t Blick über den Südarm bis zum Monte Rosa. Ab Lecco/Valmadrera direkter Zug nach Como Lago (~1 h, Interrail).","lat":45.812,"lon":9.083,"adresse":"Funicolare: Piazza Alcide De Gasperi 4, 22100 Como","dauer_min":300,"preis":{"erwachsene":6.6,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":6.5,"hinweis":"Standseilbahn hin und zurück 6,60 €, einfach 3,60 € (Stand 2024). Stadt frei, Dom frei."},"kostenlos":{"immer":false,"regeln":["Stadt, Dom und Promenade frei"],"termine_im_aufenthalt":[],"hinweis":"Zu Fuß nach Brunate (1 h, 500 Hm) spart die 3,60 € – dann nur runterfahren."},"oeffnungszeiten":"Standseilbahn tägl. 6:00–22:30, im Sommer bis 24:00, alle 15–30 min","ruhetag":null,"reservierung":"nein","tipp":"Zug bis 'Como Lago' (Trenord ab Lecco), nicht 'Como San Giovanni' – Como Lago liegt direkt am See, 10 min zur Standseilbahn. Nur machen, wenn du einen 5. Tag übrig hast; Mailand und der Ostarm sind wichtiger.","link":"https://www.funicolarecomo.it/","quelle":"https://siviaggia.it/idee-di-viaggio/funicolare-como-brunate/479770/","preisstand":"2026","unsicher":true,"quelle_hinweis":"funicolarecomo.it zeigt nur Geschichte, keine Tarifseite erreichbar; Preise aus siviaggia.it (Aug. 2024).","dist_km":21.7}],"tage":[{"datum":"2027-07-03","titel":"Ankommen in Valmadrera, Strand, Lecco-Abend","intro":"Ankunft aus Genua am frühen Nachmittag, Bahnhof Valmadrera liegt 10 Minuten von der Wohnung. Erst ins Wasser am Strand von Parè, dann rüber nach Lecco auf den Lungolago und Aperitivo mit Buffet statt Abendessen. Für morgen muss das Brera-Zeitfenster (8:30) gebucht sein, Castello Sforzesco braucht keins.","programm":[{"spot":null,"zeit":"14:00","titel":"Einchecken, Via Roma 82","notiz":"Supermarkt für Frühstück und Picknick; Lecco hat Iperal und Esselunga, Valmadrera eigene Läden."},{"spot":"pare-spiaggia-kayak","zeit":"15:30","notiz":"15 min von der Wohnung: Kiesstrand, Wiese, Blick auf Lecco und Resegone, Wasser um 22 °C. Kajak lieber morgens zwischen 8 und 10 – nachmittags macht der Breva-Wind Welle; heute nur baden."},{"spot":"lecco-lungolago","zeit":"18:00","notiz":"Mit dem Schiff ab Anleger Valmadrera (7 min) oder 25 min zu Fuß über die Ponte Azzone Visconti. Piazza XX Settembre, Piazza Cermenati, der Campanile von San Nicolò, Promenade bis zur Brücke. Case dell'acqua am Lungolago: gekühltes Wasser gratis."},{"spot":"essen-lecco","zeit":"19:00","notiz":"Aperitivo-Regel: 8–10 € für Spritz oder Bier mit Buffet zwischen 18 und 20 Uhr, oft das günstigste Abendessen. Sonst Trattoria in den Gassen hinter der Piazza XX Settembre: Missoltini mit Polenta oder Pizzoccheri, 12–16 €."}]},{"datum":"2027-07-04","titel":"Mailand am Gratis-Sonntag","intro":"Erster Sonntag im Monat: Brera und die Museen im Castello Sforzesco sind frei – deshalb heute Mailand und nicht morgen, wenn beides zu ist. Zug um 7 ab Lecco, Brera im ersten Zeitfenster, bevor es ab 11 voll wird. Nachmittags das Abendmahl, falls du ein Gratisticket erwischt hast, und zum Schluss die Dachterrassen des Doms. Dresscode: Schultern und Knie bedeckt.","programm":[{"spot":"brera","zeit":"08:30","notiz":"Zug gegen 6:50 ab Valmadrera nach Lecco, dort um 7 nach Milano Centrale (Interrail auf Trenord, 40–60 min), von Centrale 25 min zu Fuß. Vorher buchen: Gratis-Zeitfenster 8:30 über Brera Booking, Pflicht am Domenica al Museo. Mantegnas toter Christus, Raffaels Vermählung, Caravaggios Emmaus, Hayez' Kuss; Palazzo Citterio ist mit drin."},{"spot":"castello-sforzesco","zeit":"11:00","notiz":"10 min zu Fuß, am ersten Sonntag ganztägig frei, 10–17:30. Zuerst die Pietà Rondanini im ehemaligen Spanischen Hospital im Hof, dann Sala delle Asse."},{"spot":null,"zeit":"12:45","titel":"Parco Sempione, Mittag","notiz":"Durch den Park zum Arco della Pace (15 min), Picknick auf der Wiese oder Pizza al taglio. Wasserflasche auffüllen."},{"spot":"cenacolo","zeit":"14:30","notiz":"Nur mit Ticket: Gratistickets für den 04.07. kommen mit dem Quartalskontingent (Freigabe vsl. Juni 2027, 12 Uhr) auf cenacolovinciano.vivaticket.it und sind in Minuten weg; sonst mittwochs 12 Uhr für die Folgewoche probieren oder regulär 2 € + Gebühr. Metro Cadorna, 8 min zu Fuß. Ohne Ticket: Programmpunkt streichen und länger im Park bleiben."},{"spot":"duomo-milano","zeit":"16:00","notiz":"Spätnachmittag auf dem Dach: weniger Leute, besseres Licht. Treppe statt Lift (250 Stufen) spart 4 €, Duomo Pass Stairs ca. 22 €, kein Studi-Tarif – oder nur der Innenraum für 5–10 €. Letzter Einlass Terrassen ca. 18:10."},{"spot":null,"zeit":"18:45","titel":"Zug zurück ab Centrale","notiz":"Duomo → Centrale mit der Metro, Zug nach Lecco, umsteigen nach Valmadrera. Abendessen aus dem Supermarkt am Lungolago."}]},{"datum":"2027-07-05","titel":"Varenna, Burg, Villa, Schiff nach Bellagio","intro":"Montag Seetag, weil Mailands Museen zu sind. Früher Zug nach Varenna, erst hoch zum Castello di Vezio, dann der Ufergarten der Villa Monastero, mittags mit der Fähre nach Bellagio – so hast du Varenna vor den Tagestouristen. Zurück nicht per Zug, sondern mit der Sommerlinie den ganzen Lecco-Arm hinunter bis zum Anleger Valmadrera. Picknick im Supermarkt in Varenna kaufen, Bellagio ist teuer.","programm":[{"spot":"varenna","zeit":"08:30","notiz":"Zug von Valmadrera nach Lecco, dort 20 min nach Varenna-Esino, Interrail; der Bahnhof liegt oben, 10 min runter zum Ort. Passeggiata degli Innamorati am Wasser, Gassen, Piazza San Giorgio. Im Supermarkt Picknick für den Tag kaufen."},{"spot":"castello-di-vezio","zeit":"10:00","notiz":"Hinter der Kirche San Giorgio die Treppen hoch, Beschilderung Castello di Vezio, 20–30 min Maultierpfad. Ca. 5 €, Blick über alle drei Seearme, Bellagio direkt gegenüber. Café oben günstiger als unten."},{"spot":"villa-monastero","zeit":"11:45","notiz":"Nur den Garten (15–25 Jahre mit Ausweis 7 €): fast zwei Kilometer Zypressen, Zitrusterrassen und Stufen am Ufer. Das Haus ist nett, aber nicht der Punkt."},{"spot":null,"zeit":"13:30","titel":"Fähre Varenna → Bellagio","notiz":"Ca. 4,50 € einfach, 20 min, Kauf am Schalter (an Bord +1 €). Keine Ermäßigung unter 26."},{"spot":"bellagio","zeit":"14:00","notiz":"Salita Serbelloni, Arkaden, Punta Spartivento am Nordende mit Blick in alle Richtungen (frei). Villa Melzi am Ufer 8 €, wenn Garten-Lust groß ist. Picknick statt Café, hier kostet alles."},{"spot":null,"zeit":"17:10","titel":"Sommerlinie Bellagio → Valmadrera","notiz":"Ab Bellagio 17:10 oder 18:00, 2 h 20 den Lecco-Arm hinunter, hält in Valmadrera 18:33 bzw. 19:23 – 7 min vor Lecco, also vor der Haustür. Ca. 9,50–12 €, Zone am Schalter prüfen."}]},{"datum":"2027-07-06","titel":"San Pietro früh, Piani d'Erna","intro":"Berg vor der Haustür. San Pietro al Monte innen nur am Wochenende oder Di–Fr mit Führung – die per Mail an visitaguidata@amicidisanpietro.it vorher anfragen (vorher buchen). Früh los, Julihitze, eine Stunde Aufstieg ab Civate. Nachmittags mit der Seilbahn auf die Piani d'Erna, 1300 m und kühler; bei Wolken auf der Hochebene stattdessen an den Strand. Heute Nachmittag wäre auch das Castello Sforzesco ab 14 Uhr frei, falls du noch mal nach Mailand willst – eher nicht, der See ist näher.","programm":[{"spot":"san-pietro-al-monte","zeit":"07:30","notiz":"Vorher buchen: Führung Di–Fr per Mail. Von Valmadrera 35 min zu Fuß nach Civate oder ein Zughalt; ab Via Cerscera/Pozzo ca. 1 h Pflasterweg, 400 Hm. Basilika mit Apokalypse-Fresken, Krypta, Oratorium San Benedetto. Spende für die Restaurierung, 2 l Wasser."},{"spot":null,"zeit":"11:30","titel":"Mittag und Pause","notiz":"Zurück in Valmadrera: Mittagsmenü in einer Trattoria (15–18 €) oder Supermarkt, dann Schatten bis die Hitze nachlässt."},{"spot":"piani-erna","zeit":"14:00","notiz":"Bus Linie 5 ab Lecco Bahnhof bis Versasio (15 min, Endhaltestelle an der Talstation). Hin und zurück 13 €, kein Studi-Tarif; Webcam vorher checken. Oben Runde über die Hochebene, Polenta im Rifugio Marchett, Blick auf Lecco und See. Letzte Bahn 18:30."},{"spot":null,"zeit":"19:00","titel":"Letzter Abend am Wasser","notiz":"Aperitivo am Lungolago oder Picknick am Strand von Parè, dann packen."}]},{"datum":"2027-07-07","titel":"Abfahrt nach Verona","intro":"Mittwoch, kurzer Morgen: Frühstück, Wohnung übergeben, Zug ab Valmadrera über Lecco. Verbindung nach Verona vorher in der Interrail-App festlegen.","programm":[{"spot":null,"zeit":"08:30","titel":"Frühstück, packen, Schlüssel","notiz":"Reste aus dem Kühlschrank als Zugproviant."},{"spot":null,"zeit":"10:30","titel":"Zug ab Valmadrera Richtung Verona","notiz":"Über Lecco; Ankunft Verona am Nachmittag."}]}],"naechte":4},{"id":"verona","name":"Verona","land":"Italien","landcode":"IT","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-07-07","abreise":"2027-07-09","unterkunft":{"name":"Vivi San Zeno residenza Greis","ort":"Verona, Viertel San Zeno","lat":45.4423,"lon":10.9798,"hinweis":"Lage grob (Piazza San Zeno); genaue Adresse unbekannt. Ins Zentrum (Piazza Bra) 15 Min. zu Fuß."},"zentrum":{"lat":45.44306,"lon":10.99717},"intro":"Verona ist kompakt: Arena, Piazza delle Erbe, Casa di Giulietta und das Adige-Ufer liegen in einer Schleife von 20 Minuten. Zwei volle Tage reichen für Arena und Castelvecchio am Vormittag, Siesta in der Juli-Hitze, abends Castel San Pietro zum Sonnenuntergang und – am Donnerstag 08.07. – die Arena bei Nacht. Dein Viertel San Zeno ist das ruhige, echte Verona mit der schönsten romanischen Kirche Norditaliens vor der Haustür.","feiertage":[],"gut_zu_wissen":[{"titel":"Arena di Verona Opera Festival 2027","text":"104. Festival, 11. Juni – 11. September 2027. In deinem Aufenthalt: Mi 07.07. keine Vorstellung, Do 08.07. 'Roberto Bolle and Friends' (Ballett-Gala, 21:30), Fr 09.07. Carmen (Zeffirelli-Inszenierung, 21:15 – dein Abreisetag, nur wenn du erst Samstag weiterfährst). Günstigste Plätze 2027: unnummerierte Steinstufen 6. Sektor ab 22 €, 5. Sektor ab 32 €, 4. ab 47 €; Under-30-Kontingent: 2. Parkett-Sektor für 30 € (max. 4 Tickets, nicht an Premieren/Samstagen – 08.07. ist Donnerstag, also möglich). Preise der Bolle-Gala können abweichen. Tickets nur über shop.arena.it oder die Arena-Kasse (Via Dietro Anfiteatro 6b). Steinstufen: Kissen mieten oder mitbringen, Wasser mitnehmen, Beginn nach Sonnenuntergang."},{"titel":"Unter 25 zahlt fast nichts","text":"Die städtischen Museen Veronas (Arena tagsüber, Castelvecchio, Teatro Romano) kosten für EU-Bürger 18–24 nur 2–3 € statt 9–12 €; Studierende 25+ zahlen an der Arena 9 €, in den anderen Museen meist voll. Ausweis mit Geburtsdatum zeigen. Der 1. Sonntag im Monat (04.07.) liegt vor deiner Ankunft – egal, denn an der Arena gilt er ohnehin nur für Einwohner."},{"titel":"VeronaCard – rechnen","text":"24 h 27 €, 48 h 32 € (Preis aus Wiederverkäufer-Angaben, offizielle Seite nicht erreichbar – vor Ort an der Arena-Kasse oder im Tourismusbüro Piazza Bra prüfen). Enthalten: Arena, Casa di Giulietta, Castelvecchio, Torre dei Lamberti (Aufzug +1 €), Teatro Romano, San Zeno, Duomo, Sant'Anastasia, San Fermo, ATV-Stadtbusse; Giardino Giusti ermäßigt 10 €. Für Vollzahler lohnt 48 h: Arena 12 + Castelvecchio 9 + Lamberti 6 + Teatro Romano 9 + San Zeno/Duomo ~8 = 44 € gegen 32 €. Für dich mit EU 18–24-Rabatt: 3 + 2 + 4,50 + 2 + 8 = 19,50 € – Karte lohnt NICHT. Mit 25 und Studierendenausweis (9 + 9 + 4,50 + 9 + 8 = 39,50 €) nur knapp, und nur wenn du wirklich alles ansiehst."},{"titel":"Kirchenpass Chiese Vive","text":"San Zeno, Duomo, Sant'Anastasia und San Fermo gehören zum Verbund Chiese Vive. Einzelkirche zuletzt ca. 4 €, Kombiticket für alle vier ca. 8 € (die Website nennt keine Preise – an der ersten Kirche kaufen). Zum Beten ist der Eintritt immer frei, zur Besichtigung nicht. Sonntags erst ab 13 Uhr offen."},{"titel":"Hitze im Juli","text":"Verona liegt in der Po-Ebene: Anfang Juli 30–34 °C, schwül, kaum Wind. Museen und Kirchen auf 12–16 Uhr legen, Aussichten (Castel San Pietro, Lamberti) auf den Abend. Trinkbrunnen (fontanelle) an jeder Piazza – Flasche mitführen. Die Arena-Steinstufen speichern Hitze bis in die Nacht; Sitzkissen und ein Liter Wasser pro Person. Gelato als Mahlzeitenersatz ist in Verona gesellschaftlich akzeptiert."},{"titel":"Nahverkehr","text":"Alles im Zentrum ist Fußweg. ATV-Stadtbus: 90-Min-Ticket 1,50 € (App 'Ticket Bus Verona', Tabacchi, Automaten), an Bord 2,00 €, Tagesticket 5 € (Tarif ab 30.03.2026). Vom Bahnhof Porta Nuova zur Piazza Bra 15 Min. zu Fuß oder Bus 11/12/13. Nach San Zeno Bus 31/32/33 ab Porta Nuova."},{"titel":"Geld und Essen","text":"Karte überall, Coperto 2–3 €, Trinkgeld nicht erwartet. Günstig essen im Viertel San Zeno und in Veronetta (Uni-Viertel jenseits des Flusses), nicht an Piazza Bra oder Piazza delle Erbe (Spritz dort 8–10 €, in Veronetta 4 €). Lokale Klassiker: Risotto all'Amarone, Pastissada de caval (Pferderagout), Pandoro-Stadt. Osteria-Mittagsmenü 12–15 €."}],"spots":[{"id":"san_zeno","name":"Basilica di San Zeno Maggiore","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Romanik-Meisterwerk mit Bronzetüren und Mantegna-Altar – direkt bei deiner Unterkunft","beschreibung":"Eine der schönsten romanischen Kirchen Italiens (12. Jh.), gestreift aus Tuff und Ziegel, mit 48 Bronzereliefs an den Türen (11./12. Jh.), einem Kreuzgang, der Krypta mit dem Sarg des Stadtpatrons – und Mantegnas Triptychon von 1459 über dem Hochaltar, das erste große Renaissance-Altarbild Norditaliens. Shakespeare ließ Romeo und Julia hier heiraten. Der Platz davor ist dein Viertel.","lat":45.44258,"lon":10.97923,"adresse":"Piazza San Zeno 2, 37123 Verona","dauer_min":45,"preis":{"erwachsene":4,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":4,"hinweis":"Chiese Vive: Einzelkirche zuletzt ca. 4 €, Kombiticket für San Zeno + Duomo + Sant'Anastasia + San Fermo ca. 8 € – Preis nicht auf der offiziellen Website, an der Kasse prüfen. VeronaCard inklusive. Zum Gebet frei."},"kostenlos":{"immer":false,"regeln":["Eintritt zum Gebet immer frei (ohne Besichtigung)","Menschen mit Behinderung frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mär–Okt Mo–Sa 9:00–18:00, So und kirchliche Feiertage 13:00–18:30","ruhetag":null,"reservierung":"nein","tipp":"Gleich am ersten Morgen, bevor es heiß wird – du wohnst daneben. Die Bronzetüren sind innen hinter der Holztür versteckt, nicht an der Fassade. Am Platz: Osterie mit Mittagsmenü, deutlich billiger als in der Altstadt.","link":"https://www.chieseverona.it/en/our-churches/the-basilica-of-san-zeno","quelle":"https://www.chieseverona.it/en/visit-info","preisstand":"2026","unsicher":true,"quelle_hinweis":"Öffnungszeiten 2026 offiziell; Preise nennt chieseverona.it nicht, 4 €/8 € aus Reiseberichten 2025.","dist_km":0.1},{"id":"arena","name":"Arena di Verona (Besichtigung tagsüber)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Römisches Amphitheater von 30 n. Chr., besser erhalten als das Kolosseum – 3 € für EU 18–24","beschreibung":"Das drittgrößte römische Amphitheater, für 30.000 Zuschauer gebaut, und seit 1913 Opernbühne. Tagsüber steigst du über die 44 Stufenränge bis ganz oben: Blick auf die Piazza Bra, die rosa Veroneser Marmorblöcke, und unten oft die Bühnenbauten für den Abend – Sphinxen für Aida, Sevilla für Carmen. Für EU-Bürger bis 24 kostet das 3 €.","lat":45.43902,"lon":10.99493,"adresse":"Piazza Bra 1, 37121 Verona","dauer_min":60,"preis":{"erwachsene":12,"ermaessigt":9,"unter26":3,"waehrung":"EUR","eur":12,"hinweis":"Ermäßigt 9 € für Studierende und über 65; EU-Bürger 18–24: 3 €; unter 18 frei. VeronaCard inklusive."},"kostenlos":{"immer":false,"regeln":["Unter 18 frei","Erster Sonntag im Monat frei nur für Einwohner Veronas"],"termine_im_aufenthalt":[],"hinweis":"Kein Gratistag für Touristen; 04.07. liegt vor der Ankunft"},"oeffnungszeiten":"Sommer tägl. ca. 9:00–19:00 (letzter Einlass 18:30); an Vorstellungstagen früher zu (meist ab 16:30–17:00), Mo teils erst ab Mittag","ruhetag":null,"reservierung":"empfohlen","tipp":"Mittwoch 07.07. gibt es keine Vorstellung – da ist die Arena den ganzen Tag offen und innen leer, am besten gleich um 9 Uhr. Am 08.07. (Bolle-Gala) schließt sie nachmittags. Ausweis für den 3-€-Tarif. Von ganz oben links fotografieren, da siehst du Bühne und Piazza zusammen.","link":"https://www.arena.it/","quelle":"https://www.italy-museum.com/it/verona/arena-verona","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Museumsseite (museiverona.comune.verona.it) nicht erreichbar; Preise aus zwei Sekundärquellen übereinstimmend (italy-museum ohne deren 6 € Gebühr, voloscontato). Öffnungszeiten an Opernabenden variieren.","dist_km":1.2},{"id":"erbe_lamberti","name":"Piazza delle Erbe + Torre dei Lamberti","kategorie":"aussicht","muss":3,"kurz":"Marktplatz auf dem römischen Forum und 84 m Turm darüber – 4,50 € für Studierende bis 30","beschreibung":"Die Piazza delle Erbe ist seit 2.000 Jahren Veronas Mitte: Marktstände unter Schirmen, Fresken an den Fassaden (Case Mazzanti), der Brunnen mit der römischen Madonna, abends Aperitivo-Tische. Der Torre dei Lamberti daneben ist mit 84 m der höchste Turm der Stadt – 368 Stufen oder Aufzug, oben der Rundblick über rote Dächer, Adige-Schleife und Arena. Studierende bis 30 zahlen 4,50 €.","lat":45.44298,"lon":10.99772,"adresse":"Via della Costa 1, 37121 Verona","dauer_min":60,"preis":{"erwachsene":6,"ermaessigt":4.5,"unter26":4.5,"waehrung":"EUR","eur":6,"hinweis":"Ermäßigt 4,50 € für Studierende 14–30 mit Ausweis, über 60, Kinder 8–14. Mit VeronaCard frei (Treppe) bzw. 1 € (Aufzug). Aufzug sonst inklusive."},"kostenlos":{"immer":false,"regeln":["Unter 8 frei","Platz immer frei"],"termine_im_aufenthalt":[],"hinweis":"Nur der Turm kostet"},"oeffnungszeiten":"Turm Mo–Fr 10:00–18:00, Sa–So 10:30–19:00 (letzter Einlass 20 Min. vorher); Markt tägl. vormittags bis nachmittags","ruhetag":null,"reservierung":"nein","tipp":"Aufzug fährt bis zur vorletzten Ebene, die letzten Stufen gehst du – oben ist es oft windig und 5 Grad kühler. Durch den Arco della Costa (mit dem hängenden Walknochen) kommst du auf die ruhigere Piazza dei Signori mit dem Dante-Denkmal und den Scaliger-Grabmälern (von außen frei).","link":"https://torredeilamberti.it/en/","quelle":"https://torredeilamberti.it/en/biglietteria/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"teilfrei":true,"dist_km":1.4},{"id":"ponte_pietra","name":"Ponte Pietra + Adige-Ufer","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Römische Brücke von 100 v. Chr., 1945 gesprengt und aus den Flusssteinen wieder aufgebaut","beschreibung":"Zwei Bögen sind original römisch (weißer Stein), der Rest Ziegel aus dem Mittelalter – 1945 von der Wehrmacht gesprengt, 1957 aus den aus dem Adige gefischten Steinen rekonstruiert. Von hier siehst du Teatro Romano und Castel San Pietro am Hang gegenüber. Das Ufer (Lungadige) kannst du vom Castelvecchio bis hierher ablaufen: 25 Minuten, kaum Verkehr, Veronas Altstadt im Flussbogen.","lat":45.44785,"lon":11.0001,"adresse":"Ponte Pietra, 37121 Verona","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-07-07","2027-07-08","2027-07-09"],"hinweis":null},"oeffnungszeiten":"Immer","ruhetag":null,"reservierung":"nein","tipp":"Zur blauen Stunde, wenn die Brücke beleuchtet ist und Castel San Pietro oben leuchtet – vom Ufer unterhalb des Duomo fotografieren. Danach über die Brücke und die Treppen (Scalone) hoch zur Aussicht.","link":"https://www.turismoverona.eu/","quelle":"https://www.turismoverona.eu/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffentlicher Raum.","dist_km":1.7},{"id":"castel_san_pietro","name":"Castel San Pietro (Aussicht) + Funicolare","kategorie":"aussicht","muss":3,"kurz":"Die Postkartenaussicht auf Verona – Treppe gratis, Standseilbahn 2 €","beschreibung":"Die Terrasse vor der habsburgischen Kaserne auf dem Hügel über Ponte Pietra ist der Ort, an dem ganz Verona den Sonnenuntergang anschaut: Flussschleife, Dächer, Türme, dahinter die Lessinia-Berge. Hoch kommst du gratis über die Treppen (Scalone Castel San Pietro, 10 Min., ab Ponte Pietra) oder mit der Standseilbahn (90 Sekunden) ab Via Fontanelle Santo Stefano.","lat":45.44802,"lon":11.00297,"adresse":"Piazzale Castel San Pietro, 37129 Verona; Funicolare: Via Fontanelle Santo Stefano 6","dauer_min":60,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Aussicht frei. Funicolare: einfach 2 €, hin und zurück 3 €; ermäßigt 1–2 € (unter 10, über 65, Einwohner Provinz Verona). Nicht in der VeronaCard."},"kostenlos":{"immer":true,"regeln":["Aussichtsterrasse immer frei","Treppenaufstieg frei"],"termine_im_aufenthalt":["2027-07-07","2027-07-08","2027-07-09"],"hinweis":"Nur die Seilbahn kostet"},"oeffnungszeiten":"Terrasse immer; Funicolare Apr–Okt tägl. 10:00–21:00","ruhetag":null,"reservierung":"nein","tipp":"Hoch mit der Bahn (2 €, bei 33 °C gut angelegt), runter zu Fuß über den Scalone. Sonnenuntergang Anfang Juli gegen 21:00 – die Bahn fährt bis 21 Uhr, also rechtzeitig oben sein. Bier/Wasser aus dem Supermarkt mitnehmen, oben gibt es nur eine teure Bar.","link":"https://www.funicolarediverona.it/en/","quelle":"https://www.funicolarediverona.it/en/ticket-office/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.9},{"id":"essen_veronetta","name":"Günstig essen: San Zeno + Veronetta","kategorie":"essen","muss":2,"kurz":"Osterie im eigenen Viertel und Studentenbars jenseits des Flusses – Mittagsmenü 12–15 €, Spritz 4 €","beschreibung":"Zwei Ecken, in denen Verona noch für Veroneser kocht: die Piazza San Zeno mit ihren Osterie (Risotto all'Amarone, Bigoli, Pastissada) und Veronetta, das Uni-Viertel rund um Via XX Settembre und Via Interrato dell'Acqua Morta, mit Aperitivo-Bars, Pizza al taglio und Trattorien mit Tagesmenü. Dazwischen liegt die Altstadt, in der du nur schauen, nicht essen solltest.","lat":45.44258,"lon":10.97923,"adresse":"Piazza San Zeno (37123) und Via XX Settembre / Veronetta (37129), Verona","dauer_min":90,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Richtwerte: Osteria-Mittagsmenü 12–15 €, Pizza 7–10 €, Spritz 3,50–4,50 € in Veronetta, 8–10 € an Piazza Bra/Erbe. Kein offizieller Preis."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Küche meist 12–14:30 und 19–22:30; viele Osterie So oder Mo zu","ruhetag":null,"reservierung":"nein","tipp":"Vor dem Arena-Abend früh essen (19 Uhr) oder Brot, Käse und Sopressa aus dem Supermarkt (Pam an der Via dei Mutilati, 5 Min. von der Arena) mit auf die Stufen nehmen – erlaubt und üblich. Leitungswasser ist überall trinkbar.","link":"https://www.turismoverona.eu/","quelle":"https://www.turismoverona.eu/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Gastronomie ohne offizielle Preisliste; Richtwerte aus Reiseberichten 2025/26.","dist_km":0.1},{"id":"castelvecchio","name":"Castelvecchio (Museum + Ponte Scaligero)","kategorie":"museum","muss":2,"kurz":"Scaliger-Burg mit Carlo Scarpas Museumsumbau; die Zinnenbrücke ist frei","beschreibung":"Die Backsteinburg der Della Scala (1354) am Adige ist vor allem wegen Carlo Scarpa berühmt, der sie 1958–74 in ein Museum verwandelte – Betonstege, Reiterstatue des Cangrande frei im Raum schwebend, Pisanello, Mantegna, Bellini, Veronese. Die Ponte Scaligero mit den Schwalbenschwanz-Zinnen führt über den Fluss und ist immer frei begehbar.","lat":45.4396,"lon":10.98739,"adresse":"Corso Castelvecchio 2, 37121 Verona","dauer_min":90,"preis":{"erwachsene":9,"ermaessigt":6,"unter26":2,"waehrung":"EUR","eur":9,"hinweis":"Ermäßigt 6 € nur über 65; EU-Bürger 18–24: 2 €; unter 18 frei. Studierende 25+ zahlen laut Quelle voll. VeronaCard inklusive."},"kostenlos":{"immer":false,"regeln":["Brücke und Burghof immer frei","Unter 18 frei"],"termine_im_aufenthalt":[],"hinweis":"Nur das Museum kostet"},"oeffnungszeiten":"Museum Di–So ca. 10:00–18:00, Mo ab Nachmittag; Brücke immer","ruhetag":null,"reservierung":"nein","tipp":"Auf dem Weg vom Hostel in die Stadt liegt die Burg ohnehin – morgens über die Zinnenbrücke gehen, der Blick flussaufwärts ist gratis und leer. Im Museum auf die Wehrgänge steigen (im Ticket), von dort siehst du die Brücke von oben.","link":"https://museodicastelvecchio.comune.verona.it/","quelle":"https://www.italy-museum.com/it/venezia/museo-castelvecchio","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Museumsseite nicht erreichbar; Preis aus Wiederverkäufer (ohne 6 € Gebühr), Öffnungszeiten aus älteren Quellen uneinheitlich (11–17 bzw. 10–18).","teilfrei":true,"dist_km":0.7},{"id":"piazza_bra","name":"Piazza Bra + Liston","kategorie":"viertel","muss":2,"kurz":"Veronas Wohnzimmer vor der Arena: Abendspaziergang auf dem rosa Marmorpflaster","beschreibung":"Der größte Platz der Stadt, mit der Arena auf der einen, dem Liston (breiter Marmor-Gehweg mit Café-Terrassen) auf der anderen Seite, Palazzo Barbieri, Gran Guardia und einem Park mit Brunnen in der Mitte. Abends vor den Vorstellungen flanieren hier Opernbesucher im Abendkleid neben Touristen in Flipflops – das ist die Passeggiata.","lat":45.43828,"lon":10.99324,"adresse":"Piazza Bra, 37121 Verona","dauer_min":30,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Platz frei; Cafés am Liston teuer (Spritz 8–10 €)."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-07-07","2027-07-08","2027-07-09"],"hinweis":null},"oeffnungszeiten":"Immer","ruhetag":null,"reservierung":"nein","tipp":"Am Opernabend ab 20 Uhr auf die Stufen vor der Gran Guardia setzen und die Garderoben anschauen – gratis Theater. Das Tourismusbüro (IAT) an der Piazza Bra verkauft die VeronaCard und hat kostenlose Stadtpläne.","link":"https://www.turismoverona.eu/","quelle":"https://www.turismoverona.eu/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffentlicher Raum.","dist_km":1.1},{"id":"arena_oper","name":"Arena bei Nacht: Roberto Bolle and Friends (08.07.) / Carmen (09.07.)","kategorie":"nachtleben","muss":2,"kurz":"Oper oder Ballett unter freiem Himmel vor 13.000 Leuten – ab 22 € auf den Steinstufen","beschreibung":"Das Arena-Festival ist der Grund, warum man im Juli nach Verona fährt: Die Vorstellung beginnt bei Dunkelheit, früher zündete das Publikum auf den Stufen Kerzen an, heute Handys. Am Donnerstag 08.07.2027 tanzt Roberto Bolle mit internationalen Étoiles (21:30), am Freitag 09.07. läuft Zeffirellis monumentale Carmen (21:15) – mit Pferden und hunderten Statisten. Die unnummerierten Steinstufen oben sind die billigsten und stimmungsvollsten Plätze.","lat":45.43902,"lon":10.99493,"adresse":"Piazza Bra 1, 37121 Verona (Kasse: Via Dietro Anfiteatro 6b)","dauer_min":180,"preis":{"erwachsene":22,"ermaessigt":null,"unter26":30,"waehrung":"EUR","eur":22,"hinweis":"2027-Tarif: Steinstufen 6. Sektor ab 22 €, 5. Sektor ab 32 €, 4. Sektor ab 47 €, Sektoren Rossini/Puccini/Verdi 60/85/105 €, Parkett ab 135 €. Under 30: begrenztes Kontingent im 2. Parkett-Sektor für 30 € (max. 4 Tickets, nicht an Premieren/Samstagen). Gala-Abende (Bolle) können eigene Preise haben."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"08.07. 21:30 (Bolle), 09.07. 21:15 (Carmen); Einlass ca. 2 Std. vorher; 07.07. keine Vorstellung","ruhetag":null,"reservierung":"nötig","tipp":"Früh auf shop.arena.it buchen – Steinstufen für 22 € sind im Juli schnell weg; U30-Plätze für 30 € im Parkett sind der beste Deal, falls noch da. Steinstufen sind unnummeriert: ab Einlass (ca. 19:30) anstellen für Plätze in der Mitte. Kissen mieten (~3 €) oder Handtuch mitnehmen; Essen und Wasser in Plastikflaschen dürfen mit. Bei Regen wird nach 1,5 Std. Wartezeit abgesagt und erstattet.","link":"https://www.arena.it/en/arena-verona-opera-festival/calendar/","quelle":"https://www.arena.it/en/arena-verona-opera-festival/tickets/rates-and-sectors/","preisstand":"2027","unsicher":false,"quelle_hinweis":"Kalender und Tarife 2027 offiziell veröffentlicht; Einlasszeiten und Kissenpreis aus Erfahrungswerten.","dist_km":1.2},{"id":"duomo","name":"Duomo di Verona (Cattedrale di Santa Maria Matricolare)","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Kathedralkomplex mit Tizians Himmelfahrt, frühchristlichen Mosaiken und Baptisterium","beschreibung":"Romanische Fassade mit Rolands- und Olivierfiguren am Portal, innen gotisch, mit Tizians 'Assunta' (1535) in der ersten Kapelle links. Das Ticket umfasst den ganzen Komplex: die Kirche Sant'Elena mit Mosaikböden aus dem 4. Jahrhundert unter Glas, das Baptisterium San Giovanni in Fonte mit dem monolithischen Taufbecken und den Kreuzgang. Weniger besucht als San Zeno, genauso lohnend.","lat":45.44723,"lon":10.99707,"adresse":"Piazza Duomo 21, 37121 Verona","dauer_min":45,"preis":{"erwachsene":4,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":4,"hinweis":"Chiese Vive: Einzelkirche ca. 4 €, Kombiticket vier Kirchen ca. 8 € (Preise an der Kasse prüfen). VeronaCard inklusive."},"kostenlos":{"immer":false,"regeln":["Eintritt zum Gebet immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mär–Okt Mo–Fr 11:00–17:30, Sa 11:00–15:30, So 13:30–17:30","ruhetag":null,"reservierung":"nein","tipp":"Erst ab 11 Uhr offen – passt genau in die heiße Mittagszeit. Mit dem Kombiticket danach Sant'Anastasia (5 Min., Pisanellos Georgs-Fresko, die 'Buckligen' Weihwasserträger) mitnehmen. Vom Duomo sind es 3 Minuten zur Ponte Pietra.","link":"https://www.chieseverona.it/en/our-churches/the-cathedral-complex","quelle":"https://www.chieseverona.it/en/visit-info","preisstand":"2026","unsicher":true,"quelle_hinweis":"Öffnungszeiten offiziell; Preise nicht auf der Website.","dist_km":1.5},{"id":"teatro_romano","name":"Teatro Romano + Museo Archeologico","kategorie":"museum","muss":2,"kurz":"Römisches Theater am Hang über dem Fluss, Museum im Kloster darüber mit Terrassenblick","beschreibung":"Das Theater aus augusteischer Zeit liegt in den Hang gebaut, mit Blick über Ponte Pietra auf die Altstadt – im Juli abends Bühne der 'Estate Teatrale Veronese' (Shakespeare, Jazz). Das Archäologische Museum im ehemaligen Hieronymitenkloster darüber hat römische Mosaike, Bronzen und von seiner Terrasse die fast gleiche Aussicht wie Castel San Pietro, nur ohne Menschen.","lat":45.44761,"lon":11.00172,"adresse":"Regaste Redentore 2, 37129 Verona","dauer_min":75,"preis":{"erwachsene":9,"ermaessigt":6,"unter26":2,"waehrung":"EUR","eur":9,"hinweis":"Ermäßigt 6 € über 65; EU-Bürger 18–24: 2 €; unter 18 frei. VeronaCard inklusive. Abendvorstellungen separat."},"kostenlos":{"immer":false,"regeln":["Unter 18 frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Di–So ca. 10:00–18:00, Mo ab Nachmittag; an Abendvorstellungstagen früher zu","ruhetag":null,"reservierung":"nein","tipp":"Für 2 € (EU 18–24) die günstigste Aussichtsterrasse der Stadt – Aufzug im Museum bis ganz oben. Programm der Estate Teatrale prüfen: Jazz- oder Theaterabende im römischen Theater kosten oft 15–25 € und sind eine Alternative zum Arena-Abend.","link":"https://museoarcheologico.comune.verona.it/","quelle":"https://www.italy-museum.com/it/venezia/museo-archeologico-teatro-romano-verona","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Seite nicht erreichbar; Preis aus Wiederverkäufer (ohne 6 € Gebühr), Öffnungszeiten aus Sekundärquellen.","dist_km":1.8},{"id":"casa_giulietta","name":"Casa di Giulietta","kategorie":"sehenswuerdigkeit","muss":1,"kurz":"Der Balkon einer erfundenen Figur – seit April 2026 kostet selbst der Hof 5 €, nur mit Zeitfenster","beschreibung":"Ein gotisches Haus der Familie Cappello, 1930er-Jahre-Balkon, Bronzestatue mit blankgeriebener Brust – Verona vermarktet Shakespeares Fiktion seit hundert Jahren. Seit dem 1. April 2026 ist der Hof nicht mehr frei: Eingang über die Piazzetta Navona durch das Teatro Nuovo, kontingentierte Zeitfenster, 5 € für den Hof, 12 € mit dem Haus (Kostüme, Bett aus dem Zeffirelli-Film). Touristenfalle mit Ansage – aber wer zum ersten Mal hier ist, will es sehen.","lat":45.44201,"lon":10.99862,"adresse":"Via Cappello 23, 37121 Verona (Eingang Piazzetta Navona)","dauer_min":30,"preis":{"erwachsene":5,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":5,"hinweis":"Nur Hof 5 €; Hof + Haus 12 €. Ermäßigungen in den Quellen nicht genannt. Ausschließlich online auf verona.coopculture.it, Zeitfenster. VeronaCard enthält einen Eintritt."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":"Seit 04/2026 kein freier Hofzugang mehr"},"oeffnungszeiten":"Di–So 9:00–19:00, Mo 14:00–19:00","ruhetag":null,"reservierung":"nötig","tipp":"Wenn überhaupt, dann nur der 5-€-Hof im ersten Zeitfenster um 9 Uhr – nachmittags stehst du mit 40 Leuten in einem Innenhof von 10 Metern. Nur über die offizielle Seite buchen, mit Fremd-Tickets wird der Einlass nicht garantiert. Die 12 € fürs Haus lieber in die Arena stecken.","link":"https://casadigiulietta.comune.verona.it/","quelle":"https://www.finestresullarte.info/attualita/da-1-aprile-2026-nuove-modalita-di-visita-cortile-e-casa-giulietta-a-verona","preisstand":"2026","unsicher":true,"quelle_hinweis":"Preise aus Pressebericht zur Neuregelung (offizielle Ticketseite coopculture blockt automatisierte Abrufe); Ermäßigungen unbekannt.","dist_km":1.5},{"id":"giardino_giusti","name":"Giardino Giusti","kategorie":"natur","muss":1,"kurz":"Renaissancegarten von 1570 mit Zypressenallee, Labyrinth und Aussichtsterrasse – aber 14 €","beschreibung":"Goethe hat sich hier 1786 einen Zypressenzweig abgebrochen; der Garten hinter dem Palazzo Giusti ist seit 450 Jahren fast unverändert: Buchsbaum-Parterre, Zypressenallee, Grotte mit Maskaron, Hecken-Labyrinth und oben am Hang ein Belvedere mit Blick über die Stadt. Schön und ruhig – aber mit 14 € (10 € für Studierende) inzwischen teuer für einen Garten.","lat":45.44368,"lon":11.00758,"adresse":"Via Giardino Giusti 2, 37129 Verona","dauer_min":60,"preis":{"erwachsene":14,"ermaessigt":10,"unter26":10,"waehrung":"EUR","eur":14,"hinweis":"Studierende 10 € (Ausweis), VeronaCard 10 €, mit Ticket Palazzo Maffei 13 €. Keine EU-18–25-Regel (privat)."},"kostenlos":{"immer":false,"regeln":["Menschen mit Behinderung + Begleitung frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Sommer tägl. 9:00–19:00 (letzter Einlass 1 Std. vorher)","ruhetag":null,"reservierung":"nein","tipp":"Nur wenn Geld und Zeit übrig sind – die Aussicht gibt es von Castel San Pietro gratis. Wenn doch: morgens um 9, dann ist der Garten leer und schattig. Liegt in Veronetta, dem Uni-Viertel mit den günstigen Bars.","link":"https://giardinogiusti.com/","quelle":"https://giardinogiusti.com/opening/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.2},{"id":"gardasee","name":"Tagesausflug Gardasee: Peschiera + Sirmione","kategorie":"tagesausflug","muss":1,"kurz":"15 Zugminuten bis zum See: Baden in Peschiera oder die Scaliger-Burg von Sirmione (2 € für EU 18–25)","beschreibung":"Peschiera del Garda liegt auf der Interrail-Strecke Richtung Mailand (Regionalzug 15 Min., ca. 4–5 €): venezianische Festungsstadt am Südufer, Strand (Spiaggia Braccobaldo, frei) direkt am Ort. Weiter nach Sirmione geht es per Bus (ATV/Arriva LN026, ~25 Min.) oder Schiff: die Halbinsel mit der wassergesäumten Rocca Scaligera (Staatsmuseum – 2 € für EU 18–25, erster Sonntag frei), Catulls römischer Villa an der Spitze und dem Steinstrand Jamaica Beach zum Schwimmen.","lat":45.4923,"lon":10.60851,"adresse":"Rocca Scaligera, Piazza Castello, 25019 Sirmione (BS); Zug ab Verona Porta Nuova nach Peschiera del Garda","dauer_min":480,"preis":{"erwachsene":10,"ermaessigt":2,"unter26":2,"waehrung":"EUR","eur":10,"hinweis":"Rocca Scaligera 10 € / 2 € (EU 18–25) / unter 18 frei. Grotte di Catullo separat (~8 €, gleiche Regeln). Zug Verona–Peschiera ca. 4–5 € je Richtung (Preis prüfen; mit Interrail-Pass inklusive), Bus Peschiera–Sirmione ca. 3–4 €. See und Strände frei."},"kostenlos":{"immer":false,"regeln":["Rocca: erster Sonntag im Monat frei (Staatsmuseum)","Unter 18 frei","Strände und Halbinsel frei"],"termine_im_aufenthalt":[],"hinweis":"04.07. liegt vor dem Aufenthalt"},"oeffnungszeiten":"Rocca Di–So 8:30–19:15 (Kasse bis 18:30)","ruhetag":"Montag (Rocca)","reservierung":"nein","tipp":"Nur bei zwei vollen Tagen in Verona sinnvoll – eher als Abreisetag am 09.07., wenn es ohnehin Richtung Westen weitergeht (Gepäck im Schließfach Peschiera). Sirmione ist mittags überlaufen; früh hin, Burg um 8:30, dann an die Spitze zur Jamaica Beach baden. Tageslicht-Zugticket bei Trenitalia prüfen, bei Flexi-Pass lieber das Regionalticket kaufen statt einen Reisetag zu verbrauchen.","link":"https://museilombardia.cultura.gov.it/musei/castello-scaligero-di-sirmione/","quelle":"https://cultura.gov.it/luogo/castello-scaligero-di-sirmione","preisstand":"2026","unsicher":true,"quelle_hinweis":"Burgpreis offiziell (cultura.gov.it); Zug- und Buspreise nicht verifiziert (Trenitalia-Tarif nicht abrufbar), Richtwerte aus Omio.","dist_km":29.5}],"tage":[{"datum":"2027-07-07","titel":"San Zeno, leere Arena, Sonnenuntergang","intro":"Mittwoch ist der einzige Tag ohne Arena-Vorstellung – die Arena ist bis 19 Uhr offen und innen leer, deshalb gleich heute rein. San Zeno liegt neben der Unterkunft, der Abend gehört dem Fluss: früh in Veronetta essen, dann über die Ponte Pietra hoch zum Castel San Pietro, Sonnenuntergang gegen 21 Uhr. Flasche mitnehmen, Fontanelle an jeder Piazza.","programm":[{"spot":null,"zeit":"14:00","titel":"Ankommen in San Zeno","notiz":"Vom Bahnhof Porta Nuova Bus 31/32/33 nach San Zeno (90-Min-Ticket 1,50 € in der App 'Ticket Bus Verona' oder im Tabacchi). Einchecken, Ausweis mit Geburtsdatum einstecken – damit kosten die städtischen Museen 2–3 €."},{"spot":"san_zeno","zeit":"15:00","notiz":"Direkt am Platz, Mo–Sa bis 18 Uhr. Bronzetüren innen hinter der Holztür, Mantegna über dem Hochaltar; Kombiticket Chiese Vive (ca. 8 € für vier Kirchen) hier kaufen, wenn du morgen den Duomo mitnimmst."},{"spot":"arena","zeit":"16:30","notiz":"15 Min. zu Fuß über die Ponte Scaligero und am Castelvecchio vorbei. Heute keine Vorstellung, letzter Einlass 18:30 – ganz nach oben links steigen, Bühne und Piazza Bra im selben Bild. 3 € mit EU-Ausweis 18–24."},{"spot":"essen_veronetta","zeit":"18:30","notiz":"Durchs Zentrum rüber nach Veronetta (Via XX Settembre, 20 Min.): Tagesmenü oder Pizza, Spritz 4 € statt 8–10 € an der Piazza Bra. Früh essen, damit du um 20:30 oben bist."},{"spot":"ponte_pietra","zeit":"20:00","notiz":"5 Min. von Veronetta. Zur blauen Stunde vom Ufer unterhalb des Duomo fotografieren – Brücke beleuchtet, Castel San Pietro oben."},{"spot":"castel_san_pietro","zeit":"20:30","notiz":"Mit der Funicolare hoch (2 €, fährt bis 21 Uhr), Sonnenuntergang gegen 21 Uhr auf der Terrasse, Wasser vorher im Supermarkt kaufen. Runter zu Fuß über den Scalone zur Ponte Pietra, dann 35 Min. zurück nach San Zeno."}]},{"datum":"2027-07-08","titel":"Castelvecchio, Lamberti, Arena-Gala","intro":"Der volle Tag: Museen in der Hitze, abends 'Roberto Bolle and Friends' in der Arena (21:30). Die Arena schließt heute nachmittags für den Aufbau, deshalb war die Besichtigung gestern; der Torre dei Lamberti macht werktags um 18 Uhr zu, also mittags hoch – oben ist es 5 Grad kühler. Gala-Ticket früh auf shop.arena.it buchen, Steinstufen ab 22 € oder U30-Parkett 30 €.","programm":[{"spot":"castelvecchio","zeit":"10:00","notiz":"10 Min. von San Zeno, Museum öffnet um 10 (2 € mit EU-Ausweis 18–24). Scarpas Betonstege, Cangrande, Wehrgänge im Ticket – von dort siehst du die Zinnenbrücke von oben."},{"spot":"erbe_lamberti","zeit":"11:45","notiz":"10 Min. durch die Via Roma. Markt noch offen, dann Turm (4,50 € mit Studiausweis, Aufzug inklusive); durch den Arco della Costa auf die Piazza dei Signori mit den Scaliger-Grabmälern, von außen frei."},{"spot":null,"zeit":"13:00","titel":"Mittag und Siesta","notiz":"Osteria-Mittagsmenü abseits der Piazza delle Erbe (12–15 €) oder Gelato als Mahlzeit – in Verona akzeptiert. Bis 14:30 Schatten suchen, die Stadt macht es auch."},{"spot":"duomo","zeit":"14:30","notiz":"10 Min. nach Norden, Mo–Fr 11–17:30 – kühl in der heißesten Stunde. Tizians Assunta erste Kapelle links, Mosaike unter Glas in Sant'Elena, Baptisterium. Mit dem Chiese-Vive-Kombiticket von gestern drin."},{"spot":"teatro_romano","zeit":"15:30","notiz":"3 Min. zur Ponte Pietra, drüben links. 2 € mit EU-Ausweis, Aufzug im Museum bis zur Terrasse – die Castel-San-Pietro-Aussicht ohne Menschen. An Abendvorstellungstagen schließt es früher: vorher am Eingang fragen."},{"spot":null,"zeit":"17:00","titel":"Zurück nach San Zeno, Picknick packen","notiz":"30 Min. zu Fuß: duschen, Handtuch oder Kissen und 1 Liter Wasser einpacken. Auf dem Weg zur Arena beim Pam an der Via dei Mutilati (5 Min. von der Arena) Brot, Käse und Sopressa kaufen – auf den Stufen erlaubt und üblich."},{"spot":"piazza_bra","zeit":"19:00","notiz":"Auf die Stufen vor der Gran Guardia setzen und die Abendgarderoben anschauen – gratis Theater vor dem Theater."},{"spot":"arena_oper","zeit":"19:30","notiz":"Vorher buchen (shop.arena.it, 08.07. ist Donnerstag – U30-Parkett 30 € möglich). Steinstufen sind unnummeriert: ab Einlass 19:30 anstellen für Plätze in der Mitte, Kissen mieten ~3 €. Beginn 21:30, Ende nach Mitternacht; 20 Min. zu Fuß nach San Zeno."}]},{"datum":"2027-07-09","titel":"Julia um neun, Zug um elf","intro":"Abreisetag nach Zell am See – bis 11 Uhr am Bahnhof Porta Nuova sein. Die Casa di Giulietta ist nur im ersten Zeitfenster um 9 Uhr erträglich und liegt 15 Min. von San Zeno; wer lieber ausschläft, lässt sie weg. Gepäck spätestens um 10:15 aus der Unterkunft holen.","programm":[{"spot":null,"zeit":"08:15","titel":"Frühstück an der Piazza San Zeno","notiz":"Kurz, dann zu Fuß ins Zentrum (15 Min.)."},{"spot":"casa_giulietta","zeit":"09:00","notiz":"Nur der 5-€-Hof, nur das 9-Uhr-Fenster, nur über verona.coopculture.it buchen (Eingang Piazzetta Navona). Das Haus für 12 € lohnt nicht – das Geld war gestern in der Arena besser angelegt."},{"spot":null,"zeit":"10:00","titel":"Gepäck holen, Bus zum Bahnhof","notiz":"Zurück nach San Zeno (15 Min.), dann Bus 31/32/33 zur Porta Nuova oder 20 Min. zu Fuß. Wasser für den Zug an der Fontanella auffüllen."}]}],"naechte":2},{"id":"zell-am-see","name":"Zell am See","land":"Österreich","landcode":"AT","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-07-09","abreise":"2027-07-13","unterkunft":{"name":"Hotel-Garni Seestrand","ort":"Zell am See-Thumersbach","lat":47.322,"lon":12.8115,"hinweis":"Seeuferstraße 60, Thumersbach — Ostufer, gegenüber der Stadt, nicht im Zentrum. Rüber geht's mit der Schiff-Überfahrt (6,50 € einfach / 10,90 € retour), per Bus oder 45 min zu Fuß ums Nordufer. Lage grob aus Adresse."},"zentrum":{"lat":47.325,"lon":12.7958},"intro":"Vier Nächte zwischen See und Gletscher: Zell am See ist Seilbahn-Land, und das Preisniveau zeigt es. Entscheidend ist, ob deine Unterkunft die „Zell am See-Kaprun Sommerkarte“ ausgibt — dann sind Schmittenhöhe, Kitzsteinhorn, Stauseen, Schiff und Strandbäder gratis und die Reise kostet fast nichts mehr; ohne Karte sind das zusammen gut 200 € pro Person. Plan: ein Bergtag Schmittenhöhe (plus Pinzgauer Spaziergang), ein Gletschertag Kitzsteinhorn, ein Tag Kaprun (Klamm + Mooserboden), dazwischen See. Juli-Wetter: Gewitter ab 14 Uhr, oben am Kitzsteinhorn auch im Juli um 0 °C.","feiertage":[],"gut_zu_wissen":[{"titel":"Sommerkarte — die große Frage","text":"Die Zell am See-Kaprun Sommerkarte (15. Mai–31. Oktober) gibt es nicht zu kaufen, nur gratis beim Check-in in Partnerbetrieben. Drin: Kitzsteinhorn (außer 3K-K-onnection), Schmittenhöhe, Maiskogel, Hochgebirgsstauseen, Schiff, drei Strandbäder, Hallenbad, Vogtturm, Sigmund-Thun-Klamm, NationalparkWelten Mittersill, Kitzloch-/Seisenberg-/Vorderkaserklamm — 18 Premiumpartner zu 100 %, dazu 23 Bonuspartner mit Rabatt (Tauern Spa, Krimml). Vom 15. Juli bis 15. September gilt die Karte am Anreisetag erst ab 15 Uhr und vier Highlights (Gipfelfahrt Schmitten, Gipfelbahn Kitzsteinhorn, Schiffsrundfahrt, Stauseen) erst ab dem 2. Tag — dein Aufenthalt 9.–13.7. liegt noch VOR dieser Sperre. Stand Oktober 2026: Hotel-Garni Seestrand steht NICHT in der Partnerliste (259 Betriebe) und erwähnt die Karte auf seiner Website nicht. Vor dem Buchen beim Hotel fragen — wenn nein, lohnt ein Partnerbetrieb selbst bei 20 € mehr pro Nacht."},{"titel":"Guest Mobility Ticket & Gästekarte","text":"Übernachtungsgäste erhalten laut Region das Guest Mobility Ticket: alle Öffis im Bundesland Salzburg (ÖBB-Regionalzüge, Postbus, Pinzgauer Lokalbahn) gratis für die Dauer des Aufenthalts — ob jeder gemeldete Gast oder nur Sommerkarten-Gäste, ist auf den Seiten nicht eindeutig (die Sommerkarten-Seite sagt „zusätzlich zur Sommerkarte“). Getrennt davon gibt es die normale Pinzgauer Gästekarte (Meldeschein), die bei Schmitten, Kitzsteinhorn, Strandbad u. a. ca. 10 % spart. Beides am Check-in einfordern. Interrail gilt NICHT auf der Pinzgauer Lokalbahn (SLB), nur auf ÖBB bis Zell am See."},{"titel":"Preise ohne Karte","text":"Schmittenhöhe Gipfel retour 45 €, Kitzsteinhorn TOP OF SALZBURG 61 €, Mooserboden 39,50 €, Schiffsrundfahrt 24 €, Strandbad 10,80 €, Klamm 8,50 €. Studierende: kein Tarif bei den Bergbahnen (Jugend endet mit Jahrgang 2008–2010), nur im Vogtturm (7 €). Unter 26: nirgends. Online-Tickets der Bergbahnen sind nicht billiger, nur schneller."},{"titel":"Essen & Geld","text":"Karte überall, Hüttenkassen oft nur bar. Trinkgeld 5–10 %, Betrag beim Zahlen nennen. Leitungswasser gratis und gut. Günstig essen: Kaspressknödel/Kasnocken auf den Almen (12–15 €), Spar/Billa im Zentrum, Thumersbach selbst hat wenig — abends in der Stadt bleiben und mit dem letzten Schiff (17 Uhr!) oder dem Bus zurück, sonst Fußweg."}],"spots":[{"id":"seerundweg","name":"Zeller See – Rundweg & Thumersbach-Promenade","kategorie":"natur","muss":3,"kurz":"12 km ebene Runde um den See, abends vom Ostufer das Alpenglühen am Kitzsteinhorn","beschreibung":"Der Seeuferweg führt in ca. 3 Stunden um den ganzen See: Esplanade in Zell, Südufer durch das Schilfgebiet bei Schüttdorf, dann die ruhige Thumersbacher Promenade am Ostufer direkt vor deiner Tür — mit der besten Aussicht überhaupt, weil Stadt, Schmitten und Kitzsteinhorn gegenüber liegen. Badestellen frei zugänglich am Nord- und Südufer (Erlberg, Seespitz-Wiese außerhalb des Strandbads).","lat":47.316,"lon":12.802,"adresse":"Seeuferstraße, 5700 Zell am See-Thumersbach","dauer_min":180,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-07-09","2027-07-10","2027-07-11","2027-07-12","2027-07-13"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Abendrunde ab Hotel Richtung Norden nach Zell (45 min), Essen in der Stadt, zurück mit dem letzten Schiff um 17 Uhr geht nicht — also Bus oder zu Fuß zurück über den Südbogen. Sonnenaufgang von der Thumersbacher Promenade: Kitzsteinhorn rosa.","link":"https://www.zellamsee-kaprun.com/de","quelle":"https://www.zellamsee-kaprun.com/en/poi/lido-zell-am-see~2375","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.0},{"id":"schmittenhoehe","name":"Schmittenhöhe (1.965 m)","kategorie":"aussicht","muss":3,"kurz":"Zells Hausberg: 30 Dreitausender im Panorama, Sechs-Seen-Blick auf den Zeller See","beschreibung":"Die Schmittenhöhebahn fährt direkt aus der Stadt (Talstation 15 min vom Zentrum) auf knapp 2.000 m. Oben die Elisabethkapelle, Gipfelrundweg mit Blick auf Großglockner, Kitzsteinhorn und den See tief unten, dazu die Panoramaplattform am trassXpress. Von hier starten der Pinzgauer Spaziergang und leichte Höhenwege zur Sonnkogel-Alm; runter kann man auch über den Berggasthof Mittelstation wandern.","lat":47.3283,"lon":12.7372,"adresse":"Schmittenhöhebahn Talstation, Schmittenstraße 119, 5700 Zell am See","dauer_min":300,"preis":{"erwachsene":45,"ermaessigt":40.5,"unter26":null,"waehrung":"EUR","eur":45,"hinweis":"Gipfelstürmer-Ticket (2.000 m) Berg + Tal 45 €, mit Pinzgauer Gästekarte 40,50 €, Kinder Jg. 2011–2020 22,50 €. Nur Bergfahrt 32 €. Erlebnis-Ticket 1.400 m 33 €. Mit Sommerkarte gratis."},"kostenlos":{"immer":false,"regeln":["Mit Zell am See-Kaprun Sommerkarte frei (Gipfelfahrt 15.7.–15.9. erst ab 2. Tag — betrifft dich nicht)","Aufstieg zu Fuß immer frei (ca. 3,5 h, 1.200 Hm)"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Schmittenhöhebahn 18. Mai–4. Okt 9:00–17:00 (2026); trassXpress ab 18. Juni, cityXpress ab 20. Juni","ruhetag":null,"reservierung":"nein","tipp":"Erste Bahn um 9 Uhr, Gipfelrunde bis 11, dann Pinzgauer Spaziergang oder zu Fuß zur Mittelstation und Bergfahrt-Ticket (32 €) sparen. Gewitter kommen nachmittags von Westen — ab 14 Uhr unten sein.","link":"https://www.schmitten.at/","quelle":"https://www.schmitten.at/de/Tickets-Preise/Sommerbergbahn-Tickets","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":5.6},{"id":"kitzsteinhorn","name":"Kitzsteinhorn – TOP OF SALZBURG (3.029 m)","kategorie":"aussicht","muss":3,"kurz":"Mit der Seilbahn auf den Gletscher: Aussichtsplattform, Nationalpark-Galerie, Schnee im Juli","beschreibung":"Vom Kapruner Tal in vier Bahnen auf 3.029 m: Gletscherjet 1–4 bis Alpincenter, dann Gipfelbahn zur Station TOP OF SALZBURG mit zwei Plattformen (Großglockner-Blick), der 360 m langen Nationalpark-Galerie durch den Fels, Cinema 3000 und der ICE ARENA mit Schneestrand und Rutschen im Juli/August. Der einzige Ort in Salzburg, wo du im Sommer in Schnee stehst — dementsprechend das teuerste Ticket der Reise.","lat":47.1888,"lon":12.6878,"adresse":"Gletscherjet 1 Talstation, Kesselfallstraße 60, 5710 Kaprun","dauer_min":300,"preis":{"erwachsene":61,"ermaessigt":58,"unter26":null,"waehrung":"EUR","eur":61,"hinweis":"TOP OF SALZBURG Ticket 61 €, mit Pinzgauer Gästekarte 58 €, Jugend Jg. 2008–2010 45,50 €, Kinder Jg. 2011–2020 30,50 €. Nur bis Alpincenter (2.450 m) 48 €. Mit Sommerkarte frei (außer 3K K-onnection)."},"kostenlos":{"immer":false,"regeln":["Mit Zell am See-Kaprun Sommerkarte frei (Gipfelbahn 15.7.–15.9. erst ab 2. Tag — betrifft dich nicht)"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Sommerbetrieb 7. April–26. Nov 2026, Bahnen ca. 8:15–16:30","ruhetag":null,"reservierung":"empfohlen","tipp":"Nur bei Blau am Morgen rauf (Webcam kitzsteinhorn.at) — bei Nebel siehst du 61 € lang nichts. Warme Jacke, Sonnenbrille, Sonnencreme. Hinfahrt Postbus 660 Zell am See – Kaprun – Kitzsteinhorn Talstation (mit Guest Mobility Ticket gratis).","link":"https://www.kitzsteinhorn.at/","quelle":"https://www.kitzsteinhorn.at/en/tickets-prices/top-of-salzburg","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":17.5},{"id":"mooserboden","name":"Kaprun Hochgebirgsstauseen – Mooserboden (2.040 m)","kategorie":"natur","muss":3,"kurz":"Mit Bus und Europas größtem Schrägaufzug zu zwei türkisen Stauseen unter dem Gletscher","beschreibung":"Ab der Kassa Kesselfall geht's per Transferbus, dem offenen Lärchwand-Schrägaufzug (431 m Höhenunterschied) und wieder Bus zum Mooserboden: zwei Staumauern, türkises Wasser, das Kitzsteinhorn-Massiv dahinter. Oben Staumauer-Führung ins Innere der 107 m hohen Mauer, Höhenweg zum Fürthermoar und Elektrizitätsgeschichte im Informationszentrum. Spektakulärer als Kitzsteinhorn, deutlich billiger.","lat":47.1639,"lon":12.7261,"adresse":"Kassa Kesselfall, Kesselfallstraße 98, 5710 Kaprun","dauer_min":300,"preis":{"erwachsene":39.5,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":39.5,"hinweis":"Berg + Tal 39,50 € (einfach 22 €), Kinder Jg. 2011–2020 22 €, Familienkarte 101 €. Staumauerführung extra 12 € (Kinder 8 €). Mit Sommerkarte Berg + Tal frei."},"kostenlos":{"immer":false,"regeln":["Mit Zell am See-Kaprun Sommerkarte frei (15.7.–15.9. erst ab 2. Tag — betrifft dich nicht)"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"22. Mai–11. Okt 2026, tägl. ab 8:10, Juli/Aug bis 17:00, letzte Bergfahrt 15:30","ruhetag":null,"reservierung":"empfohlen","tipp":"Postbus 660 ab Zell am See bis Kesselfall (mit Guest Mobility Ticket gratis), früh los — ab 11 Uhr steht man am Schrägaufzug an. Transfer dauert 1 h pro Richtung, oben 2–3 h einplanen. Windjacke, es zieht am Stausee.","link":"https://visit.verbund.com/kaprun","quelle":"https://visit.verbund.com/de/kaprun/kaprun-hardfacts","preisstand":"2026","unsicher":false,"quelle_hinweis":"Gruppen-PDF nennt 35,50 € pro Person — das ist der Gruppentarif ab 15 Personen; 39,50 € ist der Einzelpreis der Hardfacts-Seite.","dist_km":18.7},{"id":"strandbaeder","name":"Strandbäder Zell am See / Thumersbach / Seespitz","kategorie":"strand","muss":2,"kurz":"Trinkwasserklarer See mit 20–23 °C, Sprungturm und Solarbecken","beschreibung":"Drei städtische Strandbäder: Zell am See (Stadt, Sprungturm, Rutsche, Trampolin), Thumersbach (direkt bei deinem Hotel, Liegewiese mit Stadtblick) und Seespitz (Südende, ruhiger). Alle mit solarbeheiztem Becken, Liegewiesen und Stegen; der See selbst ist Trinkwasserqualität und im Juli angenehm. Wer nur schwimmen will, findet außerhalb auch freie Stellen.","lat":47.3266,"lon":12.8148,"adresse":"Strandbad Thumersbach, Seeuferstraße, 5700 Zell am See","dauer_min":180,"preis":{"erwachsene":10.8,"ermaessigt":9.8,"unter26":null,"waehrung":"EUR","eur":11,"hinweis":"Einzeleintritt 10,80 €, mit Gästekarte 9,80 €, Jugend 6,80 €, Kinder 5,90 €. Mit Sommerkarte frei. Hotelgäste des Seestrand haben laut Portalen eigenen Badeplatz am Haus."},"kostenlos":{"immer":false,"regeln":["Mit Zell am See-Kaprun Sommerkarte frei","Seezugang außerhalb der Bäder (Erlberg, Südufer) frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Saison ab Anfang Mai bis Anfang/Mitte September, tägl. ca. 9:00–19:00 (wetterabhängig)","ruhetag":null,"reservierung":"nein","tipp":"Erst beim Hotel fragen, ob der eigene Seezugang reicht — dann sparst du dir das Strandbad ganz. Thumersbach ist das sonnigste Ufer am Abend, Zell am Morgen.","link":"https://www.100freizeit.com/","quelle":"https://www.100freizeit.com/freizeitzentrum/preise/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffnungszeiten nicht von der Betreiberseite extrahierbar; Saisonbeginn 2027 laut Betreiber 7. Mai.","dist_km":0.6},{"id":"schifffahrt","name":"Schifffahrt Zeller See","kategorie":"aktivitaet","muss":2,"kurz":"Panorama-Rundfahrt oder einfach als Fähre Thumersbach ↔ Zell nutzen","beschreibung":"Die MS Schmittenhöhe und das neue E-Schiff Maria Franziska von Trapp fahren stündlich ab der Esplanade: 45-minütige Panoramarundfahrt mit Blick auf Schmitten und Kitzsteinhorn, oder als Linienschiff mit Halt in Thumersbach — für dich die bequemste Verbindung zwischen Hotel und Stadt. Rundfahrt mit Sommerkarte einmal pro Aufenthalt gratis.","lat":47.3236,"lon":12.798,"adresse":"Schiffsanlegestelle Esplanade, 5700 Zell am See","dauer_min":60,"preis":{"erwachsene":24,"ermaessigt":22,"unter26":null,"waehrung":"EUR","eur":24,"hinweis":"Panorama-Rundfahrt 24 €, ermäßigt (Gästekarte) 22 €, Kinder 12 €. Überfahrt Zell ↔ Thumersbach einfach 6,50 €, retour 10,90 €. Mit Sommerkarte Rundfahrt 1× und Überfahrten frei."},"kostenlos":{"immer":false,"regeln":["Mit Zell am See-Kaprun Sommerkarte frei (Rundfahrt 1× pro Aufenthalt, Überfahrten unbegrenzt)"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"9. Mai–4. Okt 2026, stündlich 10:00–17:00","ruhetag":null,"reservierung":"nein","tipp":"Ohne Sommerkarte: Rundfahrt sparen, nur Überfahrt (6,50 €) — die Aussicht ist dieselbe. Letztes Schiff 17 Uhr, abends also Bus oder Fußweg.","link":"https://www.schmitten.at/betriebszeiten/schiff","quelle":"https://www.schmitten.at/betriebszeiten/schiff","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.0},{"id":"altstadt-vogtturm","name":"Zeller Altstadt & Museum Vogtturm","kategorie":"viertel","muss":2,"kurz":"Stadtplatz, romanische Hippolytkirche und der mittelalterliche Turm mit Stadtmuseum","beschreibung":"Die Altstadt ist klein: Stadtplatz mit dem Vogtturm (12. Jh., sechs Stockwerke Regionalgeschichte mit Mitmach-Stationen), die Pfarrkirche St. Hippolyt mit romanischem Turm und gotischer Empore, Schloss Rosenberg (Rathaus), die Esplanade am See. Eine Stunde Bummel, Eis an der Seepromenade, fertig — das Museum lohnt an Regentagen.","lat":47.3246,"lon":12.7962,"adresse":"Stadtplatz 8, 5700 Zell am See","dauer_min":90,"preis":{"erwachsene":10,"ermaessigt":7,"unter26":null,"waehrung":"EUR","eur":10,"hinweis":"Vogtturm 10 €, Studierende 7 €, Jugend 10–18 J. 5 €, unter 10 frei; 10 % mit Gästekarte. Mit Sommerkarte frei. Altstadt und Kirche frei."},"kostenlos":{"immer":false,"regeln":["Altstadt, Kirche, Esplanade immer frei","Vogtturm mit Sommerkarte frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Vogtturm Mi–So 13:00–18:00","ruhetag":"Montag und Dienstag (Vogtturm)","reservierung":"nein","tipp":"Vogtturm nur mit Sommerkarte oder bei Regen — 10 € für ein Heimatmuseum ist viel. Die Kirche hat den besten Blick von der Empore, gratis.","link":"https://vogtturm.at/","quelle":"https://vogtturm.at/besucherinfo/oeffnungszeiten-und-eintritt/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.2},{"id":"sigmund-thun-klamm","name":"Sigmund-Thun-Klamm","kategorie":"natur","muss":2,"kurz":"320 m Holzsteg durch eine 32 m tiefe Schlucht am Ortsrand von Kaprun","beschreibung":"Die Kapruner Ache hat sich hier zwischen Kraftwerk und Klammsee eingeschnitten; auf Stegen und Treppen gehst du in 30 Minuten durch die enge Klamm, oben öffnet sich der Klammsee mit Rundweg und Blick zum Kitzsteinhorn. Klein, aber nass und laut — und der perfekte Zwischenstopp zwischen Kaprun-Ort und Kesselfall/Mooserboden.","lat":47.2535,"lon":12.7458,"adresse":"Krafthausstraße 20, 5710 Kaprun","dauer_min":75,"preis":{"erwachsene":8.5,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":8.5,"hinweis":"Erwachsene ab 16 J. 8,50 €, Kinder 6–15 J. 6 €. Mit Sommerkarte frei."},"kostenlos":{"immer":false,"regeln":["Mit Zell am See-Kaprun Sommerkarte frei","Klammsee-Rundweg oberhalb frei zugänglich"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Juli–August tägl. 9:00–19:00 (Mai/Juni/Sep 9:00–17:30); Saison Anfang Mai–Anfang November","ruhetag":null,"reservierung":"nein","tipp":"Am Mooserboden-Tag mitnehmen: Bus 660 hält am Kraftwerk Hauptstufe. Einbahn bergauf — oben am Klammsee weiter zur Haltestelle, nicht zurück durch die Klamm.","link":"https://www.klamm-kaprun.at/","quelle":"https://klamm-kaprun.skiperformance.com/de/Sommer/support/prices","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":9.1},{"id":"pinzgauer-spaziergang","name":"Pinzgauer Spaziergang","kategorie":"natur","muss":2,"kurz":"17 km Höhenweg auf 2.000 m von der Schmittenhöhe nach Saalbach — fast ohne Steigung","beschreibung":"Einer der schönsten Höhenwege der Alpen: von der Schmittenhöhe über Hochkogel und Schattberg-Kamm nach Saalbach, immer auf ca. 2.000 m, immer mit den Hohen Tauern im Rücken und den Kitzbüheler Alpen voraus. 6–7 Stunden, kaum Gegenanstiege, kurze Varianten bis zur Rohrertörl-Abzweigung und Abstieg nach Viehhofen oder zurück zur Schmitten möglich. Zurück ab Saalbach mit dem Postbus.","lat":47.3375,"lon":12.67,"adresse":"Start Bergstation Schmittenhöhebahn, 5700 Zell am See","dauer_min":420,"preis":{"erwachsene":32,"ermaessigt":29,"unter26":null,"waehrung":"EUR","eur":32,"hinweis":"Nur Bergfahrt Schmittenhöhe 32 € (Gästekarte 29 €); mit Sommerkarte frei. Ziel Saalbach: Schattberg-Bahn talwärts extra oder 1,5 h Abstieg zu Fuß. Bus Saalbach–Zell am See mit Guest Mobility Ticket gratis."},"kostenlos":{"immer":false,"regeln":["Weg selbst frei; Bergfahrt mit Sommerkarte frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Schneefrei meist ab Mitte/Ende Juni; Schmittenhöhebahn ab 9:00","ruhetag":null,"reservierung":"nein","tipp":"Erste Bahn 9 Uhr, dann reicht es bis Saalbach vor 16 Uhr. Wetterfenster prüfen — auf dem Kamm gibt es bei Gewitter keinen Schutz. Wasser und Proviant mitnehmen, unterwegs keine Hütte bis zum Schattberg.","link":"https://www.schmitten.at/","quelle":"https://www.schmitten.at/de/Tickets-Preise/Sommerbergbahn-Tickets","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":10.8},{"id":"grossglockner","name":"Tagesausflug Großglockner Hochalpenstraße","kategorie":"tagesausflug","muss":2,"kurz":"48 km Panoramastraße, 36 Kehren, Pasterze-Gletscher und Murmeltiere an der Franz-Josefs-Höhe","beschreibung":"Die berühmteste Alpenstraße Österreichs steigt von Fusch über 36 Kehren zum Hochtor (2.504 m) und zur Kaiser-Franz-Josefs-Höhe (2.369 m) direkt gegenüber dem Großglockner (3.798 m) und der schrumpfenden Pasterze. Ohne Auto bleibt nur der Glocknerbus (Ausflugsbus ab Zell am See, Di + Do im Juli): 9 Uhr ab Hallenbad-Parkplatz, 16:30 zurück, Edelweißspitze und Franz-Josefs-Höhe inklusive. Teuer, aber einmaliger Blick.","lat":47.0744,"lon":12.7513,"adresse":"Kaiser-Franz-Josefs-Höhe, 9844 Heiligenblut","dauer_min":450,"preis":{"erwachsene":45,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":45,"hinweis":"Glocknerbus ab 45 € pro Person (Maut inklusive), 10 % mit Zell am See-Kaprun Card. Pkw-Tageskarte wäre 46,50 € pro Auto (E-Auto 40 €). Linienbus-Alternative nicht verifiziert."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":"Glocknerbus fährt dienstags (Juli/Aug auch donnerstags): in deinem Aufenthalt nur Di 13.7. = Abreisetag. Sonst entfällt der Ausflug."},"oeffnungszeiten":"Straße Juni–Aug 5:30–21:00; Glocknerbus 26. Mai–29. Sep 2026, Reservierung bis 15 Uhr am Vortag","ruhetag":null,"reservierung":"nötig","tipp":"Nur machen, wenn der Dienstag 13.7. mit deiner Weiterreise vereinbar ist (zurück 16:30). Sonst ehrlich streichen — der Mooserboden liefert 80 % des Gletscherblicks für die Hälfte.","link":"https://www.grossglockner.at/","quelle":"https://www.grossglockner.at/en/for-your-visit/glocknerbus","preisstand":"2026","unsicher":true,"quelle_hinweis":"Glocknerbus-Preis 2026 „ab 45 €“ laut grossglockner.at (Veranstalter PRI Tours); 2027-Fahrtage noch nicht veröffentlicht.","dist_km":27.9},{"id":"krimml","name":"Tagesausflug Krimmler Wasserfälle","kategorie":"tagesausflug","muss":2,"kurz":"380 m in drei Stufen — die höchsten Wasserfälle Österreichs, Wasserfallweg 4 km","beschreibung":"Die Krimmler Ache stürzt in drei Stufen 380 m ins Salzachtal; der Wasserfallweg führt in 1,5–2 h mit Aussichtskanzeln bis zum oberen Fall, im Juli nach der Schmelze mit maximaler Gischt. Hin geht es mit der Pinzgauer Lokalbahn (Schmalspur, ~1 h 40 bis Krimml; Abschnitt Mittersill–Krimml 2026 noch Schienenersatzverkehr) und 20 min Fußweg bzw. Ortsbus. Kombiticket mit den WasserWelten möglich.","lat":47.2089,"lon":12.1719,"adresse":"Oberkrimml 45, 5743 Krimml","dauer_min":480,"preis":{"erwachsene":9,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":9,"hinweis":"Wasserfallweg 9 €, Kinder 6–15 J. 4,50 €; Kombi mit WasserWelten 15,90 €. Zell am See-Kaprun Card: 2 € Rabatt. Lokalbahn mit Guest Mobility Ticket gratis, sonst Fahrpreis nicht verifiziert; Interrail gilt NICHT (Salzburg AG)."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Wasserfallweg 1. Mai–Ende Oktober durchgehend; Kassa ca. 8:00–18:00","ruhetag":null,"reservierung":"nein","tipp":"Nur mit Guest Mobility Ticket lohnend — sonst sind Bahn plus Eintritt ein 30-€-Tag für einen Wasserfall. Früh los (Lokalbahn ab Zell ca. 8 Uhr), bis 11 am Fall, zurück bevor die Gewitter kommen. Regenjacke: die Gischt am unteren Fall ist Dusche.","link":"https://www.wasserfaelle-krimml.at/","quelle":"https://wasserfaelle-krimml.at/en/besuchen/tickets","preisstand":"2026","unsicher":true,"quelle_hinweis":"Lokalbahn-Fahrpreis und Status des Schienenersatzverkehrs 2027 nicht verifiziert (pinzgauerlokalbahn.at ohne Tarifangabe).","dist_km":49.9},{"id":"tauern-spa","name":"TAUERN SPA Kaprun","kategorie":"aktivitaet","muss":1,"kurz":"Therme mit Panoramabecken auf dem Dach — Schlechtwetter-Joker mit Kitzsteinhorn-Blick","beschreibung":"Große Therme am Ortsrand von Kaprun: Innen- und Außenbecken, Dach-Infinity-Pool mit Blick zum Kitzsteinhorn, Rutschen, Saunawelt gegen Aufpreis. Nicht günstig und kein Muss — aber wenn an einem Tag der Regen durchzieht, ist das die Rettung. Dynamische Preise, online buchen ist billiger als an der Kasse.","lat":47.2785,"lon":12.758,"adresse":"Tauern Spa Platz 1, 5710 Kaprun","dauer_min":240,"preis":{"erwachsene":28.5,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":28.5,"hinweis":"Tageskarte Wasserwelt ab 28,50 €, 3-Stunden-Karte ab 24 €, Abendkarte (ab 17 Uhr) ab 25,50 €; Sauna +19,50 €. Dynamisches Preismodell. Sommerkarte: Bonuspartner mit Rabatt (Höhe nicht veröffentlicht)."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Wasserwelt tägl. 9:00–21:00, Sauna 10:00–21:00","ruhetag":null,"reservierung":"empfohlen","tipp":"Abendkarte ab 17 Uhr nehmen: Dachpool bei Sonnenuntergang, 4 Stunden reichen, 3 € gespart. Bus 660 hält vor der Tür.","link":"https://www.tauernspakaprun.com/","quelle":"https://www.tauernspakaprun.com/de/therme/preise-oeffnungszeiten","preisstand":"2026","unsicher":false,"quelle_hinweis":"Preise „ab“ wegen dynamischer Preisgestaltung.","dist_km":6.3},{"id":"hundstein","name":"Hundstein (2.117 m)","kategorie":"natur","muss":1,"kurz":"Höchster Grasberg Europas, direkt über Thumersbach — Gipfel ohne Seilbahn, ohne Eintritt","beschreibung":"Der Hundstein steigt gleich hinter deinem Hotel auf: von Thumersbach über die Enzianhütte zum Statzerhaus am Gipfel (2.117 m) sind es 4–5 Stunden und 1.350 Höhenmeter, dafür steht man allein auf einem 360-Grad-Gipfel mit Blick auf Hohe Tauern, Steinernes Meer und den See. Der Gegenentwurf zur Schmitten: kein Ticket, keine Menschen, dafür Schweiß.","lat":47.3482,"lon":12.8889,"adresse":"Ausgangspunkt Thumersbach (Enzianhütte), 5700 Zell am See","dauer_min":480,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Frei. Statzerhaus bewirtschaftet (Juli), Jause 10–15 €."},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-07-09","2027-07-10","2027-07-11","2027-07-12","2027-07-13"],"hinweis":null},"oeffnungszeiten":"immer; nur bei stabilem Wetter","ruhetag":null,"reservierung":"nein","tipp":"Start 6 Uhr, Gipfel bis 11, Abstieg vor den Gewittern. 2 Liter Wasser, der Grasberg bietet keinen Schatten. Abkürzung: Taxi/Mitfahrt bis zur Enzianhütte spart 500 Hm.","link":"https://www.zellamsee-kaprun.com/de","quelle":"https://www.zellamsee-kaprun.com/en/region/attractions","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":6.5},{"id":"maiskogel","name":"Maiskogel (1.570 m)","kategorie":"natur","muss":1,"kurz":"Kapruns Familienberg: Almwiesen, Maisi-Flitzer-Rodelbahn, günstigere Bahn","beschreibung":"Die MK Maiskogelbahn startet direkt im Ort Kaprun und bringt dich auf 1.570 m zu Almwiesen, Spielplätzen und einem einfachen Höhenrundweg mit Blick auf Kitzsteinhorn und Zeller See. Über die K-onnection-Bahn ist der Maiskogel mit dem Kitzsteinhorn verbunden. Für sich allein nur mit Sommerkarte oder als Wander-Ausgangspunkt (Abstieg nach Kaprun 1,5 h) interessant.","lat":47.2572,"lon":12.7405,"adresse":"MK Maiskogelbahn, Schloßstraße 1, 5710 Kaprun","dauer_min":180,"preis":{"erwachsene":31.5,"ermaessigt":30,"unter26":null,"waehrung":"EUR","eur":31.5,"hinweis":"Berg + Tal 31,50 €, Gästekarte 30 €, Jugend Jg. 2008–2010 23,50 €, Kinder 15,50 €. Einfache Fahrt 20,50 €. Mit Sommerkarte frei."},"kostenlos":{"immer":false,"regeln":["Mit Zell am See-Kaprun Sommerkarte frei","Aufstieg zu Fuß frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"23. Mai–4. Okt 2026, ca. 9:00–17:00","ruhetag":null,"reservierung":"nein","tipp":"Ohne Sommerkarte weglassen — die 31,50 € stecken besser in der Schmitten. Mit Karte: Bergfahrt, Abstieg zu Fuß über die Glocknerblick-Alm nach Kaprun, dann Klamm.","link":"https://www.kitzsteinhorn.at/de/maiskogel","quelle":"https://www.kitzsteinhorn.at/en/tickets-prices/round-trip-tickets","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":9.0}],"tage":[{"datum":"2027-07-09","titel":"Über den See, ins Wasser","intro":"Ankunft am Ostufer: Das Hotel liegt in Thumersbach gegenüber der Stadt, das Schiff (stündlich bis 17 Uhr) ist der schönste Weg hin. Beim Einchecken die drei Karten einfordern – Sommerkarte (falls das Hotel Partner ist: Bahnen, Schiff, Bäder gratis), Guest Mobility Ticket (Busse und Lokalbahn gratis) und Pinzgauer Gästekarte. Danach nur noch See.","programm":[{"spot":null,"zeit":"14:00","titel":"Ankunft Zell am See, Einkauf","notiz":"Vom Bahnhof 5 Min. zur Esplanade; vorher bei Spar oder Billa im Zentrum Abendessen und Wasser kaufen – Thumersbach hat wenig, und abends fährt kein Schiff mehr."},{"spot":"schifffahrt","zeit":"15:00","notiz":"Als Fähre nutzen: Überfahrt Esplanade → Thumersbach 6,50 € (retour 10,90 €), mit Sommerkarte frei. Die Rundfahrt für 24 € sparen – die Aussicht ist dieselbe."},{"spot":null,"zeit":"15:30","titel":"Einchecken im Seestrand","notiz":"Sommerkarte, Guest Mobility Ticket und Gästekarte verlangen und fragen, ob der hoteleigene Seezugang reicht – dann sparst du das Strandbad."},{"spot":"strandbaeder","zeit":"16:30","notiz":"Strandbad Thumersbach liegt direkt beim Hotel (bis 19 Uhr, 10,80 € / 9,80 € mit Gästekarte / Sommerkarte frei) – oder gleich der Hotel-Steg. Thumersbach ist abends das sonnigste Ufer, gegenüber Stadt und Schmitten."},{"spot":null,"zeit":"19:30","titel":"Abend auf der Thumersbacher Promenade","notiz":"Alpenglühen am Kitzsteinhorn vom Ufer vor dem Hotel, Picknick aus dem Supermarkt. Webcam kitzsteinhorn.at für morgen prüfen."}]},{"datum":"2027-07-10","titel":"Gletscher am Morgen, Altstadt danach","intro":"Seilbahn-Tag, also früh: Das Kitzsteinhorn lohnt nur bei blauem Himmel am Morgen, und ab 14 Uhr kommen die Gewitter – zeigt die Webcam Nebel, tausche mit dem Schmitten-Tag morgen. Oben um 0 °C, also Jacke, Sonnenbrille, Sonnencreme. Nachmittags Zeller Altstadt und der Vogtturm (nur Mi–So offen).","programm":[{"spot":null,"zeit":"07:30","titel":"Bus nach Zell, Postbus 660 nach Kaprun","notiz":"Das Schiff fährt erst ab 10 Uhr, also Bus von Thumersbach in die Stadt und weiter mit dem Postbus 660 bis Kitzsteinhorn Talstation (mit Guest Mobility Ticket gratis)."},{"spot":"kitzsteinhorn","zeit":"08:45","notiz":"Bahnen ab 8:15, vorher buchen empfohlen (61 €, 58 € mit Gästekarte, Sommerkarte frei). Gletscherjet bis Alpincenter, Gipfelbahn zu TOP OF SALZBURG: Plattformen, Nationalpark-Galerie, ICE ARENA mit Schnee. Spätestens 13:30 wieder unten."},{"spot":null,"zeit":"14:00","titel":"Zurück nach Zell, Mittag","notiz":"Postbus 660 zurück. Kaspressknödel oder Kasnocken gibt es unten günstiger als auf 3.000 m."},{"spot":"altstadt-vogtturm","zeit":"15:00","notiz":"Stadtplatz, Hippolytkirche (Empore gratis, bester Blick), Esplanade. Vogtturm Mi–So 13–18 Uhr: 7 € mit Studiausweis – nur mit Sommerkarte oder bei Regen."},{"spot":null,"zeit":"17:00","titel":"Abendessen in der Stadt, Bus zurück","notiz":"In Zell bleiben und essen (Trinkgeld 5–10 %, Hüttenkassen bar). Das letzte Schiff geht um 17 Uhr – danach Bus nach Thumersbach oder 45 Min. ums Nordufer."}]},{"datum":"2027-07-11","titel":"Schmittenhöhe und der Höhenweg","intro":"Der Bergtag aus dem Stadt-Intro: erste Bahn um 9, Gipfelrunde, dann auf dem Pinzgauer Spaziergang nach Westen – fast ohne Steigung, aber ohne Hütte und ohne Schutz bei Gewitter. Die komplette Strecke bis Saalbach sind 6–7 Stunden; bei unsicherem Wetter die kurze Variante bis zur Rohrertörl-Abzweigung und zurück zur Schmitten. Wasser und Proviant für den ganzen Tag mitnehmen.","programm":[{"spot":null,"zeit":"08:00","titel":"Bus nach Zell, zur Talstation","notiz":"Bus von Thumersbach in die Stadt, von dort 15 Min. zu Fuß zur Schmittenhöhebahn (Schmittenstraße 119)."},{"spot":"schmittenhoehe","zeit":"09:00","notiz":"Gipfelstürmer-Ticket 45 € (40,50 € mit Gästekarte, Sommerkarte frei; für den Höhenweg reicht die Bergfahrt für 32 €). Elisabethkapelle, Gipfelrundweg, Panoramaplattform – bis 10:30, dann los."},{"spot":"pinzgauer-spaziergang","zeit":"10:30","notiz":"Ab Bergstation über Hochkogel und Schattberg-Kamm auf 2.000 m. Bis Saalbach vor 16 Uhr, dann Schattberg-Bahn oder 1,5 h Abstieg, zurück mit dem Postbus (Guest Mobility Ticket). Kurzvariante: bis zur Rohrertörl-Abzweigung und zurück."},{"spot":null,"zeit":"18:30","titel":"Abendessen in Zell, Bus nach Thumersbach","notiz":"Kasnocken-Abend in der Stadt, Bus zurück – das Schiff ist um 17 Uhr durch."}]},{"datum":"2027-07-12","titel":"Mooserboden, Klamm, Seeabend","intro":"Kaprun-Tag: zuerst die Stauseen, weil ab 11 Uhr die Schlange am Lärchwand-Schrägaufzug steht, die Klamm danach auf dem Rückweg – der Bus 660 hält am Kraftwerk Hauptstufe. Vogtturm und Co. spielen heute keine Rolle (Montag zu). Abends die Südhälfte des Seerundwegs von der Stadt zurück zum Hotel, mit Alpenglühen von der Thumersbacher Promenade.","programm":[{"spot":null,"zeit":"07:30","titel":"Bus nach Zell, Postbus 660 bis Kesselfall","notiz":"Mit Guest Mobility Ticket gratis. Windjacke einpacken, am Stausee zieht es."},{"spot":"mooserboden","zeit":"08:30","notiz":"Kassa Kesselfall ab 8:10, vorher buchen empfohlen (39,50 €, Sommerkarte frei). Transferbus, Schrägaufzug, Bus – 1 h pro Richtung, oben 2–3 h: Staumauern, Höhenweg zum Fürthermoar, Staumauerführung extra 12 €. Letzte Bergfahrt 15:30."},{"spot":"sigmund-thun-klamm","zeit":"14:30","notiz":"Bus 660 bis Kraftwerk Hauptstufe, Einbahn bergauf (8,50 €, Sommerkarte frei). Oben am Klammsee Rundweg mit Kitzsteinhorn-Blick, dann weiter zur Haltestelle – nicht zurück durch die Klamm."},{"spot":null,"zeit":"16:30","titel":"Zurück nach Zell, früh essen","notiz":"Bus 660 in die Stadt, Abendessen in Zell."},{"spot":"seerundweg","zeit":"18:30","notiz":"Zu Fuß zurück ums Südufer: Esplanade, Schilfgebiet bei Schüttdorf, Thumersbacher Promenade – gut 1,5 h, eben. Abends vom Ostufer das Alpenglühen am Kitzsteinhorn, die beste Aussicht am See."}]},{"datum":"2027-07-13","titel":"Sonnenaufgang, Schiff, Zug nach Maribor","intro":"Abreisetag – gegen 11 Uhr am Bahnhof. Der Glocknerbus fährt heute, aber bis 16:30, das geht sich mit der Weiterreise nicht aus. Also Sonnenaufgang vor der Tür, Frühstück, und mit dem ersten Schiff um 10 Uhr rüber; wer früher los muss, nimmt den Bus. Gepäck bis 9:45 unten.","programm":[{"spot":null,"zeit":"06:00","titel":"Sonnenaufgang auf der Promenade","notiz":"Kitzsteinhorn rosa, direkt vor dem Hotel – 20 Minuten, dann zurück ins Bett oder zum Frühstück."},{"spot":null,"zeit":"08:30","titel":"Frühstück, auschecken","notiz":"Guest Mobility Ticket gilt bis zur Abreise – Bus oder Schiff sind frei."},{"spot":null,"zeit":"10:00","titel":"Erstes Schiff nach Zell, zum Bahnhof","notiz":"Überfahrt Thumersbach → Esplanade (6,50 €, Sommerkarte frei), 5 Min. zum Bahnhof. Interrail gilt ab hier wieder auf der ÖBB."}]}],"naechte":4},{"id":"maribor","name":"Maribor","land":"Slowenien","landcode":"SI","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-07-13","abreise":"2027-07-15","unterkunft":{"name":"Grajski kamen apartment","ort":"Maribor","lat":46.5595,"lon":15.647,"hinweis":"Altstadt bei der Burg (Grajski trg), Adresse unbekannt"},"zentrum":{"lat":46.558,"lon":15.6455},"intro":"Maribor ist Sloweniens zweitgrößte Stadt und fühlt sich an wie ein großes Weindorf an der Drau: Altstadt, Flussufer Lent mit der ältesten Weinrebe der Welt, und direkt hinter den letzten Häusern der Pohorje-Bergrücken mit Seilbahn. Zwei Tage reichen: einer für Altstadt, Lent und Burgmuseum, einer für Pohorje oder die Badeinsel. Du bist Dienstag bis Donnerstag da – gut für Museen, schlecht für die Pohorje-Seilbahn, die 2026 außerhalb der Ferienzeit nur Fr–So fuhr: unbedingt den Fahrplan 2027 prüfen.","feiertage":[],"gut_zu_wissen":[{"titel":"Gratistage in Slowenien","text":"Es gibt keine nationale Erster-Sonntag-Regel; einzelne Häuser (z. B. Ethnografisches Museum Ljubljana) machen den ersten Sonntag frei, das Regionalmuseum Maribor nicht – dessen Gratistage sind 08.02. (Prešeren-Tag), 18.05. (Museumstag), 3. Samstag im Juni und 03.12. Keiner fällt in deinen Aufenthalt, und du hast eh keinen Sonntag. Studi-Tarif liegt meist bei 50–60 %."},{"titel":"Nahverkehr (Marprom)","text":"Alles in der Altstadt ist zu Fuß 10 Minuten. Bus brauchst du nur für die Pohorje-Seilbahn (Linie G6 ab Hauptbahnhof/Zentrum, ca. 20 Min.) und Mariborski otok (Linie 15). Einzelfahrt im Voraus 1,30 € (App 'Marprom shop'); Papiertickets gibt es seit 01.01.2026 nicht mehr, aber beim Fahrer kann man mit Karte oder bar zahlen (etwas teurer). Zum Otok sind die letzten beiden Haltestellen laut Presse 2025 gratis."},{"titel":"Festival Lent","text":"Sloweniens größtes Open-Air-Festival am Drauufer – 2026 vom 26.06. bis 04.07., viele Konzerte frei. Termin 2027 war im Oktober 2026 noch nicht veröffentlicht, traditionell letzte Juniwoche. Bei deinem Besuch Mitte Juli ist es vorbei; die Bühnen am Lent können noch stehen."},{"titel":"Wein & Essen","text":"Maribor ist Weinstadt (Štajerska): Sauvignon, Laški Rizling, Šipon. Günstig probieren im Haus der Alten Rebe (Gläser ab ca. 3 €) statt bei der Vinag-Führung. Essen: Pohorska gibanica (Schichtkuchen), Štajerska kisla juha (saure Suppe), Hauswürste – günstig mittags als 'malica' (Tagesgericht 7–10 €) in Gostilnas um den Glavni trg. Leitungswasser ist Quellwasser, Trinkgeld 5–10 %."}],"spots":[{"id":"stara-trta","name":"Älteste Weinrebe der Welt & Haus der Alten Rebe","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Über 400 Jahre alte Žametovka-Rebe am Drauufer, Guinness-Rekord, Eintritt frei","beschreibung":"An der Fassade eines Hauses am Lent wächst eine Rebe, die seit mindestens 1570 Trauben trägt – die älteste noch fruchtende der Welt. Jedes Jahr werden daraus ein paar Dutzend 0,25-l-Fläschchen gefüllt, die nur an Staatsgäste gehen. Das Haus dahinter ist seit der Renovierung 2024 Weinladen und Verkostungsraum mit über 200 Weinen von 50 steirischen Winzern, plus digitaler Ausstellung zur Rebe. Eintritt frei, 365 Tage offen.","lat":46.5576,"lon":15.6437,"adresse":"Vojašniška ulica 8, 2000 Maribor","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Eintritt frei; Weinproben kosten (Glas ca. 3–5 €, nicht offiziell geprüft)"},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-07-13","2027-07-14","2027-07-15"],"hinweis":null},"oeffnungszeiten":"tägl. ca. 10:00–18:00 (365 Tage; genaue Zeiten 2027 auf visitmaribor.si)","ruhetag":null,"reservierung":"nein","tipp":"Die Rebe selbst ist von außen jederzeit zu sehen – abends, wenn der Laden zu hat, hast du sie für dich. Für die Geschichte dahinter das kleine Museum der Alten Rebe am Vojašniški trg nebenan.","link":"https://www.visitmaribor.si/en/","quelle":"https://www.slovenia.info/sl/novinarsko-sredisce/novice/30929-najbolj-obiskana-turisticna-znamenitost-v-mariboru-vstopa-v-novo-obdobje","preisstand":"2026","unsicher":false,"quelle_hinweis":"Gratis-Eintritt laut Slovenia.info (Pressemitteilung 12/2024); Visit-Maribor-Seite der Sehenswürdigkeit nicht ladbar.","dist_km":0.3},{"id":"lent","name":"Lent – Drauufer mit Gerichtsturm und Wasserturm","kategorie":"viertel","muss":3,"kurz":"Mittelalterliches Hafenviertel, heute Uferpromenade mit Bars","beschreibung":"Lent war der Flusshafen, wo die Flößer aus dem Pohorje anlegten. Heute ist es die Uferpromenade unter
