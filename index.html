<!doctype html>
<html lang="de">
<head>

<meta name="apple-mobile-web-app-title" content="Interrail 2027">
<meta name="theme-color" content="#1F3C88">

<title>Interrail 2027</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: Bahnsteig-App. Eine Spalte (max 760px), feste Tab-Leiste unten, Karten pro Spot, Linienfarbe = Reiseroute. */
:root{
  --bg:#F2F4F6; --surface:#FFFFFF; --surface2:#E9EDF1; --fg:#15202B; --muted:#5D6B79; --line:#D5DCE3;
  --accent:#1F3C88; --accent-soft:#E4EAF8; --accent-fg:#FFFFFF;
  --free:#0E7A4F; --free-bg:#DFF3E8; --warn:#A8560A; --warn-bg:#FBEEDD; --bad:#9F2A2A; --bad-bg:#F9E3E3;
  --display:"Bricolage Grotesque","Instrument Sans",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(21,32,43,.06),0 6px 20px rgba(21,32,43,.06);
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1319; --surface:#161E27; --surface2:#1F2934; --fg:#E7ECF1; --muted:#98A6B4; --line:#2A3542;
  --accent:#9DB8FF; --accent-soft:#1E2B45; --accent-fg:#0D1319;
  --free:#5BD39A; --free-bg:#153527; --warn:#F1B46B; --warn-bg:#3A2A12; --bad:#F08E8E; --bad-bg:#3E1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#161E27; --surface2:#1F2934; --fg:#E7ECF1; --muted:#98A6B4; --line:#2A3542;
  --accent:#9DB8FF; --accent-soft:#1E2B45; --accent-fg:#0D1319;
  --free:#5BD39A; --free-bg:#153527; --warn:#F1B46B; --warn-bg:#3A2A12; --bad:#F08E8E; --bad-bg:#3E1C1C;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px calc(84px + env(safe-area-inset-bottom,0px))}
.view[hidden]{display:none}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
.tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 8px;font-size:11px;font-weight:600;color:var(--muted);border-top:2px solid transparent}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent);border-top-color:var(--accent)}
/* Hero */
.hero{display:flex;flex-direction:column;gap:6px;padding:20px 0 10px}
.hero h1{font-size:clamp(34px,9vw,50px);font-weight:800;letter-spacing:-.02em}
.hero .sub{font-size:17px;color:var(--muted)}
.counter{display:inline-flex;gap:8px;align-items:baseline;background:var(--accent);color:var(--accent-fg);border-radius:999px;padding:8px 14px;font-weight:600;margin-top:6px;align-self:flex-start}
.counter b{font-family:var(--display);font-size:22px;font-weight:800}
/* Route timeline */
.route{list-style:none;margin:16px 0 0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:19px;top:14px;bottom:14px;width:2px;background:var(--line)}
.route li{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:8px 0;position:relative}
.route .dot{width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-left:13px;z-index:1}
.route li.extra .dot{border-style:dashed;border-color:var(--muted)}
.route li.now .dot{background:var(--accent);box-shadow:0 0 0 5px var(--accent-soft)}
.route button.stop{text-align:left;display:block;width:100%;padding:8px 0}
.route .name{font-family:var(--display);font-weight:700;font-size:19px}
.route .when{color:var(--muted);font-size:14px}
.route .n{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.route .n b{display:block;font-family:var(--display);font-size:18px;color:var(--fg)}
/* City header */
.cityhead{padding:6px 0 14px}
.cityhead h2{font-size:clamp(28px,7vw,40px);font-weight:800;letter-spacing:-.02em}
.cityhead .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:14px;margin-top:6px}
.cityhead .intro{margin:10px 0 0;max-width:65ch}
.picker{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.picker::-webkit-scrollbar{display:none}
.picker button{white-space:nowrap;padding:7px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500}
.picker button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.navrow{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.navrow button{color:var(--accent);font-weight:600;font-size:14px;padding:8px 0}
/* Notices */
.notice{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 14px;border-radius:var(--r);margin:10px 0;font-size:14px}
.notice.warn{background:var(--warn-bg);color:var(--fg)}
.notice.warn .ic{color:var(--warn)}
.notice.free{background:var(--free-bg)}
.notice.free .ic{color:var(--free)}
.notice .ic{font-weight:800;font-family:var(--display);font-size:16px}
.notice b{font-weight:600}
/* Know */
details.know{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:8px 0}
details.know summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.know summary::-webkit-details-marker{display:none}
details.know summary::after{content:"+";font-family:var(--display);font-size:20px;color:var(--muted)}
details.know[open] summary::after{content:"–"}
details.know .body{padding:0 14px 14px;font-size:15px}
details.know .body p{margin:0 0 10px}
details.know .body h4{margin:12px 0 4px;font-size:15px;font-family:var(--display)}
/* Filters */
.filters{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.filters::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip.free[aria-pressed="true"]{background:var(--free);border-color:var(--free);color:#fff}
.sect{display:flex;justify-content:space-between;align-items:baseline;margin:18px 0 8px}
.sect h3{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
/* Spot cards */
.spots{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.spot{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:70px}
.spot .head{display:grid;grid-template-columns:1fr auto;gap:8px 12px;padding:14px 14px 12px;width:100%;text-align:left;align-items:start}
.spot .title{font-family:var(--display);font-weight:700;font-size:18px;line-height:1.2}
.spot .kurz{color:var(--muted);font-size:14px;margin-top:2px}
.spot .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;grid-column:1/-1}
.tag{font-size:12px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--surface2);color:var(--muted)}
.tag.free{background:var(--free-bg);color:var(--free)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.must{background:var(--accent-soft);color:var(--accent)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.price{text-align:right;white-space:nowrap}
.price .main{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1}
.price .main.free{color:var(--free)}
.price .sub{font-size:12px;color:var(--muted);margin-top:2px}
.spot .detail{border-top:1px solid var(--line);padding:12px 14px 14px;font-size:15px}
.spot .detail p{margin:0 0 10px}
.spot .detail p:last-child{margin-bottom:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14px;margin:10px 0}
.kv dt{color:var(--muted);font-weight:500}
.kv dd{margin:0;min-width:0}
.ptable{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0 12px}
.ptable td{padding:6px 0;border-bottom:1px solid var(--line)}
.ptable td:last-child{text-align:right;font-weight:600}
.ptable tr.you td{color:var(--accent);font-weight:700}
.ptable td .eur{color:var(--muted);font-weight:400;font-size:12.5px;margin-left:6px}
.freebox{background:var(--free-bg);border-radius:10px;padding:10px 12px;margin:8px 0 12px;font-size:14px}
.freebox b{color:var(--free)}
.freebox ul{margin:4px 0 0;padding-left:18px}
.dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.dates span{background:var(--surface);border:1px solid var(--free);color:var(--free);border-radius:6px;padding:2px 8px;font-weight:600;font-size:13px}
.tip{border-left:3px solid var(--accent);padding:6px 12px;margin:10px 0;background:var(--accent-soft);border-radius:0 10px 10px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.actions a,.actions button{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;text-decoration:none;color:var(--fg);background:var(--surface)}
.actions button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.src{font-size:12px;color:var(--muted);margin-top:12px}
.src a{color:var(--muted)}
.heart{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.heart.on{color:var(--bad)}
.heart svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.heart.on svg{fill:currentColor}
/* Map */
.map{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:10px;margin:10px 0}
.map > svg{width:100%;height:auto;display:block;font-family:var(--body)}
.map .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);padding:8px 4px 2px}
.map .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.map > svg text{fill:var(--fg)}
.map > svg .lbl{font-size:10px;fill:var(--muted)}
.map circle.pin{cursor:pointer}
.map .home{fill:var(--accent)}
/* Tagesplan */
.tag{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 14px 6px;margin:10px 0}
.tag .th{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}
.tag .th .d{font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.02em}
.tag .th h4{font-family:var(--display);font-size:19px;font-weight:700;margin:0;line-height:1.2}
.tag .intro{color:var(--muted);font-size:14.5px;margin:4px 0 10px;max-width:65ch}
.prog{display:grid;grid-template-columns:52px 1fr;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.prog .zeit{font-family:var(--display);font-weight:700;font-size:15px;color:var(--muted);padding-top:2px}
.prog .pn{font-weight:700;font-size:16px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:baseline}
.prog .pn button{font-weight:700;font-size:16px;text-align:left;color:var(--fg);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.prog .pn .pp{font-size:13.5px;font-weight:600;color:var(--accent)}
.prog .pn .pp.free{color:var(--free)}
.prog p{margin:4px 0 0;font-size:14.5px;max-width:65ch}
.mapchips{display:flex;gap:6px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}
.mapchips::-webkit-scrollbar{display:none}
.spot .detail p{max-width:65ch}
.labels-off .leaflet-tooltip.must{display:none}
.leaflet-tooltip.must{font:600 12px var(--body);background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;box-shadow:var(--shadow)}
/* Calendar */
.cal{display:flex;flex-direction:column;gap:8px}
.day{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;display:grid;grid-template-columns:56px 1fr;gap:12px}
.day.we{background:var(--surface2)}
.day .d{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.day .d small{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:3px}
.day .city{font-weight:600;font-size:14px}
.day ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:14px}
.day li button{text-align:left;color:var(--free);font-weight:600}
.day .none{color:var(--muted);font-size:13.5px}
.day .hol{color:var(--warn);font-weight:600;font-size:13.5px}
.month{margin:18px 0 6px}
/* Saved */
.budget{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.budget .v{font-family:var(--display);font-weight:800;font-size:26px}
.budget .l{font-size:12.5px;color:var(--muted)}
.empty{color:var(--muted);padding:30px 10px;text-align:center}
.prose{max-width:65ch}
.prose h3{font-size:19px;margin:22px 0 6px}
.prose p,.prose li{font-size:15px}
.prose ul{padding-left:20px}
.toggle{display:flex;align-items:center;gap:10px;font-size:14px;margin:6px 0 2px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
@media (prefers-reduced-motion:no-preference){.spot .detail{animation:in .18s ease-out}@keyframes in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}}
</style>
</head>

<script>
const DATA = [{"id":"muenchen","name":"München","land":"Deutschland","landcode":"DE","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","extra":true,"extra_hinweis":"Kurztrip vor dem Interrail, nicht Teil der Route","ankunft":"2027-04-02","abreise":"2027-04-03","unterkunft":{"name":"Hotel München-Olympiapark","ort":"München, Olympiapark","lat":48.174,"lon":11.554,"hinweis":"Lage grob (Olympiapark). U3 Olympiazentrum ist die nächste U-Bahn, 8 min bis Marienplatz-Umstieg (Münchner Freiheit / Odeonsplatz)."},"zentrum":{"lat":48.1373,"lon":11.5754},"intro":"Eine Nacht, anderthalb Tage: Freitagnachmittag Olympiapark + BMW Welt (frei, direkt am Hotel), abends Englischer Garten oder Biergarten. Samstag Altstadt (Marienplatz, Alter Peter, Viktualienmarkt, Frauenkirche) und ein Museum – Pinakotheken oder Deutsches Museum, je nach Wetter. Ostern 2027 ist am 28.03., der 02./03.04. sind normale Tage, alles offen; der Sonntags-1-€-Trick der Pinakotheken greift leider nicht.","feiertage":[],"gut_zu_wissen":[{"titel":"MVV-Tickets","text":"Zone M deckt alles ab, was du brauchst (Olympiapark, Altstadt, Museen). Stand 2026: Einzelfahrt M 4,20 €, Kurzstrecke (4 Stationen) 2,10 €, Single-Tageskarte M 10,10 €, Gruppen-Tageskarte M 19,70 € (bis 5 Personen). Ab 01.01.2027: Single-Tageskarte M 10,80 €, Kurzstrecke bleibt 2,10 €, Gruppen-Tageskarte steigt ca. 4 % (M-5 von 32,60 auf 33,90 €), Zone M also vsl. ~20,50 €. Die Single-Tageskarte lohnt ab der 3. Fahrt am Tag. Falls doch eine zweite Person mitfährt: Gruppen-Tageskarte (~20,50 €) schlägt 2× Single-Tageskarte (21,60 €). Kaufen in der MVV-App oder am Automaten; gültig bis 6 Uhr des Folgetags."},{"titel":"Museen ermäßigt","text":"Studierendenausweis zählt überall: Pinakotheken 6–7 € statt 9–10 €, Deutsches Museum 9 € statt 16 €, Lenbachhaus 6 € statt 10 €, BMW Museum 9 € statt 17 €, Residenz für Studierende mit Ausweis frei. Die Pinakotheken kosten sonntags 1 € – trifft deinen Termin nicht (Fr/Sa). Lenbachhaus ist am 1. Donnerstag im Monat 18–22 Uhr frei (01.04.2027, Tag vor Ankunft – knapp daneben)."},{"titel":"Was frei ist","text":"BMW Welt, Englischer Garten + Eisbachwelle, Viktualienmarkt, Marienplatz + Glockenspiel (11, 12, im Sommer 17 Uhr), Frauenkirche innen, Olympiapark + Olympiaberg, Hofgarten, Isarufer. Mit Studierendenausweis zusätzlich das Residenzmuseum. Das reicht für einen vollen Tag ohne einen Euro Eintritt."},{"titel":"Bier","text":"Hofbräuhaus: Maß 11,60 €, Halbe 5,80 € (Speisekarte 2026). Augustiner ist das Münchner Lieblingsbier und in den Bräustuben (Landsberger Str. 19) günstiger – Weißwurst-Paar 10–13 Uhr für 2 €. Biergartenregel: eigenes Essen mitbringen ist erlaubt, nur Getränke kaufst du dort. Augustiner-Keller-Biergarten öffnet wetterabhängig, Anfang April unsicher."},{"titel":"Geld","text":"Karte fast überall, Viktualienmarkt-Stände und Biergarten-Selbstbedienung teils nur bar. Trinkgeld 5–10 % oder aufrunden. Leitungswasser top, Brunnen in der Stadt."}],"spots":[{"id":"olympiapark","name":"Olympiapark + Olympiaberg (Olympiaturm geschlossen)","kategorie":"aussicht","muss":3,"kurz":"Zeltdach von 1972, Olympiaberg mit Stadtblick – der Turm ist bis Oktober 2027 zu","beschreibung":"Das Olympiagelände von 1972 mit dem Zeltdach von Frei Otto ist direkt vor deinem Hotel: See, Stadion, Schwimmhalle. Der Olympiaturm (190 m Plattform) wird seit Juni 2024 saniert und öffnet laut Olympiapark voraussichtlich erst Oktober 2027 – also nicht zu deinem Termin. Ersatz: der Olympiaberg (Schuttberg, 60 m über dem Park) mit freiem Blick über Zeltdach, Stadt und bei Föhn auf die Alpen.","lat":48.1716,"lon":11.548,"adresse":"Spiridon-Louis-Ring 21, 80809 München","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Park und Berg frei. Olympiaturm geschlossen (vorher 13 €/10 € erm.). Skylift (temporärer Aussichtskorb, 70 m) 13 €/erm. 11 € – ob er im April 2027 noch im Park steht, ist offen."},"kostenlos":{"immer":true,"regeln":["Außengelände immer frei"],"termine_im_aufenthalt":["2027-04-02","2027-04-03"],"hinweis":null},"oeffnungszeiten":"Park immer zugänglich","ruhetag":null,"reservierung":"nein","tipp":"Olympiaberg zum Sonnenuntergang (Anfang April gegen 19:45) – Zeltdach, Turm und Frauenkirche in einer Linie. 10 min vom Hotel.","link":"https://www.olympiapark.de/","quelle":"https://www.olympiapark.de/de/attraktionen-und-gastronomie/sightseeing/besichtigung-olympiaturm","preisstand":"2026","unsicher":false,"quelle_hinweis":"Turm-Status von der Olympiapark-Seite (Stand Okt. 2026: Wiedereröffnung vsl. Oktober 2027). Skylift-Preise von muenchen.de.","dist_km":0.5},{"id":"englischer-garten","name":"Englischer Garten + Eisbachwelle","kategorie":"natur","muss":3,"kurz":"Stadtpark größer als der Central Park, Surfer auf der stehenden Welle","beschreibung":"375 ha Park mitten in der Stadt, seit 1789. Am Südeingang (Prinzregentenstraße) surfen das ganze Jahr Leute auf der Eisbachwelle, auch Anfang April im Neopren. Dahinter Monopteros (Hügel mit Stadtblick), Chinesischer Turm mit Biergarten (7000 Plätze, Selbstbedienung), Seehaus am Kleinhesseloher See.","lat":48.1435,"lon":11.5878,"adresse":"Eisbachwelle: Prinzregentenstraße / Haus der Kunst, 80538 München","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Frei. Maß im Biergarten am Chinesischen Turm ca. 10–11 € (Richtwert)."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-04-02","2027-04-03"],"hinweis":null},"oeffnungszeiten":"Immer zugänglich; Biergärten wetterabhängig ab ca. 11 Uhr","ruhetag":null,"reservierung":"nein","tipp":"Von der Eisbachwelle über den Monopteros zum Chinesischen Turm sind 25 min – das ist der Standard-Spaziergang. Anfang April ist der Biergarten am Chinesischen Turm bei Sonne offen, bei Regen zu.","link":"https://www.schloesser.bayern.de/deutsch/garten/objekte/mu_engl.htm","quelle":"https://www.schloesser.bayern.de/deutsch/garten/objekte/mu_engl.htm","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":4.2},{"id":"marienplatz-alter-peter","name":"Marienplatz + Glockenspiel + Alter Peter","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Rathaus-Glockenspiel um 11 und 12, dann 306 Stufen auf den besten Turm der Stadt","beschreibung":"Der Marienplatz ist das Zentrum: Neues Rathaus (neugotisch, 1909) mit dem Glockenspiel um 11 und 12 Uhr (März–Okt. auch 17 Uhr), Mariensäule, Altes Rathaus. Der Alte Peter ist Münchens älteste Pfarrkirche; der Turm hat 306 Stufen, oben 56 m, und den besten Blick der Altstadt, weil die Frauenkirche-Türme mit im Bild sind. Bei Föhn Alpenpanorama.","lat":48.1365,"lon":11.5758,"adresse":"Rindermarkt 1, 80331 München","dauer_min":75,"preis":{"erwachsene":5,"ermaessigt":3,"unter26":3,"waehrung":"EUR","eur":5,"hinweis":"Turm: 5 €, Studierende mit Ausweis 3 €, Schüler 6–18 2 €. Kirche und Platz frei."},"kostenlos":{"immer":false,"regeln":["Platz, Glockenspiel und Kirche immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Turm April–Okt. tägl. 9:00–19:30 (letzter Einlass 19:00)","ruhetag":null,"reservierung":"nein","tipp":"Glockenspiel ist 12 Minuten mit viel Warten davor – 11 Uhr ist leerer als 12. Direkt danach auf den Peter, bevor die Schlange kommt; die Treppe ist eng, oben kein Lift.","link":"https://www.alterpeter.de/","quelle":"https://www.alterpeter.de/turmbesteigung-alter-peter/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":4.5},{"id":"viktualienmarkt","name":"Viktualienmarkt","kategorie":"markt","muss":3,"kurz":"Münchens Dauer-Lebensmittelmarkt mit Biergarten in der Mitte","beschreibung":"140 Stände seit 1807, zwei Minuten vom Marienplatz: Obst, Käse, Metzger, Fisch, Honig, Gewürze. In der Mitte ein Biergarten, in dem reihum die sechs Münchner Brauereien ausschenken, und es gilt die Biergartenregel – was du an den Ständen kaufst, darfst du dort essen. Günstigstes echtes Mittagessen der Altstadt.","lat":48.1351,"lon":11.5763,"adresse":"Viktualienmarkt 3, 80331 München","dauer_min":60,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Markt frei. Leberkässemmel 3–4 €, Käsebrot 4–6 €, Halbe im Biergarten ca. 5 €."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-04-02","2027-04-03"],"hinweis":null},"oeffnungszeiten":"Mo–Sa ca. 8:00–20:00 (Stände individuell), So zu","ruhetag":"Sonntag","reservierung":"nein","tipp":"Samstagvormittag ist voll, aber gut. Obatzda vom Käsestand + Brezn vom Bäcker + Halbe im Biergarten = Mittagessen für 10 €.","link":"https://www.muenchen.de/sehenswuerdigkeiten/viktualienmarkt","quelle":"https://www.muenchen.de/sehenswuerdigkeiten/viktualienmarkt","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":4.6},{"id":"bmw-welt-museum","name":"BMW Welt (frei) + BMW Museum","kategorie":"museum","muss":2,"kurz":"Showroom-Architektur gratis, Museum in der Schüssel für 9 € mit Studiausweis","beschreibung":"Die BMW Welt ist ein frei zugänglicher Doppelkegel aus Glas – aktuelle Modelle, Motorräder, Rolls-Royce, Fahrzeugabholung live. Gegenüber das BMW Museum in der 'Salatschüssel' von 1973 mit 100 Jahren Firmengeschichte, Isetta, M1, Formel-1. Beides liegt an der U3 Olympiazentrum, 5 min vom Hotel.","lat":48.1768,"lon":11.556,"adresse":"Am Olympiapark 1–2, 80809 München","dauer_min":120,"preis":{"erwachsene":17,"ermaessigt":9,"unter26":9,"waehrung":"EUR","eur":17,"hinweis":"Museum: 17 €, ermäßigt 9 € (Studierende 11–27 Jahre, Schüler, Senioren), Familie 38 €. BMW Welt frei. Nur Kartenzahlung."},"kostenlos":{"immer":false,"regeln":["BMW Welt immer frei","Museum: bis 10 Jahre frei"],"termine_im_aufenthalt":[],"hinweis":"Das Museum hat keinen Gratistag."},"oeffnungszeiten":"BMW Welt Mo–Sa 7:30–24:00, So 9:00–24:00 (Ausstellungen betreut 9–18); Museum Di–So 10:00–18:00 (letzter Einlass 17:30)","ruhetag":"Montag (Museum)","reservierung":"empfohlen","tipp":"Freitagabend nach Ankunft nur die BMW Welt (frei, bis 24 Uhr offen) – das Museum lohnt eher für Auto-Fans; wenn, dann Samstag früh um 10 ohne Schlange.","link":"https://www.bmw-welt.com/","quelle":"https://www.bmw-welt.com/de.html","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.3},{"id":"pinakotheken","name":"Pinakotheken (Alte + Moderne) – Kunstareal","kategorie":"museum","muss":2,"kurz":"Dürer, Rubens, Altdorfer – und 12 € Kombiticket für vier Häuser","beschreibung":"Die Alte Pinakothek ist eine der großen Altmeister-Sammlungen Europas (Dürers Selbstbildnis, Altdorfers Alexanderschlacht, der größte Rubens-Bestand weltweit). Die Pinakothek der Moderne gegenüber vereint Kunst, Design, Architektur und Grafik in einem Haus. Dazu Brandhorst (Warhol, Twombly) und die Neue Pinakothek (bis ca. 2029 wegen Sanierung zu, Highlights hängen in der Alten).","lat":48.1481,"lon":11.57,"adresse":"Barer Straße 27, 80333 München","dauer_min":150,"preis":{"erwachsene":9,"ermaessigt":6,"unter26":6,"waehrung":"EUR","eur":9,"hinweis":"Alte Pinakothek 9 €/erm. 6 €, Pinakothek der Moderne 10 €/7 €, Brandhorst 7 €/5 €. Kombiticket alle Häuser an einem Tag 12 € (kein ermäßigtes Kombi). Sonntags je 1 € – nicht an deinem Termin. Unter 18 frei."},"kostenlos":{"immer":false,"regeln":["Unter 18 frei","Sonntag 1 € (nicht frei, aber fast)"],"termine_im_aufenthalt":[],"hinweis":"Fr 02.04. / Sa 03.04. – kein Sonntag. Studierende: 6 € bzw. 7 €."},"oeffnungszeiten":"Alte Pinakothek Di–So 10:00–18:00, Di+Mi bis 20:00; Pinakothek der Moderne Mi–So 10:00–18:00 (Mo+Di zu); Brandhorst Di–So 10:00–18:00, Do bis 20:00","ruhetag":"Montag (Pinakothek der Moderne auch Dienstag)","reservierung":"nein","tipp":"Mit Studiausweis ist ein Haus (6–7 €) günstiger als das 12-€-Kombi; Kombi lohnt nur ab zwei Häusern ohne Ermäßigung. Für anderthalb Tage reicht die Alte Pinakothek, 2 Stunden.","link":"https://www.pinakothek.de/","quelle":"https://www.pinakothek.de/besuch","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":3.1},{"id":"residenz","name":"Residenz München (Residenzmuseum + Schatzkammer)","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Stadtschloss der Wittelsbacher, 130 Räume – für Studierende frei","beschreibung":"Vier Jahrhunderte Herrschersitz mitten in der Altstadt: Antiquarium (größter Renaissancesaal nördlich der Alpen), Reiche Zimmer im Rokoko, Ahnengalerie, Hofkapelle. Die Schatzkammer hat Kronen, Reliquiare und das Rubinschmuck-Set. Hofgarten davor ist frei. Audioguide inklusive.","lat":48.1415,"lon":11.5778,"adresse":"Residenzstraße 1, 80333 München","dauer_min":120,"preis":{"erwachsene":10,"ermaessigt":9,"unter26":0,"waehrung":"EUR","eur":10,"hinweis":"Residenzmuseum 10 €/erm. 9 €, Schatzkammer 10 €/9 €, Kombi 15 €/13 €, Gesamtkarte mit Cuvilliés-Theater 20 €. Studierende über 18 mit gültigem Studierendenausweis frei (Bayerische Schlösserverwaltung). Unter 18 frei."},"kostenlos":{"immer":false,"regeln":["Studierende mit Ausweis immer frei","Unter 18 immer frei","Hofgarten immer frei"],"termine_im_aufenthalt":[],"hinweis":"Für dich frei – Ausweis mitnehmen. Gilt für Residenzmuseum, Schatzkammer und Cuvilliés-Theater."},"oeffnungszeiten":"28.03.–25.10.: tägl. 9:00–18:00 (letzter Einlass 17:00); Cuvilliés-Theater Mo–Sa 14:00–18:00, So 9:00–18:00","ruhetag":null,"reservierung":"nein","tipp":"Das ist dein Gratis-Museum: Studierendenausweis zeigen, Kombi nehmen. Antiquarium und Schatzkammer zuerst, der Rest ist viel Rokoko-Raum nach Raum.","link":"https://www.residenz-muenchen.de/","quelle":"https://www.residenz-muenchen.de/deutsch/tourist/eintritt.htm","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"teilfrei":true,"dist_km":4.0},{"id":"frauenkirche","name":"Frauenkirche + Südturm","kategorie":"aussicht","muss":2,"kurz":"Die Zwiebeltürme, Südturm seit 2022 wieder offen – 86 Stufen + Lift auf 80 m","beschreibung":"Der Dom mit den zwei Zwiebelhauben (99 m) ist das Wahrzeichen, kein Gebäude in der Innenstadt darf höher sein. Innen hell und schlicht, mit dem 'Teufelstritt' am Eingang. Der Südturm ist nach langer Sanierung seit 2022 wieder begehbar: 86 Stufen Wendeltreppe, dann Lift auf die Plattform in 80 m.","lat":48.1386,"lon":11.5736,"adresse":"Frauenplatz 12, 80331 München","dauer_min":60,"preis":{"erwachsene":7.5,"ermaessigt":5.5,"unter26":5.5,"waehrung":"EUR","eur":7.5,"hinweis":"Turm 7,50 €, ermäßigt (Studierende mit Ausweis, 7–16 J.) 5,50 €, bis 6 J. frei. Kirche frei. Tickets im Domshop in der Südturmkapelle oder online über München Tourismus."},"kostenlos":{"immer":false,"regeln":["Kirche immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Turm Mo–Sa 10:00–17:00, So/Feiertag 11:30–17:00 (letzter Aufstieg 16:30); Kirche tägl. ca. 8:00–20:00","ruhetag":null,"reservierung":"nein","tipp":"Entweder Alter Peter oder Frauenkirche-Turm, nicht beide – der Peter ist günstiger (3 €) und hat die Frauenkirche im Bild. Frauenkirche nehmen, wenn Treppen ein Problem sind (Lift).","link":"https://www.muenchner-dom.de/","quelle":"https://www.muenchner-dom.de/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":4.2},{"id":"hofbraeuhaus-augustiner","name":"Hofbräuhaus vs. Augustiner Bräustuben","kategorie":"essen","muss":2,"kurz":"Einmal reinschauen ins Hofbräuhaus (Maß 11,60 €), trinken bei Augustiner","beschreibung":"Das Hofbräuhaus am Platzl ist Touristenmagnet mit Blaskapelle und Schwemme – einmal durchgehen lohnt, die Stammtische im Erdgeschoss sind echt. Essen und trinken ist bei den Münchnern Augustiner: die Bräustuben neben der Brauerei (Landsberger Str. 19, Tram 18/19 Holzapfelstraße) sind laut, ehrlich und günstig – Holzfass-Helles, Weißwurst-Frühstück für 2 € (10–13 Uhr).","lat":48.1376,"lon":11.5798,"adresse":"Hofbräuhaus: Platzl 9, 80331 München · Augustiner Bräustuben: Landsberger Str. 19, 80339 München","dauer_min":90,"preis":{"erwachsene":11.6,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":11.5,"hinweis":"Hofbräuhaus Speisekarte 2026: Maß Original/Dunkel 11,60 €, Halbe 5,80 €, Weißwurst-Paar 8,20 €, Breze 2,10 €, Schweinsbraten 18,90 €. Bräustuben: Halbe Holzfass-Helles ca. 3,30–4,50 €, Weißwurst-Paar 2 € (10–13 Uhr), Maß nicht verifiziert."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":"Reinschauen ins Hofbräuhaus kostet nichts."},"oeffnungszeiten":"Hofbräuhaus tägl. 11:00–24:00 (Küche bis 22:00); Bräustuben tägl. 10:00–24:00 (Küche 11:00–23:00)","ruhetag":null,"reservierung":"nein","tipp":"Freitagabend ins Hofbräuhaus zum Gucken (eine Halbe, 5,80 €), Samstag vor der Abreise Weißwurst-Frühstück in den Bräustuben für 2 € – die Hauptbahnhof-Nähe (10 min zu Fuß) passt zur Abfahrt.","link":"https://www.hofbraeuhaus.de/","quelle":"https://www.hofbraeuhaus.de/wp-content/uploads/2026/07/2026_HB_Standard-Speisekarte_DE.pdf","preisstand":"2026","unsicher":false,"quelle_hinweis":"Hofbräuhaus-Preise aus der Speisekarte 2026 (PDF). Bräustuben-Preise von braeustuben.de, Halbe-Preis dort nur mit Stammkarte angegeben (3,33 €).","dist_km":4.5},{"id":"deutsches-museum","name":"Deutsches Museum (Museumsinsel)","kategorie":"museum","muss":2,"kurz":"Größtes Technikmuseum der Welt, Bergwerk im Keller, Hochspannungsshow","beschreibung":"Auf der Isarinsel, 1925 eröffnet, nach Sanierung der ersten Hälfte mit neuen Abteilungen (Luftfahrt, Raumfahrt, Chemie, Musik, Gesundheit, Robotik). Das Bergwerk im Untergeschoss und die Hochspannungsvorführung (mehrmals täglich) sind die Klassiker. Ein Tag reicht nicht, drei Stunden gezielt schon.","lat":48.1299,"lon":11.5834,"adresse":"Museumsinsel 1, 80538 München","dauer_min":180,"preis":{"erwachsene":16,"ermaessigt":9,"unter26":9,"waehrung":"EUR","eur":16,"hinweis":"Ermäßigt 9 € für Studierende (Vollzeit, mit Ausweis), 6–17 J., Senioren Mo–Fr. Familie 33 €. Unter 6 frei."},"kostenlos":{"immer":false,"regeln":["Unter 6 frei"],"termine_im_aufenthalt":[],"hinweis":"Kein Gratistag. Schließtage: 01.01., Karfreitag, 01.05., 01.11., 24./25./31.12. – Karfreitag 2027 ist der 26.03., betrifft dich nicht."},"oeffnungszeiten":"Tägl. 9:00–17:00 (letzter Einlass 16:30)","ruhetag":null,"reservierung":"empfohlen","tipp":"Online-Ticket spart die Kassenschlange am Samstag. Um 9 Uhr rein, Hochspannungs-Vorführung (Zeiten am Eingang) einplanen, danach am Isarufer weiter.","link":"https://www.deutsches-museum.de/","quelle":"https://www.deutsches-museum.de/museumsinsel/besuch/preise-und-tickets","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":5.4},{"id":"lenbachhaus","name":"Lenbachhaus","kategorie":"museum","muss":1,"kurz":"Der Blaue Reiter – Kandinsky, Münter, Marc – in einer Künstlervilla mit Foster-Anbau","beschreibung":"Die weltweit größte Sammlung des Blauen Reiters (Kandinsky, Gabriele Münter, Franz Marc, Macke, Klee), dazu Münchner Malerei des 19. Jh. und zeitgenössische Räume. Villa des Malerfürsten Lenbach plus goldener Anbau von Norman Foster, am Königsplatz, 5 min von den Pinakotheken.","lat":48.1468,"lon":11.5637,"adresse":"Luisenstraße 33, 80333 München","dauer_min":90,"preis":{"erwachsene":10,"ermaessigt":6,"unter26":6,"waehrung":"EUR","eur":10,"hinweis":"Ermäßigt 6 € für Studierende mit Ausweis. Unter 18 frei. Kunstgeschichte-Studierende frei."},"kostenlos":{"immer":false,"regeln":["Unter 18 frei","Erster Donnerstag im Monat 18:00–22:00 frei"],"termine_im_aufenthalt":[],"hinweis":"Erster Donnerstag im April 2027 ist der 01.04. – ein Tag vor Ankunft. Wer am Do schon anreist: 18–22 Uhr frei."},"oeffnungszeiten":"Di–So 10:00–18:00, Do bis 20:00","ruhetag":"Montag","reservierung":"nein","tipp":"Wenn es ein Kunstmuseum sein soll und Alte Meister nicht dein Ding sind, ist das die bessere Wahl als die Alte Pinakothek: kleiner, farbiger, 90 Minuten.","link":"https://www.lenbachhaus.de/","quelle":"https://www.lenbachhaus.de/besuchen/allgemeine-informationen","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":3.1},{"id":"isarufer","name":"Isarufer: Museumsinsel bis Flaucher","kategorie":"natur","muss":1,"kurz":"Renaturierter Fluss mit Kiesbänken mitten in der Stadt, 3 km Spaziergang","beschreibung":"Die Isar wurde zwischen 2000 und 2011 wieder in ein breites Kiesbett gelegt; vom Deutschen Museum flussaufwärts über die Reichenbachbrücke zum Flaucher sind es 3 km an Kiesbänken, Wehren und Grillplätzen. Im April noch zu kalt zum Baden, aber die Münchner sitzen ab dem ersten Sonnentag am Ufer. Zum Biergarten 'Zum Flaucher' am Ende.","lat":48.1288,"lon":11.5775,"adresse":"Reichenbachbrücke, 80469 München","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-04-02","2027-04-03"],"hinweis":null},"oeffnungszeiten":"Immer zugänglich","ruhetag":null,"reservierung":"nein","tipp":"Nach dem Deutschen Museum am Ostufer (Au-Seite) südwärts – weniger Verkehr, mehr Kies. U3 Brudermühlstraße bringt dich vom Flaucher direkt zurück zum Olympiazentrum ohne Umsteigen.","link":"https://www.muenchen.de/sehenswuerdigkeiten/isar","quelle":"https://www.muenchen.de/sehenswuerdigkeiten/isar","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":5.3}],"tage":[{"datum":"2027-04-02","titel":"BMW Welt, Eisbach, Hofbräuhaus","intro":"Halber Tag nach der Ankunft, wie im Stadt-Intro: erst das Freie am Hotel, dann der Englische Garten mit Surfern und Biergarten, abends eine Halbe im Hofbräuhaus zum Gucken. Heute die Single-Tageskarte M (10,80 €) kaufen – vier Fahrten, sie gilt bis 6 Uhr früh. Der Olympiaberg kommt morgen früh, weil der Abend der Stadt gehört.","programm":[{"spot":null,"zeit":"14:00","titel":"Ankunft Hauptbahnhof, U3 Olympiazentrum","notiz":"Mit der U-Bahn zum Olympiazentrum (Umstieg am Odeonsplatz auf die U3), einchecken im Hotel München-Olympiapark. Studierendenausweis griffbereit – morgen ist die Residenz damit frei."},{"spot":"bmw-welt-museum","zeit":"15:00","notiz":"5 Min. vom Hotel. BMW Welt frei und bis 24 Uhr offen: Doppelkegel, Modelle, Abholungen live. Das Museum (9 € mit Studiausweis, bis 18 Uhr) nur, wenn dich Autos wirklich interessieren – die Zeit fehlt sonst morgen."},{"spot":"englischer-garten","zeit":"16:45","notiz":"U3 bis Münchner Freiheit, 10 Min. in den Park. Chinesischer Turm (Biergarten bei Sonne offen, Selbstbedienung, eigenes Essen erlaubt), über den Monopteros mit Stadtblick zur Eisbachwelle – 25 Min. Spaziergang, die Surfer sind auch im April im Neopren da."},{"spot":"hofbraeuhaus-augustiner","zeit":"19:00","notiz":"Von der Eisbachwelle durch den Hofgarten 15 Min. zum Platzl. Eine Halbe (5,80 €) in der Schwemme, Blaskapelle, Stammtische – einmal reicht; essen lieber in den Augustiner Bräustuben (Landsberger Str. 19, Tram 18/19 Holzapfelstraße), Küche bis 23 Uhr. Zurück mit der U3 ab Odeonsplatz."}]},{"datum":"2027-04-03","titel":"Olympiaberg, Residenz, Marienplatz, Markt","intro":"Halber Tag bis zur Abfahrt: Olympiaberg beim Hotel, dann Altstadt in einer Linie – Residenz (für dich frei), Glockenspiel um 12, Alter Peter, Mittag am Viktualienmarkt. Vorher auschecken und das Gepäck im Hotel lassen; nach dem Markt holst du es (U3, 15 Min.) und brauchst ab 14:15 gut eine Stunde bis zum Zug. Pinakotheken und Deutsches Museum passen in anderthalb Tage nicht.","programm":[{"spot":"olympiapark","zeit":"08:00","notiz":"10 Min. vom Hotel auf den Olympiaberg: Zeltdach, Turm und Frauenkirche in einer Linie, bei Föhn die Alpen. Der Olympiaturm ist bis Oktober 2027 zu, der Berg ist der Ersatz und frei."},{"spot":"residenz","zeit":"10:00","notiz":"U3 bis Odeonsplatz. Studierendenausweis zeigen, Kombi Residenzmuseum + Schatzkammer nehmen – frei statt 15 €, Audioguide inklusive. Antiquarium und Schatzkammer zuerst, der Rest ist Rokoko Raum für Raum."},{"spot":"marienplatz-alter-peter","zeit":"12:00","notiz":"5 Min. von der Residenz. Glockenspiel um 12 (12 Minuten, voll – die Residenz war es wert), direkt danach die 306 Stufen auf den Alten Peter (3 € mit Ausweis), bevor die Schlange kommt. Enge Treppe, kein Lift."},{"spot":"viktualienmarkt","zeit":"13:15","notiz":"2 Min. vom Marienplatz. Obatzda vom Käsestand, Brezn vom Bäcker, Halbe im Biergarten – Mittagessen für 10 €, Stände teils nur bar. Danach U3 zum Hotel, Gepäck, Hauptbahnhof."}]}],"naechte":1},{"id":"krakau","name":"Krakau","land":"Polen","landcode":"PL","waehrung":"PLN","kurs_eur":0.2282,"kurs_stand":"2026-10-07","ankunft":"2027-05-24","abreise":"2027-05-27","unterkunft":{"name":"RETRO STATiON APARTMENT","ort":"Krakau","lat":50.067,"lon":19.946,"hinweis":"Lage grob geschätzt (Nähe Hauptbahnhof Kraków Główny), genaue Adresse unbekannt"},"zentrum":{"lat":50.0617,"lon":19.9373},"intro":"Krakau ist kompakt: Altstadt, Wawel und Kazimierz liegen alle zu Fuß beieinander, Schindler-Fabrik und Podgórze eine Brücke weiter. Die Gratistage der Museen geben den Takt vor: Montag Schindler, Altes Rathaus und Alte Synagoge, Dienstag Rynek Underground und alle Nationalmuseen, Mittwoch Collegium Maius und Adler-Apotheke. Ein Tag geht für Auschwitz drauf; der Abreisetag ist Fronleichnam, also Feiertag.","feiertage":[{"datum":"2027-05-27","name":"Fronleichnam (Boże Ciało)","hinweis":"Gesetzlicher Feiertag: Läden zu, große Prozession vom Wawel zum Rynek am Vormittag. Marienkirche nur 14–18 Uhr für Besucher. Ob Muzeum Krakowa / Nationalmuseum öffnen, war für 2027 noch nicht veröffentlicht – kurz vorher prüfen."}],"gut_zu_wissen":[{"titel":"Gratistage","text":"Jedes städtische Museum (Muzeum Krakowa) hat einen eigenen Gratistag für die Dauerausstellung: Schindler-Fabrik, Rathausturm, Alte Synagoge montags; Rynek Underground dienstags; Adler-Apotheke mittwochs. Alle Zweige des Nationalmuseums (MNK, auch Tuchhallen-Galerie und Czartoryski) sind dienstags frei – und sonst zahlen Studierende dort nur 1 PLN. Collegium Maius: Mittwoch 13:30–16:00 frei. Gratistickets gibt es nur an der Kasse am Tag selbst, früh da sein."},{"titel":"Nahverkehr","text":"Tarif seit 02.03.2026 (Zone I): 15 min 4 PLN, 30 min 6, 60 min 8, 90 min 9, 24 h 20 (Zone I) bzw. 25 (alle Zonen), 48 h 40, 72 h 55 PLN. Ermäßigt jeweils die Hälfte; Studierendenausweis/ISIC wird für Zeitkarten anerkannt, im Zweifel Vollpreis zahlen. Kauf am Automaten an Haltestellen und in den Trams (Karte), oder per App (jakdojade, mPay). Papierticket beim Einsteigen entwerten. Die Altstadt ist autofrei und klein – du brauchst die Tram vor allem für Kościuszko-Hügel, Zakrzówek und Wieliczka."},{"titel":"Krakow Card","text":"Offizielle Seite war nicht erreichbar; Blog-Preise 2025: 1 Tag ca. 151 PLN, 3 Tage ca. 200 PLN inkl. ÖPNV, Studentenpass ohne ÖPNV 112 PLN. Wawel ist nicht enthalten. Für dich lohnt sie nicht: Mit Montag (Schindler) und Dienstag (Underground, MNK) sparst du die teuersten Tickets ohnehin, und die MNK-Studi-Tickets kosten 1 PLN."},{"titel":"Geld","text":"1 EUR ≈ 4,38 PLN (EZB 07.10.2026). Karte geht fast überall, auch für Zapiekanki. Bargeld nur wenig wechseln, nie am Rynek oder Bahnhof („0 % commission“ heißt schlechter Kurs), eher Kantor in Seitenstraßen; am Geldautomaten die eigene Umrechnung ablehnen und Euronet meiden. Trinkgeld ~10 % im Restaurant. Leitungswasser ist trinkbar."},{"titel":"Zeitfenster-Tickets","text":"Wawel-Innenräume und Schindler-Fabrik sind Zeitfenster-Tickets und in der Saison oft Tage vorher weg. Schindler: online 90 Tage im Voraus (ab ca. 25.02.2027). Wieliczka: fremdsprachige Touren in der Hochsaison 3–5 Tage vorher buchen. Auschwitz: Eintrittspässe werden online freigegeben und sind oft Wochen vorher vergriffen – sobald der Reiseplan steht, buchen."}],"spots":[{"id":"marienkirche","name":"Marienkirche (Bazylika Mariacka)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Gotische Backsteinkirche mit dem Veit-Stoß-Altar und dem Trompeterturm","beschreibung":"Innen blau-goldener Sternenhimmel und der größte gotische Flügelaltar der Welt, 1489 von Veit Stoß aus Nürnberg geschnitzt – um 11:50 Uhr werden die Flügel feierlich geöffnet. Der höhere der beiden Türme ist der Trompeterturm: alle 25 Minuten lässt man eine Kleingruppe die 239 Stufen hoch, Blick über den ganzen Rynek.","lat":50.06167,"lon":19.93917,"adresse":"plac Mariacki 5, 31-042 Kraków","dauer_min":45,"preis":{"erwachsene":20,"ermaessigt":10,"unter26":10,"waehrung":"PLN","eur":4.5,"hinweis":"Kirche 20 / erm. 10 PLN (Studierende 19–26). Trompeterturm extra 20 / erm. 15 PLN, nur Tageskasse"},"kostenlos":{"immer":false,"regeln":["Zum Gebet (Seiteneingang) immer frei, ohne Altarblick"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mo–Sa 11:30–18:00, So/Feiertag 14:00–18:00 (Altar ab 11:50 bzw. 14:10). Turm Di–Sa 11:00–17:30, So/Feiertag 13:00–17:30","ruhetag":"Mo (nur Turm)","reservierung":"nein","tipp":"Um 11:45 da sein für die Altaröffnung. Tickets gibt es gegenüber am plac Mariacki 7, nicht an der Kirche. Turmtickets sind knapp: direkt um 11 Uhr holen.","link":"https://mariacki.com/en/","quelle":"https://mariacki.com/en/tours-of-the-basilica/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.8},{"id":"rynek-tuchhallen","name":"Rynek Główny + Tuchhallen (Sukiennice)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Größter mittelalterlicher Marktplatz Europas, mitten drauf die Tuchhallen","beschreibung":"200 × 200 Meter Platz, Tauben, Pferdekutschen, jede Stunde das Trompetensignal (Hejnał) vom Marienturm, das mitten im Ton abbricht. Die Tuchhallen in der Mitte sind unten eine Souvenirpassage, oben die Galerie polnischer Malerei des 19. Jahrhunderts (Nationalmuseum) mit Matejkos Riesenformaten und einem Balkon über den Platz.","lat":50.0617,"lon":19.9373,"adresse":"Rynek Główny 1–3, 31-042 Kraków","dauer_min":60,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"PLN","eur":0,"hinweis":"Platz und Passage frei. Galerie oben: 35 / erm. 25 PLN, Schüler/Studierende 1 PLN"},"kostenlos":{"immer":false,"regeln":["Platz und Passage immer frei","Galerie (MNK): jeden Dienstag Dauerausstellung frei"],"termine_im_aufenthalt":["2027-05-25"],"hinweis":"Studierende zahlen auch sonst nur 1 PLN"},"oeffnungszeiten":"Platz immer; Galerie Di–So 10:00–18:00","ruhetag":"Mo (Galerie)","reservierung":"nein","tipp":"Zur vollen Stunde unter dem Marienturm stehen und zum Trompeter hochwinken – er winkt zurück. Die Cafés am Platz kosten das Doppelte der Seitenstraßen.","link":"https://mnk.pl/en","quelle":"https://mnk.pl/en/practical-information/price-list-and-tickets/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.9},{"id":"wawel","name":"Wawel (Königsschloss)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Königsschloss über der Weichsel, Herz der polnischen Geschichte","beschreibung":"Der Hügel mit Schloss und Kathedrale war 500 Jahre Sitz der polnischen Könige. Der Arkadenhof, die Mauern und der Blick auf die Weichsel kosten nichts – allein dafür lohnt der Abend. Innen gibt es getrennte Zeitfenster-Tickets pro Route: Schloss 1. Stock (Repräsentationsräume, 57 PLN), 1.+2. Stock (95), Kronschatz (47), Waffenkammer (47); Drachenhöhle (15 PLN) führt 135 Stufen hinab zum Fluss und zum feuerspeienden Drachen.","lat":50.0541,"lon":19.9354,"adresse":"Wawel 5, 31-001 Kraków","dauer_min":150,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"PLN","eur":0,"hinweis":"Gelände frei. Schloss 1. Stock 57 / erm. 43 PLN; 1.+2. Stock 95 / 71; Kronschatz 47 / 35; Waffenkammer 47 / 35; Drachenhöhle 15 / 10 PLN. Ermäßigt mit Studierendenausweis."},"kostenlos":{"immer":false,"regeln":["Außengelände, Höfe und Aussicht immer frei","Montag: ausgewählte Ausstellungen gratis, begrenztes Kontingent nur an der Kasse (max. 5 Tickets pro Person)"],"termine_im_aufenthalt":["2027-05-24"],"hinweis":"Die Ausstellungsseiten 2026 nennen für die Innenräume Di–So; der Gratis-Montag ist nur aus Zweitquellen belegt – vor Ort am Montagmorgen an der Kasse fragen, früh da sein."},"oeffnungszeiten":"Gelände tägl. 6:00–Dämmerung; Ausstellungen Di–So 9:00–17:00 (letzter Einlass je nach Route 30–120 min vorher); Drachenhöhle tägl. 9:00–17:00 (Saison 24.04.–31.10.)","ruhetag":"Mo (Innenräume, außer Gratis-Kontingent)","reservierung":"empfohlen","tipp":"Erst abends aufs Gelände (gratis, Licht auf der Weichsel), Innenräume morgens um 9 mit online gekauftem Zeitfenster. Die Drachenhöhle ist der schönste Abgang Richtung Boulevards.","link":"https://wawel.krakow.pl/en","quelle":"https://wawel.krakow.pl/en/exhibitions","preisstand":"2026","unsicher":true,"quelle_hinweis":"Preise von den offiziellen Routen-Seiten; Gratis-Montag-Regel nur über thebettervacation.com (Stand 06/2026) belegt, offizielle FAQ nicht erreichbar","dist_km":1.6},{"id":"kazimierz","name":"Kazimierz (jüdisches Viertel)","kategorie":"viertel","muss":3,"kurz":"Ehemalige jüdische Stadt, heute Krakaus Kneipen- und Kulturviertel","beschreibung":"Sieben Synagogen auf engem Raum, der alte Remuh-Friedhof, Hinterhöfe mit Flohmarkt-Charme, abends Bars in ehemaligen Werkstätten. Die ulica Szeroka ist das historische Zentrum, Plac Nowy der Treffpunkt. Die Alte Synagoge (Muzeum Krakowa) zeigt jüdisches Leben vor 1939 und ist montags frei.","lat":50.0517,"lon":19.946,"adresse":"ul. Szeroka, 31-053 Kraków","dauer_min":180,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"PLN","eur":0,"hinweis":"Viertel frei. Alte Synagoge 22 / erm. 16 PLN (montags frei, Mo 10–15)"},"kostenlos":{"immer":true,"regeln":["Viertel immer frei","Alte Synagoge: jeden Montag frei"],"termine_im_aufenthalt":["2027-05-24","2027-05-25","2027-05-26","2027-05-27"],"hinweis":null},"oeffnungszeiten":"Viertel immer; Alte Synagoge Mo 10:00–15:00, Di–So 9:00–17:00","ruhetag":null,"reservierung":"nein","tipp":"Nachmittags durch die Gassen, dann Zapiekanka am Plac Nowy und Bier in der Alchemia oder Singer (Tische sind Nähmaschinen). Über die Bernatek-Fußgängerbrücke nach Podgórze zur Schindler-Fabrik.","link":"https://muzeumkrakowa.pl/en/branches/old-synagogue","quelle":"https://muzeumkrakowa.pl/en/branches/old-synagogue","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.7},{"id":"schindler-fabrik","name":"Schindler-Fabrik (Fabryka Emalia Oskara Schindlera)","kategorie":"museum","muss":3,"kurz":"Krakau unter deutscher Besatzung 1939–45, erzählt in Schindlers Emaillefabrik","beschreibung":"Nicht in erster Linie ein Schindler-Museum, sondern eine dichte Ausstellung über den Alltag in Krakau unter der Besatzung: Straßenszenen, das Ghetto in Podgórze, Płaszów, Widerstand, dazu Schindlers Büro mit der Wand aus Emailletöpfen. Sehr szenografisch, sehr voll – daher Zeitfenster.","lat":50.0475,"lon":19.9616,"adresse":"ul. Lipowa 4, 30-702 Kraków","dauer_min":120,"preis":{"erwachsene":60,"ermaessigt":45,"unter26":null,"waehrung":"PLN","eur":13.5,"hinweis":"Ermäßigt mit Studierendenausweis; Führung Englisch 90 / 75 PLN"},"kostenlos":{"immer":false,"regeln":["Jeden Montag frei (nur 10:00–15:00), Tickets nur an der Kasse am Tag selbst, keine Online-Reservierung"],"termine_im_aufenthalt":["2027-05-24"],"hinweis":"Montag ist der Ankunftstag – Kontingent ist oft vor 11 Uhr weg, Schlange ab 9:30"},"oeffnungszeiten":"Mo 10:00–15:00, Di–So 9:00–20:00; letzter Einlass 90 min vor Schluss","ruhetag":"jeder 1. Dienstag im Monat (nicht im Aufenthalt)","reservierung":"nötig","tipp":"Online-Tickets gibt es 90 Tage vorher (ab ca. 25.02.2027) – für einen Wochentag ein frühes Zeitfenster buchen, dann Adler-Apotheke und Ghetto-Platz gleich nebenan.","link":"https://muzeumkrakowa.pl/en/branches/oskar-schindlers-enamel-factory","quelle":"https://muzeumkrakowa.pl/en/branches/oskar-schindlers-enamel-factory","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.4},{"id":"auschwitz-birkenau","name":"Tagesausflug Auschwitz-Birkenau","kategorie":"tagesausflug","muss":3,"kurz":"Gedenkstätte und Museum, 65 km westlich – Eintritt frei, Pass reservieren","beschreibung":"Das Stammlager Auschwitz I mit den Blockausstellungen und drei Kilometer weiter Birkenau mit Rampe, Baracken und den gesprengten "aussicht","muss":2,"kurz":"Künstlicher Erinnerungshügel von 1823, bester Rundblick auf Krakau","beschreibung":"Die Krakauer schütteten den 34 Meter hohen Hügel mit Erde von Kościuszkos Schlachtfeldern auf; außen herum eine österreichische Festung. Der Spiralweg zur Spitze bringt dich auf 326 Meter: Altstadt, Wawel, Nowa Huta, bei klarer Sicht die Tatra. Im Ticket sind die Ausstellungen in der Festung enthalten.","lat":50.0549,"lon":19.8933,"adresse":"al. Waszyngtona 1, 30-204 Kraków","dauer_min":90,"preis":{"erwachsene":34,"ermaessigt":26,"unter26":null,"waehrung":"PLN","eur":8.0,"hinweis":"Preise ab 01.04.2026; ermäßigt mit Studierendenausweis"},"kostenlos":{"immer":false,"regeln":["Gratistage nur 4.2., 24.3., 15.10. (Kościuszko-Gedenktage)"],"termine_im_aufenthalt":[],"hinweis":"Umliegender Wolski-Wald und Weg zum Hügel frei"},"oeffnungszeiten":"tägl. 9:00–18:00","ruhetag":null,"reservierung":"nein","tipp":"Bus 100 ab Salwator (Endstation Tram 1/2) fährt bis vor die Tür; schöner ist der Fußweg über die Błonia-Wiese und die Allee Waszyngtona, 40 Minuten vom Nationalmuseum.","link":"https://kopieckosciuszki.pl/en/","quelle":"https://kopieckosciuszki.pl/en/tickets/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":4.0},{"id":"zakrzowek","name":"Zakrzówek-See","kategorie":"natur","muss":2,"kurz":"Türkiser Steinbruchsee mit Kalkfelsen, 15 Tram-Minuten vom Wawel","beschreibung":"Ein gefluteter Kalksteinbruch mit bis zu 30 Meter hohen Felswänden und karibisch gefärbtem Wasser mitten in der Stadt. Seit 2023 gibt es ein offizielles Freibad mit Stegen und Becken im See (Saison ab Juni, mit Rettungsschwimmern), drumherum Klippenwege und Wiesen zum Liegen. Ende Mai ist Baden außerhalb des bewachten Bereichs verboten, der Spaziergang oben lohnt trotzdem.","lat":50.0379,"lon":19.9138,"adresse":"ul. Wyłom / ul. św. Jacka, 30-394 Kraków","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"PLN","eur":0,"hinweis":"Park und Freibad frei (städtisch), Freibad-Saison ab Juni – im Mai nur Spazieren"},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-05-24","2027-05-25","2027-05-26","2027-05-27"],"hinweis":null},"oeffnungszeiten":"Park immer; Badebereich saisonal","ruhetag":null,"reservierung":"nein","tipp":"Tram bis Kapelanka oder Norymberska, dann 10 Minuten. Über die Klippen bis zur Aussichtsplattform an der Nordseite laufen – schönster Blick aufs Wasser.","link":"https://zzm.krakow.pl/","quelle":"https://pl.wikipedia.org/wiki/Zakrz%C3%B3wek_(Krak%C3%B3w)","preisstand":"2026","unsicher":true,"quelle_hinweis":"Freier Zugang; Saisonzeiten des Freibads nicht offiziell gegengeprüft","dist_km":4.0},{"id":"wieliczka","name":"Salzbergwerk Wieliczka","kategorie":"tagesausflug","muss":2,"kurz":"UNESCO-Salzbergwerk mit Kapelle aus Salz, 135 m unter Tage – teuer, aber einmalig","beschreibung":"Seit dem 13. Jahrhundert wurde hier Salz gefördert; die Touristenroute führt 800 Stufen hinab durch Kammern, Salzseen und die Kinga-Kapelle, deren Kronleuchter und Reliefs komplett aus Salz geschnitzt sind. Nur mit Führung (ca. 2–3 h inkl. Salinenmuseum), 17–18 °C unten. Das teuerste Ticket der Reise – überleg, ob es dir das wert ist.","lat":49.9833,"lon":20.0537,"adresse":"ul. Daniłowicza 10, 32-020 Wieliczka","dauer_min":240,"preis":{"erwachsene":159,"ermaessigt":131,"unter26":131,"waehrung":"PLN","eur":36.5,"hinweis":"Fremdsprachige Tour Hochsaison (Mai–Sept.) 159 / erm. 131 PLN; Nebensaison 143 / 121. Polnische Tour günstiger. Ermäßigt: Studierende bis 26 mit Ausweis"},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"tägl. 8:00–18:00 (Touristenroute, Saison)","ruhetag":null,"reservierung":"nötig","tipp":"Online auf bilety.kopalnia.pl buchen, deutsche Touren sind seltener als englische – früh im Tag nehmen. Anreise mit der Regionalbahn SKA1 ab Kraków Główny nach Wieliczka Rynek-Kopalnia (ca. 25 min), KMK-Ticket gilt nicht.","link":"https://www.wieliczka-saltmine.com/","quelle":"https://grandpl.com/en/greece/article/visiting-the-salt-mine-in-poland-how-to-book-tickets-and-prices/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Preisseite nicht abrufbar (404); Preise aus zwei Zweitquellen (grandpl.com 2026, inyourpocket 05/2026: 143/121 Nebensaison), offizielle Seite nennt „ab 121 PLN“","dist_km":12.1},{"id":"rathausturm","name":"Rathausturm (Wieża Ratuszowa)","kategorie":"aussicht","muss":1,"kurz":"70-Meter-Turm des abgerissenen Rathauses, Montag gratis","beschreibung":"Vom alten Rathaus blieb nur der schiefe gotische Turm am Rynek. Oben Blick auf Tuchhallen, Marienkirche und bis zum Wawel – näher dran als vom Marienturm, dafür ohne Kleingruppen-Taktung. Unten eine kleine Ausstellung zur Stadtgeschichte.","lat":50.0615,"lon":19.9365,"adresse":"Rynek Główny 1, 31-001 Kraków","dauer_min":30,"preis":{"erwachsene":22,"ermaessigt":16,"unter26":null,"waehrung":"PLN","eur":5.0,"hinweis":null},"kostenlos":{"immer":false,"regeln":["Jeden Montag frei"],"termine_im_aufenthalt":["2027-05-24"],"hinweis":"Montag nur 11:00–16:00"},"oeffnungszeiten":"Mo 11:00–16:00, Di–So 10:00–18:00","ruhetag":null,"reservierung":"nein","tipp":"Am Ankunftsmontag gratis – guter erster Überblick über die Altstadt.","link":"https://muzeumkrakowa.pl/en/branches/town-hall-tower","quelle":"https://muzeumkrakowa.pl/en/branches/town-hall-tower","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.9},{"id":"apteka-pod-orlem","name":"Adler-Apotheke (Apteka pod Orłem) + Ghetto-Heldenplatz","kategorie":"museum","muss":1,"kurz":"Die einzige Apotheke im Krakauer Ghetto – kleines Museum am Platz der leeren Stühle","beschreibung":"Tadeusz Pankiewicz führte als einziger Nichtjude seine Apotheke im Ghetto weiter und half, wo er konnte. Das kleine Museum erzählt das über Schubladen, Telefone und Dokumente zum Anfassen. Davor der Plac Bohaterów Getta mit 70 Bronzestühlen als Denkmal für die Deportierten – jederzeit frei.","lat":50.0464,"lon":19.9565,"adresse":"plac Bohaterów Getta 18, 30-547 Kraków","dauer_min":40,"preis":{"erwachsene":22,"ermaessigt":16,"unter26":null,"waehrung":"PLN","eur":5.0,"hinweis":null},"kostenlos":{"immer":false,"regeln":["Jeden Mittwoch frei","Platz mit Stühlen immer frei"],"termine_im_aufenthalt":["2027-05-26"],"hinweis":null},"oeffnungszeiten":"Mi–So 9:00–17:00","ruhetag":"Mo, Di","reservierung":"nein","tipp":"Fünf Gehminuten von der Schindler-Fabrik; am Mittwoch beides kombinieren, dann weiter zum Krakus-Hügel.","link":"https://muzeumkrakowa.pl/en/branches/eagle-pharmacy","quelle":"https://muzeumkrakowa.pl/en/branches/eagle-pharmacy","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.4},{"id":"krakus-huegel","name":"Krakus-Hügel (Kopiec Krakusa)","kategorie":"aussicht","muss":1,"kurz":"Prähistorischer Grabhügel in Podgórze, gratis und fast ohne Touristen","beschreibung":"Der Legende nach das Grab des Stadtgründers Krak, tatsächlich ein Hügel aus dem 7. oder 8. Jahrhundert auf einem Kalkfelsen über Podgórze. Keine Kasse, kein Zaun, dafür die Altstadt und der Wawel genau gegenüber auf der anderen Flussseite – der Sonnenuntergangsplatz der Einheimischen.","lat":50.0381,"lon":19.9585,"adresse":"ul. Maryewskiego, 30-531 Kraków","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"PLN","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-05-24","2027-05-25","2027-05-26","2027-05-27"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Von der Schindler-Fabrik 20 Minuten zu Fuß bergauf; Getränke mitnehmen, oben gibt es nichts.","link":"https://www.krakow.pl/","quelle":"https://www.krakow.pl/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Freier Zugang, keine Preisquelle nötig","dist_km":3.3}],"tage":[{"datum":"2027-05-24","titel":"Ankommen, Marienkirche, Wawel, Kazimierz","intro":"Montag ist Ruhetag der meisten Museen, also heute die Dinge, die immer offen sind: Marienkirche, Wawel-Gelände und das Kneipenviertel Kazimierz. Alles liegt auf einer Linie vom Bahnhof nach Süden. Der Gratis-Montag der Schindler-Fabrik (nur 10–15 Uhr) ist mit der Ankunft um 14 Uhr nicht zu schaffen – Schindler kommt am Dienstag mit gebuchtem Zeitfenster.","programm":[{"spot":null,"zeit":"14:00","titel":"Einchecken","notiz":"Apartment nahe Kraków Główny, Gepäck abstellen. Zur Altstadt sind es 10 Minuten zu Fuß."},{"spot":"marienkirche","zeit":"14:45","notiz":"Tickets gegenüber am plac Mariacki 7, nicht an der Kirche. Turm ist montags zu, der Veit-Stoß-Altar reicht."},{"spot":"wawel-kathedrale","zeit":"15:40","notiz":"Über die Grodzka 10 Minuten zum Wawel, direkt rein – die Kathedrale schließt um 16:30. Online-Ticket spart die Kassenschlange."},{"spot":"wawel","zeit":"16:30","notiz":"Gelände, Höfe und Blick auf die Weichsel sind frei. An der Kasse nach dem Montags-Gratiskontingent fragen (meist nachmittags weg), Drachenhöhle bis 17 Uhr als Abgang Richtung Boulevards."},{"spot":"kazimierz","zeit":"18:00","notiz":"Am Fluss entlang 20 Minuten nach Kazimierz. Alte Synagoge ist dann schon zu, dafür die Gassen um die Szeroka und ein Bier in der Alchemia oder Singer."},{"spot":"plac-nowy-zapiekanki","zeit":"20:00","notiz":"Abendessen aus der Luke am Plac Nowy – eine Zapiekanka reicht, „Endzior“ ist der Klassiker."}]},{"datum":"2027-05-25","titel":"Gratis-Dienstag und Schindler-Fabrik","intro":"Dienstag ist der teure Tag, den du umsonst bekommst: Rynek Underground (nur 10–15 Uhr, Kontingent), Tuchhallen-Galerie und Czartoryski-Museum sind alle gratis. Um 10 Uhr an der Underground-Kasse stehen. Nachmittags mit gebuchtem Zeitfenster in die Schindler-Fabrik, abends über die Weichsel-Boulevards zurück.","programm":[{"spot":"rynek-underground","zeit":"09:45","notiz":"Gratisticket nur an der Kasse auf der Westseite der Tuchhallen, Eingang auf der Ostseite. Vor 10 Uhr anstellen, das Kontingent ist begrenzt."},{"spot":"bar-mleczny","zeit":"11:45","notiz":"Pod Temidą in der Grodzka, 5 Minuten vom Rynek. Vor 12:30 kommen, dann stehen die Büros noch nicht an. Ein paar Złoty Bargeld mitnehmen."},{"spot":"rynek-tuchhallen","zeit":"12:30","notiz":"Zurück auf den Platz: Galerie in den Tuchhallen heute gratis (sonst 1 PLN für Studis). Um 13 Uhr unter dem Marienturm dem Trompeter hochwinken."},{"spot":"czartoryski","zeit":"14:00","notiz":"10 Minuten nach Norden zu Florianstor und Barbakan. Dienstag gratis, dafür voller – die Dame mit dem Hermelin hat ihren eigenen Raum."},{"spot":"schindler-fabrik","zeit":"16:30","notiz":"Vorher buchen: Zeitfenster-Ticket online ab ca. 25.02.2027, Di–So 9–20 Uhr, letzter Einlass 18:30. Zu Fuß 35 Minuten über Kazimierz und die Bernatek-Brücke oder Tram."},{"spot":"bulwary-wislane","zeit":"18:45","notiz":"Vom Podgórze-Ufer gegenüber Kazimierz liegt der Wawel im Abendlicht. Am Fluss entlang zurück Richtung Altstadt, Sonnenuntergang gegen 20:30."}]},{"datum":"2027-05-26","titel":"Auschwitz-Birkenau, abends Zakrzówek","intro":"Der Tag gehört der Gedenkstätte. Bus ab MDA hinter Kraków Główny, direkt bei der Unterkunft, 1,5 Stunden. Früher Slot, dann bist du gegen 15 Uhr zurück und hast abends noch Zeit für den Steinbruchsee – ein ruhiger Kontrast. Collegium Maius (Mittwoch gratis 13:30–16:00) fällt dafür weg.","programm":[{"spot":"auschwitz-birkenau","zeit":"07:00","notiz":"Vorher buchen: namentlicher Pass auf visit.auschwitz.org, sobald die Reise steht, Vormittagsslots sind Wochen vorher weg. Name muss zum Ausweis passen, Rucksack max. 35×25×15 cm. Eintritt frei, Führung kostet."},{"spot":"zakrzowek","zeit":"16:30","notiz":"Tram bis Kapelanka oder Norymberska, 10 Minuten zu Fuß. Über die Klippen zur Aussichtsplattform an der Nordseite, Badebereich saisonal."},{"spot":null,"zeit":"19:30","titel":"Abendessen in der Altstadt","notiz":"Seitenstraßen statt Rynek – die Cafés am Platz kosten das Doppelte."}]},{"datum":"2027-05-27","titel":"Fronleichnam, Prozession, Weiterfahrt","intro":"Feiertag: Läden zu, Museen unsicher, dafür zieht am Vormittag die Fronleichnamsprozession vom Wawel zum Rynek. Das schaust du dir an, dann geht es zum Zug nach Bratislava. Gepäck bis spätestens 10:30 holen – der Bahnhof ist 10 Minuten entfernt.","programm":[{"spot":null,"zeit":"08:30","titel":"Auschecken und Frühstück","notiz":"Vorräte vom Vortag – am Feiertag haben die Läden zu."},{"spot":null,"zeit":"09:30","titel":"Prozession am Rynek","notiz":"Die Prozession kommt vom Wawel über die Grodzka zum Rynek. Marienkirche öffnet heute erst um 14 Uhr."},{"spot":null,"zeit":"10:45","titel":"Zum Bahnhof","notiz":"Gepäck holen und zu Kraków Główny."}]}],"naechte":3},{"id":"bratislava","name":"Bratislava","land":"Slowakei","landcode":"SK","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-05-27","abreise":"2027-05-31","unterkunft":{"name":"Apartmán Bratislava Ružinov","ort":"Bratislava-Nivy/Ružinov","lat":48.14667,"lon":17.13,"hinweis":"Lage grob (Nähe Busbahnhof Nivy), genaue Adresse unbekannt. Ins Zentrum 20 Min zu Fuß oder Bus/Trolleybus bis Nám. SNP."},"zentrum":{"lat":48.14389,"lon":17.10806},"intro":"Bratislava ist klein: Altstadt, Burg und Donauufer schaffst du an einem Tag zu Fuß. Die restlichen Tage gehören Devín (Burgruine an der March), dem Kamzík-Wald und einem Abstecher nach Wien – mit Interrail ist die Stunde Zug dorthin praktisch gratis. Montag (Abreisetag) sind Devín, SNG, Nedbalka und Danubiana zu, Dienstag Burg-Museum und Michaelerturm – plane die Museen auf Fr–So.","feiertage":[],"gut_zu_wissen":[{"titel":"Feiertage","text":"Keine im Aufenthalt. Die Slowakei kennt Fronleichnam (27.05.) nicht als Feiertag – alles hat normal offen. Nächste Feiertage: 5.7. (Kyrill und Method), vorher 8.5."},{"titel":"Studierendenrabatt","text":"Fast überall gibt es den halben Preis für ISIC/EURO-26-Karte oder Studierendenausweis (Burg 7 statt 14 €, Devín 4 statt 8 €, Danubiana 6 statt 12 €, Nedbalka 4 statt 8 €). Einen Unter-26-Tarif ohne Ausweis gibt es nicht – Ausweis mitnehmen."},{"titel":"Nahverkehr (IDS BK)","text":"Tarif seit 1.6.2025, Stadtzonen 100+101: 30 Min 1,20 €, 60 Min 1,80 €, 24 h 5,40 €, 72 h 10,70 €. In der App IDS BK sind alle Tickets 10 % billiger (72 h ≈ 9,65 €). Für Devín (Bus 29 ab Most SNP) und Kamzík (Trolleybus 212 bis Koliba) reicht das Stadtticket. Papiertickets an gelben Automaten, vor dem Einsteigen kaufen und entwerten. Eine Erhöhung für 2026/27 ist möglich – Preise vor Ort prüfen."},{"titel":"Bratislava Card","text":"72 h 39 € mit ÖPNV / 35 € ohne (Stand 2026). Frei: Burg-Museum, Devín, Michaelerturm, Altes Rathaus, Zoo; 25 % auf UFO. Für dich lohnt sie nicht: Burg 7 + Devín 4 + Michaelerturm 4 + 72-h-Ticket 9,65 = unter 25 €. Nur für Vollzahler, die alle Burgen + Rathaus abklappern, geht sie knapp auf."},{"titel":"Geld und Essen","text":"Euro, Karte fast überall. Leitungswasser ist gut trinkbar. Trinkgeld 5–10 % oder aufrunden. Günstig und lokal: Bryndzové halušky und Kapustnica im Slovak Pub (Obchodná 62) oder in einer Kantine (jedáleň) mittags. Nahe der Unterkunft: Trhovisko Miletičova (Mo–Sa vormittags), der größte Markt der Stadt mit Lángoš-Ständen. Bratislavský rožok (Mohn-/Nusshörnchen) in jeder Bäckerei."},{"titel":"Wien ist eine Stunde entfernt","text":"REX-Züge ÖBB halbstündlich ab Hlavná stanica oder Petržalka nach Wien Hbf, ca. 1 h, keine Reservierung nötig oder möglich – Interrail-Tag eintragen und einsteigen."}],"spots":[{"id":"altstadt-michaelertor","name":"Altstadt und Michaelertor","kategorie":"viertel","muss":3,"kurz":"Kompakte Fußgängeraltstadt, einziges erhaltenes Stadttor mit Aussichtsturm","beschreibung":"Vom Michaelertor (Michalská brána) mit seinem grünen Zwiebelturm läuft die Altstadt in zehn Minuten bis zur Donau durch: Hauptplatz mit Altem Rathaus, Primatialpalais, Martinsdom, die Bronzefiguren Čumil und Schöner Náci. Im Turm sitzt ein kleines Waffenmuseum, oben eine Galerie mit Blick über die Dächer.","lat":48.14528,"lon":17.10694,"adresse":"Michalská 22, 811 03 Bratislava","dauer_min":120,"preis":{"erwachsene":6,"ermaessigt":4,"unter26":null,"waehrung":"EUR","eur":6,"hinweis":"Nur der Turm kostet (6 € / erm. 4 €); Altstadt natürlich frei. Tickets in der Apotheke Zum Roten Krebs direkt neben dem Tor."},"kostenlos":{"immer":false,"regeln":["Altstadt und Durchgang unter dem Tor immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Turm Mi–Mo 10:00–18:00 (letzter Einlass 17:30)","ruhetag":"Dienstag (Turm)","reservierung":"nein","tipp":"Früh morgens oder nach 18 Uhr ist die Altstadt leer; tagsüber kommen Donau-Kreuzfahrtgruppen. Der Turm lohnt nur, wenn du nicht aufs UFO gehst – der Blick ist ähnlich, aber niedriger.","link":"https://muzeumbratislava.sk/en/michaels-tower","quelle":"https://muzeumbratislava.sk/en/michaels-tower","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.7},{"id":"burg","name":"Bratislavaer Burg (Hrad)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Der weiße Tisch über der Donau – Hof und Blick kostenlos, Museum drinnen","beschreibung":"Die viertürmige Burg thront über Altstadt und Donau und ist der Fixpunkt jeder Stadtansicht. Der Burghof, der Barockgarten und die Terrassen mit Blick bis nach Österreich und Ungarn sind frei zugänglich. Drinnen sitzt das Historische Museum des SNM (Burggeschichte, Schatzkammer, Wechselausstellungen); der Aufstieg auf den Kronturm ist im Ticket drin.","lat":48.14222,"lon":17.1,"adresse":"Hrad, 811 06 Bratislava","dauer_min":90,"preis":{"erwachsene":14,"ermaessigt":7,"unter26":null,"waehrung":"EUR","eur":14,"hinweis":"Museum: 14 € / ISIC-EURO26 7 €; nur Schatzkammer 4 € / 2 €. Hof, Garten, Aussicht frei. Bratislava Card frei."},"kostenlos":{"immer":false,"regeln":["Burggelände, Hof und Barockgarten immer frei (8–22 Uhr)"],"termine_im_aufenthalt":[],"hinweis":"Kein Gratistag fürs Museum gefunden."},"oeffnungszeiten":"Gelände tägl. 8:00–22:00; Museum Mi–Mo 10:00–18:00 (letzter Einlass 17:00)","ruhetag":"Dienstag (Museum)","reservierung":"nein","tipp":"Abends um 21 Uhr hoch: Gelände noch offen, Stadt beleuchtet, kaum Leute. Aufstieg über die Treppen vom Dom (Zámocké schody), zurück über den Garten Richtung Parlament.","link":"https://www.snm.sk/en/museums/museum-of-history","quelle":"https://www.snm.sk/en/museums/museum-of-history/museum-of-history/visit/admission-fees","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.3},{"id":"devin","name":"Burg Devín","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Burgruine am Zusammenfluss von March und Donau, direkt an der alten Grenze","beschreibung":"Devín war großmährische Festung, Habsburger Grenzburg und bis 1989 Sperrgebiet am Eisernen Vorhang – das Tor der Freiheit unterhalb erinnert an die Erschossenen. Die Ruine auf dem Felsen über zwei Flüssen ist eine der schönsten Lagen im Land; der Blick geht nach Österreich hinüber. Mit Bus 29 ab Most SNP in 20 Minuten draußen.","lat":48.17389,"lon":16.97806,"adresse":"Muránska 10, 841 10 Bratislava-Devín","dauer_min":150,"preis":{"erwachsene":8,"ermaessigt":4,"unter26":null,"waehrung":"EUR","eur":8,"hinweis":"Apr–Okt 8 € / Studierende 4 €. Bratislava Card frei. Online-Tickets über hraddevin.mmb.sk."},"kostenlos":{"immer":false,"regeln":["Ufer, Dorf und Tor der Freiheit unterhalb der Burg immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Apr–Mai Di–So 10:00–18:00, Jun–Aug 10:00–19:00; letzter Einlass 45 Min vor Schluss","ruhetag":"Montag (also am Abreisetag 31.05. zu)","reservierung":"nein","tipp":"Bus 29 ab Haltestelle Most SNP (unter der Brücke, Altstadtseite), Stadtticket reicht. Wasser und Brot mitnehmen – oben gibt es nur einen Kiosk. Zurück zu Fuß am Donauradweg nach Karlova Ves (1,5 h) oder wieder Bus.","link":"https://www.muzeumbratislava.sk/en/node/226","quelle":"https://www.muzeumbratislava.sk/en/node/226","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":11.7},{"id":"donauufer-eurovea"," and":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.4},{"id":"sng","name":"Slowakische Nationalgalerie (SNG)","kategorie":"museum","muss":2,"kurz":"Frisch sanierte Nationalgalerie am Donauufer, Sammlungsräume großteils gratis","beschreibung":"Seit der Wiedereröffnung 2022 ist die SNG ein offenes Haus: brutalistischer Brückenbau über dem Barockpalais, Café, Buchladen und ein offenes Depot mit Skulpturen, das nichts kostet. Gotische Altäre, Barock und slowakische Moderne; die Wechselausstellungen sind der Teil, der Eintritt kostet.","lat":48.14083,"lon":17.10889,"adresse":"Rázusovo nábrežie 2, 811 02 Bratislava","dauer_min":90,"preis":{"erwachsene":7,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":7,"hinweis":"Ausstellungen laut Ticketseite 0–7 €; die offene Sammlung (Skulptur) 0 €. Welche Dauerausstellungen genau frei sind und was Studierende zahlen: vor Ort oder online prüfen."},"kostenlos":{"immer":false,"regeln":["Offenes Depot / Skulptur-Sammlung immer frei","Gebäude, Café, Buchladen frei"],"termine_im_aufenthalt":[],"hinweis":"Ein genereller Gratis-Status aller Dauerausstellungen ließ sich 2026 nicht bestätigen."},"oeffnungszeiten":"Di, Mi, Fr–So 10:00–18:00; Do 12:00–20:00","ruhetag":"Montag","reservierung":"nein","tipp":"Donnerstagabend bis 20 Uhr, wenn die Altstadt sich leert. Das Dachcafé hat Donaublick ohne Ticket.","link":"https://www.sng.sk/en","quelle":"https://www.sng.sk/en/slovak-national-gallery/tickets","preisstand":"2026","unsicher":true,"quelle_hinweis":"Ticketseite zeigt nur Spannen (0–7 €), keine Tarifliste. Frühere Gratis-Regelung (Sponsor Tatra banka, 2022) ist nicht sicher noch gültig.","dist_km":1.7},{"id":"ufo","name":"UFO-Aussichtsplattform (Most SNP)","kategorie":"aussicht","muss":2,"kurz":"Fliegende Untertasse auf dem Brückenpylon, 95 m über der Donau","beschreibung":"Das UFO auf der SNP-Brücke von 1972 ist das Wahrzeichen der sozialistischen Moderne in Bratislava. Oben Restaurant, Bar und eine offene Plattform mit 360°-Blick: Burg, Altstadt, die Plattenbauten von Petržalka und bei klarer Sicht Wien. Der Lift braucht 45 Sekunden.","lat":48.13833,"lon":17.10444,"adresse":"Most SNP, 851 01 Bratislava-Petržalka","dauer_min":45,"preis":{"erwachsene":11.9,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":12,"hinweis":"Mo–Fr 10–13 Uhr 9,90 €, sonst 11,90 €; Studierendenrabatt wird genannt, Höhe nicht veröffentlicht. Bratislava Card −25 %. Wer im Restaurant ein Hauptgericht isst, kommt frei hoch. Nur vor Ort kaufen."},"kostenlos":{"immer":false,"regeln":["Frei mit Hauptgericht im UFO-Restaurant"],"termine_im_aufenthalt":[],"hinweis":"Die Brücke selbst (Fußweg unter der Fahrbahn) ist frei und auch ein guter Blick."},"oeffnungszeiten":"Plattform tägl. 10:00–23:00","ruhetag":null,"reservierung":"nein","tipp":"Werktags vormittags ist es 2 € billiger. Alternative ohne Eintritt: der Blick von der Burgterrasse oder vom Slavín – wer sparen muss, lässt das UFO weg.","link":"https://www.u-f-o.sk/","quelle":"https://thedailypackers.com/bratislava-ufo-tower/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Seite u-f-o.sk ließ sich nicht laden (Redirect-Schleife). Preise aus zwei Reiseblogs vom 01/04.2026 (9,90/11,90 €); ein dritter Blog nennt 7,40 €.","dist_km":2.1},{"id":"slavin","name":"Slavín","kategorie":"aussicht","muss":2,"kurz":"Sowjetisches Ehrenmal auf dem Hügel, bester Gratis-Blick auf die Stadt","beschreibung":"Auf dem Slavín liegen 6.845 sowjetische Soldaten, die 1945 bei der Befreiung Bratislavas fielen; der 39 m hohe Obelisk ist von überall zu sehen. Der Weg hoch führt durch das Villenviertel mit Botschaften, oben hast du Burg, Altstadt und Donau ohne Eintritt vor dir. Besonders zum Sonnenuntergang.","lat":48.15417,"lon":17.09917,"adresse":"Pažického 3, 811 04 Bratislava","dauer_min":60,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Frei, immer zugänglich."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_i
