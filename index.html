r."},"kostenlos":{"immer":false,"regeln":["Einzelne Gratistage (2026: 26./27.09., 04.10., 08.11., 20./26.12.) – keine im Juni"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mo–Sa 9:30–17:30, So 14:00–17:30 (Kasse bis 17:00)","ruhetag":null,"reservierung":"nein","tipp":"Im Juni steht die Calcio-Storico-Arena auf dem Platz – Fassade teilweise verstellt, am 24.06. ist der Platz gesperrt. Besuch deshalb auf einen anderen Tag legen; Eingang dann seitlich.","link":"https://www.santacroceopera.it/en/","quelle":"https://www.feelflorence.it/en/points-interest/basilica-di-santa-croce","preisstand":"2026","unsicher":true,"quelle_hinweis":"Ticketseite (ticket.santacroceopera.it) lädt nur per JavaScript; Vollpreis über feelflorence.it, Ermäßigung offen.","dist_km":17.5},{"id":"sant-ambrogio-markt","name":"Mercato di Sant'Ambrogio","kategorie":"markt","muss":2,"kurz":"Der Markt, auf dem Florentiner einkaufen – kein Tourist weit und breit","beschreibung":"Zehn Minuten östlich von Santa Croce: Bauernstände draußen, Halle mit Metzgern und Käsern drinnen, dazu die Trattoria Da Rocco in der Halle (Primi um 5–6 €) und der Lampredotto-Kiosk am Platz. Hier siehst du, was Florenz jenseits der Uffizien isst.","lat":43.771,"lon":11.266,"adresse":"Piazza Lorenzo Ghiberti, 50122 Firenze","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":0,"unter26":0,"waehrung":"EUR","eur":0,"hinweis":"Markt frei; Mittagessen bei Da Rocco ca. 10 € (nicht offiziell verifiziert)."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-21","2027-06-22","2027-06-23","2027-06-24","2027-06-25","2027-06-26","2027-06-28"],"hinweis":"Sonntag (27.06.) geschlossen."},"oeffnungszeiten":"Mo–Sa 7–14","ruhetag":"Sonntag","reservierung":"nein","tipp":"Pfirsiche und Kirschen im Juni kiloweise zum Picknick am Arno; Cibreo-Café um die Ecke für einen Espresso an der Bar (1,50 €).","link":"https://www.feelflorence.it/en","quelle":"https://www.feelflorence.it/en","preisstand":"2026","unsicher":true,"quelle_hinweis":"Öffnungszeiten nicht von offizieller Seite.","dist_km":17.6},{"id":"arno-ufer-biblioteca","name":"Arno-Ufer, Nationalbibliothek, Ponte alle Grazie","kategorie":"aussicht","muss":2,"kurz":"Lungarno-Spaziergang – und der beste Platz für die Fochi am 24.06.","beschreibung":"Vom Ponte alle Grazie ostwärts: die Fassade der Biblioteca Nazionale Centrale (1935, größte Bibliothek Italiens, 1966 vom Hochwasser verwüstet), dann der Lungarno della Zecca Vecchia mit Blick zurück auf Ponte Vecchio und hinüber zu San Miniato. Abends sitzen hier die Studierenden auf der Mauer. Am 24.06. gegen 22 Uhr fliegen von hier aus gesehen die Fochi über dem Piazzale Michelangelo – genau gegenüber.","lat":43.7669,"lon":11.263,"adresse":"Piazza dei Cavalleggeri 1 / Lungarno della Zecca Vecchia, 50122 Firenze","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":0,"unter26":0,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-21","2027-06-22","2027-06-23","2027-06-24","2027-06-25","2027-06-26","2027-06-27","2027-06-28"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Für die Fochi ab 20:30 einen Platz an der Ufermauer zwischen Ponte alle Grazie und Ponte San Niccolò sichern; Supermarkt-Wein und Pizza al taglio mitbringen. Danach Richtung Bahnhof laufen (35 min) – Busse stecken fest.","link":"https://www.feelflorence.it/en","quelle":"https://www.feelflorence.it/en","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":17.7},{"id":"museo-tessuto","name":"Museo del Tessuto (Prato)","kategorie":"museum","muss":1,"kurz":"Warum Prato Europas Textilhauptstadt ist – in einer alten Fabrik","beschreibung":"In der ehemaligen Cimatoria Campolmi: Stoffe vom 5. Jh. bis zur Haute Couture, Webstühle, Färbetechniken, dazu die Geschichte der Lumpen-Recycling-Industrie, die Prato groß gemacht hat (und die heute die chinesische Community prägt). Kurz, konkret, in 1 Stunde durch.","lat":43.8773,"lon":11.1,"adresse":"Via Puccetti 3, 59100 Prato","dauer_min":60,"preis":{"erwachsene":10,"ermaessigt":6,"unter26":6,"waehrung":"EUR","eur":10,"hinweis":"10 €; Studierende 7–25 Jahre 6 €; über 65 8 €. In der Prato Card enthalten. Firenzecard-Inhaber frei."},"kostenlos":{"immer":false,"regeln":["Unter 6 frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Di–Do 10–15, Fr–Sa 10–19, So 15–19","ruhetag":"Montag","reservierung":"nein","tipp":"Freitag- oder Samstagabend, wenn es bis 19 Uhr offen ist – dann liegt es auf dem Weg zwischen Bahnhof Centrale und Altstadt.","link":"https://www.museodeltessuto.it/en/","quelle":"https://www.museodeltessuto.it/orari-biglietti-location/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.3},{"id":"castello-imperatore-prato","name":"Castello dell'Imperatore (Prato)","kategorie":"sehenswuerdigkeit","muss":1,"kurz":"Stauferburg Friedrichs II. mitten in der Toskana – Mauerrundgang mit Blick","beschreibung":"Die einzige Burg der Hohenstaufen nördlich von Süditalien, um 1240 für Friedrich II. als quadratische Festung mit acht Türmen gebaut und nie fertig geworden. Innen ein leerer Hof, oben ein Wehrgang mit Blick über Prato bis zu den Bergen. Daneben Giuliano da Sangallos Santa Maria delle Carceri, der perfekte Renaissance-Zentralbau (frei).","lat":43.8791,"lon":11.098,"adresse":"Piazza Santa Maria delle Carceri, 59100 Prato","dauer_min":40,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Quellen widersprechen sich: Eintritt frei bzw. 2,50 €. Vor Ort klären – in jedem Fall unter 3 €."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":"Außenansicht und Santa Maria delle Carceri immer frei."},"oeffnungszeiten":"ca. tägl. 10–16 (Sommer teils 10–13 und 16–20)","ruhetag":"Dienstag (laut einer Quelle)","reservierung":"nein","tipp":"Im Sommer Open-Air-Kino und Konzerte im Burghof – Programm an den Plakaten in der Altstadt.","link":"https://www.pratoturismo.it/en/","quelle":"https://www.museionline.info/toscana-musei-monumenti/castello-dellimperatore","preisstand":"2026","unsicher":true,"quelle_hinweis":"Keine offizielle Preisseite gefunden; Angaben aus Museumsverzeichnis und Reiseportal.","dist_km":0.5},{"id":"pitti","name":"Palazzo Pitti","kategorie":"museum","muss":1,"kurz":"Großherzogspalast mit Raffael-Dichte wie nirgends – für 3 €","beschreibung":"Die Galleria Palatina hängt noch wie im 18. Jh.: Wand an Wand Raffael, Tizian, Rubens in Prunkräumen. Ein Ticket gilt für alle Sammlungen (Moderne, Kostüm und Mode, Schatzkammer, Kapelle). Für 3 € ein Regentag-Programm, sonst nachrangig gegenüber Uffizien und Bargello.","lat":43.7651,"lon":11.25,"adresse":"Piazza de' Pitti 1, 50125 Firenze","dauer_min":120,"preis":{"erwachsene":16,"ermaessigt":3,"unter26":3,"waehrung":"EUR","eur":16,"hinweis":"16 € Kasse / 19 € online; EU 18–25: 3 €. Kombi Pitti + Boboli 22 €/25 €."},"kostenlos":{"immer":false,"regeln":["Erster Sonntag im Monat frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Di–So 8:15–18:30","ruhetag":"Montag","reservierung":"nein","tipp":"Hier brauchst du kein Zeitfenster – einfach hin, Schlangen sind kurz. Mit Boboli an einem Tag kombinieren.","link":"https://www.uffizi.it/en/pitti-palace","quelle":"https://www.uffizi.it/en/tickets","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":17.1},{"id":"museo-galileo","name":"Museo Galileo","kategorie":"museum","muss":1,"kurz":"Galileis Fernrohre und sein Mittelfinger – Wissenschaftsgeschichte am Arno","beschreibung":"Direkt neben den Uffizien: die Instrumentensammlung der Medici und Lothringer, Galileis beide Original-Fernrohre, die Linse der Jupitermond-Entdeckung, Armillarsphären, anatomische Wachsmodelle – und in einem Reliquiar Galileis Finger. Für Informatik-Leute die spannendste Stunde nach den Uffizien.","lat":43.7678,"lon":11.256,"adresse":"Piazza dei Giudici 1, 50122 Firenze","dauer_min":90,"preis":{"erwachsene":14,"ermaessigt":10,"unter26":null,"waehrung":"EUR","eur":14,"hinweis":"14 €; ermäßigt 10 € nur für bestimmte Karteninhaber (kein allgemeiner Studierendenrabatt ausgewiesen); 6–18 Jahre 7 €. Online +1 €."},"kostenlos":{"immer":false,"regeln":["Unter 6 frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mo, Mi–So 9:30–18, Di 9:30–13","ruhetag":null,"reservierung":"nein","tipp":"Dienstagvormittag meiden (schließt 13 Uhr). Guter Lückenfüller, wenn das Uffizien-Fenster erst nachmittags ist.","link":"https://www.museogalileo.it/en/","quelle":"https://www.museogalileo.it/en/visit/hours-prices.html","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":17.2}],"tage":[{"datum":"2027-06-21","titel":"Prato beziehen, Oltrarno-Abend","intro":"Ankunft aus Venedig am frühen Nachmittag in Prato. Montag sind alle Staatsmuseen zu, deshalb heute das Viertel südlich des Arno: Ponte Vecchio im Abendlicht, Werkstätten im Oltrarno, Aperitivo auf den Stufen von Santo Spirito. Zug Prato–Firenze S.M.N. mehrmals pro Stunde, 15–25 min, Interrail. Falls noch nicht erledigt: Kuppel-Zeitfenster (Mittwoch 8:15) und Uffizien-Fenster (Dienstag 8:15) sofort buchen.","programm":[{"spot":null,"zeit":"14:00","titel":"Einchecken in Prato","notiz":"Vorher klären, ob Prato Centrale oder Porta al Serraglio näher an der Unterkunft liegt – Serraglio liegt an der Altstadt. Supermarkt-Einkauf fürs Frühstück."},{"spot":null,"zeit":"15:30","titel":"Zug nach Florenz S.M.N.","notiz":"Regionale, auf die Anzeige achten (manche enden in Rifredi/Campo di Marte). Vom Bahnhof 15 min zum Arno."},{"spot":"ponte-vecchio","zeit":"16:15","notiz":"Von der Ponte Santa Trinita aus anschauen, das ist der bessere Blick; über die Brücke selbst nur kurz. Nicht auf der Brücke essen."},{"spot":"oltrarno-santo-spirito","zeit":"16:45","notiz":"Via Maggio, Via Toscanella, Borgo San Frediano: offene Werkstätten der Goldschmiede und Rahmenbauer. Kirche Santo Spirito (frei, Michelangelos Holzkruzifix in der Sakristei) bis 18 Uhr, ab 19 Uhr Spritz auf den Kirchenstufen."},{"spot":null,"zeit":"19:30","titel":"Abendessen im Oltrarno","notiz":"Trattoria Sabatino oder da Ginone – die günstigsten der Stadt. Dann Zug zurück nach Prato, Züge fahren bis gegen Mitternacht."}]},{"datum":"2027-06-22","titel":"Uffizien zuerst, Palazzo Vecchio, Santa Croce","intro":"Dienstag, das erste Zeitfenster um 8:15 in den Uffizien – drei Stunden, mehr hält niemand durch. Danach am selben Platz Palazzo Vecchio mit dem Turm, nachmittags Santa Croce (die Calcio-Arena steht auf dem Platz, Eingang seitlich – am 24. ist hier gesperrt). Uffizien vorher buchen: 2 € + 4 € Reservierung, nur über den offiziellen Shop auf uffizi.it.","programm":[{"spot":"uffizien","zeit":"08:15","notiz":"Vorher buchen, Zeitfenster 8:15, Ausweis für den 2-€-Tarif. Botticelli, Leonardo, Caravaggio, der Korridor mit Blick auf die Ponte Vecchio. Bis ca. 11:15."},{"spot":null,"zeit":"11:30","titel":"Mittag an der Piazza della Signoria","notiz":"Fontanello auf dem Platz (auch mit Sprudel), Panino oder Pizza al taglio aus einer Seitengasse."},{"spot":"palazzo-vecchio","zeit":"13:00","notiz":"In der Mittagshitze nach drinnen: Salone dei Cinquecento, Eleonoras Gemächer. Turm und Museum sind getrennte Tickets – wenn nur eins, der Turm (13 € ermäßigt): Kuppel und Stadt frontal. Online „ridotto“ wählen oder an der Kasse mit Ausweis."},{"spot":"santa-croce","zeit":"15:30","notiz":"Kasse bis 17 Uhr, ermäßigten Preis an der Kasse erfragen. Gräber von Michelangelo, Galilei, Machiavelli, Giottos Bardi-Kapelle, Pazzi-Kapelle im Kreuzgang. Fassade im Juni teils von der Arena verstellt."},{"spot":null,"zeit":"17:30","titel":"Früher Abend","notiz":"Zurück nach Prato oder noch ein Gelato am Arno – morgen geht es wieder um 8:15 los."}]},{"datum":"2027-06-23","titel":"Kuppel, Lampredotto, Bargello, David am Abend","intro":"Dom-Tag mit gebuchtem Kuppel-Slot um 8:15 (Brunelleschi-Pass 30 €, gilt 3 Tage – Campanile und Baptisterium gleich mit, Museum notfalls morgen). Danach fünf Minuten weiter in die Markthalle, vor 11:30 zu Nerbone. Mittags ins kühle Bargello, spätes Fenster in der Accademia, da ist es am leersten. Accademia vorher buchen (2 € + 4 €).","programm":[{"spot":"dom-komplex","zeit":"08:15","notiz":"Vorher buchen (duomo.firenze.it), Kuppel-Zeitfenster Pflicht: 463 Stufen zwischen den Kuppelschalen. Dann Campanile und Baptisterium mit demselben Pass. Kirchenschiff ist frei, Schlange am Hauptportal ab 10:15."},{"spot":"mercato-centrale","zeit":"11:20","notiz":"Da Nerbone im Erdgeschoss, vor 11:30 sonst 30 Minuten Schlange: Lampredotto-Panino „bagnato“ mit salsa verde, ca. 5 €. Danach kurz durch die Halle."},{"spot":"bargello","zeit":"13:00","notiz":"Ohne Reservierung, 2 € mit Ausweis, keine Schlange. Donatellos Bronze-David, Michelangelos Bacchus, die Wettbewerbsreliefs fürs Baptisterium. Kühl, ruhig – gut für die heißeste Stunde."},{"spot":null,"zeit":"15:00","titel":"Pause","notiz":"Schatten und Gelato, oder das Dommuseum mit Ghibertis Original-Paradiestür – ist im Brunelleschi-Pass drin."},{"spot":"accademia","zeit":"17:00","notiz":"Vorher buchen, spätes Fenster ab 17 Uhr, Ausweis für 2 €. David am Ende des Flurs mit den unfertigen Sklaven, dazu die Medici-Instrumente. 60–90 Minuten, danach Zug nach Prato."}]},{"datum":"2027-06-24","titel":"San Giovanni: Medici, Markt, Calcio, Fochi","intro":"Stadtfest, der Tag ist für den Abend da. Vormittags die Cappelle Medicee (2 €; prüfen, ob sie am 24. wie in früheren Jahren verlängert offen sind) und der Markt Sant'Ambrogio für Obst und Picknick. Mittags Pause, ab 16 Uhr Umzug und Finale rund um Santa Croce, ab 20:30 Platz an der Arno-Mauer sichern, 22 Uhr Feuerwerk. Piazzale Michelangelo ist heute gesperrt, Palazzo Vecchio schließt 14 Uhr. Letzten Zug nach Prato (gegen 0 Uhr) vorher raussuchen.","programm":[{"spot":"san-lorenzo-medici-kapellen","zeit":"08:15","notiz":"Eingang hinter der Kirche, Piazza Madonna degli Aldobrandini. Michelangelos Grabfiguren in der Neuen Sakristei, der Marmor-Overkill der Fürstenkapelle. Basilika San Lorenzo kostet extra 9 € ohne Rabatt – auslassen."},{"spot":"sant-ambrogio-markt","zeit":"10:00","notiz":"20 min nach Osten: Bauernstände draußen, Halle drinnen, Pfirsiche und Kirschen fürs Abend-Picknick kaufen. Espresso an der Bar im Cibreo-Café um die Ecke, 1,50 €."},{"spot":null,"zeit":"12:00","titel":"Mittag und Pause","notiz":"Lampredotto am Kiosk Sant'Ambrogio oder Da Rocco in der Markthalle (ca. 10 €). Danach Pause im Schatten oder kurz zurück nach Prato – der Abend wird lang."},{"spot":"calcio-storico-fochi","zeit":"16:00","notiz":"Umzug der Republik Florenz ab ca. 16 Uhr an der Via dei Calzaiuoli, 17 Uhr Finale auf der Piazza Santa Croce. Finaltickets gibt es Anfang Juni im städtischen Vorverkauf (schnell weg) – sonst das Spiel auf den Leinwänden der Bars rund um den Platz. Termin 2027 vor der Reise bestätigen."},{"spot":"arno-ufer-biblioteca","zeit":"20:30","notiz":"Platz an der Ufermauer zwischen Ponte alle Grazie und Ponte San Niccolò, Supermarkt-Wein und Pizza al taglio dabei. Gegen 22 Uhr fliegen die Fochi vom Piazzale Michelangelo genau gegenüber, 20 Minuten."},{"spot":null,"zeit":"22:30","titel":"Zu Fuß zum Bahnhof","notiz":"35 min zu S.M.N., Busse stecken fest. Letzter Zug nach Prato gegen Mitternacht – vorher geprüft haben."}]},{"datum":"2027-06-25","titel":"Boboli, Pitti, Brancacci, Galileo","intro":"Der Tag südlich des Arno, Gärten morgens, bevor es heiß wird. Boboli von oben an der Porta Romana einsteigen und bergab laufen, Kombiticket mit Bardini an der Boboli-Kasse, dann die Bardini-Terrasse. Mittags in den Pitti (3 €, kein Zeitfenster nötig), nachmittags der gebuchte Brancacci-Slot, zum Schluss Galileis Fernrohre am Arno.","programm":[{"spot":"boboli-bardini","zeit":"09:00","notiz":"Eingang Porta Romana oder Forte Belvedere, bergab durch Zypressenalleen und Grotten. Kombiticket Boboli + Bardini nur an der Kasse am Besuchstag (ermäßigte Variante erfragen, Boboli allein 3 €). Bardini-Eingang Costa San Giorgio, Panorama von der Café-Terrasse."},{"spot":"pitti","zeit":"11:30","notiz":"Einfach hin, Schlangen sind kurz, 3 € mit Ausweis. Galleria Palatina, Wand an Wand Raffael und Tizian; ein Ticket für alle Sammlungen. In der Mittagshitze genau richtig."},{"spot":null,"zeit":"13:30","titel":"Mittag im Oltrarno","notiz":"200 m von der Ponte Vecchio weg ist alles halb so teuer – Richtung Santo Spirito gehen."},{"spot":"brancacci","zeit":"15:00","notiz":"Vorher buchen (bigliettimusei.comune.fi.it), Kontingente pro Slot sind klein, 10 € ermäßigt. Masaccios Vertreibung aus dem Paradies, 30 Minuten reichen."},{"spot":"museo-galileo","zeit":"16:30","notiz":"Über die Ponte Vecchio zur Piazza dei Giudici, 14 € ohne Studi-Rabatt – nur wenn dich Galileis Original-Fernrohre und die Medici-Instrumente reizen; sonst Arno-Ufer und früher Feierabend."}]},{"datum":"2027-06-26","titel":"Prato-Vormittag, Sonnenuntergang San Miniato","intro":"Halber Tag für deinen Wohnort: Dom mit Lippis Fresken, Donatellos Außenkanzel, Biscotti bei Mattei, die Stauferburg, nach dem Mittag das Centro Pecci – alle drei Prato-Museen zusammen lohnen die Prato Card Young (10 €, unter 25). Gegen 16 Uhr zurück nach Florenz: Vesper der Mönche in San Miniato, Rosengarten, Sonnenuntergang über der Stadt.","programm":[{"spot":"duomo-prato","zeit":"10:00","notiz":"Ab Porta al Serraglio 5 min. Lippis Herodes-Tanz in der Cappella Maggiore (Zugang an der Dom-Infostelle erfragen), Dommuseum Sa 10–13 mit den Originalreliefs der Kanzel (6 € ermäßigt). Danach Via Ricasoli: Biscotti di Prato bei Antonio Mattei, Tüte ab ca. 5 €."},{"spot":"castello-imperatore-prato","zeit":"11:45","notiz":"Friedrichs II. Stauferburg, Wehrgang mit Blick über Prato; Eintritt frei oder 2,50 € – vor Ort klären. Daneben Santa Maria delle Carceri, frei."},{"spot":null,"zeit":"12:30","titel":"Mittag in Prato","notiz":"Piazza del Comune, ein Drittel der Florenz-Preise."},{"spot":"centro-pecci","zeit":"14:00","notiz":"20 min zu Fuß vom Bahnhof Centrale oder Bus LAM. Unter 26 7 €, in der Prato Card Young enthalten. Gegenwartskunst im goldenen Ring – der Kontrast nach fünf Tagen Renaissance. Öffnungszeiten vorher auf centropecci.it prüfen."},{"spot":"piazzale-michelangelo-san-miniato","zeit":"17:15","notiz":"Zug gegen 16 Uhr nach S.M.N., Bus 12/13 oder zu Fuß über die Rampen ab Ponte alle Grazie. Erst hoch nach San Miniato zur gregorianischen Vesper (ca. 17:30), dann Giardino delle Rose, zum Sonnenuntergang auf die San-Miniato-Treppe – ruhiger und höher als der volle Piazzale."}]},{"datum":"2027-06-27","titel":"Ruhiger Vormittag, Fiesole am Abend","intro":"Sonntag ist in Florenz der schwache Tag (Märkte zu, Santa Croce erst ab 14 Uhr), also Puffer: ausschlafen, Wäsche, oder nachholen, was unter der Woche ausgefallen ist. Nachmittags mit Bus 7 nach Fiesole – römisches Theater, Blick vom Kloster San Francesco, Sonnenuntergang oben, mit dem letzten Bus oder zu Fuß über San Domenico runter.","programm":[{"spot":null,"zeit":"09:00","titel":"Puffer-Vormittag","notiz":"Nichts Festes. Ist ein Zeitfenster geplatzt (Kuppel, Accademia), heute versuchen – Accademia und Uffizien haben sonntags regulär offen."},{"spot":"fiesole","zeit":"15:00","notiz":"Bus 7 ab Piazza San Marco, Ticket vorher in der „at bus“-App (2 €), 25 min. Area archeologica 5 € ermäßigt, bis 19 Uhr. Aufstieg zum Kloster San Francesco ist frei und hat den besten Blick. Picknick mitnehmen, Sonnenuntergang gegen 20:50."},{"spot":null,"zeit":"20:00","titel":"Runter nach San Domenico","notiz":"Zu Fuß über die Via Vecchia Fiesolana (30 min bergab, Villen, Olivenhaine), dort Bus 7 zurück, Zug nach Prato."}]},{"datum":"2027-06-28","titel":"Abfahrt nach Genua","intro":"Montag, Boboli und alle Staatsmuseen sind ohnehin zu. Frühstück, packen, Zug Richtung Genua. Verbindung vorher in der Interrail-App festlegen.","programm":[{"spot":null,"zeit":"08:30","titel":"Frühstück, packen, Schlüssel","notiz":"Reste aus dem Kühlschrank als Zugproviant, Biscotti von Mattei für unterwegs."},{"spot":null,"zeit":"10:00","titel":"Zug ab Prato Richtung Genua","notiz":"Ankunft Genua am frühen Nachmittag."}]}],"naechte":7},{"id":"genua","name":"Genua","land":"Italien","landcode":"IT","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-06-28","abreise":"2027-07-03","unterkunft":{"name":"Appartamento tranquillo e ben posizionato","ort":"Genua","lat":44.409,"lon":8.932,"hinweis":"Adresse unbekannt; Koordinaten = Centro Storico (Nähe Piazza De Ferrari/San Lorenzo) geschätzt."},"zentrum":{"lat":44.4074,"lon":8.934},"intro":"Genua ist eine Hafenstadt mit Europas größter mittelalterlicher Altstadt, aufgetürmt an einem Hang – oben die Rolli-Paläste und Aussichtsterrassen, unten die Caruggi und der Porto Antico. Mit 18–25 kostet jedes städtische Museum 2 €, nur das Aquarium kennt keinen Rabatt. Ein Tag Altstadt + Via Garibaldi, ein Tag Porto Antico, ein halber Tag Castelletto/Righi/Castello d'Albertis, ein Tag Riviera (Camogli–San Fruttuoso oder Cinque Terre) und ein Abend Boccadasse – das füllt die Woche.","feiertage":[],"gut_zu_wissen":[{"titel":"2-Euro-Regel für städtische Museen","text":"Die Musei di Genova (Strada Nuova, Castello d'Albertis, Lanterna, Sant'Agostino u. a.) geben 18–25-Jährigen (Lanterna: bis 26) ein 2-€-Ticket, unter 18 frei. Kein 1.-Sonntag-Gratistag in deinem Aufenthalt (04.07. ist nach der Abreise). Montag ist Ruhetag (Palazzo Rosso ausgenommen). Genova Museum Card (24 h 24 €, 48 h 45 €, seit 01.01.2026) lohnt bei 2-€-Tickets nicht."},{"titel":"Aquarium ohne Rabatt","text":"Das Acquario kennt nur Erwachsene (ab 26 €), Kinder 4–12 (16 €) und 65+/Militär/Behinderte (20 €) – keine Studierenden- oder unter-26-Ermäßigung. Online-„Fixed Date“-Ticket mit Zeitfenster ist das günstigste; „Flexi“ (1 Jahr gültig) kostet mehr. Kombi „Pianeta Acquario“ (Aquarium + Biosfera + Bigo) 37 €. Dafür ist alles andere im Porto Antico frei."},{"titel":"Rolli Days 2027","text":"An den Rolli Days öffnen die UNESCO-Paläste der Via Garibaldi/Via Balbi kostenlos (Reservierung nötig). 2026 fanden sie 27.–29.03. und 16.–18.10. statt; 2027er Termine sind noch nicht veröffentlicht – Frühjahr und Herbst sind das Muster, deine Woche Ende Juni ist unwahrscheinlich. Vor der Reise auf visitgenoa.it prüfen."},{"titel":"AMT: Aufzüge und Zahnradbahnen sind ÖPNV","text":"Einzelticket 2,00 € (110 min, Bus, Metro, alle Standseilbahnen inkl. Zecca–Righi, alle Aufzüge). 2,20 € integriert mit Trenitalia-Regionalzügen im Stadtgebiet (Nervi–Voltri) – damit kommst du nach Nervi. Einzelfahrt nur Aufzug/Funicolare Sant'Anna 1,20 €, 4-Fahrten-Ticket dafür 4 €. 5-Stunden-Ticket 5 €. MetDaily 24 h 10 € (1 Person) bzw. 24 € für 3 Personen; online auch 3 Tage für 24 €. Carnet 11 Fahrten 20 €. Kauf: App AMT, Tabacchi, Automaten in der Metro. Genua ist Hang – Aufzüge Castelletto (ab Piazza Portello), Montegalletto (ab Via Balbi, zum Castello d'Albertis) und die Zecca–Righi-Bahn nutzen."},{"titel":"Riviera-Ausflüge mit Interrail","text":"Regionalzüge sind im Interrail-Pass drin, ohne Reservierung: Genova Brignole → Camogli ca. 30 min, → Monterosso (Cinque Terre) ca. 1:30 h. Für die Cinque Terre brauchst du mit Interrail KEINE Treno Card; nur die Küstenwanderwege (Monterosso–Vernazza–Corniglia, Via dell'Amore) kosten die Trekking Card: 10 €/Tag, an Spitzentagen 15 € (2026). Ohne Pass kostet ein Zug zwischen den fünf Dörfern 5/8/10 € je nach Tag. Billiger und leerer: Camogli → Boot nach San Fruttuoso (11 € einfach, 17 € hin/zurück) oder zu Fuß hin (2,5 h) und per Boot zurück."},{"titel":"Essen","text":"Focaccia genovese gibt es ab 7 Uhr in jeder Bäckerei, ein Stück ca. 1,50–3 €, die Genueser tunken sie in den Cappuccino. Farinata (Kichererbsen-Fladen aus dem Holzofen) ab mittags in den Sciamadde für 3–4 €. Pesto, Trofie, Pansoti mit Walnusssoße. Trinkgeld nicht erwartet, Coperto 2–3 €."},{"titel":"Sicherheit und Gelände","text":"Die Caruggi sind tagsüber unproblematisch; nachts die Via Prè, Via della Maddalena und die Gassen hinter dem Hafen meiden. Steile Treppen überall – Turnschuhe. Leitungswasser ist trinkbar, Karte fast überall akzeptiert."}],"spots":[{"id":"san-lorenzo","name":"Cattedrale di San Lorenzo + Museo del Tesoro","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Schwarz-weiß gestreifter Dom mit Blindgänger im Schiff und dem „Heiligen Gral“ im Keller","beschreibung":"Die Kathedrale (12.–14. Jh.) im Zebra-Marmor der Genueser Gotik, mit dem steinernen Löwenpaar an der Treppe und im rechten Seitenschiff der britischen Granate von 1941, die einschlug und nicht explodierte. Im Museo del Tesoro unter dem Dom (Franco Albini, 1956): der Sacro Catino, eine grüne Glasschale, die man im Mittelalter für den Gral hielt, und die Aschenurne Johannes des Täufers.","lat":44.4078,"lon":8.9314,"adresse":"Piazza San Lorenzo, 16123 Genova","dauer_min":60,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Kathedrale frei. Museo del Tesoro kostenpflichtig (Preis auf den offiziellen Seiten nicht abrufbar; früher 6 €, 18–25 vermutlich 2 € nach städtischer Regel – an der Kasse fragen)."},"kostenlos":{"immer":false,"regeln":["Kathedrale immer frei"],"termine_im_aufenthalt":[],"hinweis":"Frei gilt für die Kirche, nicht fürs Schatzmuseum."},"oeffnungszeiten":"Dom tägl. ca. 8–12 und 15–19; Tesoro Mo–Sa ca. 9–12 und 15–18 (vor Ort prüfen)","ruhetag":"Sonntag (Tesoro)","reservierung":"nein","tipp":"Treppe vor dem Dom ist abends Treffpunkt – Focaccia vom Panificio um die Ecke und zuschauen. Hinter dem Dom beginnt die Via San Lorenzo Richtung Hafen.","link":"https://www.museidigenova.it/","quelle":"https://www.visitgenoa.it/en/museo-del-tesoro-della-cattedrale-di-san-lorenzo","preisstand":"2026","unsicher":true,"quelle_hinweis":"Tesoro-Preis und -Zeiten nicht offiziell verifiziert (Seite 404).","teilfrei":true,"dist_km":0.1},{"id":"caruggi","name":"Caruggi – die Altstadt (Via San Luca, Piazza Banchi, Via del Campo)","kategorie":"viertel","muss":3,"kurz":"Europas größte mittelalterliche Altstadt: Gassen, in die kein Tageslicht fällt","beschreibung":"Zwischen Hafen und Via Garibaldi liegt ein Labyrinth aus Gassen (caruggi), manche kaum einen Meter breit, mit Marmorportalen, Madonnen an den Ecken, Gewürzläden, Tripperie, Friseuren und Bars, die seit 1900 nicht renoviert wurden. Via San Luca und Piazza Banchi (Loggia dei Mercanti) sind die Hauptachse, Via del Campo die Straße aus De Andrés Lied (Nr. 29 rosso: kleines Museum). Verlaufen gehört dazu.","lat":44.4102,"lon":8.9296,"adresse":"Piazza Banchi, 16123 Genova","dauer_min":150,"preis":{"erwachsene":0,"ermaessigt":0,"unter26":0,"waehrung":"EUR","eur":0,"hinweis":"Frei. Via del Campo 29 rosso (De-André-Museum) kleiner Eintritt, nicht verifiziert."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-28","2027-06-29","2027-06-30","2027-07-01","2027-07-02","2027-07-03"],"hinweis":null},"oeffnungszeiten":"immer; Läden ca. 9–13 und 15:30–19:30","ruhetag":null,"reservierung":"nein","tipp":"Vormittags gehen, wenn die Läden offen sind. Piazza delle Erbe und Piazza Lavagna abends für den Aperitivo; Via Prè und Via della Maddalena nach Einbruch der Dunkelheit meiden.","link":"https://www.visitgenoa.it/en","quelle":"https://www.visitgenoa.it/en","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.2},{"id":"focaccia-farinata","name":"Focaccia + Farinata: Antica Sciamadda, Panificio Mario","kategorie":"essen","muss":3,"kurz":"Das Frühstück der Genueser für 2 € und der Kichererbsenfladen aus dem Holzofen","beschreibung":"Focaccia genovese: fingerdick, ölig, mit Salzkruste und Grübchen, ab 7 Uhr warm aus den Bäckereien – klassisch in den Cappuccino getunkt. Panificio Mario (Via San Vincenzo 61r, nahe Brignole) gilt als eine der besten. Farinata gibt es ab mittags in den „Sciamadde“ – Antica Sciamadda (Via San Giorgio 14r, seit 1800er) backt sie in Kupferpfannen im Holzofen, dazu Torta di verdure und frittierte Sardellen. Stehimbiss, Zeitungspapier, bar bezahlen.","lat":44.407,"lon":8.9319,"adresse":"Antica Sciamadda, Via San Giorgio 14r, 16128 Genova","dauer_min":30,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Focaccia ca. 1,50–3 € pro Stück, Farinata ca. 3–4 € – Richtwerte, keine offiziellen Preise."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Bäckereien ab ca. 7 Uhr; Sciamadda Mo–Sa ca. 9–14 und 16–19 (So geschlossen, vor Ort prüfen)","ruhetag":"Sonntag (Sciamadda)","reservierung":"nein","tipp":"Farinata frisch aus dem Ofen gegen 12 oder 18 Uhr bestellen – aufgewärmt ist sie gummiartig. Focaccia col formaggio (Recco-Art, mit Stracchino) extra probieren, kostet ein paar Euro mehr.","link":"https://www.visitgenoa.it/en","quelle":"https://www.visitgenoa.it/en","preisstand":"2026","unsicher":true,"quelle_hinweis":"Preise und Zeiten geschätzt, keine offiziellen Seiten.","dist_km":0.2},{"id":"via-garibaldi-rolli","name":"Via Garibaldi + Musei di Strada Nuova (Palazzi dei Rolli)","kategorie":"museum","muss":3,"kurz":"Die Palaststraße der Bankiers – drei Paläste, ein Ticket, für dich 2 €","beschreibung":"Die Strada Nuova (1550–1583) ist eine 250 m lange Reihe von Adelspalästen, UNESCO-Welterbe als „Palazzi dei Rolli“: Herbergen, in denen die Republik Staatsgäste einquartierte. Drei davon sind Museen mit einem Ticket: Palazzo Rosso (Van Dyck, Dürer, Fresken, Dachterrasse mit Stadtblick), Palazzo Bianco (Caravaggio, Rubens, flämische Malerei) und Palazzo Tursi (Rathaus, Paganinis Geige „Il Cannone“). Die Straße selbst und die Innenhöfe sind frei.","lat":44.4118,"lon":8.9317,"adresse":"Via Garibaldi 9/11/18, 16124 Genova","dauer_min":150,"preis":{"erwachsene":14,"ermaessigt":9,"unter26":2,"waehrung":"EUR","eur":14,"hinweis":"Kumulativticket Strada Nuova + Museo di Sant'Agostino: 14 € / ermäßigt 9 € / 18–25 Jahre 2 €. Unter 18 frei. Online +1 € Vorverkauf."},"kostenlos":{"immer":false,"regeln":["Straße und Innenhöfe immer frei","Unter 18 frei","Rolli Days: alle Paläste frei (Termine 2027 offen)"],"termine_im_aufenthalt":[],"hinweis":"Innenhöfe und Via Garibaldi natürlich an allen Tagen frei; Museumseintritt nur mit 2-€-Ticket."},"oeffnungszeiten":"Sommer (bis 27.09.) tägl. 10–19, Mo nur Palazzo Rosso; letzter Einlass 1 h vorher","ruhetag":"Montag (Bianco und Tursi)","reservierung":"nein","tipp":"Erst Palazzo Rosso bis ganz oben auf die Dachterrasse (Aufzug), dann Bianco, dann Tursi – das Ticket gilt für alle drei am selben Tag. Am Ankunftsmontag ist nur der Rosso offen.","link":"https://www.museidigenova.it/it/musei-di-strada-nuova","quelle":"https://www.museidigenova.it/it/musei-di-strada-nuova","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.3},{"id":"aquarium","name":"Acquario di Genova (Porto Antico)","kategorie":"aktivitaet","muss":3,"kurz":"Europas zweitgrößtes Aquarium – teuer, aber das Wahrzeichen des neuen Hafens","beschreibung":"Renzo Pianos Hafenumbau von 1992 hat Genua den Porto Antico beschert; das Aquarium ist sein Herz: 70 Becken, Delfine, Haie, Pinguine, Seekühe, Quallenhalle, 2–3 Stunden Rundgang. Mit 26 € der teuerste Posten der Woche – entscheide bewusst. Der Porto Antico selbst (Promenade, Piazza delle Feste, Blick auf die Lanterna) ist frei und abends voller Leute.","lat":44.4102,"lon":8.9265,"adresse":"Ponte Spinola, 16128 Genova","dauer_min":150,"preis":{"erwachsene":26,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":26,"hinweis":"Ab 26 € online (Fixed Date mit Zeitfenster); Kinder 4–12 16 €; 65+/Militär/Behinderte 20 €. Keine Studierenden-/unter-26-Ermäßigung. Pianeta Acquario (Aquarium + Biosfera + Bigo) 37 €, Acquario Village (alles inkl. Città dei Bambini) 51 €."},"kostenlos":{"immer":false,"regeln":["Porto Antico (Außenbereich) immer frei"],"termine_im_aufenthalt":[],"hinweis":"Frei gilt nur für das Hafengelände, nicht fürs Aquarium."},"oeffnungszeiten":"tägl. 9–20 (Sommer teils ab 8:30), letzter Einlass 18:00","ruhetag":null,"reservierung":"nötig","tipp":"Zeitfenster 9 Uhr oder nach 16 Uhr online buchen – mittags Schulklassen und Kreuzfahrtgruppen. Wer nur einen der drei Bauten will: Bigo (Aussicht) ist mit 6 € das beste Preis-Erlebnis-Verhältnis.","link":"https://www.acquariodigenova.it/en/","quelle":"https://www.acquariodigenova.it/en/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"teilfrei":true,"dist_km":0.5},{"id":"spianata-castelletto","name":"Spianata Castelletto (Aufzug ab Piazza Portello)","kategorie":"aussicht","muss":3,"kurz":"Jugendstil-Aufzug für 1,20 € hoch zur Terrasse über den Altstadtdächern","beschreibung":"Der Ascensore Castelletto Levante (1909) fährt von der Piazza Portello in 30 Sekunden auf die Belvedere-Terrasse: Schieferdächer der Caruggi, Dom, Hafen, Lanterna, bei klarer Sicht die Alpen. Der Dichter Caproni wollte hier „in den Himmel fahren“. Bar mit Tischen am Geländer. Der Klassiker für den ersten Abend.","lat":44.4137,"lon":8.9327,"adresse":"Piazza Portello / Spianata Castelletto, 16124 Genova","dauer_min":45,"preis":{"erwachsene":1.2,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":1,"hinweis":"Aufzug: AMT-Einzelfahrt 1,20 € oder normales 110-min-Ticket 2,00 € (gilt auch); Terrasse frei. Zu Fuß über die Treppen ab Via Garibaldi ebenfalls möglich."},"kostenlos":{"immer":false,"regeln":["Terrasse immer frei; Aufzug ist ÖPNV"],"termine_im_aufenthalt":[],"hinweis":"Frei = Terrasse und Aufstieg zu Fuß."},"oeffnungszeiten":"Aufzug tägl. ca. 6:40–24; Terrasse immer","ruhetag":null,"reservierung":"nein","tipp":"Hoch mit dem Aufzug, runter zu Fuß über die Salita San Francesco direkt auf die Via Garibaldi (5 min). Gelato bei Don Paolo oben an der Spianata.","link":"https://www.amt.genova.it/amt/biglietti-e-abbonamenti-2/biglietti-e-carnet/","quelle":"https://www.amt.genova.it/amt/biglietti-e-abbonamenti-2/biglietti-e-carnet/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Betriebszeiten des Aufzugs nicht offiziell verifiziert; Ticketpreise offiziell (AMT).","teilfrei":true,"dist_km":0.5},{"id":"boccadasse","name":"Boccadasse","kategorie":"strand","muss":3,"kurz":"Fischerdorf mit Kieselbucht am Stadtrand – Gelato, Sonnenuntergang, Füße ins Wasser","beschreibung":"Pastellhäuser um eine winzige Bucht, Boote auf den Kieseln, Katzen, Gelaterie. Am Ende der Corso Italia, der 2,5 km langen Uferpromenade ab Foce. Baden geht (Kiesel, klares Wasser), Sonnenuntergang über dem Meer, danach Pizza oder Focaccia auf der Mauer. Der Ort, an dem die Genueser selbst sitzen.","lat":44.3907,"lon":8.9722,"adresse":"Via Boccadasse, 16146 Genova","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":0,"unter26":0,"waehrung":"EUR","eur":0,"hinweis":"Frei; Bus 2,00 € pro Richtung."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-28","2027-06-29","2027-06-30","2027-07-01","2027-07-02","2027-07-03"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Ab Brignole mit Bus Richtung Corso Italia (z. B. Linie 31) oder 45 min zu Fuß die Promenade entlang – auf dem Rückweg hält der Bus vor der Haustür. Badesachen mitnehmen, kein Strandbad-Eintritt nötig.","link":"https://www.visitgenoa.it/en","quelle":"https://www.visitgenoa.it/en","preisstand":"2026","unsicher":true,"quelle_hinweis":"Buslinie nicht offiziell geprüft.","dist_km":3.8},{"id":"camogli-san-fruttuoso-portofino","name":"Camogli → San Fruttuoso (Boot) → Portofino","kategorie":"tagesausflug","muss":3,"kurz":"Die günstige Riviera: Fischerort, Abtei in der Bucht, Promi-Hafen – Zug mit Interrail, Boot 17 €","beschreibung":"Camogli (Zug ab Brignole ca. 30 min, Interrail) ist Portofino ohne Preise: hohe bemalte Häuser am Kieselstrand, Focaccia-Bäckereien. Von hier fährt das Boot (Golfo Paradiso) in 30 min zur Abtei San Fruttuoso, die nur per Schiff oder zu Fuß erreichbar in einer Bucht liegt – baden, Kloster (FAI, Eintritt extra), Christus in der Tiefe. Weiter per Boot nach Portofino (Piazzetta, Castello Brown, Leuchtturm-Weg) und von dort Bus 782 nach Santa Margherita und Zug zurück.","lat":44.3162,"lon":9.1737,"adresse":"San Fruttuoso di Camogli, 16032 Camogli","dauer_min":540,"preis":{"erwachsene":17,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":17,"hinweis":"Boot Camogli–San Fruttuoso 11 € einfach / 17 € hin und zurück (Kinder 4–12 ermäßigt, keine Jugend-/Studierendenermäßigung). Camogli–Portofino 13 € einfach / 21 € hin und zurück. Zug Interrail. Abtei San Fruttuoso (FAI) separat kostenpflichtig (nicht verifiziert). Bus 782 Portofino–Santa Margherita: AMT-Sondertarif."},"kostenlos":{"immer":false,"regeln":["Camogli, Strände, Portofino-Ort und Wanderwege immer frei"],"termine_im_aufenthalt":[],"hinweis":"Frei = Orte, Wege, Baden; das Boot kostet."},"oeffnungszeiten":"Boote Camogli–San Fruttuoso im Sommer ca. stündlich 9–17, wetterabhängig","ruhetag":null,"reservierung":"empfohlen","tipp":"Sparvariante: Camogli → San Fruttuoso zu Fuß über den Monte di Portofino (2,5 h, markiert, Wasser mitnehmen), nur die Rückfahrt per Boot (11 €). Erste Fahrt nehmen – ab 11 Uhr ist die Bucht voll. Bei Seegang fällt das Boot aus – Plan B: Nervi.","link":"https://www.golfoparadiso.it/","quelle":"https://www.golfoparadiso.it/tariffe/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"teilfrei":true,"dist_km":21.8},{"id":"bigo-biosfera","name":"Bigo-Panoramalift + Biosfera","kategorie":"aussicht","muss":2,"kurz":"Renzo Pianos Hafenkran als Aussichtskabine, daneben die Glaskugel mit Regenwald","beschreibung":"Der Bigo ist dem alten Ladekran nachempfunden: Eine runde Kabine dreht sich in 40 m Höhe einmal um die Achse – Blick über Hafen, Altstadt-Dächer und auf die Lanterna, mit Audio. Die Biosfera ist eine Glaskugel im Wasser mit tropischen Pflanzen, Papageien und Schmetterlingen, 15 Minuten. Beides zusammen 12 €, beides zusammen unnötig – Bigo reicht.","lat":44.41,"lon":8.9287,"adresse":"Calata Cattaneo / Ponte Spinola, 16128 Genova","dauer_min":40,"preis":{"erwachsene":6,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":6,"hinweis":"Bigo 6 €, Biosfera 6 € (Erwachsene); keine Jugendermäßigung ausgewiesen. In den Aquarium-Kombitickets enthalten."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Sommer ca. 10–20; genaue Zeiten auf acquariodigenova.it","ruhetag":null,"reservierung":"nein","tipp":"Bigo kurz vor Sonnenuntergang – die Lanterna liegt dann im Gegenlicht über dem Hafen. Bei Wind bleibt er stehen.","link":"https://www.acquariodigenova.it/en/","quelle":"https://www.acquariodigenova.it/en/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Öffnungszeiten von Bigo/Biosfera nicht von der offiziellen Seite abrufbar.","dist_km":0.3},{"id":"galata","name":"Galata Museo del Mare + U-Boot Nazario Sauro","kategorie":"museum","muss":2,"kurz":"Italiens größtes Seefahrtsmuseum – mit begehbarem U-Boot im Hafenbecken","beschreibung":"Im alten Arsenal: eine rekonstruierte Genueser Galeere in Originalgröße, die Auswanderer-Ausstellung (Nachbau des Zwischendecks, Ellis-Island-Verhör), Kolumbus, Sturmsimulator. Draußen liegt das U-Boot S518 Nazario Sauro, das du komplett durchkletterst. Dachterrasse mit Hafenblick inklusive. 2–3 Stunden.","lat":44.4124,"lon":8.9245,"adresse":"Calata Ansaldo De Mari 1, 16126 Genova","dauer_min":150,"preis":{"erwachsene":17,"ermaessigt":12,"unter26":null,"waehrung":"EUR","eur":17,"hinweis":"Tagesticket laut Presse 2026: 17 € / ermäßigt 12 € (inkl. U-Boot); der offizielle Webshop zeigt nur den „Open Pass“ (19 €/14 €, 6 Monate gültig). Ob die städtische 18–25-Regel (2 €) hier gilt, konnte nicht verifiziert werden – an der Kasse mit Ausweis fragen."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Juni/Juli tägl. 10–19 (Kasse bis 18), im Juni montags evtl. geschlossen","ruhetag":"Montag (außer Hochsommer) – vor Ort prüfen","reservierung":"nein","tipp":"U-Boot nicht mit Rucksack – Schließfächer am Eingang. Vom Dach aus das Foto auf den Porto Antico mit Bigo machen, dann zu Fuß über die Via di Prè (tagsüber) in die Altstadt.","link":"https://www.galatamuseodelmare.it/","quelle":"https://www.galatamuseodelmare.it/ticket?productId=10229245402955","preisstand":"2026","unsicher":true,"quelle_hinweis":"Regulärer Tagespreis nicht auf der offiziellen Seite lesbar (nur Open Pass); 17/12 € aus Lokalpresse 2026.","dist_km":0.7},{"id":"castello-dalbertis","name":"Castello d'Albertis – Museo delle Culture del Mondo","kategorie":"museum","muss":2,"kurz":"Neogotische Kapitänsburg über der Stadt, per Aufzug erreichbar – 2 € für dich","beschreibung":"Kapitän Enrico d'Albertis, Weltumsegler, baute sich 1886–92 auf einer alten Bastion ein Schloss mit Türmen, Sonnenuhren und Souvenirs aus aller Welt: Kanus, Masken, Waffen, die Kajüte seiner Yacht, ein kolumbianisches Zimmer. Dazu die Terrassen mit dem besten Hafenblick der Stadt. Von der Via Balbi (Bahnhof Principe) bringt dich der Ascensore Montegalletto (AMT) direkt in den Garten.","lat":44.4163,"lon":8.9237,"adresse":"Corso Dogali 18, 16136 Genova","dauer_min":90,"preis":{"erwachsene":9,"ermaessigt":6,"unter26":2,"waehrung":"EUR","eur":9,"hinweis":"9 € / ermäßigt 6 € / 18–25 Jahre 2 €; unter 18 frei. Aufzug Montegalletto: AMT 1,20 € oder 2,00-€-Ticket."},"kostenlos":{"immer":false,"regeln":["Unter 18 frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Apr–10. Sep Di–So 10–19, Do bis 22","ruhetag":"Montag","reservierung":"nein","tipp":"Donnerstagabend (bis 22 Uhr) kommen: Stadt im Abendlicht von den Terrassen, kaum Besucher. Der Aufzug fährt horizontal durch den Berg und dann senkrecht hoch – ein Erlebnis für 1,20 €.","link":"https://www.museidigenova.it/it/castello-dalbertis-museo-delle-culture-del-mondo","quelle":"https://www.museidigenova.it/it/castello-dalbertis-museo-delle-culture-del-mondo","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.0},{"id":"zecca-righi","name":"Zahnradbahn Zecca–Righi + Forts","kategorie":"aussicht","muss":2,"kurz":"Mit dem 2-€-ÖPNV-Ticket auf 300 m – Blick über Stadt und Meer, Wanderweg zu den Festungen","beschreibung":"Die Funicolare startet am Largo della Zecca (Altstadtrand) und klettert in 15 Minuten durch Tunnel und Gärten zum Righi. Oben: Terrasse über ganz Genua, Hafen bis Portofino, und der Einstieg in den Parco delle Mura mit den Forts Castellaccio, Sperone und Diamante (Rundweg 2–3 h, frei). Für die Genueser der Sonntagsausflug, für dich der günstigste Aussichtspunkt der Reise.","lat":44.4253,"lon":8.9362,"adresse":"Largo della Zecca (Talstation) / Via del Righi (Bergstation), Genova","dauer_min":120,"preis":{"erwachsene":2,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":2,"hinweis":"Normales AMT-Ticket 2,00 € (110 min, Zecca–Righi inbegriffen); Rückfahrt innerhalb 110 min im selben Ticket. Aussicht und Forts frei."},"kostenlos":{"immer":false,"regeln":["Aussicht und Festungswege immer frei; Bahn ist ÖPNV"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Bahn tägl. ca. 6:40–24, alle 15–20 min","ruhetag":null,"reservierung":"nein","tipp":"Spätnachmittag hoch, bis Forte Sperone laufen (40 min, Blick aufs Meer), zum Sonnenuntergang zurück am Righi, dann mit der Bahn runter – das Ticket im AMT-App erst beim Einsteigen aktivieren.","link":"https://www.amt.genova.it/amt/biglietti-e-abbonamenti-2/biglietti-e-carnet/","quelle":"https://www.amt.genova.it/amt/biglietti-e-abbonamenti-2/biglietti-e-carnet/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Betriebszeiten der Bahn nicht offiziell geprüft; Ticketpreis offiziell.","teilfrei":true,"dist_km":1.8},{"id":"staglieno","name":"Cimitero Monumentale di Staglieno","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Der Friedhof als Skulpturenmuseum des 19. Jh. – frei, Bus, halber Tag","beschreibung":"Einer der größten und kunsthistorisch wichtigsten Friedhöfe Europas (ab 1851): Arkadengänge voller realistischer Marmorfiguren der Genueser Bürgerfamilien – trauernde Witwen in Spitzenkleidern, Kinder, Engel, die Nussverkäuferin Caterina Campodonico, die ihr Grabmal selbst finanzierte. Dazu das Grab Mazzinis und Constance Lloyd (Oscar Wildes Frau). Hügelig, schattig, kaum Touristen.","lat":44.4223,"lon":8.9504,"adresse":"Piazzale Resasco, 16137 Genova","dauer_min":150,"preis":{"erwachsene":0,"ermaessigt":0,"unter26":0,"waehrung":"EUR","eur":0,"hinweis":"Eintritt frei; Bus 2,00 €."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-28","2027-06-29","2027-06-30","2027-07-01","2027-07-02","2027-07-03"],"hinweis":null},"oeffnungszeiten":"tägl. ca. 7:30–17 (letzter Einlass 16:30), nicht offiziell verifiziert","ruhetag":null,"reservierung":"nein","tipp":"Bus 34 ab Stazione Principe/Via Balbi fährt bis vor das Tor (ca. 20 min). Plan am Eingang mitnehmen – ohne verliert man sich; die Porticato Inferiore und das Pantheon sind der Kern.","link":"https://www.staglieno.comune.genova.it/","quelle":"https://www.staglieno.comune.genova.it/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Seite nicht erreichbar; Zeiten und Buslinie aus Erfahrungswerten.","dist_km":2.1},{"id":"lanterna","name":"Lanterna di Genova","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Der höchste Leuchtturm des Mittelmeers (77 m, seit 1543) – 172 Stufen zur Terrasse","beschreibung":"Wahrzeichen der Stadt am westlichen Hafenrand, Symbol auf jedem Genua-Logo. Ein 800 m langer Fußweg an den alten Mauern entlang führt vom Terminal-Traghetti-Parkplatz hin, dazu ein kleines Museum in den Festungsräumen und der Aufstieg bis zur ersten Terrasse (172 Stufen) mit Blick auf Hafen, Werften und Stadt. Für 2 € mit Turm das beste Jugendticket der Stadt.","lat":44.4053,"lon":8.9044,"adresse":"Rampa della Lanterna, 16126 Genova","dauer_min":90,"preis":{"erwachsene":9,"ermaessigt":8,"unter26":2,"waehrung":"EUR","eur":9,"hinweis":"Park + Museum 6 € (erm. 5 €); Park + Museum + Leuchtturm 9 € (erm. 8 €); 18–26 Jahre 2 € inkl. Leuchtturm; unter 18 frei. Online +1 € Vorverkauf."},"kostenlos":{"immer":false,"regeln":["Unter 18 frei (inkl. Turm)"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Fr, Sa, So 10–18 (letzter Einlass 17:00), Stand 06/2026","ruhetag":"Montag bis Donnerstag","reservierung":"nein","tipp":"In deiner Woche nur Fr 02.07. und Sa 03.07. offen – also Freitag einplanen. Wegen Tunnelbauarbeiten ging der Zugang zuletzt per Shuttle ab Piazzale San Benigno (alle 20 min) – auf lanternadigenova.com prüfen. Metro bis Dinegro.","link":"https://www.lanternadigenova.com/","quelle":"https://www.museidigenova.it/it/complesso-monumentale-della-lanterna","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.2},{"id":"nervi","name":"Nervi: Passeggiata Anita Garibaldi + Parchi","kategorie":"natur","muss":2,"kurz":"2 km Klippenpromenade über dem Meer, Villenparks, Zug 15 Minuten","beschreibung":"Der östlichste Stadtteil Genuas, mit dem Regionalzug ab Brignole in 15 Minuten erreichbar. Die Passeggiata Anita Garibaldi klebt an den Felsen zwischen Hafen und Capolungo, darüber die zusammenhängenden Parks dreier Villen (Rosengarten, Palmen, Blick) und die Musei di Nervi (GAM, Wolfsoniana, Raccolte Frugone – städtisch, 18–25 2 €). Ideal für einen halben Tag, mit Boccadasse kombinierbar.","lat":44.3823,"lon":9.0399,"adresse":"Passeggiata Anita Garibaldi, 16167 Genova Nervi","dauer_min":180,"preis":{"erwachsene":0,"ermaessigt":0,"unter26":0,"waehrung":"EUR","eur":0,"hinweis":"Promenade und Parks frei. Zug: Interrail gilt (Regionale), ohne Pass AMT-Trenitalia-Integrationsticket 2,20 €. Museen separat (18–25: 2 €)."},"kostenlos":{"immer":true,"regeln":["Promenade und Parks immer frei"],"termine_im_aufenthalt":["2027-06-28","2027-06-29","2027-06-30","2027-07-01","2027-07-02","2027-07-03"],"hinweis":null},"oeffnungszeiten":"Promenade immer; Parks ca. 8–20 im Sommer","ruhetag":null,"reservierung":"nein","tipp":"Vom Bahnhof Nervi direkt runter zur Promenade, bis Capolungo laufen, dort baden (Felsen), zurück durch die Parks. Abends weiter mit dem Zug nach Camogli (10 min) – oder Nervi als Startpunkt für den Riviera-Tag nehmen.","link":"https://www.visitgenoa.it/en","quelle":"https://www.amt.genova.it/amt/biglietti-e-abbonamenti-2/biglietti-e-carnet/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":9.1},{"id":"cinque-terre","name":"Cinque Terre (Tagesausflug mit Interrail)","kategorie":"tagesausflug","muss":2,"kurz":"Fünf Dörfer an der Steilküste – Zug kostenlos mit dem Pass, Wanderwege 10–15 €","beschreibung":"Monterosso, Vernazza, Corniglia, Manarola, Riomaggiore: Regionalzug ab Genova Brignole ca. 1:30 h bis Monterosso (Interrail, keine Reservierung), zwischen den Dörfern 3–5 Minuten pro Hop. Der Küstenweg Monterosso–Vernazza–Corniglia (je ca. 1,5–2 h, steil, grandios) kostet die Trekking Card; die Dörfer, Strände und die hochgelegenen Wege (z. B. Santuari-Weg) sind frei. Erwarte Massen – Ende Juni ist Hochsaison.","lat":44.1463,"lon":9.6539,"adresse":"Monterosso al Mare (SP)","dauer_min":600,"preis":{"erwachsene":10,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":10,"hinweis":"Cinque Terre Trekking Card 1 Tag 10 €, an Spitzentagen (Wochenenden/Feiertage Apr–Aug) 15 €; 2 Tage 17 €/26,70 € (2026). Treno-Card (22/29,50/35 € je nach Tag) brauchst du mit Interrail NICHT. Ohne Pass: Einzelfahrt zwischen den Dörfern 5/8/10 € je nach Tagesklasse. Keine Studierendenermäßigung."},"kostenlos":{"immer":false,"regeln":["Dörfer, Strände und die oberen Wanderwege immer frei; nur der untere Küstenweg (Sentiero Azzurro) kostet"],"termine_im_aufenthalt":[],"hinweis":"Frei = ohne Küstenweg."},"oeffnungszeiten":"Züge ca. 5–24; Wege bei Regen gesperrt","ruhetag":null,"reservierung":"nein","tipp":"Wochentag wählen (Di–Do, Trekking Card 10 € statt 15 €), um 7 Uhr ab Genua, zuerst den Weg Monterosso→Vernazza, bevor es heiß wird; Corniglia zum Mittag (382 Stufen vom Bahnhof), Manarola zum Sonnenuntergang, zurück ab Riomaggiore. Regionale Züge der Linie La Spezia–Levanto sind brechend voll – nicht die letzte Verbindung nehmen.","link":"https://www.parconazionale5terre.it/","quelle":"https://www.trenitalia.com/it/regionale/collegamenti-regionale/cinque-terre-in-treno.html","preisstand":"2026","unsicher":true,"quelle_hinweis":"Card-Preise 2026 aus lecinqueterre.org (Zweitquelle; offizielle Card-Seite zeigt Preise nur im Shop); Einzelfahrpreise offiziell von Trenitalia. 2027-Preise noch nicht veröffentlicht.","teilfrei":true,"dist_km":64.5},{"id":"palazzo-ducale","name":"Palazzo Ducale","kategorie":"museum","muss":1,"kurz":"Dogenpalast der Republik – heute Ausstellungshaus, Innenhöfe frei","beschreibung":"Zwischen Piazza De Ferrari und Piazza Matteotti: der Sitz der Dogen, mit zwei Innenhöfen, Treppenhäusern und dem Turm, in dem Paganini einsaß (Turmzellen besichtigbar). Programm: zwei bis drei große Wechselausstellungen pro Jahr (Herbst 2026–Mai 2027: Renoir bis Cézanne). Was im Juni/Juli 2027 läuft, steht noch nicht fest – vorher ins Programm schauen.","lat":44.4076,"lon":8.9336,"adresse":"Piazza Matteotti 9, 16123 Genova","dauer_min":90,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Innenhöfe und Durchgänge frei. Ausstellungspreise je nach Schau (meist 10–15 €, ermäßigt für unter 26/Studierende) – Programm 2027 noch offen."},"kostenlos":{"immer":false,"regeln":["Innenhöfe immer frei"],"termine_im_aufenthalt":[],"hinweis":"Frei nur Höfe und Loggia, nicht die Ausstellungen."},"oeffnungszeiten":"Ausstellungen meist Di–So 10–19, Höfe tägl.","ruhetag":"Montag (Ausstellungen)","reservierung":"nein","tipp":"Durch den Palazzo hindurch ist die Abkürzung von De Ferrari zum Dom. Die Turmzellen (Torre Grimaldina) mit Gefangenen-Graffiti sind der eigentlich spannende Teil – nach Führungen fragen.","link":"https://palazzoducale.genova.it/","quelle":"https://palazzoducale.genova.it/calendario-eventi/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Keine Ausstellung für Juni/Juli 2027 angekündigt; Preise nicht bestimmbar.","teilfrei":true,"dist_km":0.2},{"id":"casa-colombo","name":"Casa di Colombo + Porta Soprana","kategorie":"sehenswuerdigkeit","muss":1,"kurz":"Kolumbus' angebliches Elternhaus unter den Türmen des Stadttors von 1155","beschreibung":"Die Porta Soprana mit ihren beiden Zinnentürmen war das Haupttor der Stadtmauer von 1155; davor ein efeuüberwachsenes Häuschen, laut Inschrift das Jugendhaus von Christoph Kolumbus (eine Rekonstruktion aus dem 18. Jh. – Genua bleibt dabei, Spanien zweifelt). Innen zwei Räume, von außen in fünf Minuten erledigt. Daneben der Kreuzgang Sant'Andrea.","lat":44.4065,"lon":8.9346,"adresse":"Piazza Dante / Via di Porta Soprana, 16121 Genova","dauer_min":30,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Außenansicht frei. Eintritt Haus/Türme kostenpflichtig (städtisches Museum – Preis auf der offiziellen Seite nicht ausgewiesen; 18–25 vermutlich 2 €)."},"kostenlos":{"immer":false,"regeln":["Außenansicht und Kreuzgang Sant'Andrea immer frei"],"termine_im_aufenthalt":[],"hinweis":"Frei = von außen."},"oeffnungszeiten":"ca. 10–18, Mo geschlossen (vor Ort prüfen)","ruhetag":"Montag","reservierung":"nein","tipp":"Von hier zu Fuß in die Caruggi starten: Via Ravecca → Piazza Sarzano → Museo di Sant'Agostino (im Strada-Nuova-Ticket enthalten).","link":"https://www.museidigenova.it/it/casa-di-colombo","quelle":"https://www.museidigenova.it/it/casa-di-colombo","preisstand":"2026","unsicher":true,"quelle_hinweis":"Preis und Zeiten nicht auf der offiziellen Seite.","teilfrei":true,"dist_km":0.3}],"tage":[{"datum":"2027-06-28","titel":"Dom, Caruggi, Aufzug zur Spianata","intro":"Ankunft aus Prato am frühen Nachmittag, die Wohnung liegt im Centro Storico. Montag sind die Museen zu (nur Palazzo Rosso offen), also heute das, was immer geht: der gestreifte Dom mit dem Blindgänger, dann treiben lassen in den Caruggi, solange die Läden offen sind, Aperitivo auf der Piazza delle Erbe. Zum Sonnenuntergang mit dem Jugendstil-Aufzug auf die Spianata Castelletto – der Klassiker für den ersten Abend. Aquarium-Zeitfenster für Donnerstag heute buchen.","programm":[{"spot":null,"zeit":"14:00","titel":"Einchecken im Centro Storico","notiz":"Nähe Piazza De Ferrari/San Lorenzo. Turnschuhe raus – Genua ist Hang und Treppe."},{"spot":"san-lorenzo","zeit":"15:30","notiz":"Dom ab 15 Uhr offen, frei: Löwen an der Treppe, die britische Granate von 1941 im rechten Seitenschiff. Museo del Tesoro darunter (Mo–Sa 15–18): Sacro Catino, Preis an der Kasse erfragen, 18–25 vermutlich 2 €."},{"spot":"caruggi","zeit":"16:45","notiz":"Hinter dem Dom die Via San Lorenzo Richtung Hafen, dann Piazza Banchi, Via San Luca, Via del Campo (Nr. 29 rosso, De André). Läden bis 19:30. Aperitivo auf der Piazza delle Erbe oder Piazza Lavagna; Via Prè und Via della Maddalena nach Einbruch der Dunkelheit meiden."},{"spot":"spianata-castelletto","zeit":"20:00","notiz":"Ascensore Castelletto Levante ab Piazza Portello, 1,20 € (AMT-Ticket 2 € gilt auch). Terrasse über den Schieferdächern, Sonnenuntergang gegen 21:10, Gelato bei Don Paolo. Runter zu Fuß über die Salita San Francesco auf die Via Garibaldi."}]},{"datum":"2027-06-29","titel":"Rolli-Paläste, Staglieno, Righi am Abend","intro":"Der Tag oben in der Stadt. Vormittags die drei Paläste der Strada Nuova mit einem 2-€-Ticket (Rosso bis auf die Dachterrasse, dann Bianco und Tursi mit Paganinis Geige), nachmittags mit Bus 34 zum Monumentalfriedhof Staglieno – schattig, hügelig, kaum Touristen, letzter Einlass 16:30. Abends mit der Zahnradbahn zum Righi und bis Forte Sperone, Sonnenuntergang auf der Terrasse, alles im 2-€-ÖPNV-Ticket.","programm":[{"spot":"via-garibaldi-rolli","zeit":"10:00","notiz":"Kumulativticket 2 € mit Ausweis (gilt auch für Sant'Agostino). Reihenfolge: Palazzo Rosso mit dem Aufzug auf die Dachterrasse, Palazzo Bianco (Caravaggio, Rubens), Palazzo Tursi (Il Cannone). Letzter Einlass eine Stunde vor Schluss."},{"spot":null,"zeit":"12:45","titel":"Mittag in den Caruggi","notiz":"Trofie al pesto oder Pansoti mit Walnusssoße, Coperto 2–3 €. Wasser aus der Leitung ist trinkbar."},{"spot":"staglieno","zeit":"14:00","notiz":"Bus 34 ab Via Balbi/Stazione Principe bis vors Tor, ca. 20 min, 2 €. Plan am Eingang mitnehmen: Porticato Inferiore und Pantheon sind der Kern, dazu die Nussverkäuferin Caterina Campodonico und Mazzinis Grab. Letzter Einlass 16:30."},{"spot":"zecca-righi","zeit":"18:30","notiz":"Funicolare ab Largo della Zecca, 15 min hoch, AMT-Ticket 2 € – in der App erst beim Einsteigen aktivieren, Rückfahrt innerhalb 110 min im selben Ticket. Bis Forte Sperone laufen (40 min, Blick aufs Meer), zum Sonnenuntergang zurück am Righi, dann runter."}]},{"datum":"2027-06-30","titel":"Camogli, San Fruttuoso, Portofino","intro":"Der Riviera-Tag, unter der Woche leerer. Zug nach Camogli mit Interrail, das erste Boot um 9 in die Bucht von San Fruttuoso – ab 11 ist sie voll. Baden, die Abtei, weiter per Boot nach Portofino, von dort Bus nach Santa Margherita und Zug zurück. Bei Seegang fällt das Boot aus: dann die Sparvariante zu Fuß über den Monte di Portofino oder Tausch mit dem Nervi-Tag am Freitag. Badesachen, Wasser, Bargeld fürs Boot.","programm":[{"spot":null,"zeit":"07:45","titel":"Zug Brignole → Camogli","notiz":"Regionale, ca. 30 min, Interrail ohne Reservierung. In Camogli Focaccia aus einer der Bäckereien am Hafen als Frühstück."},{"spot":"camogli-san-fruttuoso-portofino","zeit":"08:30","notiz":"Hohe bemalte Häuser am Kieselstrand, dann 9 Uhr das erste Boot der Golfo Paradiso nach San Fruttuoso (11 € einfach, 17 € hin und zurück). Baden in der Bucht, Abtei (FAI, Eintritt extra), Christus in der Tiefe. Sparvariante: hin zu Fuß über den Monte di Portofino (2,5 h, markiert, Wasser mitnehmen), nur zurück per Boot."},{"spot":null,"zeit":"13:00","titel":"Boot nach Portofino","notiz":"Piazzetta, Weg zum Leuchtturm, Castello Brown von außen – schauen, nicht konsumieren, hier kostet alles."},{"spot":null,"zeit":"16:00","titel":"Bus 782 nach Santa Margherita, Zug nach Brignole","notiz":"AMT-Sondertarif im Bus, dann Regionale zurück. Abends Reste-Essen zu Hause, morgen wird es wieder lang."}]},{"datum":"2027-07-01","titel":"Porto Antico: Aquarium, Galata, Bigo, Albertis","intro":"Der Hafentag. Aquarium im 9-Uhr-Fenster (26 €, kein Rabatt – bewusst entscheiden, der Porto Antico drumherum ist frei), dann Galata mit dem U-Boot. Siesta in der Wohnung, abends Bigo im Abendlicht und zum Schluss das Castello d'Albertis: donnerstags bis 22 Uhr, Terrassen über dem Hafen, kaum Besucher, 2 € für dich. Aquarium vorher online buchen.","programm":[{"spot":"aquarium","zeit":"09:00","notiz":"Vorher buchen: Fixed-Date-Ticket mit Zeitfenster 9 Uhr, ab 26 €, keine Ermäßigung. 70 Becken, Delfine, Quallenhalle, 2–3 Stunden. Wenn dir 26 € zu viel sind: auslassen, Bigo heute Abend reicht als Hafen-Erlebnis."},{"spot":"galata","zeit":"12:00","notiz":"Calata Ansaldo De Mari, 10–19. Tagesticket laut Presse 17 €/12 € ermäßigt – mit Ausweis an der Kasse fragen, ob die 2-€-Regel gilt. Rucksack ins Schließfach, dann die Galeere, das Auswanderer-Zwischendeck und das U-Boot Nazario Sauro. Vom Dach das Foto auf den Porto Antico."},{"spot":null,"zeit":"14:30","titel":"Mittag am Hafen, dann Siesta","notiz":"Farinata oder Focaccia col formaggio in einer Sciamadda, danach nach Hause in den Schatten – die Wohnung ist 10 min entfernt."},{"spot":"bigo-biosfera","zeit":"18:15","notiz":"Nur den Bigo (6 €), die Biosfera ist unnötig. Kabine dreht sich in 40 m Höhe, Lanterna im Gegenlicht über dem Hafen. Bei Wind bleibt er stehen; Schluss gegen 20 Uhr."},{"spot":"castello-dalbertis","zeit":"19:30","notiz":"Ascensore Montegalletto ab Via Balbi (1,20 €): erst waagerecht durch den Berg, dann senkrecht in den Garten. Donnerstag bis 22 Uhr, 2 € mit Ausweis. Kapitän d'Albertis' Kanus, Masken, Schiffskajüte – und die Terrassen mit dem besten Hafenblick der Stadt im Abendlicht."}]},{"datum":"2027-07-02","titel":"Lanterna, Nervi, Boccadasse","intro":"Freitag ist der einzige Lanterna-Tag deiner Woche (nur Fr–So offen), also morgens zum Leuchtturm – 2 € inklusive Turm mit Ausweis. Nachmittags mit dem Regionalzug nach Nervi: Klippenpromenade, Baden an den Felsen, zurück durch die Villenparks. Abends Boccadasse, Sonnenuntergang über dem Meer, Pizza auf der Mauer. Badesachen und Handtuch den ganzen Tag dabei.","programm":[{"spot":"lanterna","zeit":"10:00","notiz":"Metro bis Dinegro; wegen Tunnelbau zuletzt Shuttle ab Piazzale San Benigno alle 20 min – auf lanternadigenova.com prüfen. 18–26 Jahre 2 € inklusive Turm, 172 Stufen zur Terrasse, Museum in den Festungsräumen. Letzter Einlass 17 Uhr, du bist um 11:30 durch."},{"spot":null,"zeit":"12:30","titel":"Mittag und Picknick-Einkauf","notiz":"Im Supermarkt Wasser und Picknick für Nervi, Mittag als Focaccia-Stück unterwegs."},{"spot":"nervi","zeit":"14:00","notiz":"Regionalzug ab Brignole 15 min, Interrail. Vom Bahnhof runter zur Passeggiata Anita Garibaldi, bis Capolungo laufen, dort baden an den Felsen, zurück durch die Parks der drei Villen. Musei di Nervi wären 2 €, heute nicht nötig."},{"spot":"boccadasse","zeit":"18:45","notiz":"Zug zurück nach Brignole, Bus Richtung Corso Italia (Linie 31) bis Boccadasse. Pastellhäuser um die Kieselbucht, noch einmal ins Wasser, Sonnenuntergang gegen 21:10, danach Pizza oder Focaccia auf der Mauer. Gelato zum Abschied; der Bus hält auf dem Rückweg vor der Haustür."}]},{"datum":"2027-07-03","titel":"Focaccia-Frühstück, Zug nach Lecco","intro":"Frühstück wie die Genueser: Focaccia in den Cappuccino getunkt, bei Panificio Mario nahe Brignole, von wo auch der Zug geht. Dann Richtung Mailand und Lecco, Ankunft Valmadrera am frühen Nachmittag. Verbindung vorher in der Interrail-App festlegen.","programm":[{"spot":"focaccia-farinata","zeit":"08:00","notiz":"Panificio Mario, Via San Vincenzo 61r, 5 min von Brignole. Ein Stück ca. 1,50–3 €, dazu Cappuccino an der Bar; ein zweites Stück als Zugproviant."},{"spot":null,"zeit":"09:15","titel":"Auschecken, Zug ab Brignole","notiz":"Über Milano nach Lecco und Valmadrera, Ankunft am Nachmittag."}]}],"naechte":5},{"id":"comer-see","name":"Comer See (Lecco)","land":"Italien","landcode":"IT","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-07-03","abreise":"2027-07-07","unterkunft":{"name":"Via Roma OttantaDue","ort":"Valmadrera","lat":45.8465,"lon":9.359,"hinweis":"Via Roma 82, Valmadrera – Westufer gegenüber Lecco. Bahnhof Valmadrera (Linie Lecco–Molteno–Como/Milano) ca. 10 min zu Fuß, Schiffsanleger Valmadrera am Lungolago."},"zentrum":{"lat":45.8536,"lon":9.3932},"intro":"Lecco ist die arbeitsame, unaufgeregte Seite des Comer Sees: Berge direkt hinter der Stadt, Promenade, ein Bahnhof, von dem du in 40–60 min in Mailand bist. Teile die vier Tage so auf: Sa Ankunft + Lungolago Lecco, So Mailand (erster Sonntag: Brera und Castello Sforzesco gratis), Mo Seetag mit Zug nach Varenna und Schiff nach Bellagio (Mailänder Museen sind montags zu), Di Berg oder Wasser direkt vor der Tür (San Pietro al Monte, Monte Barro, Kajak in Parè). Interrail gilt auf allen Trenord-Zügen, das Schiff zahlst du extra.","feiertage":[],"gut_zu_wissen":[{"titel":"Domenica al Museo 04.07.","text":"Am ersten Sonntag im Monat sind alle staatlichen Museen Italiens gratis – hier zählt die Pinacoteca di Brera (sonst 20 €, für dich unter 26 sonst 4 €) und das Cenacolo (nur mit Online-Gratisticket, die sind sofort weg). Die Mailänder Stadtmuseen im Castello Sforzesco sind am ersten Sonntag ebenfalls frei. Villen am See (Carlotta, Balbianello, Monastero) sind privat/FAI/Provinz – kein Gratistag."},{"titel":"Unter 26 in Italien","text":"Staatliche Museen: 18–25 aus der EU zahlen 2 € statt Vollpreis (Cenacolo), Brera nimmt 4 €. Private Villen haben eigene Studierenden-Tarife bis 25 Jahre (Carlotta 12 €, Balbianello 11 €, Monastero 9 €) – Studentenausweis plus Ausweis mitnehmen, sonst Vollpreis."},{"titel":"Zug (Trenord) + Interrail","text":"Interrail gilt auf dem ganzen Trenord-Netz (Ausnahme nur Malpensa Express). Lecco–Milano Centrale ~40–60 min, Lecco–Varenna-Esino 20 min, Lecco–Como Lago ~1 h (über Molteno, stündlich). Die Interrail-App zeigt Lecco–Piona manchmal als 'nicht im Netz' – das ist ein App-Fehler, zur Sicherheit kostet Lecco–Varenna ohne Pass ca. 3 €, Lecco–Milano ca. 5,20 € (Omio-Angabe, nicht Trenord-Seite). Bahnhof Valmadrera liegt an der Linie Lecco–Como, Züge nach Milano fahren ab Lecco."},{"titel":"Schiff (Navigazione Laghi)","text":"Preise nach Tarifzonen (Tratte 1–8): einfache Fahrt 3,00 € (1 Zone) bis 14,50 € (8 Zonen), Rückfahrt = doppelt, Tageskarte 'libera circolazione' 8,00 € (1 Zone) bis 32,00 € (8 Zonen). Keine Ermäßigung unter 26, nur Kinder 4–11 und über 65 (Mo–Fr). Lecco–Bellagio (Sommerlinie 01.07.–04.10., 7 Fahrten/Tag ab Lecco 8:25–18:45, hält in Valmadrera 7 min später, 2 h 20 bis Bellagio) liegt bei ca. 9,50–12 € einfach – Zone am Schalter prüfen. Varenna–Bellagio ca. 4,50 € einfach. Die Tageskarte 'Centro Lago' (Bellagio–Varenna–Menaggio–Tremezzo) kostet je nach Zonenzuschnitt 11,50–17,50 € und lohnt ab drei Fahrten. Kauf an Bord: +1 € Aufschlag. Schnellboote (Servizio Rapido) kosten 1,50–5,50 € Zuschlag – nicht nötig."},{"titel":"Nahverkehr Mailand (STIBM)","text":"Einzelfahrt Mi1–Mi3 (ganze Stadt, 90 min) 2,20 €, Tageskarte 7,60 € – Stand 2024/25, ATM-Seite war nicht erreichbar, am Automaten prüfen. Kontaktlos mit Karte direkt am Drehkreuz zahlen geht (Tageshöchstpreis). Zu Fuß reicht oft: Centrale–Brera 25 min, Brera–Castello 10 min, Castello–Duomo 15 min."},{"titel":"Montag in Mailand","text":"Brera, Cenacolo und die Museen im Castello sind montags zu. Dom und Dachterrassen täglich. Also Mailand auf den Sonntag legen."},{"titel":"Geld & Wasser","text":"Karte fast überall, auf Schiffen und Berghütten etwas Bargeld. Trinkgeld: 'coperto' (1–3 €) steht auf der Rechnung, mehr ist nicht üblich. Leitungswasser ist trinkbar; Lecco hat 'case dell'acqua' (gekühlt, kostenlos) am Lungolago. Hitze im Juli: morgens wandern, nachmittags ins Wasser."}],"spots":[{"id":"lecco-lungolago","name":"Lecco: Altstadt + Lungolago","kategorie":"viertel","muss":3,"kurz":"Kleine Altstadt, Promenade mit Blick auf Resegone und Grigne","beschreibung":"Lecco ist die Stadt von Manzonis 'Promessi Sposi' und hat wenig Tourismusglanz, dafür eine Uferpromenade vom Hafen bis zur Ponte Azzone Visconti mit den Bergen direkt dahinter. Piazza XX Settembre und Piazza Cermenati sind der Kern, die Basilica San Nicolò hat den höchsten Glockenturm der Lombardei. Abends sitzen alle am Wasser.","lat":45.8527,"lon":9.3945,"adresse":"Piazza Cermenati, 23900 Lecco","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Frei. Campanile San Nicolò nur an Besichtigungstagen gegen Spende."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-07-03","2027-07-04","2027-07-05","2027-07-06","2027-07-07"],"hinweis":null},"oeffnungszeiten":"Immer zugänglich","ruhetag":null,"reservierung":"nein","tipp":"Von Valmadrera zu Fuß über die Ponte Azzone Visconti (ca. 25 min) oder mit dem Schiff ab Anleger Valmadrera (7 min). Aperitivo am Lungolago ist günstiger als in Bellagio.","link":"https://www.leccotourism.it/","quelle":"https://www.leccotourism.it/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.8},{"id":"san-pietro-al-monte","name":"San Pietro al Monte (Civate)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Romanische Klosteranlage auf 660 m, nur zu Fuß erreichbar – 3 km von Valmadrera","beschreibung":"Eine der wichtigsten romanischen Anlagen der Lombardei (11. Jh.) steht mitten im Wald über Civate: Basilika mit Stuck und Fresken (Apokalypse, Drache), Krypta, das kleine Oratorium San Benedetto. Kein Auto kommt hin, du gehst ab Civate ca. 1 h über einen alten Pflasterweg hoch (400 Hm). Außen und Lage lohnen immer, innen nur am Wochenende offen.","lat":45.82,"lon":9.334,"adresse":"Start: Via Cerscera / Pozzo, 23862 Civate","dauer_min":180,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Kein Eintritt, Spende für die Restaurierung erbeten. Führungen Sa/So inklusive."},"kostenlos":{"immer":true,"regeln":["Immer frei (Spende)"],"termine_im_aufenthalt":["2027-07-03","2027-07-04","2027-07-05","2027-07-06","2027-07-07"],"hinweis":"Innen: nur Sa/So 10:00–12:30 und 14:00–16:00 offen; Di–Fr nur mit Vorabreservierung (visitaguidata@amicidisanpietro.it)."},"oeffnungszeiten":"Basilika März–Okt.: Sa + So 10:00–12:30 / 14:00–16:00; Di–Fr nach Reservierung; Mo zu. Außengelände immer","ruhetag":"Montag","reservierung":"empfohlen","tipp":"Sa 03.07. direkt nach Ankunft hoch, wenn du vor 14 Uhr da bist – oder So 04.07. früh um 9 vor Mailand ist zu knapp; besser für Di–Fr per Mail eine Führung anfragen. Von Valmadrera zu Fuß nach Civate 35 min oder ein Zughalt (Civate) auf der Linie Richtung Como.","link":"https://www.amicidisanpietro.it/","quelle":"https://www.amicidisanpietro.it/orari/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":3.5},{"id":"varenna","name":"Varenna","kategorie":"viertel","muss":3,"kurz":"Das schönste Dorf am Ostufer, 20 min Zug ab Lecco","beschreibung":"Varenna liegt steil am Hang gegenüber von Bellagio: bunte Häuser, die 'Passeggiata degli Innamorati' am Wasser, kleine Gassen, zwei Villen mit Gärten. Mit dem Zug ab Lecco (Interrail) bist du in 20 Minuten da, der Bahnhof liegt oben, 10 min zu Fuß runter zum Anleger. Von hier gehen die Schiffe ins Dreieck Bellagio–Menaggio.","lat":46.0108,"lon":9.2845,"adresse":"Piazza San Giorgio, 23829 Varenna","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Ort frei. Zug Lecco–Varenna mit Interrail inklusive (sonst ca. 3 €)."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-07-03","2027-07-04","2027-07-05","2027-07-06","2027-07-07"],"hinweis":null},"oeffnungszeiten":"Immer zugänglich","ruhetag":null,"reservierung":"nein","tipp":"Früh kommen (Zug gegen 8:30), erst Castello di Vezio hoch, dann Villa Monastero, mittags Schiff nach Bellagio – so hast du den Ort vor den Tagestouristen aus Mailand.","link":"https://www.varennaturismo.com/","quelle":"https://www.varennaturismo.com/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":19.2},{"id":"brera","name":"Pinacoteca di Brera (Mailand)","kategorie":"museum","muss":3,"kurz":"Mantegnas toter Christus, Raffaels Vermählung, Caravaggio – gratis am 04.07.","beschreibung":"Die wichtigste Gemäldesammlung Norditaliens in einem Palazzo mit botanischem Garten und Kunstakademie im selben Gebäude. Mantegna, Bellini, Piero della Francesca, Raffael, Caravaggios 'Abendmahl in Emmaus', Hayez' 'Kuss'. Seit 2024 gehört Palazzo Citterio (Moderne, 300 m weiter) zum Ticket 'Grande Brera'.","lat":45.472,"lon":9.1878,"adresse":"Via Brera 28, 20121 Milano","dauer_min":120,"preis":{"erwachsene":20,"ermaessigt":4,"unter26":4,"waehrung":"EUR","eur":20,"hinweis":"Grande Brera (Pinacoteca + Palazzo Citterio, Citterio 6 Tage gültig). 18–25 aus der EU 4 €. Unter 18 frei. Audioguide 5 €."},"kostenlos":{"immer":false,"regeln":["Erster Sonntag im Monat (staatlich, Domenica al Museo)","Unter 18 immer frei"],"termine_im_aufenthalt":["2027-07-04"],"hinweis":"Gratis-Sonntag mit Pflichtreservierung über Brera Booking – Zeitfenster vorab online sichern, wird voll."},"oeffnungszeiten":"Di–So 8:30–19:15 (letzter Einlass 18:00)","ruhetag":"Montag","reservierung":"nötig","tipp":"Am Gratis-Sonntag das erste Zeitfenster (8:30) buchen und mit dem Zug um 7 ab Lecco – ab 11 wird es voll. Danach 10 min zu Fuß zum Castello, das am selben Tag frei ist.","link":"https://pinacotecabrera.org/","quelle":"https://pinacoteca ei-orari-e-biglietti.html","preisstand":"2026","unsicher":false,"quelle_hinweis":"milanocastello.it blockt automatische Abfragen (403); Preise und Gratisregeln über milanofree.it (Stand Mai 2026) – deckt sich mit der Comune-Regel für alle Musei Civici.","dist_km":44.1},{"id":"cenacolo","name":"Cenacolo Vinciano – Leonardos Abendmahl (Mailand)","kategorie":"museum","muss":2,"kurz":"15 Minuten vor dem Original, Tickets Monate vorher","beschreibung":"Das Abendmahl ist ein Wandbild im Refektorium von Santa Maria delle Grazie, kein Museumsbild – deshalb max. 40 Leute, 15 Minuten, klimatisierte Schleuse. Die Wirkung im Raum ist etwas anderes als jede Reproduktion. Ohne Ticket keine Chance.","lat":45.466,"lon":9.171,"adresse":"Piazza Santa Maria delle Grazie 2, 20123 Milano","dauer_min":45,"preis":{"erwachsene":15,"ermaessigt":2,"unter26":2,"waehrung":"EUR","eur":15,"hinweis":"18–25 EU 2 € (staatlicher Tarif), plus Vorverkaufsgebühr ca. 2 €. Unter 18 frei. Max. 5 Tickets pro Person und Jahr."},"kostenlos":{"immer":false,"regeln":["Erster Sonntag im Monat (staatlich) – nur mit Online-Gratisticket"],"termine_im_aufenthalt":["2027-07-04"],"hinweis":"Gratistickets für den 04.07.2027 kommen mit dem Quartalskontingent (Juli–Sept., Freigabe vsl. Juni 2027, 12:00 Uhr) online und sind in Minuten weg. Jeden Mittwoch 12:00 werden Resttickets für die Folgewoche freigegeben."},"oeffnungszeiten":"Di–So 8:15–19:00 (letzter Einlass 18:45)","ruhetag":"Montag","reservierung":"nötig","tipp":"Freigabetermin im Kalender eintragen und um 11:55 bei cenacolovinciano.vivaticket.it eingeloggt sein. Wenn's nicht klappt: Mittwochs 12:00 für die Folgewoche probieren. Metro M1/M2 Cadorna, 8 min zu Fuß.","link":"https://cenacolovinciano.org/","quelle":"https://cenacolovinciano.org/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Öffnungszeiten, Freigaberhythmus und Reservierungspflicht von der offiziellen Seite; die Preise 15 €/2 € stehen dort nicht lesbar, bestätigt über milanofree.it (2026) und den staatlichen 18–25-Tarif.","dist_km":44.8},{"id":"moregallo","name":"Monte Moregallo","kategorie":"aussicht","muss":1,"kurz":"Der Hausberg von Valmadrera, 1276 m, steil und still","beschreibung":"Der Moregallo steht direkt über Valmadrera und fällt steil in den See; der Gipfel liegt genau über dem Punkt, wo sich der Lecco-Arm öffnet, mit Blick auf Bellagio und beide Seearme. Ab Valmadrera (Sentiero 7 über Sambrosera oder ab Parè über den 'Sentiero delle Grotte') 3–3,5 h hoch, 1000 Hm, kaum Leute, unten Bade-Belohnung.","lat":45.865,"lon":9.329,"adresse":"Start: Valmadrera, Via San Tomaso / Parè","dauer_min":360,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-07-03","2027-07-04","2027-07-05","2027-07-06","2027-07-07"],"hinweis":null},"oeffnungszeiten":"Immer zugänglich","ruhetag":null,"reservierung":"nein","tipp":"Nur bei stabilem Wetter und mit 2 l Wasser pro Person – Südhang, kein Wasser am Weg. Vor 7 Uhr los.","link":"https://www.leccotourism.it/","quelle":"https://www.leccotourism.it/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":3.1},{"id":"piani-resinelli","name":"Piani Resinelli + Grignetta","kategorie":"natur","muss":1,"kurz":"Kletter-Hochebene auf 1300 m, Kalkzacken der Grigna Meridionale","beschreibung":"Die Resinelli sind die Alpinisten-Basis Lecco: Hochebene mit Hütten, dem Parco Valentino (Aussichtsbalkon über den See) und den Zacken der Grignetta darüber, an denen Riccardo Cassin groß wurde. Ohne Klettern lohnt der Rundweg Parco Valentino (1 h, frei) und bei Lust der Normalweg auf die Grignetta (2184 m, ca. 3 h, ausgesetzt).","lat":45.888,"lon":9.396,"adresse":"Piani Resinelli, 23801 Abbadia Lariana","dauer_min":300,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Frei. Bus ab Lecco/Ballabio nach Resinelli selten – prüfen."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-07-03","2027-07-04","2027-07-05","2027-07-06","2027-07-07"],"hinweis":null},"oeffnungszeiten":"Immer zugänglich","ruhetag":null,"reservierung":"nein","tipp":"Ohne Auto schwer: Bus Lecco–Ballabio (Linea D20-ish) und dann 1 h zu Fuß oder sommerlicher Shuttle – nur mit Vorab-Check des Fahrplans. Sonst Piani d'Erna nehmen, das geht ohne Planung.","link":"https://www.leccotourism.it/","quelle":"https://www.leccotourism.it/","preisstand":"2026","unsicher":true,"quelle_hinweis":"ÖPNV-Anbindung nicht verifiziert.","dist_km":5.4},{"id":"villa-carlotta","name":"Villa Carlotta (Tremezzo)","kategorie":"sehenswuerdigkeit","muss":1,"kurz":"Canova-Skulpturen und 8 ha Garten gegenüber von Bellagio","beschreibung":"Barockvilla am Westufer mit Museum (Canovas 'Amor und Psyche', Hayez, Thorvaldsen-Fries) und einem Garten, der im Juli vor allem mit alten Bäumen, Farnen und Zitrusterrassen punktet – die Rhododendron-Blüte ist im Mai. Von Bellagio 15 min mit der Fähre, von der Anlegestelle Tremezzo 400 m zu Fuß.","lat":45.983,"lon":9.238,"adresse":"Via Regina 2, 22016 Tremezzina","dauer_min":120,"preis":{"erwachsene":17.5,"ermaessigt":15,"unter26":12,"waehrung":"EUR","eur":17.5,"hinweis":"Studierende 19–25 mit Ausweis 12 €, 6–18 Jahre 7 €, über 65 15 €. Unter 6 frei."},"kostenlos":{"immer":false,"regeln":["Unter 6 frei"],"termine_im_aufenthalt":[],"hinweis":"Privatstiftung, kein staatlicher Gratis-Sonntag."},"oeffnungszeiten":"20.03.–18.10.: tägl. 10:00–19:00 (letztes Ticket 18:00, Museum schließt 18:30)","ruhetag":null,"reservierung":"nein","tipp":"Nur wenn Garten-Lust groß ist – mit 12 € pro Person plus Fähren wird der Tag teuer. Alternative: Villa Melzi in Bellagio (8 €) oder Monastero in Varenna (7 €) decken das Thema günstiger ab.","link":"https://www.villacarlotta.it/","quelle":"https://www.villacarlotta.it/en/visit/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":17.8},{"id":"balbianello","name":"Villa del Balbianello (Lenno)","kategorie":"sehenswuerdigkeit","muss":1,"kurz":"Die Star-Wars-/Bond-Villa auf der Halbinsel, FAI","beschreibung":"Loggia, Platanen in Form geschnitten, Terrassen auf einer Landzunge – die fotogenste Villa am See (Attack of the Clones, Casino Royale). Der FAI (italienischer National Trust) verwaltet sie, Pflichtreservierung. Hinkommen ab Lenno zu Fuß (1 km bergauf, 25 min) oder per Taxiboot.","lat":45.964,"lon":9.201,"adresse":"Via Guido Monzino 1, 22016 Tremezzina (Lenno)","dauer_min":120,"preis":{"erwachsene":15,"ermaessigt":11,"unter26":11,"waehrung":"EUR","eur":15,"hinweis":"Nur Park 15 € / Studierende bis 25 Jahre 11 €. Park + Villa nur mit 50-min-Führung 25 € / Studierende 17 €. FAI-Mitglieder frei bzw. 5 €."},"kostenlos":{"immer":false,"regeln":["Unter 5 frei"],"termine_im_aufenthalt":[],"hinweis":"FAI, kein Gratistag."},"oeffnungszeiten":"Saison ca. 10:00–18:00, Montag und Mittwoch geschlossen (letzter Parkeinlass 1 h vor Schluss)","ruhetag":"Montag und Mittwoch","reservierung":"nötig","tipp":"Schiff Bellagio–Lenno (Zone 2–3) dann zu Fuß hoch; der Fußweg ist nur an bestimmten Tagen offen, sonst Taxiboot ab Lenno Lido (extra). Zeitfenster online vorab buchen, im Juli sind Nachmittage voll.","link":"https://fondoambiente.it/luoghi/villa-del-balbianello","quelle":"https://fondoambiente.it/luoghi/villa-del-balbianello/visita","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffnungstage pro Monat auf der FAI-Seite; der Juli-2027-Kalender steht noch nicht online.","dist_km":17.9},{"id":"como-brunate","name":"Como + Standseilbahn Brunate","kategorie":"tagesausflug","muss":1,"kurz":"Die andere Seestadt: Dom, Seidenstadt-Altstadt, 7 min Standseilbahn zum Balkon der Alpen","beschreibung":"Como ist größer und eleganter als Lecco – Dom mit Renaissancefassade, ummauerte Altstadt, die Uferpromenade mit Volta-Tempel. Die Standseilbahn von 1894 zieht dich in 7 Minuten nach Brunate hoch; von dort 30 min zu Fuß zum Faro Voltiano (Leuchtturm, 2 €) mi
