sights-attractions/kamzik-hill-tv-tower/","quelle":"https://www.itimaker.com/blog/bratislava-best-views-spots","preisstand":"2026","unsicher":true,"quelle_hinweis":"Turmpreis (6 €) nur aus einem Reiseblog (Mai 2026); offizielle Seite des Turms nicht gefunden. Wald frei ist sicher.","teilfrei":true,"dist_km":4.8},{"id":"danubiana","name":"Danubiana Meulensteen Art Museum","kategorie":"museum","muss":2,"kurz":"Museum für Gegenwartskunst auf einer Halbinsel im Donaustausee","beschreibung":"20 km südlich, auf einer schmalen Landzunge im Stausee Čunovo, liegt ein Museum wie ein gestrandetes Schiff: Skulpturenpark am Wasser, Dachterrasse, drinnen Wechselausstellungen internationaler Gegenwartskunst. Die Lage ist der halbe Besuch – Wasser auf drei Seiten, Grenze zu Ungarn in Sicht. Mit Bus 90 ab Nový most etwa 40 Minuten.","lat":48.03167,"lon":17.22583,"adresse":"Vodné dielo, 851 10 Bratislava-Čunovo","dauer_min":180,"preis":{"erwachsene":12,"ermaessigt":6,"unter26":null,"waehrung":"EUR","eur":12,"hinweis":"12 € / Studierende 6 €. Der Skulpturenpark außen ist nur mit Ticket zugänglich."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Di–So 10:00–18:00 (letzter Einlass 17:30)","ruhetag":"Montag","reservierung":"nein","tipp":"Bus 90 ab Nový most (Stadtticket gilt bis Čunovo, Zone prüfen), Fahrplan ist dünn – Rückfahrt vorher nachsehen. Schifffahrten vom Zentrum gibt es im Sommer an Wochenenden, Preis/Fahrplan ließen sich nicht bestätigen. Mit Devín an einem Tag ist zu viel.","link":"https://www.danubiana.sk/en/","quelle":"https://danubiana.sk/en/kontakt/vstupne","preisstand":"2026","unsicher":false,"quelle_hinweis":"Fährverbindung nicht verifiziert.","dist_km":14.6},{"id":"tagesausflug-wien","name":"Tagesausflug Wien","kategorie":"tagesausflug","muss":2,"kurz":"Eine Stunde Regionalzug, Interrail gilt, keine Reservierung","beschreibung":"Wien liegt 60 km entfernt – REX-Züge der ÖBB fahren halbstündlich von Hlavná stanica oder Petržalka zum Wien Hauptbahnhof, Fahrzeit rund eine Stunde, Interrail-Pass gilt ohne Aufpreis. Ein Tag reicht für Stephansdom (Kirchenschiff frei), Hofburg von außen, Naschmarkt und einen Abend im Prater oder am Donaukanal. Für Wiener Museen gilt: unter 19 frei, sonst voll – plane eher Stadt als Museum.","lat":48.185,"lon":16.3775,"adresse":"Wien Hauptbahnhof, Am Hauptbahnhof 1, 1100 Wien","dauer_min":600,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Zug mit Interrail frei (ein Reisetag). Ohne Pass: Bratislava Ticket hin/zurück 18 € inkl. Wiener Öffis."},"kostenlos":{"immer":false,"regeln":["Zugfahrt mit Interrail-Reisetag frei"],"termine_im_aufenthalt":[],"hinweis":"Kostet einen Interrail-Reisetag, wenn du einen Flexi-Pass hast."},"oeffnungszeiten":"REX ca. 5:00–23:00 halbstündlich","ruhetag":null,"reservierung":"nein","tipp":"Ab Petržalka fahren die Züge über Kittsee, ab Hlavná stanica über Marchegg – beide gleich schnell, nimm den Bahnhof, der näher ist (Hlavná stanica: Trolleybus ab Nivy). Fronleichnam 27.05. ist in Österreich Feiertag: Läden zu, Museen meist offen – nicht den Donnerstag nehmen, wenn du einkaufen willst.","link":"https://www.oebb.at/","quelle":"https://Seat61.com/trains-and-routes/vienna-to-bratislava-by-train.htm","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":56.0},{"id":"nedbalka","name":"Galerie Nedbalka","kategorie":"museum","muss":1,"kurz":"Slowakische Moderne in einem Guggenheim-artigen Rundbau, Kaffee inklusive","beschreibung":"Private Galerie in der Altstadt mit vier Etagen slowakischer Kunst von 1900 bis heute, rund um ein helles Atrium. Klein, ruhig, gut beschriftet – und im Erwachsenenticket ist ein Kaffee oder Tee im Café drin. Guter Regen- oder Nachmittagsplan.","lat":48.14556,"lon":17.10944,"adresse":"Nedbalova 17, 811 01 Bratislava","dauer_min":60,"preis":{"erwachsene":8,"ermaessigt":4,"unter26":null,"waehrung":"EUR","eur":8,"hinweis":"8 € inkl. Kaffee/Tee; ISIC/EURO26 4 € (ohne Getränk)."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Di–So 13:00–19:00","ruhetag":"Montag","reservierung":"nein","tipp":"Öffnet erst um 13 Uhr – passt als Nachmittagsprogramm nach der Burg. Wer nur einen Kunstbesuch will: lieber SNG (billiger, größer); Nedbalka ist für die, die slowakische Maler kennenlernen wollen.","link":"https://www.nedbalka.sk/en/","quelle":"https://nedbalka.sk/en/visit-us","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.5},{"id":"sad-janka-krala","name":"Sad Janka Kráľa","kategorie":"natur","muss":1,"kurz":"Ältester öffentlicher Park Mitteleuropas, auf der Petržalka-Seite der Donau","beschreibung":"1774 angelegt, liegt der Park direkt gegenüber der Altstadt am Südufer. Alte Platanen, eine Gartenpavillon-Turmspitze aus einer abgerissenen Kirche, Wiesen zum Liegen und das Ufer mit dem besten Blick zurück auf Burg und UFO. Über die SNP-Brücke oder die Alte Brücke zu Fuß in zehn Minuten.","lat":48.13611,"lon":17.10833,"adresse":"Sad Janka Kráľa, 851 01 Bratislava-Petržalka","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Frei."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-05-27","2027-05-28","2027-05-29","2027-05-30","2027-05-31"],"hinweis":null},"oeffnungszeiten":"Rund um die Uhr","ruhetag":null,"reservierung":"nein","tipp":"Von der Alten Brücke (Starý most) hinüber, durch den Park zum Ufer gegenüber der Burg, über die SNP-Brücke zurück – die Runde ist der schönste Gratis-Spaziergang der Stadt, abends mit Beleuchtung.","link":"https://www.visitbratislava.com/","quelle":"https://www.visitbratislava.com/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.0}],"tage":[{"datum":"2027-05-27","titel":"Ankommen, Donauufer, SNG, Blaue Kirche","intro":"Von Nivy aus läufst du am Donauufer ins Zentrum, das ist angenehmer als die Hauptstraße. Donnerstag hat die Nationalgalerie bis 20 Uhr offen, und die Blaue Kirche öffnet ihren Innenraum nur 17:30–19:00 – beides liegt am Weg. Abends die Altstadt, wenn die Kreuzfahrtgruppen weg sind.","programm":[{"spot":null,"zeit":"14:00","titel":"Einchecken","notiz":"Apartment in Nivy/Ružinov, 20 Minuten zu Fuß ins Zentrum."},{"spot":"donauufer-eurovea","zeit":"15:00","notiz":"Von Nivy ans Ufer, an der Eurovea vorbei nach Westen bis zum Nationaltheater. Im Erdgeschoss der Mall Billa oder Kaufland fürs Frühstück."},{"spot":"sng","zeit":"16:00","notiz":"Donnerstag 12–20 Uhr. Offenes Depot und Skulpturen sind frei, das Dachcafé hat Donaublick ohne Ticket."},{"spot":"blaue-kirche","zeit":"17:45","notiz":"10 Minuten zurück nach Osten. Innenraum nur 17:30–19:00, Pfarrkirche – nicht während der Messe fotografieren."},{"spot":"altstadt-michaelertor","zeit":"18:30","notiz":"Nach 18 Uhr ist die Altstadt leer. Turm ist dann zu – lass ihn weg, das UFO am Freitag hat den besseren Blick. Abendessen im Slovak Pub (Obchodná 62): Halušky und Kapustnica."}]},{"datum":"2027-05-28","titel":"Burg, Slavín, Kamzík, UFO am Abend","intro":"Der Hügeltag: Burg am Morgen, dann bergauf zum Slavín, von dort mit dem Trolleybus weiter in den Kamzík-Wald. Wer im Turmrestaurant ein Hauptgericht isst, bekommt die Aussicht umsonst – das ist dein Abendessen. Zurück in der Stadt aufs UFO, bis 23 Uhr offen.","programm":[{"spot":"burg","zeit":"09:30","notiz":"Aufstieg über die Treppen vom Dom (Zámocké schody). Gelände und Garten frei, Museum ab 10 Uhr, Studi-Tarif 7 €."},{"spot":"slavin","zeit":"11:30","notiz":"Von der Burg 25 Minuten bergauf über Palisády, bester Gratis-Blick. Zurück durch den Horský park. Trolleybus 207, wenn die Beine streiken."},{"spot":null,"zeit":"13:00","titel":"Mittag in einer jedáleň","notiz":"Kantine im Zentrum, günstiges Tagesmenü."},{"spot":"kamzik","zeit":"15:00","notiz":"Trolleybus 212 bis Endstation Koliba, 20 Minuten Waldweg. Vorher buchen: Tisch im Turmrestaurant, dann ist die Aussichtsetage im Hauptgericht drin. Rückweg Sessellift zur Železná studnička und Bus 43."},{"spot":"ufo","zeit":"20:15","notiz":"Plattform bis 23 Uhr, Sonnenuntergang gegen 20:40. Wer sparen will: der Fußweg unter der Brückenfahrbahn ist frei und reicht."}]},{"datum":"2027-05-29","titel":"Samstagsmarkt, Burg Devín, Donaurunde","intro":"Samstag ist der einzige Markttag in der Stará tržnica – dort frühstücken, dann mit Bus 29 nach Devín. Wasser und Brot mitnehmen, oben gibt es nur einen Kiosk. Nachmittag und Abend wieder in der Stadt, mit der Gratis-Runde über beide Brücken.","programm":[{"spot":"stara-trznica","zeit":"09:00","notiz":"Vor 11 Uhr ist noch alles da: Kaffee, Koláče, Käse vom Stand. Markt nur 9–15 Uhr."},{"spot":"devin","zeit":"11:00","notiz":"Bus 29 ab Most SNP (unter der Brücke, Altstadtseite), Stadtticket reicht. Sa 10–18 Uhr, Studi 4 €. Ufer und Tor der Freiheit unterhalb sind frei."},{"spot":null,"zeit":"14:00","titel":"Rückweg","notiz":"Zu Fuß am Donauradweg nach Karlova Ves (1,5 h) oder wieder Bus 29."},{"spot":"nedbalka","zeit":"17:00","notiz":"Öffnet erst 13 Uhr, bis 19 Uhr – slowakische Moderne im Rundbau, Kaffee inklusive, Studi 4 €."},{"spot":"sad-janka-krala","zeit":"18:30","notiz":"Über die Alte Brücke rüber, durch den Park zum Ufer gegenüber der Burg, über die SNP-Brücke zurück – abends beleuchtet."}]},{"datum":"2027-05-30","titel":"Tagesausflug nach Wien","intro":"Mit Interrail ist Wien eine Stunde entfernt und praktisch gratis – Reisetag eintragen, einsteigen. REX halbstündlich ab Hlavná stanica (Trolleybus ab Nivy), keine Reservierung möglich. Sonntag passt gut, weil die Bratislavaer Museen am Montag ohnehin zu sind.","programm":[{"spot":"tagesausflug-wien","zeit":"08:00","notiz":"Ab Hlavná stanica über Marchegg oder ab Petržalka über Kittsee, beide ca. 1 h. Kostet einen Reisetag beim Flexi-Pass."},{"spot":null,"zeit":"19:30","titel":"Abendessen nahe der Unterkunft","notiz":"Bratislavský rožok aus der Bäckerei fürs Frühstück mitnehmen."}]},{"datum":"2027-05-31","titel":"Markt bei der Unterkunft, Weiterfahrt","intro":"Montag ist Devín, SNG, Nedbalka und Danubiana zu – der Vormittag gehört dem Markt um die Ecke. Gepäck bis 10:30 abholen, mit dem Trolleybus von Nivy zur Hlavná stanica und weiter nach Budapest.","programm":[{"spot":null,"zeit":"08:30","titel":"Trhovisko Miletičova","notiz":"Größter Markt der Stadt, Mo–Sa vormittags, nahe der Unterkunft – Lángoš-Stände fürs Frühstück."},{"spot":null,"zeit":"10:30","titel":"Zum Bahnhof","notiz":"Gepäck holen, Trolleybus zur Hlavná stanica."}]}],"naechte":4},{"id":"budapest","name":"Budapest","land":"Ungarn","landcode":"HU","waehrung":"HUF","kurs_eur":0.00273,"kurs_stand":"2026-09-30","ankunft":"2027-05-31","abreise":"2027-06-04","unterkunft":{"name":"Flow Spaces (Hostel)","ort":"Budapest IX, Pest","lat":47.48806,"lon":19.06139,"hinweis":"Gönczy Pál utca 2, 1093 Budapest – 2 Min von Kálvin tér (M3/M4), 5 Min zur Großen Markthalle und Freiheitsbrücke."},"zentrum":{"lat":47.49806,"lon":19.05417},"intro":"Budapest sind zwei Städte: das flache Pest mit Parlament, Ruinenbars und Boulevards, das hügelige Buda mit Burg, Fischerbastei und Thermalquellen. Vier Tage reichen für einen Burgtag, einen Pest-Tag (Parlament, Andrássy út, Heldenplatz), einen Badetag und einen halben Tag Buda-Hügel oder Margareteninsel. Montag (Ankunft) sind fast alle Museen zu – nutz ihn für Donauufer, Markthalle und Gellértberg.","feiertage":[],"gut_zu_wissen":[{"titel":"Feiertage","text":"Keine im Aufenthalt. Pfingstmontag 2027 ist der 17.05. (vor der Reise), der nächste Feiertag der 20.08. An Nationalfeiertagen (15.03., 20.08., 23.10.) sind die staatlichen Museen für alle frei – trifft dich leider nicht."},{"titel":"Museumsregel für EU-Bürger unter 26","text":"Ungarische Staatsmuseen (Nationalgalerie, Museum der Schönen Künste, Nationalmuseum, Zitadelle u. a.) geben EWR-Bürgern von 6 bis 26 und von 62 bis 70 Jahren 50 % Rabatt, unter 6 und über 70 frei. Ausweis zeigen reicht, Studierendenstatus ist egal. Private Häuser (Synagoge, Haus des Terrors, Bäder) haben eigene Regeln; das Parlament ermäßigt nur Studierende 6–24 mit Ausweis."},{"titel":"Nahverkehr (BKK)","text":"Einzelfahrt 500 Ft (700 Ft im Bus beim Fahrer), 30-Min-Ticket 600 Ft, 90 Min 850 Ft, 24 h 2.750 Ft, 72 h 5.750 Ft (≈ 15,70 €). Für vier Tage: 72-h-Karte plus ein, zwei Einzeltickets. In der App BudapestGO kaufen, Ticket vor dem Einsteigen aktivieren und beim Umsteigen per QR/NFC am Gerät scannen – Kontrolleure stehen an jedem Metroeingang und steigen in Trams zu. Strafe 12.000 Ft sofort, 25.000 Ft später, ab 30 Tagen 50.000 Ft+. Bus 100E zum Flughafen 2.500 Ft."},{"titel":"Budapest Card","text":"72 h 29.990 Ft (≈ 82 €, Preis ab Mai 2026): ÖPNV, Lukács-Bad, 30+ Museen (Dauerausstellungen), Donaufahrt, Sessellift. Für dich lohnt sie nicht: Abzüglich 72-h-Fahrkarte (5.750) musst du 24.240 Ft an Eintritten reinholen, und deine Museumstickets kosten wegen der Unter-26-Regel nur die Hälfte (Nationalgalerie 2.700, Schöne Künste 2.900, Nationalmuseum 1.750, Lukács 7.000 = 14.350 Ft). Lieber 72-h-Karte + Einzeleintritte."},{"titel":"Bäder – welches?","text":"Gellért ist bis 2028 wegen Sanierung geschlossen. Széchenyi (das Postkartenbad) Mo–Do 13.200 Ft, Fr–So 14.800 Ft; Abendticket für die letzten 2 Stunden 6.600/7.400 Ft. Rudas (türkische Kuppel von 1550) Mo–Do 12.000, Fr–So 15.000 Ft, gemischt erst ab 11 Uhr, Di nur Frauen. Lukács Mo–Do 7.000 Ft, Fr–So 8.000 Ft – das Einheimischenbad, halb so teuer, zwei Minuten vom Margit híd. Badekappe nur im Sportbecken, Handtuch und Flipflops mitbringen (Leihe teuer)."},{"titel":"Geld","text":"Forint, Kurs ≈ 366 Ft/€ (EZB 30.09.2026). Nie am Wechselstand in der Touristenzone tauschen, nie Euro bar zahlen (Hauswechselkurse 10–20 % schlechter). Karte geht fast überall, am Automaten Umrechnung immer ablehnen (in HUF abheben). Bargeld für Markthalle, Kinderbahn (nur bar!) und Lángos-Buden. Trinkgeld 10 % ist üblich, manchmal schon als 'szervizdíj' auf der Rechnung – dann nichts extra. Leitungswasser trinkbar."},{"titel":"Günstig essen","text":"Lángos (frittierter Fladen mit Sauerrahm und Käse) 1.500–2.500 Ft am Stand; Kifőzde/Étkezde (Mittagskantinen) Menü unter 3.000 Ft; in der Großen Markthalle oben an den Ständen Töltött káposzta und Gulyás. Kürtőskalács (Baumstriezel) ist Touristenpreis, aber einmal muss sein."}],"spots":[{"id":"grosse-markthalle","name":"Große Markthalle (Nagyvásárcsarnok)","kategorie":"markt","muss":3,"kurz":"Riesige Eisenhalle von 1897 mit Paprika, Salami und Lángos – zwei Minuten vom Hostel","beschreibung":"Drei Etagen unter einem Zsolnay-Ziegeldach: unten Fleisch, Gemüse, Paprikaketten und Tokajer, im Keller Fisch und Sauerkraut, oben Stickereien und die Imbissgalerie mit Lángos, Gulasch und Krautwickel. Touristisch, aber die Budapester kaufen hier wirklich ein. Für dich der Frühstücks- und Proviantladen, 200 m von der Unterkunft.","lat":47.48722,"lon":19.05861,"adresse":"Vámház körút 1-3, 1093 Budapest","dauer_min":60,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":0,"hinweis":"Eintritt frei. Lángos oben ca. 2.000–3.000 Ft (Touristenpreis), Markt unten normal."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-05-31","2027-06-01","2027-06-02","2027-06-03","2027-06-04"],"hinweis":"Sonntag geschlossen – kein Sonntag im Aufenthalt."},"oeffnungszeiten":"Mo 6:00–17:00, Di–Fr 6:00–18:00, Sa 6:00–15:00","ruhetag":"Sonntag","reservierung":"nein","tipp":"Vor 9 Uhr kommen, dann ist es Markt statt Attraktion. Für günstiges Mittagessen nicht oben in der Halle, sondern in die Markthalle Hold utca (Belvárosi Piac, 47.50306/19.05139) hinter der Basilika – dort essen die Büroleute.","link":"https://www.budapestmarkethall.com/","quelle":"https://www.budapestbylocals.com/great-market-hall/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffnungszeiten aus Reiseführern, mehrere Quellen stimmen überein.","dist_km":0.2},{"id":"szimpla-kert","name":"Szimpla Kert und jüdisches Viertel","kategorie":"nachtleben","muss":3,"kurz":"Die Ur-Ruinenbar im VII. Bezirk – Eintritt frei, Trabi als Sitzbank","beschreibung":"2002 in einer Abrissruine eröffnet, heute die Mutter aller Ruinenbars: zwei Etagen Innenhöfe voller Schrott-Kunst, Fahrräder an der Decke, Kinosaal mit Sesseln, ein Trabant zum Reinsetzen. Drumherum das ehemalige jüdische Ghetto mit Streetart, Kazinczy-Synagoge und dem Streetfood-Hof Karaván nebenan. Sonntagvormittag Bauernmarkt im Szimpla – fällt bei dir leider auf keinen Sonntag.","lat":47.49694,"lon":19.06333,"adresse":"Kazinczy utca 14, 1075 Budapest","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":0,"hinweis":"Eintritt frei; Bier ca. 1.200–1.800 Ft."},"kostenlos":{"immer":true,"regeln":["Eintritt immer frei"],"termine_im_aufenthalt":["2027-05-31","2027-06-01","2027-06-02","2027-06-03","2027-06-04"],"hinweis":null},"oeffnungszeiten":"Tägl. ca. 15:00–4:00 (Sonntag ab 9:00 Markt)","ruhetag":null,"reservierung":"nein","tipp":"Unter der Woche nach 21 Uhr gehen – am Wochenende Junggesellenabschiede. Vor 18 Uhr ist es fast leer und du kannst in Ruhe fotografieren. Essen nebenan im Karaván (Kazinczy 18), Lángos-Burger und Kürtőskalács; günstiger als drinnen.","link":"https://szimpla.hu/","quelle":"https://szimpla.hu/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffnungszeiten auf der Seite nicht maschinenlesbar – Angabe aus Erfahrungswerten, vor Ort prüfen.","dist_km":1.0},{"id":"gellertberg-zitadelle","name":"Gellértberg und Zitadelle","kategorie":"aussicht","muss":3,"kurz":"235 m über der Donau, Freiheitsstatue, 2026 wiedereröffnete Festung – Park und Terrassen frei","beschreibung":"Der steile Dolomitfelsen gegenüber der Großen Markthalle trägt die Freiheitsstatue von 1947 und die Habsburger Zitadelle, die nach elf Jahren Baustelle im März 2026 wieder offen ist: Park, Aussichtsterrassen, Dachgarten und Café frei, drinnen die Ausstellung 'Bastion der Freiheit'. Der Aufstieg vom Gellért-Bad dauert 20 Minuten und ist der beste Panoramaweg der Stadt – Burg, Parlament, alle Brücken auf einmal.","lat":47.48667,"lon":19.04667,"adresse":"Citadella sétány 1, 1118 Budapest","dauer_min":90,"preis":{"erwachsene":4900,"ermaessigt":2450,"unter26":2450,"waehrung":"HUF","eur":13.5,"hinweis":"Nur die Ausstellung kostet: 4.900 Ft, EWR 6–26 und 62–70 2.450 Ft. Berg, Park, Terrassen, Freiheitsstatue frei."},"kostenlos":{"immer":false,"regeln":["Berg, Park und Aussichtsterrassen immer frei (Apr–Okt 6:00–24:00)"],"termine_im_aufenthalt":[],"hinweis":"Gratis-Termine gelten für Berg und Terrassen, nicht für die Ausstellung."},"oeffnungszeiten":"Park Apr–Okt 6:00–24:00; Ausstellung Mo–Do, Sa, So 10:00–18:00, Fr 12:00–20:00","ruhetag":null,"reservierung":"nein","tipp":"Von der Unterkunft über die Freiheitsbrücke und den Treppenweg hinter dem Gellért-Bad hoch (25 Min) – perfekt für den Ankunftsmontag, wenn Museen zu sind. Sonnenuntergang oben, dann im Dunkeln runter zur Rudas-Seite, Weg ist beleuchtet.","link":"https://citadella.hu/en","quelle":"https://thebettervacation.com/budapest/gellert-hill-citadella/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Ausstellungspreis von zwei Reiseführern (08/2026), offizielle Seite zeigt Preise erst im Buchungsschritt. Freier Park ist offiziell bestätigt.","teilfrei":true,"dist_km":1.1},{"id":"donaukorso","name":"Donaukorso, Schuhe am Donauufer und Kettenbrücke","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Die Uferpromenade von der Elisabethbrücke zum Parlament – UNESCO-Panorama gratis","beschreibung":"Der Pester Donaukorso zwischen Elisabeth- und Kettenbrücke ist die Flaniermeile mit dem Burgpanorama gegenüber. Die Kettenbrücke (1849, erste feste Donaubrücke Ungarns) ist seit 2023 saniert und für Fußgänger frei. Nördlich davon, kurz vor dem Parlament, stehen 60 gusseiserne Schuhe am Kai: Denkmal für die Juden, die 1944/45 von Pfeilkreuzlern hier erschossen wurden – Schuhe mussten sie vorher ausziehen. Still, klein, bleibt.","lat":47.50389,"lon":19.04528,"adresse":"Id. Antall József rakpart, 1054 Budapest","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":0,"hinweis":"Frei."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-05-31","2027-06-01","2027-06-02","2027-06-03","2027-06-04"],"hinweis":null},"oeffnungszeiten":"Rund um die Uhr","ruhetag":null,"reservierung":"nein","tipp":"Von der Unterkunft am Ufer entlang nach Norden laufen (40 Min bis zum Parlament), über die Kettenbrücke nach Buda, mit Tram 19/41 am Buda-Ufer zurück – die Tram 2 auf der Pester Seite gilt als schönste Straßenbahnlinie Europas, normales BKK-Ticket. Zu den Schuhen früh oder spät gehen, mittags Gedränge.","link":"https://www.budapestinfo.hu/","quelle":"https://hungaryunlocked.com/free-things-to-do-in-budapest/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.1},{"id":"parlament","name":"Parlament (Országház)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Neogotischer Riesenbau am Donauufer, Führung mit Krone – EU-Bürger zahlen die Hälfte","beschreibung":"Das größte Gebäude Ungarns (1904), 268 m lang, 96 m hoch, 691 Räume. Die Führung (45 Min, Audioguide auch auf Deutsch) zeigt die goldene Prunktreppe, die Kuppelhalle mit der Stephanskrone und den alten Oberhaussaal. Außen und vom Buda-Ufer aus ist es jederzeit frei – abends angestrahlt am schönsten.","lat":47.50722,"lon":19.04583,"adresse":"Kossuth Lajos tér 1-3, 1055 Budapest","dauer_min":75,"preis":{"erwachsene":7000,"ermaessigt":3500,"unter26":null,"waehrung":"HUF","eur":19,"hinweis":"EWR-Bürger 7.000 Ft, Studierende 6–24 mit Ausweis 3.500 Ft (Nicht-EU doppelt: 14.000/7.000). Keine Unter-26-Stufe – wer 25 ist, zahlt voll. Ausweis am Eingang zeigen."},"kostenlos":{"immer":false,"regeln":["Außen, Kossuth tér und das Ufer immer frei","Besucherzentrum (Lapidarium) frei"],"termine_im_aufenthalt":[],"hinweis":"Am 20.08. ist die Führung frei – nicht im Aufenthalt."},"oeffnungszeiten":"Tägl. 8:00–18:00 (Apr–Okt), Führungen in festen Zeitfenstern; an Sitzungstagen eingeschränkt","ruhetag":null,"reservierung":"nötig","tipp":"Online auf jegymester.hu buchen, 1–3 Wochen vorher – deutsche Slots sind am ehesten weg. Eingang im Besucherzentrum unter dem Platz (Nordseite), 15 Min vorher da sein wegen Sicherheitskontrolle. Mit dem Ticket kannst du vorher gratis das Lapidarium ansehen.","link":"https://www.parlament.hu/en/web/visitors","quelle":"https://www.parlament.hu/en/web/visitors/ticket-prices","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Preisseite nur hinter CAPTCHA erreichbar; 7.000/3.500 Ft aus Suchauszug der Seite und einem Blog vom 02.10.2026. Ein anderer Blog (04.2026) nennt 14.270/7.710 Ft – vor dem Buchen auf jegymester.hu prüfen.","dist_km":2.4},{"id":"fischerbastei","name":"Fischerbastei (Halászbástya)","kategorie":"aussicht","muss":3,"kurz":"Märchenterrassen mit Parlamentsblick – untere Ebene immer frei, obere abends frei","beschreibung":"Sieben Türme für die sieben Magyarenstämme, 1902 als reine Aussichtsarchitektur gebaut. Die unteren Terrassen, Treppen und Arkaden kosten nie etwas; nur die oberen Türme sind tagsüber ticketpflichtig – und vor 9 Uhr sowie nach Kassenschluss drehst du einfach das Drehkreuz. Der Blick auf Parlament und Donau ist der berühmteste der Stadt.","lat":47.50222,"lon":19.03472,"adresse":"Szentháromság tér, 1014 Budapest","dauer_min":45,"preis":{"erwachsene":1700,"ermaessigt":850,"unter26":null,"waehrung":"HUF","eur":4.5,"hinweis":"Nur obere Türme, nur zu Kassenzeiten: 1.700 Ft / Studierende 850 Ft. Untere Terrassen immer frei."},"kostenlos":{"immer":false,"regeln":["Untere Terrassen immer frei","Obere Türme frei vor 9:00 und nach Kassenschluss (bis 31.05. 19:00, ab 1.06. 21:00)"],"termine_im_aufenthalt":[],"hinweis":"Jeden Tag frei – morgens vor 9 oder abends nach 21 Uhr (am 31.05. schon ab 19 Uhr)."},"oeffnungszeiten":"Rund um die Uhr; Kasse obere Ebene 9:00–19:00 (bis 31.05.), 9:00–21:00 (Jun–Sep)","ruhetag":null,"reservierung":"nein","tipp":"Sonnenaufgang (Ende Mai ca. 4:55 Uhr) oder nach 21 Uhr: leer, frei, Parlament angestrahlt. Tagsüber zwischen 10 und 16 Uhr stehen die Kreuzfahrtgruppen – dann lieber weiter zur Tóth-Árpád-Promenade auf der Westseite des Burgbergs.","link":"https://www.halaszbastya.eu/","quelle":"https://hungaryunlocked.com/fishermans-bastion-budapest-guide/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Seite leitet nur zum Restaurant weiter; Preis und Zeiten aus Reiseführer vom 03.10.2026, zwei Quellen stimmen überein.","teilfrei":true,"dist_km":2.5},{"id":"szechenyi-bad","name":"Széchenyi-Heilbad","kategorie":"aktivitaet","muss":3,"kurz":"Das gelbe Palastbad im Stadtwäldchen, Schach im 38°-Außenbecken","beschreibung":"Europas größtes Heilbad (1913): drei Außenbecken in einem neobarocken Hof, 15 Innenbecken, Saunen, und Rentner, die im warmen Wasser Schach spielen. Das Wasser kommt aus 1.246 m Tiefe mit 77 °C. Teuer geworden, aber es gibt kein zweites Bad mit dieser Kulisse – und das Abendticket halbiert den Preis.","lat":47.51861,"lon":19.08222,"adresse":"Állatkerti körút 9-11, 1146 Budapest","dauer_min":180,"preis":{"erwachsene":13200,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":36,"hinweis":"Tagesticket mit Spind Mo–Do 13.200 Ft, Fr–So/Feiertag 14.800 Ft. Abendticket (letzte 2 h) 6.600 / 7.400 Ft; Frühticket bis 9 Uhr 10.500 Ft. Kein Studierendenrabatt für Touristen."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mo–Do 7:00–20:00, Fr 7:00–22:00, Sa/So 8:00–20:00","ruhetag":null,"reservierung":"empfohlen","tipp":"Dienstag bis Donnerstag ab 18 Uhr mit Abendticket (6.600 Ft): zwei Stunden reichen für die Außenbecken, Licht geht an, Preis halbiert. Online auf szechenyifurdo.hu kaufen, dann an der Schlange vorbei. Handtuch und Flipflops mitbringen.","link":"https://www.szechenyifurdo.hu/en","quelle":"https://www.szechenyifurdo.hu/arak-2026","preisstand":"2026","unsicher":false,"quelle_hinweis":"Ob 'Wochenende' wie bei Rudas schon Freitag beginnt, steht nicht explizit auf der Preisseite.","dist_km":3.7},{"id":"rudas-bad","name":"Rudas-Bad","kategorie":"aktivitaet","muss":2,"kurz":"Osmanische Kuppel von 1550 am Fuß des Gellértbergs, Dachpool mit Donaublick","beschreibung":"Das Rudas ist das authentischste der türkischen Bäder: achteckiges Becken unter einer Kuppel mit farbigen Lichtlöchern, vier kleinere Becken von 16 bis 42 °C, gebaut unter Pascha Sokollu Mustafa. Dazu ein moderner Wellnessteil mit einem Whirlpool auf dem Dach, Blick auf Donau und Elisabethbrücke. Das türkische Bad ist montags und mittwochs vormittags nur für Männer, dienstags nur für Frauen – gemischt ab 11 Uhr.","lat":47.48889,"lon":19.05,"adresse":"Döbrentei tér 9, 1013 Budapest","dauer_min":150,"preis":{"erwachsene":12000,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":33,"hinweis":"Alles-Ticket Mo–Do 12.000 Ft, Fr–So 15.000 Ft. Nur Türkisches Bad oder nur Wellness 8.000 Ft (Mo, Do, Fr bis 10:45). Nachtbaden Fr/Sa 22–3 Uhr 15.000 Ft, nur online. Ab 14 Jahren."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Tägl. 6:00–20:00 (Mo bis 22:00); Türkisches Bad gemischt Mo 11–22, Mi–Fr 11–20, Sa/So 6–20; Di nur Frauen; Mo/Mi 6–10:45 nur Männer","ruhetag":null,"reservierung":"empfohlen","tipp":"Dienstag ist das Türkische Bad nur für Frauen offen – passt für dich, und es gilt der Werktagspreis. Alternativ Mittwoch oder Donnerstag ab 11 Uhr (gemischt). Liegt 15 Min zu Fuß von der Unterkunft über die Freiheitsbrücke.","link":"https://www.rudasfurdo.hu/en","quelle":"https://www.rudasfurdo.hu/en/prices","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.9},{"id":"grosse-synagoge","name":"Große Synagoge (Dohány utca)","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Größte Synagoge Europas, maurischer Stil, Lebensbaum-Denkmal – teuer, aber einmalig","beschreibung":"1859 gebaut, 3.000 Plätze, Zwiebeltürme und orientalische Ornamente wie ein Opernhaus. Im Garten liegen über 2.000 Tote des Ghettowinters 1944/45 in Massengräbern, dahinter der silberne Lebensbaum mit Namen auf den Blättern. Das Ticket umfasst Synagoge, Jüdisches Museum, Friedhof, Lapidarium und eine 45-Minuten-Führung (auch auf Deutsch). Der Preis ist hoch – wer knapp ist, nimmt die Kazinczy-Synagoge (orthodox, Jugendstil, deutlich billiger) oder sieht sie von außen.","lat":47.49583,"lon":19.06,"adresse":"Dohány utca 2, 1074 Budapest","dauer_min":90,"preis":{"erwachsene":14500,"ermaessigt":12000,"unter26":null,"waehrung":"HUF","eur":39.5,"hinweis":"14.500 Ft, Studierende mit ISIC 12.000 Ft, Kinder 6–12 5.500 Ft. Führung inklusive. Kein EU-Rabatt. Männer bekommen eine Kippa am Eingang."},"kostenlos":{"immer":false,"regeln":["Außenansicht und Lebensbaum durch den Zaun (Wesselényi utca) immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Sommer So–Do 10:00–20:00, Fr 10:00–16:00 (Zeiten saisonal; letzter Einlass 1 h vorher)","ruhetag":"Samstag und jüdische Feiertage – kein Samstag im Aufenthalt","reservierung":"empfohlen","tipp":"Wenn du gehst: Online-Ticket (jewishtourhungary.com) und die deutsche Führung erfragen, die ist im Preis. Der Lebensbaum ist von der Wesselényi utca durch den Zaun gut zu sehen – für die, die 40 € lieber ins Bad stecken.","link":"https://www.jewishtourhungary.com/","quelle":"https://hungaryunlocked.com/dohany-street-synagogue-budapest-guide/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Seite zeigt keine Preise (Frameset/Warenkorb); Preise aus Reiseführer vom 04.10.2026. Sommeröffnungszeiten für Juni nicht offiziell geprüft.","dist_km":0.9},{"id":"langos","name":"Lángos bei Retró Lángos Büfé","kategorie":"essen","muss":2,"kurz":"Der Frittierfladen mit Knoblauch, Sauerrahm und Käse – hier nicht zum Touristenpreis","beschreibung":"Lángos ist Ungarns Streetfood Nummer eins: Hefeteig in Öl ausgebacken, mit Knoblauchwasser bestrichen, dann Tejföl und geriebener Käse drauf. Die Bude am Arany János utca (M3) macht ihn seit Jahrzehnten für Büroleute und Studenten, nicht für Reisegruppen – klassisch, mit Wurst, mit Kraut, süß mit Nutella. Ein Stück ist ein Mittagessen.","lat":47.50306,"lon":19.05389,"adresse":"Bajcsy-Zsilinszky út 25, 1065 Budapest","dauer_min":30,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":null,"hinweis":"Ein Lángos klassisch ca. 1.500–2.500 Ft (≈ 4–7 €), Preis nicht offiziell geprüft."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mo–Fr ca. 7:00–20:00, Sa kürzer, So zu – vor Ort prüfen","ruhetag":"Sonntag (vermutlich)","reservierung":"nein","tipp":"Mittags Schlange, aber schnell. Nur bar oder Karte am Fenster – Serviette gleich mitnehmen, es tropft. Zweite Adresse für günstiges Warmes: eine Kifőzde (Kantine) wie 'Frici Papa' (Király utca 55), Menü unter 3.000 Ft.","link":"https://www.google.com/maps/search/Retr%C3%B3+L%C3%A1ngos+B%C3%BCf%C3%A9","quelle":"https://www.google.com/maps/search/Retr%C3%B3+L%C3%A1ngos+B%C3%BCf%C3%A9","preisstand":"2026","unsicher":true,"quelle_hinweis":"Keine offizielle Webseite; Preise und Zeiten aus Erfahrung, nicht geprüft.","dist_km":1.8},{"id":"burgpalast-nationalgalerie","name":"Burgpalast und Ungarische Nationalgalerie","kategorie":"museum","muss":2,"kurz":"Königsschloss auf dem Burgberg, Terrassen frei, drinnen ungarische Kunst","beschreibung":"Der Burgpalast ist nach dem Krieg als Museumsschloss wiederaufgebaut worden; Höfe, Terrassen mit Donaublick, der Matthiasbrunnen und die Festungsmauern kosten nichts und sind tagsüber offen. In den Flügeln B–D hängt die Nationalgalerie: mittelalterliche Flügelaltäre, Munkácsy, Csontváry, ungarische Moderne – und oben die Kuppel mit Rundblick.","lat":47.49611,"lon":19.03972,"adresse":"Szent György tér 2, 1014 Budapest","dauer_min":120,"preis":{"erwachsene":5400,"ermaessigt":2700,"unter26":2700,"waehrung":"HUF","eur":14.5,"hinweis":"Dauerausstellung ca. 5.400 Ft, EWR 6–26 Jahre 50 % = 2.700 Ft; Kuppel +1.000 Ft. Quellen schwanken (3.200–5.400 Ft) – die Hälfte gilt in jedem Fall."},"kostenlos":{"immer":false,"regeln":["Burghof, Terrassen, Matthiasbrunnen und Festungsmauern immer frei","Für alle frei an Nationalfeiertagen (15.03., 20.08., 23.10.)"],"termine_im_aufenthalt":[],"hinweis":"Kein Feiertag im Aufenthalt."},"oeffnungszeiten":"Galerie Di–So 10:00–18:00 (Kasse bis 17:00); Burggelände tägl.","ruhetag":"Montag (Galerie) – also am Ankunftstag 31.05. zu","reservierung":"nein","tipp":"Hoch zu Fuß über die Königstreppe hinter der Kettenbrücke (10 Min) statt mit der Standseilbahn. Die Kuppel bringt mehr als der Matthiasturm: rundum frei, 1.000 Ft. Ausweis für den Rabatt bereithalten.","link":"https://mng.hu/en","quelle":"https://thebettervacation.com/budapest/hungarian-national-gallery/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Preisseite mng.hu/jegyarak lädt leer. Zwei Reiseführer widersprechen sich (3.200 vs. 5.400 Ft Vollpreis); die 50-%-Regel ist über das Schwestermuseum (mfab.hu) belegt.","dist_km":1.9},{"id":"haus-des-terrors","name":"Haus des Terrors (Terror Háza)","kategorie":"museum","muss":2,"kurz":"Ehemalige Zentrale von Pfeilkreuzlern und Staatssicherheit – Kellerzellen im Original","beschreibung":"Andrássy út 60 war 1944 Hauptquartier der faschistischen Pfeilkreuzler und danach bis 1956 der kommunistischen Geheimpolizei ÁVH. Das Museum (2002) inszeniert beide Diktaturen mit Videowänden, einem sowjetischen Panzer im Atrium und der langsamen Fahrstuhlfahrt in die Kellerzellen. Umstritten wegen der Gewichtung (viel Kommunismus, wenig Pfeilkreuzler), aber eindrücklich. Der Audioguide ist nötig, die Texte sind sonst nur auf Ungarisch.","lat":47.50694,"lon":19.065,"adresse":"Andrássy út 60, 1062 Budapest","dauer_min":120,"preis":{"erwachsene":4000,"ermaessigt":2000,"unter26":2000,"waehrung":"HUF","eur":11,"hinweis":"4.000 Ft / ermäßigt 2.000 Ft (EU-Bürger 2–26 oder ISIC). Audioguide extra (ca. 2.000 Ft). Kein Online-Verkauf, nur an der Kasse."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Di–So 10:00–18:00 (Kasse bis 17:30)","ruhetag":"Montag","reservierung":"nein","tipp":"Direkt um 10 Uhr, Schlange wächst ab 11. Zwei Stunden einplanen und danach die Andrássy út Richtung Heldenplatz weiterlaufen (Opernhaus, Liszt-Platz) – oder umgekehrt nach dem Museum der Schönen Künste.","link":"https://www.terrorhaza.hu/en","quelle":"https://www.terrorhaza.hu/en/visitor-information","preisstand":"2026","unsicher":false,"quelle_hinweis":"Audioguide-Preis nicht verifiziert.","dist_km":2.1},{"id":"matthiaskirche","name":"Matthiaskirche (Mátyás-templom)","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Krönungskirche mit buntem Zsolnay-Dach und orientalisch bemaltem Innenraum","beschreibung":"Hier wurden Franz Joseph und Sisi 1867 gekrönt; Liszt schrieb dafür die Krönungsmesse. Außen das Majolika-Dach, innen eine komplett bemalte Halle in Ocker und Gold, die eher an eine Moschee erinnert als an eine gotische Kirche – im 16. Jh. war sie 150 Jahre lang eine. Turmaufstieg mit 197 Stufen separat.","lat":47.50194,"lon":19.03417,"adresse":"Szentháromság tér 2, 1014 Budapest","dauer_min":45,"preis":{"erwachsene":3400,"ermaessigt":2700,"unter26":null,"waehrung":"HUF","eur":9.5,"hinweis":"Kirche 3.400 Ft / Studierende 2.700 Ft; Turm 4.000 / 3.300 Ft; Audioguide 1.600 Ft. Kein EU-Rabatt (Kirche, nicht Staat)."},"kostenlos":{"immer":false,"regeln":["Frei zu Gottesdiensten (dann keine Besichtigung, kein Fotografieren)"],"termine_im_aufenthalt":[],"hinweis":"Wer die Messe mitfeiert (So 8:30, 10:00, 18:00; werktags abends), kommt ohne Ticket hinein – nur als Mitfeiernder, nicht als Tourist."},"oeffnungszeiten":"Mo–Fr 9:00–17:00, Sa 9:00–12:00, So 13:00–17:00 (Touristen); wechselt bei Messen und Hochzeiten","ruhetag":null,"reservierung":"nein","tipp":"Direkt um 9 Uhr rein, bevor die Gruppen von der Fischerbastei herüberkommen. Den Turm spar dir – die Fischerbastei daneben hat denselben Blick für weniger oder nichts.","link":"https://www.matyas-templom.hu/en","quelle":"https://matyas-templom.hu/en/buy-tickets/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.6},{"id":"heldenplatz-schoene-kuenste","name":"Heldenplatz, Museum der Schönen Künste und Stadtwäldchen","kategorie":"museum","muss":2,"kurz":"Millenniumsdenkmal, Alte Meister zum halben Preis, dahinter der Park mit Vajdahunyad-Burg","beschreibung":"Am Ende der Andrássy út (UNESCO) steht das Millenniumsdenkmal von 1896 mit den sieben Stammesfürsten und dem Erzengel Gabriel auf 36 m Säule. Links das Museum der Schönen Künste: ägyptische Sammlung, Raffael, El Greco, Goya, die ganze Spanier-Sammlung – eines der besten Häuser Mitteleuropas. Dahinter das Stadtwäldchen (Városliget) mit der Vajdahunyad-Burg (ein Architektur-Sampler aller ungarischen Stile), dem See und dem Széchenyi-Bad.","lat":47.515,"lon":19.07778,"adresse":"Dózsa György út 41, 1146 Budapest","dauer_min":180,"preis":{"erwachsene":5800,"ermaessigt":2900,"unter26":2900,"waehrung":"HUF","eur":16,"hinweis":"Museum: Dauerausstellung 5.800 Ft, EWR-Bürger 6–26 und 62–70 Jahre 2.900 Ft (Ausweis). Heldenplatz, Park, Burghof Vajdahunyad frei."},"kostenlos":{"immer":false,"regeln":["Heldenplatz, Stadtwäldchen und Burghof Vajdahunyad immer frei","Museum für alle frei an Nationalfeiertagen (15.03., 20.08., 23.10.)"],"termine_im_aufenthalt":[],"hinweis":"Kein Feiertag im Aufenthalt; Platz und Park natürlich frei."},"oeffnungszeiten":"Museum Di–So 10:00–18:00 (Kasse bis 17:00); Platz und Park immer","ruhetag":"Montag (Museum)","reservierung":"nein","tipp":"Mit der M1 (ältester U-Bahn des Kontinents, 1896, gelbe Holzwagen) bis Hősök tere fahren – allein die Fahrt ist Sehenswürdigkeit. Museum vormittags, dann durch den Park zum Széchenyi-Bad: Abendticket ab 18 Uhr, perfekter Tag.","link":"https://www.mfab.hu/","quelle":"https://www.mfab.hu/tickets/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":3.2},{"id":"lukacs-bad","name":"Lukács-Bad","kategorie":"aktivitaet","muss":2,"kurz":"Das Bad der Einheimischen – halber Preis von Széchenyi, Heilwasser seit dem 12. Jh.","beschreibung":"Keine Touristenkulisse, dafür Budapester Alltag: Schriftsteller, Rentner, Schwimmer. Zwei Außenbecken, Thermalbecken zwischen 24 und 40 °C, Saunawelt, ein Innenhof voller Dank-Tafeln von Geheilten. Das Wasser ist dasselbe wie im teuren Nachbarn Veli bej. Für den zweiten Badetag oder wenn das Budget knapp ist.","lat":47.51806,"lon":19.03611,"adresse":"Frankel Leó út 25-29, 1023 Budapest","dauer_min":150,"preis":{"erwachsene":7000,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":19,"hinweis":"Tagesticket mit Spind Mo–Do 7.000 Ft, Fr–So 8.000 Ft; Kabine +1.000 Ft. In der Budapest Card enthalten."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Tägl. 7:00–19:00, Di bis 22:00; Kasse schließt 1 h vorher","ruhetag":null,"reservierung":"nein","tipp":"Tram 4/6 oder 17/19 bis Margit híd budai hídfő, dann 5 Min. Dienstagabend bis 22 Uhr – danach über die Margaretenbrücke auf die Insel zum Nachtspaziergang.","link":"https://www.lukacsfurdo.hu/en","quelle":"https://www.lukacsfurdo.hu/en/prices","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":3.8},{"id":"margareteninsel","name":"Margareteninsel (Margitsziget)","kategorie":"natur","muss":2,"kurz":"2,5 km Parkinsel in der Donau – Musikbrunnen, Klosterruine, Wasserturm, alles frei","beschreibung":"Autofrei, 96 Hektar Rasen, Platanen und Rosengärten zwischen Margareten- und Árpádbrücke. Dazu die Ruine des Dominikanerinnenklosters, in dem die heilige Margarete lebte, ein Jugendstil-Wasserturm, ein kleiner Tiergarten, eine Laufbahn rund um die Insel (5,3 km) und der Musikbrunnen, der stündlich zu Musik tanzt (abends mit Licht). Der Ort, an dem Budapest sonntags liegt.","lat":47.52778,"lon":19.04722,"adresse":"Margitsziget, 1138 Budapest","dauer_min":150,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":0,"hinweis":"Frei. Tretauto-/Fahrradverleih und das Palatinus-Strandbad kosten extra."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-05-31","2027-06-01","2027-06-02","2027-06-03","2027-06-04"],"hinweis":null},"oeffnungszeiten":"Rund um die Uhr; Musikbrunnen ca. Mai–Okt stündlich 10:30–21:30 (Lichtshow abends)","ruhetag":null,"reservierung":"nein","tipp":"Tram 4/6 hält mitten auf der Margaretenbrücke (Margitsziget), von da zu Fuß. Abends zur letzten Brunnenshow um 21 Uhr und dann am Westufer zurück – Blick auf Parlament und Burg im Dunkeln. Picknick aus der Markthalle mitnehmen.","link":"https://www.budapestinfo.hu/","quelle":"https://hungaryunlocked.com/free-things-to-do-in-budapest/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Brunnenzeiten aus Erfahrung, nicht offiziell gegengeprüft.","dist_km":4.5},{"id":"kinderbahn-normafa","name":"Kinderbahn (Gyermekvasút) und Normafa","kategorie":"aktivitaet","muss":2,"kurz":"Schmalspurbahn durch die Budaer Berge, betrieben von Kindern – plus Waldwiese mit Stadtblick","beschreibung":"Seit 1948 fahren 10- bis 14-Jährige in Uniform die 11 km lange Waldbahn: Fahrkarten, Weichen, Abfertigung – nur der Lokführer ist erwachsen. Elf Kilometer durch Buchenwald von Széchenyi-hegy nach Hűvösvölgy, 45 Minuten. Die Endstation oben erreichst du mit der Zahnradbahn (Tram 60, BKK-Ticket), zehn Minuten entfernt liegt Normafa: Wiesen, Wald, Blick über die ganze Stadt, Rétes-Bude. Ein halber Tag Berge mitten in der Hauptstadt.","lat":47.49889,"lon":18.97806,"adresse":"Széchenyi-hegy állomás, Hegyhát út, 1121 Budapest","dauer_min":240,"preis":{"erwachsene":1000,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":2.5,"hinweis":"Einfach 1.000 Ft, hin/zurück 1.800 Ft; Kinder 6–18 halber Preis; Nostalgiezug +400 Ft. Nur Bargeld. Normafa und Zahnradbahn (BKK-Ticket) frei bzw. im 72-h-Ticket."},"kostenlos":{"immer":false,"regeln":["Normafa (Wald, Wiesen, Aussicht) immer frei","Zahnradbahn Tram 60 im BKK-Ticket enthalten"],"termine_im_aufenthalt":[],"hinweis":"Gratis-Termine gelten für Normafa, die Kinderbahn kostet."},"oeffnungszeiten":"Mai–Aug tägl. ca. 9:00–18:00 stündlich; Sep–Apr montags kein Betrieb","ruhetag":"Montag (nur Sep–Apr) – im Juni fährt sie täglich; 31.05. prüfen","reservierung":"nein","tipp":"Tram 56/59/61 bis Városmajor, dort in die Zahnradbahn (Tram 60) bis Endstation Széchenyi-hegy, Treppe hoch zur Kinderbahn. Erst nach Normafa laufen (10 Min, Rétes essen), dann mit der Bahn nach Hűvösvölgy und Tram 61 zurück. Nur Bargeld am Schalter.","link":"https://gyermekvasut.hu/en/","quelle":"https://going.com/guides/hungary-childrens-railway","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Seite war nur abgeschnitten lesbar; Fahrpreise 1.000/1.800 Ft von Reiseführer (2024) und Suchauszug 2026 bestätigt. Fahrplan Mai/Juni nicht geprüft.","teilfrei":true,"dist_km":6.4},{"id":"basilika","name":"St.-Stephans-Basilika","kategorie":"sehenswuerdigkeit","muss":1,"kurz":"Größte Kirche der Stadt mit Stephans Hand als Reliquie – seit 2025 Pflichtticket, teuer","beschreibung":"96 m hoch wie das Parlament (höher darf in Budapest nichts sein), innen Marmor und Gold, in der Seitenkapelle die mumifizierte rechte Hand des Staatsgründers Stephan. Die Kuppelterrasse hat Rundblick über Pest. Seit der Umstellung auf Touristentickets kostet allein das Kirchenschiff rund 25 € – das steht in keinem Verhältnis; Platz davor und Fassade sind frei, und wer die Messe besucht, kommt ohne Ticket hinein.","lat":47.50083,"lon":19.05389,"adresse":"Szent István tér 1, 1051 Budapest","dauer_min":60,"preis":{"erwachsene":9455,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":26,"hinweis":"Kirche ca. 9.455 Ft (≈ 25 €), Kirche + Kuppel + Schatzkammer ca. 15.100 Ft; Kinder 7–15 ermäßigt, keine Studierendenstufe gefunden. Preise werden in Euro gesetzt und in Ft umgerechnet."},"kostenlos":{"immer":false,"regeln":["Platz und Außenansicht immer frei","Gottesdienstbesuch ohne Ticket (keine Besichtigung währenddessen)"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Kirche Mo–Sa 9:00–18:00, So 13:00–18:00; Kuppel/Schatzkammer tägl. 9:00–19:00","ruhetag":null,"reservierung":"empfohlen","tipp":"Außen ansehen, Platz davor mit Kaffee, Geld fürs Bad behalten. Wer unbedingt rein will: Abendmesse unter der Woche (18 Uhr) – dann ist der Innenraum offen, ohne Ticket, nur still bleiben.","link":"https://www.bazilikabudapest.hu/","quelle":"https://thebettervacation.com/budapest/st-stephens-basilica/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Preisseite nur über Buchungsportal (lädt leer); Preise aus Reiseführer 04/2026. Öffnungszeiten von der offiziellen Seite.","dist_km":1.5},{"id":"kerepesi-friedhof","name":"Kerepesi-Friedhof (Fiumei úti sírkert)","kategorie":"natur","muss":1,"kurz":"Geheimtipp: 56 Hektar Nationalfriedhof mit Mausoleen, Arbeiterpantheon und Rehen","beschreibung":"Hinter dem Ostbahnhof liegt der Père-Lachaise von Budapest: Mausoleen von Kossuth, Deák und Batthyány, das riesige sozialistische Arbeiterpantheon von 1958, Jugendstil-Gräber, alte Alleen – und kaum ein Tourist. Rehe laufen zwischen den Gräbern, es gibt Bänke und Schatten. Für einen ruhigen Nachmittag, wenn die Stadt zu laut wird; vom Hostel mit der M4 bis Keleti.","lat":47.49444,"lon":19.08528,"adresse":"Fiumei út 16, 1086 Budapest","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":0,"hinweis":"Frei."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-05-31","2027-06-01","2027-06-02","2027-06-03","2027-06-04"],"hinweis":null},"oeffnungszeiten":"Tägl. ca. 7:00–20:00 (Sommer); am Haupteingang gibt es einen Plan","ruhetag":null,"reservierung":"nein","tipp":"Am Eingang den Lageplan fotografieren, dann Richtung Kossuth-Mausoleum und weiter zum Arbeiterpantheon im Nordosten – das sieht sonst niemand. Kombinieren mit dem Keleti-Bahnhof (Eklektik von 1884, frei).","link":"https://fiumeiutisirkert.nori.gov.hu/","quelle":"https://fiumeiutisirkert.nori.gov.hu/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffnungszeiten nicht gegengeprüft (Friedhof, saisonal).","dist_km":1.9},{"id":"standseilbahn","name":"Standseilbahn Budavári Sikló","kategorie":"aktivitaet","muss":1,"kurz":"Historische Zahnseilbahn von 1870 zur Burg – hübsch, 95 Sekunden, teuer","beschreibung":"Die Sikló war die zweite Standseilbahn Europas; die Holzwagen fahren in 95 Sekunden 50 Höhenmeter vom Kettenbrückenkopf zum Burgpalast. Nach der Tarifreform 2026 kostet die Fahrt für Touristen 4.500 Ft einfach – fast so viel wie ein Museum. Der Fußweg daneben (Königstreppe) dauert zehn Minuten und hat denselben Blick.","lat":47.49806,"lon":19.03972,"adresse":"Clark Ádám tér, 1013 Budapest","dauer_min":15,"preis":{"erwachsene":4500,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":12.5,"hinweis":"Einfach 4.500 Ft, hin/zurück 5.500 Ft; Kinder 3–14 2.000/3.000 Ft. Kein Studierenden- oder EU-Rabatt (Einheimischenrabatt nur mit ungarischer Adresskarte)."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Tägl. 8:00–22:00; Wartung an jedem zweiten Montag (ungerade Kalenderwochen)","ruhetag":"Montag in ungeraden Kalenderwochen (31.05.2027 ist KW 22 – vermutlich offen, prüfen)","reservierung":"nein","tipp":"Wenn überhaupt, nur bergauf einfach und abends: der Wagen hat Glasdach, die Kettenbrücke leuchtet unter dir. Sonst zu Fuß – du sparst rund 12 €.","link":"https://www.bkv.hu/en/budavari_siklo/","quelle":"https://budappest.com/ride-the-buda-castle-funicular-budapests-most-scenic-way-to-reach-castle-hill/","preisstand":"2026","unsicher":true,"quelle_hinweis":"BKV-S tseite rüber, Mo–Fr bis 17 Uhr. Den Turm sparen."},{"spot":null,"zeit":"13:15","titel":"Mittag und Pause","notiz":"Mit Tram 19/41 am Buda-Ufer nach Süden zum Fuß des Gellértbergs."},{"spot":"rudas-bad","zeit":"14:30","notiz":"Dienstag nur Frauen im Türkischen Bad, Werktagspreis. Handtuch und Flipflops mitbringen, Dachpool mit Donaublick."},{"spot":"standseilbahn","zeit":"20:30","notiz":"Nur bergauf, nur abends: Glasdach, die Kettenbrücke leuchtet unter dir. Runter dann zu Fuß."},{"spot":"fischerbastei","zeit":"21:00","notiz":"Ab 21 Uhr Kassenschluss, obere Türme frei und leer. Bis 31.05. wäre es schon ab 19 Uhr – heute gilt die Sommerregel."}]},{"datum":"2027-06-02","titel":"Terror-Haus, Lángos, Heldenplatz, Széchenyi","intro":"Der Pest-Tag entlang der Andrássy út: um 10 Uhr ins Haus des Terrors, bevor die Schlange wächst, dann mit der M1 – der ältesten U-Bahn des Kontinents – zum Heldenplatz. Ab 18 Uhr Abendticket im Széchenyi, zwei Stunden reichen für die Außenbecken.","programm":[{"spot":"haus-des-terrors","zeit":"10:00","notiz":"Direkt um 10 Uhr rein, ab 11 wird die Schlange lang. Zwei Stunden einplanen."},{"spot":"langos","zeit":"12:30","notiz":"15 Minuten nach Westen zum Retró Lángos Büfé. Mittags Schlange, aber schnell – Serviette mitnehmen."},{"spot":"heldenplatz-schoene-kuenste","zeit":"14:00","notiz":"M1 bis Hősök tere. Erst ins Museum (Kasse bis 17 Uhr, Unter-26 halber Preis), dann durch den Park zur Vajdahunyad-Burg."},{"spot":"szechenyi-bad","zeit":"18:00","notiz":"Vorher buchen: Abendticket für die letzten zwei Stunden online auf szechenyifurdo.hu, dann an der Schlange vorbei. Außenbecken, Schach, Licht geht an. Handtuch und Flipflops."},{"spot":null,"zeit":"20:30","titel":"Abendessen","notiz":"Mit der M1 zurück, Kifőzde 'Frici Papa' (Király utca 55) hat Menü unter 3.000 Ft."}]},{"datum":"2027-06-03","titel":"Parlament, Synagoge, Margareteninsel, Szimpla","intro":"Morgens das gebuchte Parlamentsticket, dann über die Basilika zur Großen Synagoge – eine Linie durch Pest. Nachmittags Picknick aus der Markthalle auf die Margareteninsel, abends zur Brunnenshow bleiben und zum Abschluss in die Szimpla, unter der Woche nach 21 Uhr.","programm":[{"spot":"parlament","zeit":"09:00","notiz":"Vorher buchen: Slot auf jegymester.hu 1–3 Wochen vorher, Studi 6–24 mit Ausweis die Hälfte. Eingang Besucherzentrum Nordseite, 15 Minuten früher wegen Sicherheitskontrolle; Lapidarium vorher gratis."},{"spot":"basilika","zeit":"10:45","notiz":"Nur von außen, auf dem Weg nach Süden. Platz und Fassade frei, das Ticket drinnen ist das Geld fürs Bad."},{"spot":"grosse-synagoge","zeit":"11:30","notiz":"Vorher buchen: Online-Ticket auf jewishtourhungary.com, deutsche Führung ist im Preis. Lebensbaum sonst durch den Zaun an der Wesselényi utca."},{"spot":null,"zeit":"13:30","titel":"Mittag und Picknick kaufen","notiz":"Kantine in der Nähe, dann Picknick für die Insel aus der Markthalle (bis 18 Uhr)."},{"spot":"margareteninsel","zeit":"16:30","notiz":"Tram 4/6 bis Margitsziget auf der Brücke. Musikbrunnen stündlich, abends Lichtshow – am Westufer zurück mit Blick auf Parlament und Burg."},{"spot":"szimpla-kert","zeit":"21:30","notiz":"Letzter Abend: unter der Woche nach 21 Uhr, Eintritt frei. Essen nebenan im Karaván (Kazinczy 18)."}]},{"datum":"2027-06-04","titel":"Kerepesi-Friedhof und Weiterfahrt","intro":"Ein ruhiger Vormittag, den sonst niemand macht: der Nationalfriedhof mit Mausoleen und Rehen, 20 Minuten vom Hostel. Gepäck bis 10:30 holen, dann zum Zug nach Keszthely.","programm":[{"spot":null,"zeit":"08:00","titel":"Auschecken","notiz":"Gepäck im Hostel lassen, Frühstück vom Vortag."},{"spot":"kerepesi-friedhof","zeit":"08:30","notiz":"Am Eingang den Lageplan fotografieren, zum Kossuth-Mausoleum und weiter zum Arbeiterpantheon im Nordosten. Immer frei."},{"spot":null,"zeit":"10:30","titel":"Zum Bahnhof","notiz":"Gepäck holen und mit dem 72-h-Ticket zum Bahnhof – Keleti liegt direkt am Friedhof, falls dein Zug dort abfährt."}]}],"naechte":4},{"id":"keszthely","name":"Keszthely","land":"Ungarn","landcode":"HU","waehrung":"HUF","kurs_eur":0.00274,"kurs_stand":"2026-09-25","ankunft":"2027-06-04","abreise":"2027-06-07","unterkunft":{"name":"Downtown apartment with parking space","ort":"Keszthely","lat":46.766,"lon":17.244,"hinweis":"Lage grob (Zentrum), Adresse unbekannt"},"zentrum":{"lat":46.7665,"lon":17.2445},"intro":"Keszthely ist die 'Hauptstadt' des westlichen Balaton: ein echtes Städtchen mit Barockschloss, Uni und Fußgängerzone statt reiner Badeort. Ein Tag für Schloss und Stadt, ein halber für Hévíz (Thermalsee, 15 Minuten mit dem Bus), der Rest für Strand, Rad oder einen Schiffsausflug nach Badacsony. Das Wasser ist Anfang Juni schon badewarm genug, die Hauptsaison hat noch nicht begonnen.","feiertage":[],"gut_zu_wissen":[{"titel":"Museumsrabatte in Ungarn","text":"Regierungsverordnung 194/2000: EWR-Bürger von 6 bis 26 zahlen in allen staatlichen und kommunalen Museen die Hälfte – Studi-Ausweis oder Perso reicht. Zusätzlich gibt jedes Museum einen Wochenendtag im Monat frei für unter 26 (Dauerausstellung) – welcher, legt das Haus fest (Balaton-Museum: letzter Samstag, also 26.06. – nicht im Aufenthalt; Festetics-Schloss veröffentlicht keinen). Alle Museen frei an den Nationalfeiertagen 15.03., 20.08., 23.10. Einen 'ersten Sonntag frei' gibt es in Ungarn nicht – der 06.06. bringt nichts."},{"titel":"Nahverkehr","text":"Keszthely läuft man komplett zu Fuß (Bahnhof–Schloss 20 Minuten). Nach Hévíz fährt Volánbusz vom Busbahnhof (neben dem Bahnhof) mehrmals pro Stunde, ca. 15–20 Minuten; Ticket beim Fahrer oder in der MÁV-App (Bus und Bahn haben seit 2024 einen gemeinsamen Tarif, in der App 5 % billiger). Fahrpreis konnte nicht verifiziert werden – rechne mit wenigen hundert Forint pro Strecke. Unter 26 gibt es keinen allgemeinen Rabatt (nur für ungarische Studierende)."},{"titel":"Geld","text":"Kurs: 1 EUR ≈ 364 HUF (MNB, 25.09.2026). Karte geht fast überall, auch an Strandkassen und Büfés; Bargeld für Markt und Lángos-Stand. Nie in Euro zahlen, die Kurse an der Kasse sind schlecht. Trinkgeld 10 % in Restaurants, oft steht schon 'szervizdíj' 12–15 % auf der Rechnung – dann nichts mehr. Leitungswasser ist trinkbar."},{"titel":"Balaton-Strände","text":"Am Balaton ist fast jeder Strand ein eingezäuntes Freibad mit Eintritt (strand = Freibad). Keszthely hat seit 2026 eine Ausnahme: der Helikon-Strand ist kostenlos. Nachmittagstickets (ab 16/17 Uhr) sind an fast allen Stränden billiger. Wasserqualität: Helikon war im Aug. 2026 wegen Bakterien eine Woche gesperrt, Városi blieb ausgezeichnet – im Zweifel die aktuelle Messung auf keszthely.hu checken."},{"titel":"Essen","text":"Lángos (frittierter Hefeteig mit Knoblauch, Sauerrahm und Käse) ist das Strandessen schlechthin – 1.500–2.500 Ft am Strandbüfé. Hekk (gebratener Seehecht) ist die zweite Balaton-Institution. Günstig mittags: 'napi menü' in Kneipen rund um die Kossuth utca für 2.500–3.500 Ft."}],"spots":[{"id":"festetics","name":"Festetics-Schloss (Helikon-Schlossmuseum)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Drittgrößtes Barockschloss Ungarns mit berühmter Bibliothek","beschreibung":"Das Schloss der Grafen Festetics ist der Grund, warum Keszthely mehr ist als ein Badeort. Herzstück ist die Helikon-Bibliothek mit 80.000 Bänden in originalen Eichenregalen, dazu Prunkräume mit Möbeln und Porzellan. Auf dem Gelände liegen weitere Ausstellungen (Kutschen, Jagd, Modelleisenbahn, Reisen) und ein Vogelpark mit Palmenhaus. Der Schlosspark ist frei und abends ein guter Spazierort.","lat":46.7698,"lon":17.2409,"adresse":"Kastély u. 1, 8360 Keszthely","dauer_min":150,"preis":{"erwachsene":4600,"ermaessigt":2300,"unter26":2300,"waehrung":"HUF","eur":12.5,"hinweis":"Schloss + 1 Ausstellung 4.600 / 6–25 J. 2.300 Ft. Schloss + 5 Ausstellungen (inkl. Vogelpark) 7.500 / 3.750 Ft. Einzelne Nebenausstellung 2.500 / 1.250 Ft. Preise Sommer 2026 (01.06.–30.09.); 2027 noch nicht veröffentlicht."},"kostenlos":{"immer":false,"regeln":["Schlosspark immer frei (Apr–Sep 5:00–20:00)","Nationalfeiertage frei (15.03., 20.08., 23.10.) – keiner im Aufenthalt","unter 26 EWR: ein Wochenendtag pro Monat frei (Dauerausstellung) – das Schloss nennt den Tag nicht auf der Website"],"termine_im_aufenthalt":[],"hinweis":"Vor Ort nach dem 'ingyenes hétvégi nap' für unter 26 fragen – wenn er auf den 5. oder 6.6. fällt, sparst du 2.300 Ft."},"oeffnungszeiten":"Juni tägl. 10:00–17:00 (Juli/Aug bis 18:00); Vogelpark gleich; Park Apr–Sep 5:00–20:00","ruhetag":null,"reservierung":"nein","tipp":"Das Kombiticket 'Schloss + 1 Ausstellung' reicht: Bibliothek und Prunkräume sind der Kern, die Kutschen siehst du durch die Fenster. Morgens um 10 vor den Busgruppen rein. Der Palmenhaus/Vogelpark-Eingang liegt hinten im Park.","link":"https://festeticskastely.hu/en/","quelle":"https://festeticskastely.hu/en/tickets/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.5},{"id":"heviz","name":"Hévíz-Thermalsee","kategorie":"aktivitaet","muss":3,"kurz":"Größter natürlicher Thermalsee Europas, 33–36 °C, Seerosen inklusive","beschreibung":"Ein 4,4 Hektar großer See, der aus einer 38 m tiefen Quelle gespeist wird und sich alle drei Tage komplett erneuert. Man schwimmt zwischen Seerosen im warmen, leicht schwefeligen Wasser, hält sich an Holzstangen fest oder dümpelt im Schwimmreifen (Verleih vor Ort). Die Badehäuser auf Stelzen sind seit 2026 wegen Sanierung geschlossen, gebadet wird nur im Freien – im Juni egal. Mehr als 3 Stunden sind medizinisch eh nicht empfohlen.","lat":46.7869,"lon":17.1921,"adresse":"Dr. Schulhof Vilmos sétány 1, 8380 Hévíz","dauer_min":180,"preis":{"erwachsene":4200,"ermaessigt":3800,"unter26":null,"waehrung":"HUF","eur":11.5,"hinweis":"3-Stunden-Ticket 4.200 Ft, Studierende (ab 14, mit Ausweis) 3.800 Ft; Tageskarte 7.100 / 6.600 Ft; Abendticket (2 h vor Schließung) 3.400 Ft. Das sind die reduzierten Preise seit 30.03.2026 wegen der Badehaus-Sanierung (regulär 4.500 / 7.500 Ft laut heviz.hu). Ab 15.07.2026 gibt es zu jedem 3-h-Ticket eine Stunde gratis."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Sommer tägl. 8:30–18:30 (Badeschluss 18:30)","ruhetag":null,"reservierung":"nein","tipp":"3-Stunden-Ticket nehmen, nicht die Tageskarte – länger hält man im 35-Grad-Wasser eh nicht aus. Online auf jegy.spaheviz.hu kaufen (30 Tage gültig, Studi-Rabatt aber nur an der Kasse mit Ausweis). Haupteingang Schulhof-Promenade. Bus von Keszthely Busbahnhof, Haltestelle 'Hévíz, autóbusz-állomás', dann 10 Min. zu Fuß durch den Kurpark.","link":"https://spaheviz.hu/en/","quelle":"https://jegy.spaheviz.hu/en","preisstand":"2026","unsicher":false,"quelle_hinweis":"Zwei offizielle Quellen nennen unterschiedliche Preise (Ticketshop: reduziert wegen Umbau; heviz.hu: regulär). Je nach Baustand 2027 gilt der eine oder andere.","dist_km":4.6},{"id":"altstadt","name":"Kossuth utca & Fő tér","kategorie":"viertel","muss":2,"kurz":"Fußgängerzone vom Hauptplatz bis zum Schloss","beschreibung":"Die Kossuth Lajos utca ist die Achse der Stadt: Vom Fő tér mit der gotischen Pfarrkirche (1386, Fresken innen) und dem Rathaus führt sie 600 m nordwärts direkt aufs Schlosstor zu. Unterwegs Cafés, Eisdielen, die kuriosen Mini-Museen und am Mittwoch- und Samstagvormittag der Markt (Piac tér) mit Käse, Paprika und Lángos.","lat":46.7665,"lon":17.2445,"adresse":"Fő tér / Kossuth Lajos u., 8360 Keszthely","dauer_min":60,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-04","2027-06-05","2027-06-06","2027-06-07"],"hinweis":null},"oeffnungszeiten":"immer; Markt Mi + Sa vormittags","ruhetag":null,"reservierung":"nein","tipp":"Samstag (05.06.) ist Markttag – vormittags am Piac tér frühstücken: Lángos, Kürtőskalács, frische Erdbeeren.","link":"https://keszthely.hu/en/","quelle":"https://keszthely.hu/en/valogatasok/top-latnivalok/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.1},{"id":"varosi-strand","name":"Városi Strand (Stadtstrand)","kategorie":"strand","muss":2,"kurz":"Großer Stadtstrand mit Rutsche, Volleyball und 20 Büfés","beschreibung":"Der Hauptstrand von Keszthely nördlich des Hafens: 35.000 m² Liegewiese, Riesenrutsche, Beachvolleyball, SUP- und Tretbootverleih, Lángos-Büfés am laufenden Band. Das Wasser ist hier ebenso flach wie überall am Südwestufer, dafür ist die Wasserqualität konstant 'ausgezeichnet'. Wer nach dem Schloss einfach ins Wasser will, ist hier richtig – und zahlt dafür.","lat":46.7578,"lon":17.2508,"adresse":"Erzsébet királyné útja, 8360 Keszthely","dauer_min":180,"preis":{"erwachsene":2100,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":6.0,"hinweis":"Erwachsene 2.100 Ft (2026). Studi- und Nachmittagstarif existieren laut Presse, Höhe nicht verifiziert – an der Kasse fragen."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Saison ca. Mitte Mai–Mitte Sept., tägl. ca. 8:00–19:00 (Kassenschluss früher)","ruhetag":null,"reservierung":"nein","tipp":"Nur zahlen, wenn du die Rutsche oder den Verleih willst – zum Baden reicht der kostenlose Helikon-Strand 500 m südlich. Wer trotzdem hier will: nach 17 Uhr gibt es meist ein billigeres Nachmittagsticket.","link":"https://keszthely.hu/en/szabadido/varosi-strand/","quelle":"https://www.origo.hu/gazdasag/2026/06/balatoni-strandokon-2026-ban-itt-ennyiert-furodhetunk","preisstand":"2026","unsicher":true,"quelle_hinweis":"Preis aus Presseübersicht (Origo 06/2026), nicht von der Stadtseite – die listet keine Preise.","dist_km":1.0},{"id":"langos","name":"Lángos am Strandbüfé","kategorie":"essen","muss":2,"kurz":"Frittierter Hefeteig mit Knoblauch, Sauerrahm und Käse – das Balaton-Essen","beschreibung":"Lángos gehört an den Balaton wie Sand ans Meer: ein handtellergroßer frittierter Hefefladen, mit Knoblauchwasser bestrichen, dann Tejföl (Sauerrahm) und geriebener Käse drauf. Gibt es an jedem Strandbüfé und am Markt, bester Zeitpunkt ist nach dem Baden mit nassen Haaren. Zweite Pflicht: Hekk (gebratener Seehecht) mit Brot und Essiggurke.","lat":46.7578,"lon":17.2508,"adresse":"Büfés am Városi Strand und Helikon-Strand; Markt Piac tér (Mi/Sa)","dauer_min":20,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":null,"hinweis":"Typisch 1.500–2.500 Ft je nach Belag (Erfahrungswert, kein offizieller Preis)"},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Strandbüfés tägl. ca. 10:00–19:00 in der Saison","ruhetag":null,"reservierung":"nein","tipp":"Klassisch 'sajtos-tejfölös' bestellen. Die Büfés vor dem Strandeingang sind oft billiger als drinnen.","link":null,"quelle":null,"preisstand":"2026","unsicher":true,"quelle_hinweis":"Essens-Tipp, keine offizielle Preisquelle.","dist_km":1.0},{"id":"radweg","name":"Balaton-Radweg (Bringakörút) Richtung Vonyarcvashegy","kategorie":"aktivitaet","muss":2,"kurz":"Flache Uferstrecke, 8,5 km bis zum nächsten Weinort","beschreibung":"Der 200 km lange Balaton-Rundradweg führt direkt am Keszthelyer Ufer entlang. Richtung Osten nach Gyenesdiás und Vonyarcvashegy (8,5 km, 40 Höhenmeter) hat man den See links und Weinberge rechts, Richtung Süden geht es durch Schilf nach Fenékpuszta und zum Kis-Balaton. BalatonBike365 hat einen Verleih am Energia tér gegenüber der Mole; dazu eine App mit Routen.","lat":46.756,"lon":17.251,"adresse":"BB365 Port Keszthely, Energia tér (gegenüber Hafen), 8360 Keszthely","dauer_min":240,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":null,"hinweis":"Verleihpreise nicht online abrufbar; typisch am Balaton 3.000–5.000 Ft pro Tag für ein Trekkingrad (nicht verifiziert). Radweg selbst frei."},"kostenlos":{"immer":true,"regeln":["Radweg immer frei"],"termine_im_aufenthalt":["2027-06-04","2027-06-05","2027-06-06","2027-06-07"],"hinweis":"nur Leihrad kostet"},"oeffnungszeiten":"Radweg immer; Verleih ca. 9:00–18:00 in der Saison","ruhetag":null,"reservierung":"empfohlen","tipp":"Räder online über balatonbike365.hu vorbuchen. Lohnende Runde: Keszthely → Vonyarcvashegy (Szent-Mihály-Kapelle auf dem Hügel, freier Blick) → zurück, ~20 km, Badestopp am Gyenesdiás-Strand.","link":"https://balatonbike365.hu/","quelle":"https://balatonbike365.hu/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Preisliste des Verleihs nicht ladbar.","dist_km":1.2},{"id":"helikon-strand","name":"Helikon-Strand","kategorie":"strand","muss":2,"kurz":"Seit 2026 Keszthelys kostenloser Balaton-Strand","beschreibung":"Der südliche der beiden Stadtstrände, direkt neben dem Hafen und dem Helikon-Park. Seit der Saison 2026 hat die Stadt den Eintritt abgeschafft – Sanitäranlagen inklusive. Große Liegewiese, flacher Einstieg (typisch Balaton: man watet lange), Blick auf die Badacsony-Vulkankegel am Nordufer. Weniger Infrastruktur als am Városi Strand, dafür entspannter.","lat":46.751,"lon":17.2555,"adresse":"Helikon-Park / Csárda u., 8360 Keszthely","dauer_min":150,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":0,"hinweis":"Seit 01.05.2026 frei zugänglich"},"kostenlos":{"immer":true,"regeln":["immer frei (Stadtratsbeschluss 2026)"],"termine_im_aufenthalt":["2027-06-04","2027-06-05","2027-06-06","2027-06-07"],"hinweis":"Ob die Stadt das 2027 beibehält, steht nicht fest – auf keszthely.hu prüfen."},"oeffnungszeiten":"Frei zugänglich, Saison ca. Mai–Sept.","ruhetag":null,"reservierung":"nein","tipp":"Nach einer Baderegen-Woche die aktuelle Wasserqualität prüfen: Im Aug. 2026 war Helikon eine Woche wegen Enterokokken gesperrt, der Városi Strand nebenan nicht. Sonnenuntergang vom Hafensteg daneben.","link":"https://keszthely.hu/en/","quelle":"https://hungarytoday.hu/keszthely-helikon-beach-reopens-after-water-quality-concerns-resolved/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Offizielle Strandseite der Stadt nicht erreichbar; Gratis-Eintritt bestätigt durch Presse (Hungary Today 08/2026, Infostart 05/2026).","dist_km":1.9},{"id":"badacsony","name":"Schiff nach Badacsony + Weinberge (Tagesausflug)","kategorie":"tagesausflug","muss":2,"kurz":"Mit dem Bahart-Schiff über den See zum Vulkanberg mit Weinterrassen","beschreibung":"Badacsony ist der abgeflachte Basaltvulkan gegenüber am Nordufer – Weinberge bis zum Gipfel, Kellereien mit Terrassenblick, oben der kostenlose Kisfaludy-Aussichtsturm (438 m) und der Rózsakő-Felsen. Bahart fährt im Sommer Linienschiffe von Keszthely über Balatongyörök dorthin (ca. 1–1,5 h, nur in der Hauptsaison täglich). Oben eine Runde Olaszrizling auf einer Terrasse, dann die gelbe Markierung zum Turm.","lat":46.79,"lon":17.495,"adresse":"Hafen Keszthely: Balaton-part / Hajóállomás; Badacsony Hafen: Park u., 8261 Badacsonytomaj","dauer_min":420,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":null,"hinweis":"Bahart-Tarif 2026 nicht abrufbar (nur PDF im Ticketshop). 2024 lag die längste Linienfahrt bei ca. 3.500 Ft pro Strecke; Studi-Rabatt gibt es nur an der Hafenkasse mit Ausweis. Aussichtsturm und Wanderwege oben frei."},"kostenlos":{"immer":false,"regeln":["Kisfaludy-Aussichtsturm und Rózsakő immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Bahart-Linienschiffe ab Keszthely: Vorsaison (Anfang Juni) meist nur Wochenende/wenige Abfahrten – Fahrplan auf jegy.bahart.hu prüfen","ruhetag":null,"reservierung":"empfohlen","tipp":"Anfang Juni ist Vorsaison: Erst den Fahrplan checken, ob überhaupt ein Schiff Keszthely–Badacsony fährt (sonst Zug nach Badacsony über Tapolca, ~1 h). Rückfahrt alternativ mit dem Zug, falls das letzte Schiff zu früh geht. Alternative ohne Schiff: Bahart-Rundfahrt (sétahajó) ab Keszthely, 1 Stunde.","link":"https://www.bahart.hu/","quelle":"https://jegy.bahart.hu/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Fahrpreise stehen nur in einem PDF des Ticketshops, das nicht geladen werden konnte; Vorsaison-Fahrplan Juni 2027 noch nicht publiziert.","dist_km":19.3},{"id":"babamuzeum","name":"Puppenmuseum & Schneckenparlament (Turi-Török-Sammlungen)","kategorie":"museum","muss":1,"kurz":"Skurrile Privatmuseen in der Fußgängerzone – nur mit teurem Kombiticket","beschreibung":"Ein Sammler hat in der Kossuth utca sieben kleine Museen gebündelt: 500 Puppen in Trachten aller ungarischen Regionen, ein Parlamentsmodell aus 4,5 Millionen Schneckenhäusern, Panoptikum, Spielzeug-, Kitsch- und Foltermuseum. Kurios und fotogen, aber seit 2025 gibt es nur noch ein Kombiticket für alle sieben – 6.500 Ft ist für 20 Minuten Puppen zu viel. Das frühere Marzipanmuseum ist nicht mehr Teil davon.","lat":46.7662,"lon":17.2432,"adresse":"Kossuth Lajos u. 11, 8360 Keszthely","dauer_min":60,"preis":{"erwachsene":6500,"ermaessigt":5500,"unter26":null,"waehrung":"HUF","eur":18.0,"hinweis":"Kombiticket alle 7 Museen: Erwachsene 6.500 Ft, Kinder 5.500 Ft; kein Studi-Tarif. Nur an den Museumskassen (Bar/Karte)."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"tägl. 10:00–16:00","ruhetag":null,"reservierung":"nein","tipp":"Das Schneckenparlament sieht man zum Teil durchs Schaufenster. Wenn du rein willst, dann nur, wenn du wirklich alle sieben Häuser abklappern willst – sonst Geld sparen.","link":"https://babamuzeum-keszthely.hu/","quelle":"https://babamuzeum-keszthely.hu/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.1},{"id":"balaton-muzeum","name":"Balaton-Museum","kategorie":"museum","muss":1,"kurz":"Alles über den See: Geologie, Fischer, Badekultur – frisch 'Balaton Retro'","beschreibung":"Das Regionalmuseum in einem schönen Neobarockbau am Weg vom Bahnhof in die Stadt. 700 m² zu Entstehung des Sees, Fischerei, Schifffahrt und der Badekultur der Kádár-Zeit; seit 2026 die Ausstellung 'Balaton Retro'. Kostenlose Audioguide-App. Gut für einen Regenvormittag, nicht mehr.","lat":46.7617,"lon":17.2467,"adresse":"Múzeum u. 2, 8360 Keszthely","dauer_min":75,"preis":{"erwachsene":3000,"ermaessigt":1500,"unter26":1500,"waehrung":"HUF","eur":8.0,"hinweis":"Voll 3.000 Ft, 6–26 J. 1.500 Ft (inkl. 500 Ft Servicegebühr, die auch bei Gratis-Eintritt fällig ist)"},"kostenlos":{"immer":false,"regeln":["unter 26: letzter Samstag im Monat frei (plus 500 Ft Gebühr)","Nationalfeiertage frei (15.03., 20.08., 23.10.)"],"termine_im_aufenthalt":[],"hinweis":"Letzter Samstag im Juni 2027 ist der 26.06. – nach deiner Abreise."},"oeffnungszeiten":"Sommer Di–Sa 10:00–17:00 (Sonntag/Montag zu – Sommerzeiten 2027 prüfen)","ruhetag":"Montag, Sonntag","reservierung":"nein","tipp":"Nur bei Regen. Dann die Audioguide-App vorher laden, drinnen ist das WLAN wackelig.","link":"https://www.balatonimuzeum.hu/","quelle":"https://www.balatonimuzeum.hu/belepojegyek-es-berletek/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.5},{"id":"georgikon","name":"Georgikon-Gutshofmuseum","kategorie":"museum","muss":1,"kurz":"Europas erste Landwirtschaftshochschule – Traktoren, Weinpresse, Schmiede für 600 Ft","beschreibung":"1797 gründete Graf Festetics hier die erste landwirtschaftliche Hochschule Europas. Im alten Gutshof stehen heute Dampfpflüge, Oldtimer-Traktoren, eine Weinkelterei und eine Schmiede. Nicht spektakulär, aber charmant, fast nie voll und für 600 Ft eines der billigsten Museen des Landes.","lat":46.7729,"lon":17.2357,"adresse":"Bercsényi Miklós u. 65–67, 8360 Keszthely","dauer_min":60,"preis":{"erwachsene":600,"ermaessigt":300,"unter26":300,"waehrung":"HUF","eur":1.5,"hinweis":"Erwachsene 600 Ft, Studierende 300 Ft"},"kostenlos":{"immer":false,"regeln":["Nationalfeiertage frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"01.06.–30.09. Di–So 10:00–18:00","ruhetag":"Montag","reservierung":"nein","tipp":"Liegt 10 Minuten nordwestlich vom Schloss – gut als Abstecher nach dem Schlosspark. Du bist am 07.06. (Montag) abgereist, also nur Fr–So möglich.","link":"https://keszthely.hu/en/szabadido/georgikon-majormuzeum/","quelle":"https://keszthely.hu/en/szabadido/georgikon-majormuzeum/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.0},{"id":"kis-balaton","name":"Kis-Balaton: Kányavári-Insel","kategorie":"natur","muss":1,"kurz":"Vogelparadies im Schilfmeer, frei begehbar mit Aussichtstürmen","beschreibung":"Der Kis-Balaton ist ein 80 km² großes Feuchtgebiet südwestlich von Keszthely, Brutgebiet für Reiher, Löffler und Seeadler. Der einzige frei zugängliche Teil ist die Kányavári-Insel bei Balatonmagyaród: über eine Holzbrücke auf die Insel, 1,5 km Lehrpfad 'Búbos vöcsök' mit 15 Stationen und zwei Aussichtstürmen. Alles andere nur mit Nationalpark-Führung.","lat":46.6553,"lon":17.1783,"adresse":"Kányavári-sziget, 8753 Balatonmagyaród (Straße Sármellék–Balatonmagyaród)","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"HUF","eur":0,"hinweis":"Insel frei; seit 2022 Parkgebühr für Autos (für dich irrelevant)"},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-04","2027-06-05","2027-06-06","2027-06-07"],"hinweis":null},"oeffnungszeiten":"ganzjährig, Infrastruktur 9:00–18:00","ruhetag":null,"reservierung":"nein","tipp":"Ohne Auto nur mit dem Rad erreichbar (ca. 18 km ab Keszthely über Fenékpuszta und Zalavár, flach) – kombiniert das mit dem Leihrad. Fernglas mitnehmen, früher Morgen oder Abend wegen der Vögel.","link":"https://www.bfnp.hu/hu/kis-balaton","quelle":"https://www.programturizmus.hu/partner-kanyavari-sziget-nagy-kilato-balatonmagyarod.html","preisstand":"2026","unsicher":false,"quelle_hinweis":"Nationalpark-Seite nennt keinen Eintritt; Gratis-Zugang laut Programturizmus (Partnerseite der Gemeinde).","dist_km":13.3}],"tage":[{"datum":"2027-06-04","titel":"Ankommen, Helikon-Strand, Lángos","intro":"Keszthely läuft man zu Fuß, der Bahnhof ist 20 Minuten vom Schloss. Nach dem Einchecken direkt an den See: Helikon ist seit 2026 kostenlos, das Wasser Anfang Juni schon warm genug. Lángos vom Büfé als Abendessen, Sonnenuntergang vom Hafensteg.","programm":[{"spot":null,"zeit":"14:00","titel":"Einchecken","notiz":"Apartment im Zentrum. Vorher auf keszthely.hu nachsehen, ob Helikon noch kostenlos ist und die Wasserqualität passt."},{"spot":"helikon-strand","zeit":"15:30","notiz":"Vom Zentrum 15 Minuten nach Süden ans Ufer. Kostenlos, kein Zaun – Handtuch reicht."},{"spot":"langos","zeit":"18:00","notiz":"'Sajtos-tejfölös' am Büfé vor dem Strandeingang, dort oft billiger als drinnen. Danach Sonnenuntergang vom Hafensteg."}]},{"datum":"2027-06-05","titel":"Markt, Festetics-Schloss, Georgikon, Stadtstrand","intro":"Samstag ist Markttag – Frühstück am Piac tér, dann um 10 Uhr vor den Busgruppen ins Schloss. Das Georgikon liegt zehn Minuten weiter und hat Sa offen. Nachmittags der Stadtstrand mit dem billigeren Ticket ab 17 Uhr. Bei Regen stattdessen das Balaton-Museum (Di–Sa).","programm":[{"spot":"altstadt","zeit":"08:30","notiz":"Markttag: Lángos, Kürtőskalács, Erdbeeren am Piac tér, dann die Kossuth utca hoch zum Schloss."},{"spot":"festetics","zeit":"10:00","notiz":"Kombiticket 'Schloss + 1 Ausstellung' reicht: Bibliothek und Prunkräume. An der Kasse nach dem 'ingyenes hétvégi nap' für unter 26 fragen – fällt er auf heute oder morgen, sparst du 2.300 Ft. Park ist frei."},{"spot":null,"zeit":"12:45","titel":"Napi menü","notiz":"Tagesmenü in einer Kneipe an der Kossuth utca, 2.500–3.500 Ft."},{"spot":"georgikon","zeit":"14:00","notiz":"10 Minuten nordwestlich vom Schloss, Di–So 10–18 Uhr, 600 Ft. Traktoren, Weinpresse, Schmiede."},{"spot":"varosi-strand","zeit":"17:00","notiz":"Nach 17 Uhr meist ein billigeres Nachmittagsticket. Rutsche, Volleyball, 20 Büfés. Bis ca. 19 Uhr."}]},{"datum":"2027-06-06","titel":"Radweg nach Vonyarcvashegy, Hévíz am Nachmittag","intro":"Morgens aufs Rad, solange es kühl ist: flache Uferstrecke bis Vonyarcvashegy, Badestopp in Gyenesdiás, rund 20 km. Nachmittags mit dem Bus nach Hévíz in den Thermalsee – drei Stunden reichen, länger hält man die 35 Grad nicht aus.","programm":[{"spot":"radweg","zeit":"09:00","notiz":"Vorher buchen: Rad online über balatonbike365.hu. Zur Szent-Mihály-Kapelle auf dem Hügel in Vonyarcvashegy, freier Blick, zurück über den Strand in Gyenesdiás."},{"spot":null,"zeit":"13:00","titel":"Mittag und Rad abgeben","notiz":"Zurück in Keszthely, Verleih bis 18 Uhr."},{"spot":"heviz","zeit":"14:30","notiz":"Volánbusz vom Busbahnhof neben dem Bahnhof, 15–20 Minuten, Haltestelle 'Hévíz, autóbusz-állomás', dann 10 Minuten durch den Kurpark zum Haupteingang. 3-Stunden-Ticket, Studi-Rabatt nur an der Kasse mit Ausweis. Badeschluss 18:30."},{"spot":null,"zeit":"19:00","titel":"Abendessen","notiz":"Bus zurück, Hekk oder Lángos am Strand."}]},{"datum":"2027-06-07","titel":"Schlosspark, Weiterfahrt nach Zagreb","intro":"Montag sind Museen zu, der Schlosspark ist ab 5 Uhr frei – eine Runde vor dem Zug. Gepäck bis 10:30 holen, der Bahnhof ist 20 Minuten vom Schloss.","programm":[{"spot":null,"zeit":"08:30","titel":"Frühstück und Auschecken","notiz":"Bäckerei in der Kossuth utca."},{"spot":null,"zeit":"09:15","titel":"Runde durch den Schlosspark","notiz":"Park ist frei (Apr–Sep ab 5 Uhr), Palmenhaus hinten am Parkende von außen."},{"spot":null,"zeit":"10:30","titel":"Zum Bahnhof","notiz":"Gepäck holen, 20 Minuten zu Fuß."}]}],"naechte":3},{"id":"zagreb","name":"Zagreb","land":"Kroatien","landcode":"HR","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-06-07","abreise":"2027-06-10","unterkunft":{"name":"Downtown Luxury Apartment","ort":"Zagreb","lat":45.812,"lon":15.978,"hinweis":"Lage grob (Unterstadt/Zentrum), Adresse unbekannt"},"zentrum":{"lat":45.8131,"lon":15.9775},"intro":"Zagreb ist eine k.u.k.-Stadt mit Kaffeehauskultur und einer Oberstadt, die man in einem Vormittag abläuft – entsprechend entspannt: Tag 1 Oberstadt (Markuskirche, Lotrščak zum Mittagsschuss, Museum der zerbrochenen Beziehungen), Tag 2 Unterstadt mit Dolac, Zrinjevac, einem Museum und Mirogoj, Tag 3 raus: Medvednica mit der Seilbahn oder Maksimir und Jarun. Montag ist Museumsruhetag – dein Ankunftstag ist ein Montag, also Montag für Draußen reservieren.","feiertage":[],"gut_zu_wissen":[{"titel":"Gratistage & Museen","text":"Einen festen 'ersten Mittwoch frei' gibt es in Zagreb nicht – die Stadt öffnet ihre Museen gratis an der Nacht der Museen (Januar), am Internationalen Museumstag (18.05.), am Stadtfest (31.05.) und bei Hitzewellen für Zagreber. Nichts davon fällt in deinen Aufenthalt (07.–10.06.). Studi-Tarife liegen meist bei 50–70 % des Vollpreises, fast alle Museen schließen montags. Zagreb hat kein nationales Unter-26-Privileg wie Italien oder Ungarn."},{"titel":"Nahverkehr (ZET)","text":"Trams fahren überall hin, Tickets in der ZET-App, am Tisak-Kiosk oder beim Fahrer (teurer). Einzelfahrt 30 Min. ca. 0,53–0,55 €, Tageskarte ca. 4 € (Preise laut Reiseportalen, ZET-Tarifseite nicht abrufbar). Die Standseilbahn kostet offiziell 0,66 €. Deine Ziele in der Innenstadt sind alle zu Fuß erreichbar; Tram brauchst du für MSU (Linie 6/7/14 nach Novi Zagreb), Jarun (5/17) und die Seilbahn (Tram 14 bis Mihaljevac, dann Bus 15 nach Dolje)."},{"titel":"Zagreb Card","text":"24 h 38 € – inklusive ZET und freiem Eintritt in MBR (9 €), MSU, Technikmuseum, Stadtmuseum, Zoo. Rechnung: MBR 9 + MSU ~5 + Tesla ~5 + Tram 4 = 23 €. Lohnt sich nicht, erst recht nicht mit Studi-Tarifen."},{"titel":"Kathedrale nach dem Erdbeben","text":"Das Erdbeben vom März 2020 hat beide Türme beschädigt; die Spitzen wurden abgetragen (108 → 72 m). Nach fast sechs Jahren hat die Kathedrale Weihnachten 2025 wieder für Messen geöffnet, die Gerüste sind weg, die Restaurierung der Türme läuft weiter. Innenbesichtigung sollte 2027 möglich sein, Baustellenanblick außen einplanen."},{"titel":"Geld & Essen","text":"Euro seit 2023, Karte überall. Trinkgeld
