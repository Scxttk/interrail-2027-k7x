 5–10 % aufrunden. Leitungswasser ist gut, Zagreb hat Trinkbrunnen. Günstig satt: Ćevapi im Lepinja (Fladenbrot) 7–9 €, Štrukli (Teigtaschen mit Frischkäse, gebacken oder gekocht) 7–10 €, Burek vom Bäcker 2–3 €. Kaffee ist eine Institution – 'špica' Samstagvormittag ist das Sehen-und-Gesehen-Werden auf der Tkalčićeva und am Cvjetni trg."}],"spots":[{"id":"brokenships","name":"Museum der zerbrochenen Beziehungen","kategorie":"museum","muss":3,"kurz":"Objekte gescheiterter Lieben aus aller Welt, Europas bestes Konzeptmuseum","beschreibung":"Zwei Ex-Partner haben nach ihrer Trennung angefangen, Dinge zu sammeln, die von gescheiterten Beziehungen übrig bleiben – heute füllen anonym gespendete Objekte mit kurzen Texten den Kulmer-Palast: eine Axt, mit der eine Frau die Möbel ihres Ex zerlegte, ein Hochzeitskleid im Glas, ein Toaster ('Wie willst du jetzt toasten?'). Lustig, bitter, rührend, in 60–90 Minuten durch. 2011 Europäisches Museum des Jahres (innovativstes Museum).","lat":45.815,"lon":15.9731,"adresse":"Ćirilometodska 2, 10000 Zagreb","dauer_min":75,"preis":{"erwachsene":9.0,"ermaessigt":7.0,"unter26":null,"waehrung":"EUR","eur":9.0,"hinweis":"Erwachsene 9 €, Studierende/Schüler/65+ 7 €"},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"01.06.–30.09. tägl. 9:00–22:00 (letzter Einlass 21:30)","ruhetag":null,"reservierung":"nein","tipp":"Abends nach 19 Uhr hingehen – dann sind die Tagestouristen weg, und das Museum hat bis 22 Uhr auf. Im Café ein 'Bad Memories Eraser'-Radiergummi als Souvenir.","link":"https://brokenships.com/","quelle":"https://brokenships.com/visit/museum-details/zagreb","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.5},{"id":"gornji-grad","name":"Oberstadt (Gornji Grad) mit Markuskirche & Strossmayer-Promenade","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Das bunte Wappendach, Steinernes Tor und die Aussichtspromenade","beschreibung":"Die mittelalterliche Oberstadt liegt auf dem Hügel Gradec: kopfsteingepflasterte Gassen, Gaslaternen (die abends noch von Hand angezündet werden), Parlament und Regierungssitz am Markusplatz. Die Markuskirche mit dem Dach aus glasierten Ziegeln – Wappen Kroatiens und Zagrebs – ist das Postkartenmotiv der Stadt; innen ist sie seit dem Erdbeben meist zu. Durch das Steinerne Tor (Kamenita vrata) mit dem Marienschrein hinunter zur Strossmayer-Promenade – Stadtbalkon mit Blick über die Dächer der Unterstadt, im Sommer mit Bühne und Bars.","lat":45.8164,"lon":15.9734,"adresse":"Trg sv. Marka, 10000 Zagreb","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Alles draußen frei; Markuskirche innen seit 2020 meist geschlossen"},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-07","2027-06-08","2027-06-09","2027-06-10"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Vor 12 Uhr oben sein: Mittagsschuss vom Lotrščak-Turm, danach ins Museum der zerbrochenen Beziehungen (50 m entfernt). Abends gegen Sonnenuntergang zurück auf die Strossmayer-Promenade – die Gaslaternen werden gegen 20:30 angezündet.","link":"https://www.infozagreb.hr/","quelle":"https://www.infozagreb.hr/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.6},{"id":"dolac","name":"Dolac-Markt","kategorie":"markt","muss":2,"kurz":"Roter Schirm-Markt zwischen Ober- und Unterstadt, 'Bauch von Zagreb'","beschreibung":"Seit 1930 Zagrebs Hauptmarkt auf einer Terrasse direkt über dem Hauptplatz: oben unter roten Sonnenschirmen Obst, Gemüse, Blumen und Bäuerinnen aus dem Umland mit Käse und Rahm (sir i vrhnje), unten in der Halle Fleisch, Fisch und Bäcker. Vormittags am lebendigsten, nach 13 Uhr wird abgebaut. Kirschen und Erdbeeren Anfang Juni sind spottbillig.","lat":45.814,"lon":15.9774,"adresse":"Dolac 9, 10000 Zagreb","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-07","2027-06-08","2027-06-09","2027-06-10"],"hinweis":null},"oeffnungszeiten":"Mo–Sa ca. 6:30–15:00, So bis ca. 13:00","ruhetag":null,"reservierung":"nein","tipp":"Frühstück: 'sir i vrhnje' (Frischkäse mit Rahm) von einer der Bäuerinnen plus Brot aus der Halle, dann auf die Treppe setzen. Die Kumica-Statue am Treppenaufgang ist der Treffpunkt.","link":"https://www.trznice-zg.hr/","quelle":"https://www.trznice-zg.hr/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Öffnungszeiten aus allgemeiner Kenntnis, Marktseite nicht ladbar.","dist_km":0.2},{"id":"kathedrale","name":"Kathedrale Mariä Himmelfahrt","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Neogotische Doppelturmkathedrale – seit Weihnachten 2025 wieder offen, Türme noch gestutzt","beschreibung":"Das höchste Gebäude Kroatiens stand mit seinen 108-m-Türmen über der Stadt, bis das Erdbeben vom 22. März 2020 die Südspitze abbrach; die Nordspitze wurde danach kontrolliert abgetragen. Fast sechs Jahre Sanierung (47 Mio. €), seit Weihnachten 2025 finden wieder Messen statt – das Innere mit dem Hochaltar, der Schatzkammer und der glagolitischen Inschrift ist zugänglich, die Türme sind auf 72 m gestutzt und werden weiter restauriert. Davor der Kaptol-Platz mit der goldenen Mariensäule.","lat":45.8145,"lon":15.9796,"adresse":"Kaptol 31, 10000 Zagreb","dauer_min":30,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Eintritt frei (Spende erbeten)"},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-07","2027-06-08","2027-06-09","2027-06-10"],"hinweis":null},"oeffnungszeiten":"tägl. ca. 10:00–17:00 außerhalb der Messen (Zeiten 2027 vor Ort prüfen, Baustellenbetrieb)","ruhetag":null,"reservierung":"nein","tipp":"Hinter der Kathedrale an der Ribnjak-Seite steht die abgebrochene Turmspitze von 2020 als Mahnmal. Von hier fährt Bus 106 zum Mirogoj-Friedhof.","link":"https://www.zg-nadbiskupija.hr/","quelle":"https://www.tportal.hr/vijesti/clanak/za-bozic-ponovno-otvara-vrata-pogledajte-kako-izgleda-obnovljena-zagrebacka-katedrala-20251212","preisstand":"2026","unsicher":true,"quelle_hinweis":"Öffnungszeiten für Besucher nicht offiziell publiziert; Stand der Restaurierung laut Presse (tportal 12/2025).","dist_km":0.3},{"id":"zrinjevac","name":"Zrinjevac & das Grüne Hufeisen","kategorie":"natur","muss":2,"kurz":"Platanenallee mit Musikpavillon, Herzstück der k.u.k.-Unterstadt","beschreibung":"Das 'Lenuci-Hufeisen' ist eine U-förmige Kette von sieben Plätzen und Parks, die die Unterstadt im 19. Jh. zur Großstadt machen sollte. Zrinjevac ist der schönste Teil: Platanen, Brunnen, der Musikpavillon (sonntags vormittags oft Kapelle), die Wettersäule von 1884 und rundherum Paläste mit Akademie, Archäologischem Museum und Kunstpavillon. Weiter südlich Tomislav-Platz mit dem Reiterstandbild vor dem Bahnhof.","lat":45.8096,"lon":15.978,"adresse":"Trg Nikole Šubića Zrinskog, 10000 Zagreb","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-07","2027-06-08","2027-06-09","2027-06-10"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Abends mit einem Bier vom Kiosk auf eine Bank – im Juni gibt es oft Open-Air-Konzerte oder Food-Stände rund um den Pavillon.","link":"https://www.infozagreb.hr/","quelle":null,"preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.3},{"id":"strukli","name":"Štrukli bei La Štruk","kategorie":"essen","muss":2,"kurz":"Zagorje-Teigtaschen mit Frischkäse, gebacken in Rahm – das Zagreber Gericht","beschreibung":"Štrukli sind hauchdünn ausgezogener Strudelteig, gefüllt mit Frischkäse und Rahm, entweder gekocht in Suppe oder im Ofen überbacken, bis die Rahmkruste braun ist. Das kleine La Štruk in der Skalinska-Gasse unterhalb der Oberstadt macht nichts anderes, in süß (Heidelbeere, Walnuss-Honig) und herzhaft (Trüffel, Spinat), mit Hinterhofgarten. Dauerhaft Schlange, aber es geht schnell.","lat":45.8147,"lon":15.977,"adresse":"Skalinska 5, 10000 Zagreb","dauer_min":45,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Portion ca. 7–10 € (Erfahrungswert)"},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"tägl. ca. 11:00–22:00","ruhetag":null,"reservierung":"nein","tipp":"Außerhalb der Essenszeiten (15–18 Uhr) kommst du ohne Warten rein.","link":"https://www.lastruk.hr/","quelle":null,"preisstand":"2026","unsicher":true,"quelle_hinweis":"Essens-Tipp, Preis nicht offiziell verifiziert.","dist_km":0.3},{"id":"tkalciceva","name":"Tkalčićeva","kategorie":"viertel","muss":2,"kurz":"Kneipenstraße im ehemaligen Bachbett zwischen Gradec und Kaptol","beschreibung":"Wo heute die Café-Terrassen stehen, floss bis 1898 der Bach Medveščak, Grenze zwischen den rivalisierenden Hügelstädten Gradec und Kaptol (die 'Blutbrücke' Krvavi most erinnert daran). Heute bunte zweistöckige Häuschen, eine Terrasse neben der anderen, Craft-Bier, Kaffee und abends die ganze Stadt auf einer Straße. Touristisch, aber die Zagreber kommen trotzdem.","lat":45.8156,"lon":15.977,"adresse":"Ulica Ivana Tkalčića, 10000 Zagreb","dauer_min":60,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-07","2027-06-08","2027-06-09","2027-06-10"],"hinweis":null},"oeffnungszeiten":"immer; Bars bis ca. 1:00","ruhetag":null,"reservierung":"nein","tipp":"Essen lieber in den Seitengassen (Skalinska, Opatovina) als direkt auf der Tkalčićeva – gleiche Küche, 20 % billiger. Craft-Bier: Craft Room oder Pivnica Medvedgrad.","link":"https://www.infozagreb.hr/","quelle":null,"preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.4},{"id":"uspinjaca","name":"Standseilbahn (Uspinjača)","kategorie":"aktivitaet","muss":2,"kurz":"66 Meter, 64 Sekunden, 0,66 € – kürzeste Standseilbahn der Welt im ÖPNV","beschreibung":"Seit 1890 verbindet die Uspinjača die Ilica mit der Oberstadt – 66 m Strecke, 30 m Höhenunterschied, 64 Sekunden Fahrt, 28 Passagiere. Technisch das Nutzloseste und Charmanteste, was Zagreb hat; die Treppe daneben ist schneller. 2026 wurde sie generalüberholt und fährt seit Mai 2026 wieder. Oben steht man direkt am Lotrščak-Turm.","lat":45.814,"lon":15.973,"adresse":"Tomićeva ulica (Talstation), 10000 Zagreb","dauer_min":10,"preis":{"erwachsene":0.66,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0.5,"hinweis":"0,66 € pro Fahrt; ZET-Tages-/Mehrtageskarten gelten"},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"tägl. 6:30–21:50, alle 10 Minuten","ruhetag":null,"reservierung":"nein","tipp":"Einmal hoch, zu Fuß runter. Ticket am Häuschen unten (Karte geht). Kurz vor 12 ist Schlange wegen des Kanonenschusses – dann die Treppe.","link":"https://www.zet.hr/uspinjaca/detaljnije/403","quelle":"https://www.zet.hr/uspinjaca/detaljnije/403","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.4},{"id":"lotrscak","name":"Lotrščak-Turm & Grički top (Mittagsschuss)","kategorie":"aussicht","muss":2,"kurz":"Wehrturm von 1266, Kanone jeden Mittag um 12, bester Rundblick der Oberstadt","beschreibung":"Der einzige erhaltene Turm der Stadtmauer von Gradec steht am oberen Ende der Standseilbahn. Seit 1877 feuert hier jeden Mittag Punkt 12 eine Kanone (Grički top), damit die Glöckner der Stadt ihre Uhren stellen können – man hört es in der ganzen Innenstadt, und steht man direkt davor, zuckt man garantiert. Über eine Wendeltreppe hinauf zur Plattform mit 360-Grad-Blick über Kathedrale, Unterstadt und Medvednica.","lat":45.8148,"lon":15.9733,"adresse":"Strossmayerovo šetalište 9, 10000 Zagreb","dauer_min":30,"preis":{"erwachsene":3.0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":3.0,"hinweis":"Erwachsene 3 €, Kinder 7–18 J. 2 €; kein Studi-Tarif"},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":"Den Kanonenschuss hört man gratis von der Promenade"},"oeffnungszeiten":"Di–Fr 9:00–20:00, Sa–So 11:00–20:00","ruhetag":"Montag","reservierung":"nein","tipp":"Um 11:50 oben sein, der Schuss fällt vom 4. Stock – Ohren zuhalten lohnt. Montag (dein Ankunftstag) geschlossen, Kanone schießt trotzdem.","link":"https://gkd.hr/kula-lotrscak/","quelle":"https://gkd.hr/kula-lotrscak/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.5},{"id":"hmnu","name":"Kroatisches Museum für naive Kunst","kategorie":"museum","muss":2,"kurz":"Hinterglasmalerei der Hlebine-Schule – klein, günstig, ganz eigen","beschreibung":"Das erste Museum weltweit für naive Kunst (1952), direkt neben dem Museum der zerbrochenen Beziehungen. Rund 80 Bilder der Bauernmaler aus Hlebine – Generalić, Mraz, Rabuzin –, meist Öl hinter Glas: leuchtende Winterdörfer, surreale Hähne, Dorfhochzeiten. 45 Minuten reichen, und für 3 € im Studi-Tarif ist es das beste Preis-Leistungs-Museum der Stadt.","lat":45.8152,"lon":15.9732,"adresse":"Ćirilometodska 3, 10000 Zagreb","dauer_min":45,"preis":{"erwachsene":5.5,"ermaessigt":3.0,"unter26":null,"waehrung":"EUR","eur":5.5,"hinweis":"Erwachsene 5,50 €, Studierende/Schüler 3 €"},"kostenlos":{"immer":false,"regeln":["frei für Kunst-/Kunstgeschichtsstudierende mit Nachweis"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mo–Fr 9:00–17:00 (Einlass bis 16:30), Sa 10:00–14:00","ruhetag":"Sonntag","reservierung":"nein","tipp":"Eines der wenigen Museen, das montags offen hat – passt auf deinen Ankunftstag. Kein Aufzug, 1. Stock.","link":"https://hmnu.hr/en/","quelle":"https://hmnu.hr/en/info","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.5},{"id":"tmnt","name":"Technisches Museum Nikola Tesla","kategorie":"museum","muss":2,"kurz":"Tesla-Kabinett mit Hochspannungsvorführung, Planetarium, Bergwerksstollen","beschreibung":"Ein altes Messehallen-Ensemble voller Dampfmaschinen, Flugzeuge, U-Boot und Feuerwehrautos. Highlight ist das Tesla-Demonstrationskabinett, in dem Nachbauten seiner Erfindungen vorgeführt werden – Funkenschlag inklusive –, dazu ein begehbarer 300-m-Bergwerksstollen und ein kleines Planetarium (feste Vorführzeiten, meist nachmittags). Charmant unmodern, Familienliebling, Vorführungen auf Kroatisch mit englischer Kurzfassung.","lat":45.8027,"lon":15.966,"adresse":"Savska cesta 18, 10000 Zagreb","dauer_min":120,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Preisseite auf tmnt.hr nicht auffindbar (404). Erfahrungswert: niedrige einstellige Euro-Beträge, Planetarium/Tesla-Vorführung ggf. extra. In der Zagreb Card enthalten."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Di–Fr und Sa–So mit unterschiedlichen Zeiten (Website nennt sie, Inhalte nicht ladbar); Tesla-Vorführungen zu festen Zeiten nachmittags","ruhetag":"Montag","reservierung":"nein","tipp":"Vor dem Besuch auf tmnt.hr die Vorführzeiten für Tesla-Kabinett und Planetarium checken und danach den Besuch legen – ohne Vorführung ist es nur ein Haufen alter Maschinen.","link":"https://tmnt.hr/","quelle":"https://tmnt.hr/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Website erreichbar, aber Ticket-/Zeitenseite nicht gefunden; keine Zahl eingetragen.","dist_km":1.4},{"id":"mirogoj","name":"Mirogoj-Friedhof","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Arkadenfriedhof von Hermann Bollé – einer der schönsten Europas, frei","beschreibung":"1876 angelegt, mit 500 m langen neorenaissance Arkaden, grünen Kuppeln und efeubewachsenen Mauern – ein Park mit Grabkunst, in dem Katholiken, Orthodoxe, Juden und Muslime nebeneinander liegen. Tito-Nachfolger Tuđman liegt hier, Basketball-Legende Dražen Petrović, der Dichter Krleža. Gerade die Arkaden mit ihren Mosaiken und Skulpturen lohnen, und es ist still, auch wenn 500 m weiter die Stadt tobt.","lat":45.8348,"lon":15.987,"adresse":"Aleja Hermana Bollea 27, 10000 Zagreb","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-07","2027-06-08","2027-06-09","2027-06-10"],"hinweis":null},"oeffnungszeiten":"01.04.–30.10. tägl. 6:00–20:00","ruhetag":null,"reservierung":"nein","tipp":"Bus 106 ab Kaptol (vor der Kathedrale), 10 Minuten, hält direkt am Haupteingang. Die Arkaden links und rechts vom Eingang zuerst, dann querfeldein. Montag (Ankunftstag) ist perfekt dafür – Friedhöfe haben keinen Ruhetag.","link":"https://www.gradskagroblja.hr/","quelle":"https://www.gradskagroblja.hr/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":2.6},{"id":"maksimir","name":"Maksimir-Park","kategorie":"natur","muss":2,"kurz":"Englischer Landschaftspark von 1794, fünf Seen, Eichenwald, Zoo","beschreibung":"Der älteste öffentliche Park Südosteuropas, angelegt vom Zagreber Bischof Vrhovac als englischer Landschaftsgarten: 316 Hektar Eichenwald, fünf Seen, Pavillons, der Echo-Pavillon, Spazierwege ohne Ende. Die Zagreber joggen, picknicken und rudern hier; gegenüber liegt das Dinamo-Stadion, im Park der Zoo (kostenpflichtig). Tram 4/7/11/12 bis 'Bukovačka'.","lat":45.823,"lon":16.019,"adresse":"Maksimirski perivoj, 10000 Zagreb","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Park frei; Zoo kostet extra (nicht geprüft)"},"kostenlos":{"immer":true,"regeln":["Park immer frei"],"termine_im_aufenthalt":["2027-06-07","2027-06-08","2027-06-09","2027-06-10"],"hinweis":null},"oeffnungszeiten":"immer (Parkcafé und Zoo ca. 9:00–20:00)","ruhetag":null,"reservierung":"nein","tipp":"Vom Haupteingang zur 'Vidikovac'-Aussichtsterrasse, dann am dritten See entlang – die Runde dauert eine Stunde. Mit Mirogoj kombinieren (beide im Nordosten).","link":"https://www.park-maksimir.hr/","quelle":null,"preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":3.4},{"id":"msu","name":"Museum für zeitgenössische Kunst (MSU)","kategorie":"museum","muss":2,"kurz":"Kroatiens größtes Kunstmuseum in Novi Zagreb – mit Carsten Höllers Rutsche","beschreibung":"Der Igor-Franić-Bau von 2009 in den sozialistischen Plattenbauvierteln südlich der Save ist schon selbst ein Grund hinzufahren. Drinnen 'Sammlungen in Bewegung' – Abramović, EXAT 51, Gorgona, Neue Tendenzen, jugoslawische Konzeptkunst – und Carsten Höllers doppelte Rutsche, mit der man vom 3. Stock ins Erdgeschoss saust. Tram 6/7/14 bis 'Muzej suvremene umjetnosti'.","lat":45.7767,"lon":15.9789,"adresse":"Avenija Dubrovnik 17, 10010 Zagreb","dauer_min":120,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Offizielle Seite (msu.hr) nicht erreichbar (Zertifikatsfehler). Laut Reiseportal 'ab 5 €'; Studi-Tarif existiert. Vor Ort prüfen."},"kostenlos":{"immer":false,"regeln":["Gratistage nur anlassbezogen (Museumstag 18.05., Stadtfest 31.05., Hitzewellen für Zagreber) – kein regelmäßiger Gratistag gefunden"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Di–So (Sa oft bis 20:00); Zeiten 2027 auf msu.hr prüfen","ruhetag":"Montag","reservierung":"nein","tipp":"Die Rutsche ist ab 1,20 m Körpergröße für alle – nimm sie beim Rausgehen. Dachterrasse mit Blick auf die Save-Hochhäuser.","link":"https://www.msu.hr/","quelle":"https://entercroatia.com/cities/zagreb/museum-of-contemporary-art-zagreb/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Website nicht ladbar; Preis nur aus Sekundärquelle, deshalb nicht als Zahl eingetragen.","dist_km":3.9},{"id":"sljeme","name":"Medvednica / Sljeme mit der Seilbahn","kategorie":"tagesausflug","muss":2,"kurz":"In 20 Minuten von der Stadt auf 1.033 m: Wald, Hütten, Blick bis zu den Alpen","beschreibung":"Der Hausberg der Zagreber beginnt am Nordrand der Stadt. Die 2022 eröffnete Kabinenbahn fährt von Gračansko Dolje in 16–20 Minuten über 5 km hinauf zum Sljeme-Gipfel (1.033 m). Oben Buchenwald, der Fernsehturm, Berghütten mit Bohneneintopf (grah) und Štrukli, Wanderwege zur Burgruine Medvedgrad (mit Aussicht über die Stadt). Anfahrt: Tram 14 bis Mihaljevac, Bus 15 bis Dolje.","lat":45.8602,"lon":15.9692,"adresse":"Talstation Gračansko Dolje, 10000 Zagreb","dauer_min":300,"preis":{"erwachsene":10.0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":10.0,"hinweis":"Nicht-Zagreber: 6 € einfach, 10 € hin und zurück. 15–24-Jährige und Studierende zahlen reduziert (bei Eröffnung 2022 ca. 60 % des Vollpreises; aktuell laut Presse ca. 2–4 € – unklar, ob das für Auswärtige gilt). Zagreber fahren seit 2024 gratis."},"kostenlos":{"immer":false,"regeln":["Wanderwege immer frei (zu Fuß hoch ca. 2 h über Bikčevićev put)"],"termine_im_aufenthalt":[],"hinweis":"nur für Zagreber Einwohner gratis"},"oeffnungszeiten":"Werktags ca. 10:00–18:30, Wochenende ab 9:00; Betrieb bei Sturm eingestellt","ruhetag":null,"reservierung":"nein","tipp":"Hoch mit der Bahn (6 €), runter zu Fuß über Medvedgrad (2,5 h) und Bus 102 ab Šestine – spart 4 € und du siehst die Burg. Jacke mitnehmen, oben sind es 8 Grad weniger.","link":"https://www.zet.hr/","quelle":"https://www.index.hr/magazin/clanak/zagrepcani-za-vikend-pojurili-na-sljeme-pred-zicarom-bili-veliki-redovi/2733109.aspx","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Seilbahn-Seite (zicara.hr) nicht erreichbar; Preise laut Index.hr (11/2025) und Croatia Week (Eröffnung 2022).","dist_km":5.4},{"id":"cevapi","name":"Ćevapi am Dolac","kategorie":"essen","muss":1,"kurz":"Zehn Hackröllchen im Lepinja mit Zwiebeln und Ajvar für unter 10 €","beschreibung":"Ćevapi (bzw. ćevapčići) sind das Balkan-Fast-Food schlechthin: gegrillte Hackfleischröllchen im Fladenbrot (lepinja), dazu rohe Zwiebeln, Ajvar und Kajmak. Rund um den Dolac und die Tkalčićeva gibt es Grillbuden und Ketten (Rubelj, Plac Kitchen), eine Portion mit zehn Stück macht satt und kostet weniger als jedes Restaurantgericht.","lat":45.8143,"lon":15.977,"adresse":"Dolac / Tkalčićeva, 10000 Zagreb","dauer_min":30,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Portion ca. 7–9 € (Erfahrungswert)"},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"tägl. ca. 10:00–23:00","ruhetag":null,"reservierung":"nein","tipp":"'Deset u lepinji s lukom' bestellen – zehn im Brot mit Zwiebeln. Burek vom Bäcker (2–3 €) ist die noch billigere Frühstücksvariante.","link":null,"quelle":null,"preisstand":"2026","unsicher":true,"quelle_hinweis":"Essens-Tipp, Preis nicht offiziell verifiziert.","dist_km":0.3},{"id":"jarun","name":"Jarun-See","kategorie":"strand","muss":1,"kurz":"Zagrebs 'Meer': Kiesstrände, Regattastrecke, abends Clubs","beschreibung":"Ein ehemaliger Save-Baggersee im Südwesten, 1987 für die Universiade zur Regattastrecke ausgebaut: 2 km lang, Kiesstrände, Liegewiesen, Skater-Rundweg, Verleih für Tretboote und SUP. Anfang Juni ist das Wasser bade- bis frischwarm. Abends wird das Ostufer zur Clubmeile ('Jarunska plaža'). Tram 5/17 bis 'Jarun'.","lat":45.783,"lon":15.92,"adresse":"Aleja Matije Ljubeka, 10000 Zagreb","dauer_min":150,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-07","2027-06-08","2027-06-09","2027-06-10"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Nur wenn es richtig heiß ist. Südufer (Veliko jezero) ist ruhiger als die Clubseite. Ćevapi gibt es an den Kiosken am Ostufer.","link":"https://www.infozagreb.hr/","quelle":null,"preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":5.5}],"tage":[{"datum":"2027-06-07","titel":"Ankommen, Naive Kunst, Mirogoj, Brokenships","intro":"Montag ist Museumsruhetag – bis auf zwei Ausnahmen, die beide heute drankommen: das Museum für naive Kunst (Mo–Fr) und das Museum der zerbrochenen Beziehungen (täglich bis 22 Uhr). Dazwischen Kathedrale und der Mirogoj-Friedhof, der keinen Ruhetag kennt.","programm":[{"spot":null,"zeit":"14:00","titel":"Einchecken","notiz":"Apartment in der Unterstadt, alles Weitere zu Fuß."},{"spot":"hmnu","zeit":"15:00","notiz":"Mo–Fr 9–17 Uhr, Einlass bis 16:30, 1. Stock ohne Aufzug. Hinterglasmalerei der Hlebine-Schule, 45 Minuten."},{"spot":"kathedrale","zeit":"16:00","notiz":"Durch das Steinerne Tor runter nach Kaptol, bis ca. 17 Uhr offen. Hinten an der Ribnjak-Seite steht die abgebrochene Turmspitze von 2020."},{"spot":"mirogoj","zeit":"16:45","notiz":"Bus 106 vor der Kathedrale, 10 Minuten bis zum Haupteingang. Erst die Arkaden links und rechts, dann querfeldein. Bis 20 Uhr, frei."},{"spot":"tkalciceva","zeit":"18:45","notiz":"Abendessen in den Seitengassen Skalinska oder Opatovina – gleiche Küche, 20 % billiger. Craft-Bier im Craft Room."},{"spot":"brokenships","zeit":"20:15","notiz":"5 Minuten hoch in die Oberstadt. Nach 19 Uhr sind die Tagestouristen weg, offen bis 22 Uhr."}]},{"datum":"2027-06-08","titel":"Oberstadt, Mittagsschuss, Štrukli, Tesla","intro":"Der Oberstadt-Tag nach dem Fahrplan der Kanone: mit der Standseilbahn hoch, Markuskirche und Strossmayer-Promenade, um 11:50 oben im Lotrščak-Turm für den Mittagsschuss. Nachmittags ins Tesla-Museum zur Hochspannungsvorführung, abends Zrinjevac.","programm":[{"spot":"uspinjaca","zeit":"09:30","notiz":"Einmal hoch, 0,66 €, Ticket am Häuschen unten. Kurz vor 12 ist Schlange – deshalb jetzt."},{"spot":"gornji-grad","zeit":"09:45","notiz":"Markuskirche, Steinernes Tor, Strossmayer-Promenade. Alles frei, zwei Stunden mit Pausen."},{"spot":"lotrscak","zeit":"11:45","notiz":"Um 11:50 oben sein, der Schuss fällt vom 4. Stock – Ohren zuhalten. Di–Fr 9–20 Uhr."},{"spot":"strukli","zeit":"12:30","notiz":"Runter zur La Štruk, Mittagszeit heißt kurz warten – oder erst um 15 Uhr nach dem Tesla-Museum."},{"spot":"tmnt","zeit":"14:30","notiz":"20 Minuten nach Südwesten. Vorher auf tmnt.hr die Vorführzeiten für Tesla-Kabinett und Planetarium prüfen und den Besuch danach legen."},{"spot":"zrinjevac","zeit":"17:30","notiz":"Bier vom Kiosk, Bank unter den Platanen – im Juni oft Open-Air am Pavillon."}]},{"datum":"2027-06-09","titel":"Sljeme mit der Seilbahn, Maksimir, Ćevapi","intro":"Raus aus der Stadt: Tram 14 bis Mihaljevac, Bus 15 nach Dolje, Seilbahn auf 1.033 m. Hoch mit der Bahn, runter zu Fuß über die Burg Medvedgrad – spart 4 € und du siehst die Burg. Jacke mitnehmen, oben sind es 8 Grad weniger. Abends ein Parkspaziergang im Maksimir und Ćevapi am Dolac.","programm":[{"spot":"sljeme","zeit":"09:30","notiz":"Seilbahn werktags ab 10 Uhr, 6 € hoch. Runter über Medvedgrad (2,5 h) und Bus 102 ab Šestine. Bei Sturm fährt die Bahn nicht – dann zu Fuß über den Bikčevićev put, 2 h."},{"spot":"maksimir","zeit":"16:30","notiz":"Mit der Tram in den Nordosten. Vom Haupteingang zur Vidikovac-Terrasse, am dritten See entlang – eine Stunde Runde, frei."},{"spot":"cevapi","zeit":"19:30","notiz":"'Deset u lepinji s lukom' – zehn im Brot mit Zwiebeln, unter 10 €."}]},{"datum":"2027-06-10","titel":"Frühstück am Dolac, Weiterfahrt","intro":"Letzter Morgen: Frühstück auf dem Markt wie die Zagreber, dann zum Zug. Gepäck bis 10:30 holen.","programm":[{"spot":"dolac","zeit":"08:00","notiz":"'Sir i vrhnje' von einer der Bäuerinnen plus Brot aus der Halle, auf die Treppe setzen. Kumica-Statue am Treppenaufgang."},{"spot":null,"zeit":"09:30","titel":"Auschecken","notiz":"Gepäck holen, Burek vom Bäcker für die Fahrt."},{"spot":null,"zeit":"10:30","titel":"Zum Bahnhof","notiz":"Zu Fuß durch die Unterstadt."}]}],"naechte":3},{"id":"bled","name":"Bled & Julische Alpen","land":"Slowenien","landcode":"SI","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-06-10","abreise":"2027-06-17","unterkunft":{"name":"Apartments Malivojevič","ort":"Žirovnica","lat":46.404,"lon":14.144,"hinweis":"Lage grob (0,4 km vom Dorfzentrum Žirovnica laut Portalen). Bahnhof Žirovnica an der Strecke Jesenice–Ljubljana; nach Bled eine Station bis Lesce-Bled, von dort Bus oder 50 min zu Fuß zum See."},"zentrum":{"lat":46.363,"lon":14.094},"intro":"Eine Woche unterm Stol: Žirovnica liegt zwischen Bled und Jesenice, ruhig und ohne Touristenpreise. Rechne mit zwei Tagen Bled (See, Burg, Insel, Aussichtspunkte), einem Tag Vintgar plus Radovljica, einem Tag Bohinj, einem Bergtag (Pokljuka oder Završnica/Stol), einem Tag Ljubljana per Zug und einem Puffertag fürs Wetter. Juni ist im Alpenraum der nasseste Monat: Gewitter ab Mittag, oberhalb 2000 m liegen noch Schneefelder — Bergtouren morgens starten, Museen und Ljubljana auf Regentage legen.","feiertage":[],"gut_zu_wissen":[{"titel":"Gästekarte Julian Alps","text":"Die kostenlose „Julian Alps Card: Bled“ (Bled Bus gratis, 10 % auf die Burg, 1 Sesselliftfahrt Straža, Mostnica-Klamm frei) bekommen nur Gäste von Partnerbetrieben des Bled Tourist Board ab 3 Nächten — Žirovnica ist eine eigene Gemeinde, eine eigene Žirovnica-Karte gibt es nicht. Frag den Vermieter beim Buchen trotzdem, ob er irgendeine Gästekarte ausstellt (Stand 2026: nicht bestätigt). Ohne Karte: Bled Bus 5 €/Tag, Bohinj-Ortsbus 2 €/24 h."},{"titel":"Hinkommen von Žirovnica","text":"Interrail gilt bei den Slowenischen Eisenbahnen (SŽ): Žirovnica → Lesce-Bled 1 Station (~5 min, stündlich), Žirovnica → Ljubljana ~55–65 min direkt. Bled selbst hat zwar den Bahnhof Bled Jezero, der liegt aber an der Bohinj-Strecke (Jesenice–Bohinjska Bistrica–Nova Gorica) — mit Umstieg in Jesenice erreichst du damit Bled Jezero und Bohinjska Bistrica per Interrail. Busse (Arriva) fahren Lesce-Bled ↔ Bled ↔ Bohinj stündlich; Bled–Bohinj kostet laut Blogs ca. 4 € (2026, nicht offiziell geprüft). Fahrräder leihen lohnt: Žirovnica–Bled sind 8 flache Kilometer."},{"titel":"Bled Bus (Hop-on, Sommer)","text":"1. Juni–30. September (2026) fahren organisierte Linien ab Bled Busbahnhof: Pokljuka-Linie (Rudno polje), Landschafts-Linie, See-Linie, Radovljica-Linie. Tagespass 5 €, gratis mit Julian Alps Card. Fahrplan 2027 wird im Frühjahr veröffentlicht."},{"titel":"Preise 2026 → 2027","text":"Burg (19 €), Insel (12 €), Vintgar (15 €), Vogel (32 €) haben 2025 und 2026 jeweils angezogen; rechne für 2027 mit 1–2 € mehr. Studierendenausweis (ISIC oder deutscher Studi-Ausweis) spart bei Burg, Insel, Vogel (bis 23) und den Museen; einen Unter-26-Tarif gibt es in Slowenien nicht."},{"titel":"Geld & Essen","text":"Euro, Karte fast überall, Leitungswasser top. Trinkgeld: aufrunden, 5–10 % im Restaurant. Am See ist alles doppelt so teuer wie in Žirovnica oder Radovljica — Mittag in Radovljica (Gostilna Lectar, Avguštin) oder im Supermarkt in Žirovnica/Lesce, Kremšnita als Belohnung in Bled."}],"spots":[{"id":"vintgar","name":"Vintgar-Klamm","kategorie":"natur","muss":3,"kurz":"1,6 km Holzstege über der smaragdgrünen Radovna — nur mit Online-Zeitfenster","beschreibung":"Die Radovna hat sich hier 250 m tief eingeschnitten; auf Holzstegen und Brücken gehst du 1,6 km durch die Klamm bis zum 13 m hohen Šum-Wasserfall. Seit 2026 gilt Einbahnbetrieb mit Zeitfenster und Tagesdeckel: Du buchst den „All-in-One Pass“ online, läufst einmal durch und kehrst über einen von zwei Themenwegen (ca. 1 h) nach Podhom zurück. Shuttle vom Busbahnhof Bled zum Eingang ist im Ticket drin.","lat":46.3936,"lon":14.0876,"adresse":"Podhom 80, 4247 Zgornje Gorje","dauer_min":180,"preis":{"erwachsene":15,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":15,"hinweis":"All-in-One Pass 15 € (Klamm 10 € + Rückweg-Erlebnis 2,50 € + Shuttle/Parken 2,50 €, Audioguide inklusive), Kinder bis 15 J. 5 €. Kein Studierendentarif ausgewiesen."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"1. Juni–5. Juli 8:00–17:00 (2026); Shuttle ab 20 min vor Öffnung bis 2 h nach Schluss, ab Busbahnhof Bled alle 15 min","ruhetag":null,"reservierung":"nötig","tipp":"Zeitfenster 8:00 oder nach 15:00 buchen — zwischen 10 und 13 Uhr ist es am vollsten. Mindestens ein paar Tage vorher auf tickets.vintgar.si reservieren, im Juni sind Vormittagsslots schnell weg. Bei Starkregen schließt die Klamm.","link":"https://vintgar.si/en/","quelle":"https://www.vintgar.si/en/?p=3232","preisstand":"2026","unsicher":false,"quelle_hinweis":"Zeitfenster-Buchung: https://tickets.vintgar.si/","dist_km":4.5},{"id":"burg-bled","name":"Burg Bled","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"130 m über dem See, älteste Burg Sloweniens, bester Blick auf die Insel","beschreibung":"Die Burg thront auf dem Felsen über dem Nordufer. Oben: zwei Höfe, Museum zur Bleder Geschichte, Burgkapelle, Druckerei mit Gutenberg-Presse, Weinkeller und die Terrasse mit dem Blick, den jeder von Bled kennt. Der Eintritt ist happig, aber die Aussicht gibt's nur hier — die Alternativen Ojstrica/Osojnica zeigen die Burg von außen.","lat":46.3698,"lon":14.1007,"adresse":"Grajska cesta 61, 4260 Bled","dauer_min":90,"preis":{"erwachsene":19,"ermaessigt":11.5,"unter26":null,"waehrung":"EUR","eur":19,"hinweis":"Erwachsene 19 €, Studierende 11,50 € (nur an der Burgkasse mit Ausweis), Kinder 6–14 J. 7 €, Senioren 16 €. 10 % mit Julian Alps Gästekarte. Preisliste „gültig ab 1.1.2025“, online 2026 so ausgewiesen."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":"Keine Gratistage. Der Aufstiegsweg bis zum Burgtor ist frei."},"oeffnungszeiten":"April–Oktober tägl. 8:00–20:00","ruhetag":null,"reservierung":"nein","tipp":"Zu Fuß hoch über den Waldpfad ab der Pfarrkirche St. Martin (15 min) statt mit dem Bus. Studierendenticket gibt es nur an der Kasse, nicht online. Ab 18 Uhr leer und Abendlicht auf der Insel.","link":"https://www.blejski-grad.si/en","quelle":"https://www.blejski-grad.si/en/plan-your-visit/price-list/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":5.0},{"id":"bleder-see-rundweg","name":"Bleder See – Rundweg","kategorie":"natur","muss":3,"kurz":"6 km ebene Runde um den See, Insel und Burg immer im Blick","beschreibung":"Der Uferweg führt in gut 1,5 Stunden einmal um den See: Promenade in Bled, dann Mlino und Velika Zaka mit den klassischen Postkartenblicken auf Insel und Burgfelsen. Baden ist an mehreren Stellen möglich (Velika Zaka, Grajsko kopališče kostet), das Wasser hat im Juni 18–20 °C. Morgens vor 9 Uhr ist der Weg fast leer.","lat":46.363,"lon":14.094,"adresse":"Cesta svobode, 4260 Bled","dauer_min":100,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Uferweg frei; Burgbad (Grajsko kopališče) kostet Eintritt"},"kostenlos":{"immer":true,"regeln":["Uferweg immer frei"],"termine_im_aufenthalt":["2027-06-10","2027-06-11","2027-06-12","2027-06-13","2027-06-14","2027-06-15","2027-06-16","2027-06-17"],"hinweis":null},"oeffnungszeiten":"immer zugänglich","ruhetag":null,"reservierung":"nein","tipp":"Gegen den Uhrzeigersinn starten (Bled → Mlino → Zaka): dann hast du die Burg am Ende im Abendlicht. Von Velika Zaka direkt auf die Ojstrica abzweigen.","link":"https://www.bled.si/en/","quelle":"https://www.bled.si/en/what-to-see-do/attractions/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":6.0},{"id":"bleder-insel","name":"Bleder Insel (Pletna + Marienkirche)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Mit dem Pletna-Ruderboot zur Wallfahrtskirche mit der Wunschglocke","beschreibung":"Die einzige Insel Sloweniens: 99 Stufen hoch zur Marienkirche, drinnen läutest du die Wunschglocke, dazu Glockenturm mit Pendeluhr und kleine Ausstellung. Hin kommst du mit den traditionellen Pletna-Booten (Rudern von Hand, ab Promenade/Mlino/Velika Zaka, ca. 30–40 min Aufenthalt) oder du leihst ein Ruderboot und ruderst selbst. Die Inselgebühr (Kirche + Turm + Museum) kostet extra.","lat":46.3621,"lon":14.0894,"adresse":"Blejski otok, 4260 Bled","dauer_min":120,"preis":{"erwachsene":12,"ermaessigt":10.5,"unter26":null,"waehrung":"EUR","eur":12,"hinweis":"Inselgebühr 12 € (Kirche, Glockenturm, Museum), Studierende/Senioren 10,50 €, Kinder bis 15 J. 5 €. Pletna-Boot zusätzlich: 20 € pro Person hin und zurück (Stand Januar 2025, Presse), bar an den Bootsführer."},"kostenlos":{"immer":false,"regeln":["Insel von außen (Ufer, Stufen) ohne Ticket betretbar, Kirche nur mit Gebühr"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mai–September tägl. 8:30–19:00","ruhetag":null,"reservierung":"nein","tipp":"Alternative: Ruderboot leihen statt Pletna (Preis pro Boot/Stunde, in Mlino oder Velika Zaka fragen) — du bist flexibel; ob es allein günstiger als die 20 € kommt, hängt vom Stundenpreis ab. Pletna früh um 9 Uhr nehmen, später Schlange.","link":"https://www.blejskiotok.si/en/","quelle":"https://www.blejskiotok.si/en/welcome-to-the-island/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Inselgebühr von der offiziellen Inselseite. Pletna-Preis 20 € stammt aus einem Pressebericht (n1info, Jan 2025) — bled.si nennt keinen Preis; 2027 eher 22 €.","dist_km":6.3},{"id":"ojstrica-osojnica","name":"Ojstrica & Mala Osojnica","kategorie":"aussicht","muss":3,"kurz":"Die Postkartenblicke auf Insel und Burg — kostenlos, 20–45 min Aufstieg","beschreibung":"Vom Südwestufer (Velika Zaka, hinter dem Campingplatz) führen steile Waldpfade auf die Ojstrica (611 m, ca. 20 min) und die Mala Osojnica (685 m, ca. 45 min, Leiterpassage). Von oben siehst du die Insel mittig im See, dahinter die Burg und die Karawanken. Das ist das Foto, das jeder von Bled kennt — und es kostet nichts.","lat":46.3568,"lon":14.0818,"adresse":"Trailhead: Camping Bled, Kidričeva cesta 10c, Velika Zaka","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-10","2027-06-11","2027-06-12","2027-06-13","2027-06-14","2027-06-15","2027-06-16","2027-06-17"],"hinweis":null},"oeffnungszeiten":"immer; Sonnenaufgang (Juni ca. 5:15) ist die klassische Zeit","ruhetag":null,"reservierung":"nein","tipp":"Feste Schuhe, der Pfad ist nach Regen rutschig. Erst Ojstrica, dann weiter zur Mala Osojnica, Abstieg nach Velika Zaka — danach ins Wasser.","link":"https://www.bled.si/en/what-to-see-do/attractions/4/ojstrica","quelle":"https://www.bled.si/en/what-to-see-do/attractions/5/mala-and-velika-osojnica","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":7.1},{"id":"bohinj-see","name":"Bohinjer See","kategorie":"natur","muss":3,"kurz":"Der wilde Bruder des Bleder Sees — Triglav-Nationalpark, kaum Bebauung","beschreibung":"Bohinj ist größer, kälter und leerer als Bled: ein Gletschersee mitten im Nationalpark, am Ostufer das Dorf Ribčev Laz mit der Steinbrücke und der Johanneskirche, am Westufer Ukanc. Ein Tag reicht für Uferweg (12 km Rundweg, oder Südufer-Pfad hin und per Bus zurück), Baden und entweder Vogel-Seilbahn oder Savica-Wasserfall. Mostnica-Klamm bei Stara Fužina ist eine ruhige Alternative zur Vintgar.","lat":46.2779,"lon":13.8888,"adresse":"Ribčev Laz, 4265 Bohinjsko jezero","dauer_min":420,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"See und Uferwege frei. Bohinj-Ortsbusse 2 €/24 h (Erwachsene). Anreise Arriva-Bus ab Bled ca. 4 € (Blogs 2026) oder Interrail bis Bohinjska Bistrica + Ortsbus."},"kostenlos":{"immer":true,"regeln":["See und Uferwege immer frei"],"termine_im_aufenthalt":["2027-06-10","2027-06-11","2027-06-12","2027-06-13","2027-06-14","2027-06-15","2027-06-16","2027-06-17"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Mit Interrail: Zug Žirovnica → Jesenice → Bohinjska Bistrica (Bohinj-Bahn, Umstieg Jesenice), dort in den 2-€-Ortsbus zum See. Hin am Nordufer wandern, zurück ab Ukanc mit dem Bus. Erster Sonntag im Monat ist der Savica-Fall frei — fällt 2027 nicht in deine Woche.","link":"https://www.bohinj.si/en/","quelle":"https://promet.bohinj.si/en/organised-transport/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Arriva-Fahrpreis Bled–Bohinj (ca. 4 €) nicht von arriva.si geprüft — Seite blockierte den Abruf.","dist_km":24.1},{"id":"ljubljana","name":"Tagesausflug Ljubljana","kategorie":"tagesausflug","muss":3,"kurz":"Eine Stunde Zug: Plečnik-Stadt, Burg, Drachenbrücke, Metelkova","beschreibung":"Ljubljana ist klein genug für einen Tag: vom Bahnhof 10 min zum Prešeren-Platz mit den Drei Brücken, Markt-Arkaden von Plečnik, Drachenbrücke, dann mit der Standseilbahn oder zu Fuß (15 min) auf die Burg — Innenhof und Wehrgang kostenlos, Aussichtsturm, Museum und Virtuelle Burg mit Ticket. Nachmittags Altstadt am Fluss, abends Metelkova, das besetzte Ex-Kasernengelände mit Street-Art und Bars (frei, lebt erst ab 22 Uhr).","lat":46.0489,"lon":14.5085,"adresse":"Grajska planota 1, 1000 Ljubljana (Burg)","dauer_min":540,"preis":{"erwachsene":19,"ermaessigt":13.5,"unter26":null,"waehrung":"EUR","eur":19,"hinweis":"Burgticket inkl. Standseilbahn 19 € (online 17,10 €), Studierende 13,50 € (online 12,15 €). Ohne Bahn 15 € / 10,50 €. Nur Standseilbahn hin+zurück 6 € / 4,50 €. Zug Žirovnica–Ljubljana mit Interrail frei."},"kostenlos":{"immer":false,"regeln":["Burg-Innenhof, Wehrgang und Burgweg immer frei","Drachenbrücke, Markt, Metelkova immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Burg Mai–Sep 9:00–20:00 (letzter Ticketkauf 1 h vorher), Standseilbahn 9:00–22:00; Zentralmarkt Mo–Sa vormittags","ruhetag":null,"reservierung":"nein","tipp":"Burg zu Fuß hoch (Študentovska pot ab Ciril-Metodov trg, 15 min) und nur Hof + Wehrgang — kostet nichts und reicht den meisten. Freitags im Sommer „Odprta kuhna“ (Open Kitchen) auf dem Pogačar-Platz: Streetfood aller Ljubljana-Restaurants, ab 10 Uhr — dein Freitag ist der 11.06.","link":"https://www.ljubljanskigrad.si/en/","quelle":"https://www.ljubljanskigrad.si/en/tickets/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Odprta kuhna: Termine 2027 nicht geprüft, findet seit Jahren freitags März–Oktober statt.","dist_km":48.4},{"id":"pot-kulturne-dediscine","name":"Pfad des kulturellen Erbes & Prešeren-Geburtshaus Vrba","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Dorfrunde unterm Stol zu den Geburtshäusern von Prešeren, Finžgar und Čop","beschreibung":"Die Dörfer der Gemeinde Žirovnica haben mehr slowenische Dichter hervorgebracht als jede andere Ecke des Landes. Der ausgeschilderte Rundweg verbindet Vrba (Geburtshaus von France Prešeren, dem Nationaldichter — Februar 2026 nach Renovierung mit neuem Interpretationszentrum wiedereröffnet), Doslovče (Finžgar), Žirovnica (Čop), Breznica (Janšas Bienenhaus, der Vater der modernen Imkerei) und die Lindenallee von Vrba. Für ein Nachmittag von der Haustür aus.","lat":46.3987,"lon":14.1544,"adresse":"Vrba 2, 4274 Žirovnica (Prešeren-Haus)","dauer_min":180,"preis":{"erwachsene":3,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":3,"hinweis":"Prešeren-Haus 3 €, Schüler 2 €, Senioren/Gruppen 2,70 € (Preise vor der Renovierung; 2026 evtl. höher). Rundweg frei."},"kostenlos":{"immer":false,"regeln":["Rundweg und Dörfer immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Prešeren-Haus Di–Fr 9:00–16:00, Sa–So 10:00–17:00","ruhetag":"Montag","reservierung":"nein","tipp":"Wer ein bisschen Slowenisch-Pathos will: Prešerens „Zdravljica“ ist die Nationalhymne — die Strophe steht an der Hauswand. Für den Pfad die Karte vom TIC Žirovnica (Žirovnica 14) holen.","link":"https://visitzirovnica.si/en/","quelle":"https://visitzirovnica.si/en/?p=4945","preisstand":"2026","unsicher":true,"quelle_hinweis":"Preise und Zeiten stammen von der Gemeindeseite, aber vor der Wiedereröffnung Februar 2026 — Zeitenangabe dort widersprüchlich (Di–Sa 9–16 vs. Sa–So 10–17). Kurz vor Reise prüfen.","dist_km":1.0},{"id":"zavrsnica","name":"Završnica-Tal","kategorie":"natur","muss":2,"kurz":"Dein Hausgebirge: Stausee, Almwege und der Aufstieg zum Stol (2.236 m)","beschreibung":"Direkt hinter Žirovnica öffnet sich das Završnica-Tal in die Karawanken: unten ein kleiner Stausee mit Picknickwiesen und Erlebnispfad, dahinter der Weg zur Valvasor-Hütte (1.181 m, ca. 1,5 h) und weiter auf den Stol, den höchsten Karawanken-Gipfel (ab Hütte nochmal 2,5–3 h, Juni: Schneefelder möglich). Zu Fuß von der Unterkunft erreichbar, kein Bus nötig.","lat":46.4167,"lon":14.1406,"adresse":"Završnica, 4274 Žirovnica","dauer_min":240,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Frei. Parkplatz am Stausee kostenpflichtig (für dich irrelevant). Mietbare Picknickhütten 50/100 € — nicht nötig."},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-10","2027-06-11","2027-06-12","2027-06-13","2027-06-14","2027-06-15","2027-06-16","2027-06-17"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Ankunftsabend: 30 min zum Stausee spazieren. Stol nur bei stabilem Wetter und früh (6 Uhr) — oben ist Grenzkamm zu Österreich mit Blick bis zum Triglav. Valvasor-Hütte bewirtschaftet, Jota und Štruklji.","link":"https://visitzirovnica.si/en/","quelle":"https://visitzirovnica.si/en/piknik-prostori-v-zavrsnici/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.4},{"id":"kremsnita","name":"Kremšnita in der Kavarna Park","kategorie":"essen","muss":2,"kurz":"Die Original-Bleder Cremeschnitte, seit 1953 nach demselben Rezept","beschreibung":"Blätterteig, dicke Vanillecreme, Sahne, Puderzucker — 7 × 7 cm, seit 1953 im Hotel Park gebacken, über 15 Millionen Stück. Die Kavarna Park an der Promenade ist das Original (Blick auf See und Burg inklusive), die Schlange mittags entsprechend. Günstiger und ebenso gut: Slaščičarna Zima oder Kavarna Šmon ein paar Straßen landeinwärts.","lat":46.3659,"lon":14.112,"adresse":"Cesta svobode 15, 4260 Bled","dauer_min":45,"preis":{"erwachsene":6.5,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":6.5,"hinweis":"Kavarna Park 6,50 € (Aug 2024); Zima 5,20 €, Šmon 4,40 €, Belvedere 9 €. 2027 rechne mit +1 €."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"tägl. ca. 8:00–22:00","ruhetag":null,"reservierung":"nein","tipp":"Eine teilen reicht — das Ding ist riesig. Nicht die Sorte „gefroren“ in Hotelkühlvitrinen am Ufer nehmen, sondern dort, wo sie vor Ort geschnitten wird.","link":"https://www.sava-hotels-resorts.com/en/sava-hotels-bled/","quelle":"https://www.the-slovenia.com/slovenija/kremsnite-na-bledu-koliko-boste-danes-odsteli-za-najbolj-znano-slovensko-sladico/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Preisvergleich aus einem Presseartikel (Aug 2024, von n1info 2026 wiederholt), keine offizielle Karte online.","dist_km":4.9},{"id":"radovljica","name":"Radovljica – Altstadt & Imkereimuseum","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Mittelalterlicher Marktplatz ohne Touristenmassen, Bienenstock-Malerei im Museum","beschreibung":"Radovljica liegt 7 km von Bled auf einer Terrasse über der Sava: ein einziger gotisch-barocker Platz (Linhartov trg) mit Fresken, Arkaden und dem Thurn-Herrenhaus, darin das Imkereimuseum. Dort hängen hunderte bemalte Bienenstock-Brettchen (panjske končnice) — slowenische Volkskunst, die es nirgends sonst gibt — und ein lebender Stock mit der Krainer Biene. Dazu im selben Haus das Stadtmuseum (Kombiticket).","lat":46.3441,"lon":14.1739,"adresse":"Linhartov trg 1, 4240 Radovljica","dauer_min":150,"preis":{"erwachsene":8,"ermaessigt":6,"unter26":null,"waehrung":"EUR","eur":8,"hinweis":"Imkereimuseum 8 €, Studierende/Rentner 6 €, Kinder 5 €. Kombi mit Stadtmuseum 10 € / erm. 8 €. Altstadt frei."},"kostenlos":{"immer":false,"regeln":["Altstadt immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Museum Di–So 10:00–18:00","ruhetag":"Montag","reservierung":"nein","tipp":"Von Žirovnica ist Radovljica näher als Bled — Zug bis Lesce-Bled (eine Station) und 20 min zu Fuß, oder Rad. Montag ist das Museum zu, dann nur Platz und Lectar.","link":"https://www.radolca.si/en/","quelle":"https://www.radolca.si/en/attractions/museums-and-galleries/museum-of-apiculture-radovljica","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":7.0},{"id":"pokljuka","name":"Pokljuka-Hochplateau / Rudno polje","kategorie":"natur","muss":2,"kurz":"Fichtenwälder auf 1.300 m, Almen und der Viševnik — Triglav zum Anfassen","beschreibung":"Pokljuka ist das Waldplateau zwischen Bled und Bohinj im Triglav-Nationalpark. Vom Biathlonzentrum Rudno polje (1.347 m) führen Wege zu den Almen Uskovnica und Lipanca und auf den Viševnik (2.050 m, ca. 1,5 h Aufstieg, der leichteste 2.000er mit Triglav-Blick). Im Juni blühen die Almwiesen, oben kann noch Altschnee liegen.","lat":46.3464,"lon":13.9254,"adresse":"Rudno polje, Pokljuka, 4247 Zgornje Gorje","dauer_min":360,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Nationalpark frei. Anfahrt: Bled-Bus Pokljuka-Linie, Tagespass 5 € (gratis mit Julian Alps Card)."},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-06-10","2027-06-11","2027-06-12","2027-06-13","2027-06-14","2027-06-15","2027-06-16","2027-06-17"],"hinweis":null},"oeffnungszeiten":"immer; Bled-Bus Juni–September (Fahrplan 2027 ab Frühjahr)","ruhetag":null,"reservierung":"nein","tipp":"Ersten Bus nehmen, Viševnik vormittags, bis 14 Uhr wieder am Rudno polje — Juni-Gewitter kommen nachmittags. Jause mitnehmen, oben gibt es nur die Almhütte.","link":"https://www.bled.si/en/information/getting-around-bled/2023053015294502/bled-bus/","quelle":"https://www.bled.si/en/information/getting-around-bled/2023053015294502/bled-bus/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":18.0},{"id":"vogel","name":"Vogel-Seilbahn (1.535 m)","kategorie":"aussicht","muss":2,"kurz":"In 4 Minuten 1.000 Höhenmeter: Blick auf Bohinjer See und Triglav","beschreibung":"Die Kabinenbahn ab Ukanc bringt dich auf 1.535 m zum Ski-Hotel; von der Terrasse liegt der ganze See unter dir, gegenüber der Triglav. Oben leichte Wanderwege (Orlove glave, Šija), im Juni oft noch Schneereste über 1.800 m. Teuer für die Fahrzeit, aber der schnellste Weg zu einem echten Hochgebirgsblick.","lat":46.2749,"lon":13.8402,"adresse":"Ukanc 6, 4265 Bohinjsko jezero (Talstation)","dauer_min":180,"preis":{"erwachsene":32,"ermaessigt":28,"unter26":null,"waehrung":"EUR","eur":32,"hinweis":"Frühjahrstarif 24.4.–30.6.2026: Rückfahrkarte 32 €, Jugend 15–23 J./Senioren 28 €, Kinder 6–14 J. 15 €; einfache Fahrt 24 €. Ab 1.7. 35 €. Kein eigener Studierendentarif — wer 23 oder jünger ist, zahlt 28 €."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"tägl. 8:00–18:00, alle 30 min","ruhetag":null,"reservierung":"nein","tipp":"Nur bei klarer Sicht fahren (Webcam vogel.si vorher checken). Bergfahrt mit der Bahn, Abstieg zu Fuß nach Ukanc spart 8 € — 2,5 h steil, gute Schuhe. Bus ab Ribčev Laz bis Haltestelle Vogel.","link":"https://www.vogel.si/en","quelle":"https://vogel.si/wp-content/uploads/2026/04/Cenik_poletje-Price_list_summer_2026.pdf","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":27.4},{"id":"savica","name":"Savica-Wasserfall","kategorie":"natur","muss":2,"kurz":"78 m hoher A-förmiger Fall, 20 min Treppe durch den Wald","beschreibung":"Am Westende des Bohinjer Tals stürzt die Savica aus einer Karstquelle 78 m in einen grünen Kessel — Slowenien's Nationaldichter Prešeren hat ihn besungen. Vom Parkplatz Koča pri Savici gehst du 20–25 min über 500 Stufen zur Aussichtsplattform. Im Juni führt er nach der Schneeschmelze am meisten Wasser.","lat":46.2866,"lon":13.8018,"adresse":"Ukanc 50, 4265 Bohinjsko jezero (Koča pri Savici)","dauer_min":90,"preis":{"erwachsene":4,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":4,"hinweis":"4 € ab 16 J., unter 16 frei. Mit Julian Alps Card inklusive."},"kostenlos":{"immer":false,"regeln":["Erster Sonntag im Monat frei","unter 16 frei"],"termine_im_aufenthalt":[],"hinweis":"Erste Sonntage 2027: 6. Juni und 4. Juli — beide außerhalb deines Aufenthalts."},"oeffnungszeiten":"Sommer ca. 8:00–19:00 (Aug/Sep 2026 offiziell; Juni-Zeiten nicht veröffentlicht)","ruhetag":null,"reservierung":"nein","tipp":"Sommerbus ab Ribčev Laz/Ukanc fährt bis zum Parkplatz (2-€-Bohinj-Ticket); sonst von Ukanc 1 h zu Fuß. Mit Vogel am selben Tag kombinieren — beides liegt in Ukanc.","link":"https://www.bohinj.si/en/savica-waterfall/","quelle":"https://www.bohinj.si/en/savica-waterfall/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Juni-Öffnungszeiten standen nicht auf der Seite; 8–19 Uhr ist der Sommerwert für August/September.","dist_km":29.3},{"id":"kranjska-gora","name":"Tagesausflug Kranjska Gora – Zelenci & Jasna-See","kategorie":"tagesausflug","muss":2,"kurz":"Türkise Quellseen der Sava, Alpendorf unter dem Vršič-Pass","beschreibung":"Kranjska Gora ist das Skidorf am Ende des Sava-Tals, 35 km von Žirovnica. Hauptgrund: Zelenci, das Naturreservat mit der Sava-Quelle — ein smaragdgrüner Teich, in dem der Sand von unten aufwirbelt, 3 km westlich vom Ort (Radweg, 40 min zu Fuß). Dazu der Jasna-See (2 km südlich, Richtung Vršič) mit Zlatorog-Statue und Badestelle. Alles frei, der Weg über den Vršič-Pass ins Soča-Tal wäre der nächste Schritt.","lat":46.4918,"lon":13.7446,"adresse":"Zelenci, 4280 Kranjska Gora (Podkoren)","dauer_min":420,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Zelenci und Jasna frei. Anreise: Interrail bis Jesenice, dann Arriva-Bus Jesenice–Kranjska Gora (ca. 45 min, Fahrpreis nicht verifiziert, grob 4–5 €) — oder Rad auf dem Radweg D2 auf der alten Bahntrasse ab Jesenice (25 km, leicht bergauf)."},"kostenlos":{"immer":true,"regeln":["Zelenci und Jasna-See immer frei"],"termine_im_aufenthalt":["2027-06-10","2027-06-11","2027-06-12","2027-06-13","2027-06-14","2027-06-15","2027-06-16","2027-06-17"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Beste Variante: Räder in Jesenice oder Žirovnica leihen, auf dem Bahntrassen-Radweg nach Kranjska Gora und Zelenci rollen (nachmittags Rückenwind talabwärts). Zelenci vormittags, dann ist das Wasser am klarsten.","link":"https://www.kranjska-gora.si/en/","quelle":"https://www.kranjska-gora.si/en/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Busfahrpreis Jesenice–Kranjska Gora nicht verifiziert (arriva.si nicht erreichbar).","dist_km":32.1},{"id":"begunje","name":"Begunje – Katzenstein, Draga-Tal, Burgruine Kamen","kategorie":"sehenswuerdigkeit","muss":1,"kurz":"Plečnik-Pavillons, Gestapo-Gedenkstätte und eine Burgruine am Taleingang","beschreibung":"Begunje, 5 km östlich von Žirovnica, hat alles auf engem Raum: das Schloss Katzenstein (heute Psychiatrie, Park mit Plečnik-Pavillons frei zugänglich) war 1941–45 Gestapo-Gefängnis — das Geiselmuseum in einem Seitenflügel erinnert daran, im Draga-Tal dahinter liegt der Geiselfriedhof von Edvard Ravnikar. Am Taleingang die Ruine Kamen (12. Jh., frei), und das Avsenik-Museum erklärt, warum die „Oberkrainer“-Musik von hier kommt.","lat":46.3787,"lon":14.2057,"adresse":"Begunje na Gorenjskem 55, 4275 Begunje","dauer_min":150,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Park, Ruine, Draga-Tal frei. Geiselmuseum 5 € / Studierende 3 € (nur nach Voranmeldung +386 4 532 05 22). Avsenik-Museum Di–So 12–16, Preis nicht veröffentlicht."},"kostenlos":{"immer":true,"regeln":["Park Katzenstein, Burgruine Kamen und Draga-Tal immer frei"],"termine_im_aufenthalt":["2027-06-10","2027-06-11","2027-06-12","2027-06-13","2027-06-14","2027-06-15","2027-06-16","2027-06-17"],"hinweis":null},"oeffnungszeiten":"Außengelände immer; Geiselmuseum nach Anmeldung; Avsenik-Museum Di–So 12:00–16:00","ruhetag":"Montag (Avsenik-Museum)","reservierung":"empfohlen","tipp":"Mit dem Rad von Žirovnica über Rodine (eben, 20 min). Von der Ruine Kamen weiter ins Draga-Tal zur Gostilna Draga — ruhiger Talschluss mit Karawanken-Wänden.","link":"https://radolca.si/en/attractions/interesting-villages-and-towns/begunje-na-gorenjskem","quelle":"https://www.radolca.si/en/attractions/museums-and-galleries/museum-of-hostages","preisstand":"2026","unsicher":true,"quelle_hinweis":"Avsenik-Museum: Eintrittspreis nirgends online gefunden.","dist_km":5.5},{"id":"lectar","name":"Lectar – Lebkuchenwerkstatt & Gostilna","kategorie":"essen","muss":1,"kurz":"Lebkuchenherzen zusehen, dazu deftige Krainer Küche im Gewölbe","beschreibung":"Im Keller der Gostilna Lectar am Marktplatz werden seit 1766 die roten Lebkuchenherzen (lect) von Hand verziert — du kannst zuschauen, solange die Gaststube geöffnet ist. Oben gibt es Buchweizen-Štruklji, Žlikrofi und Krainer Würste zu Preisen, die in Bled undenkbar sind. Zugleich ein Souvenir, das nicht aus China kommt.","lat":46.344,"lon":14.1744,"adresse":"Linhartov trg 2, 4240 Radovljica","dauer_min":75,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Werkstatt frei zugänglich während der Öffnungszeiten der Gostilna; Essen Hauptgericht grob 12–18 €."},"kostenlos":{"immer":true,"regeln":["Werkstatt-Besichtigung frei (ohne Führung)"],"termine_im_aufenthalt":["2027-06-10","2027-06-11","2027-06-12","2027-06-13","2027-06-14","2027-06-15","2027-06-16","2027-06-17"],"hinweis":null},"oeffnungszeiten":"tägl. 12:00–23:00","ruhetag":null,"reservierung":"empfohlen","tipp":"Abends ist die Gaststube voll — mittags nach dem Museum hin. Kleines Herz kaufen, nicht das große: gleiche Handarbeit, halber Preis.","link":"https://www.lectar.com/en/","quelle":"https://www.radolca.si/en/attractions/museums-and-galleries/lectar-honeybread-workshop","preisstand":"2026","unsicher":true,"quelle_hinweis":"Essenspreise sind eine Schätzung; keine Speisekarte online geprüft.","dist_km":7.1},{"id":"kropa","name":"Kropa – Schmiededorf","kategorie":"sehenswuerdigkeit","muss":1,"kurz":"Nagelschmiede-Dorf in einer engen Schlucht, Eisenschmiedemuseum","beschreibung":"Kropa, 10 km südlich von Radovljica, hat 500 Jahre lang Nägel geschmiedet — das Dorf klebt in einer Schlucht an der Kroparica, die Häuser sind Manufakturen, die Brücken aus Schmiedeeisen. Das Eisenschmiedemuseum im Klinar-Haus zeigt Werkzeuge und Nägel vom Hufnagel bis zum Schiffsnagel, daneben die Schauschmiede Vigenjc Vice. Verschlafen, authentisch, kaum Touristen.","lat":46.2938,"lon":14.2047,"adresse":"Kropa 10, 4245 Kropa","dauer_min":120,"preis":{"erwachsene":5,"ermaessigt":4,"unter26":null,"waehrung":"EUR","eur":5,"hinweis":"Museum 5 €, Studierende/Kinder 4 €, Familie 10 €. Dorf frei."},"kostenlos":{"immer":false,"regeln":["Dorf und Schmiede-Architektur immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"April–Juni Di–Sa 10:00–15:00 (Juli/Aug Di–So 10–18)","ruhetag":"Sonntag und Montag (im Juni)","reservierung":"nein","tipp":"Nur mit Rad oder Bus ab Radovljica sinnvoll (Arriva Radovljica–Kropa, wenige Fahrten) — mit Radovljica kombinieren und vormittags fahren, das Museum schließt im Juni um 15 Uhr.","link":"https://www.radolca.si/en/attractions/museums-and-galleries/iron-forging-museum","quelle":"https://www.radolca.si/en/attractions/museums-and-galleries/iron-forging-museum","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":13.1}],"tage":[{"datum":"2027-06-10","titel":"Ankommen in Žirovnica, Stausee am Abend","intro":"Ankunft aus Zagreb am frühen Nachmittag, Bahnhof Žirovnica liegt an der Strecke Jesenice–Ljubljana. Heute bleibst du im Dorf: einkaufen (am See kostet alles das Doppelte), Füße vertreten im Završnica-Tal direkt hinter dem Haus. Vintgar-Zeitfenster für Samstag und Bohinj-Zugverbindung für Sonntag heute Abend festmachen, falls noch nicht geschehen.","programm":[{"spot":null,"zeit":"14:00","titel":"Einchecken in Žirovnica","notiz":"Apartments Malivojevič, ca. 0,4 km vom Dorfzentrum. Vermieter fragen, ob er irgendeine Gästekarte ausstellt (Julian Alps Card gibt es offiziell nur für Bled-Partnerbetriebe)."},{"spot":null,"zeit":"16:00","titel":"Einkaufen fürs Frühstück und die Jausen","notiz":"Supermarkt in Žirovnica oder Lesce – Picknick für die Ausflugstage, am See ist alles doppelt so teuer. Beim TIC Žirovnica (Žirovnica 14) die Karte für den Pfad des kulturellen Erbes mitnehmen."},{"spot":"zavrsnica","zeit":"18:00","notiz":"Heute nur der Spaziergang zum Stausee (30 min ab Haustür), Picknickwiesen, Karawankenwände im Abendlicht. Valvasor-Hütte (1,5 h) oder Stol bleiben dem Puffertag – nur bei stabilem Wetter und früh."}]},{"datum":"2027-06-11","titel":"Ljubljana per Zug, Odprta kuhna","intro":"Freitag ist der richtige Ljubljana-Tag: freitags steht die Odprta kuhna (Open Kitchen) auf dem Pogačar-Platz, Streetfood aller Restaurants der Stadt ab 10 Uhr. Alles liegt fußläufig vom Bahnhof; die Burg nur Hof und Wehrgang, das kostet nichts. Zug Žirovnica–Ljubljana direkt in rund einer Stunde, Interrail.","programm":[{"spot":null,"zeit":"07:30","titel":"Zug Žirovnica → Ljubljana","notiz":"Direkt, 55–65 min, Interrail. Rückfahrt-Zeiten am Bahnhof fotografieren, abends fahren weniger Züge."},{"spot":"ljubljana","zeit":"09:00","notiz":"Vom Bahnhof 10 min zum Prešeren-Platz: Drei Brücken, Plečniks Markt-Arkaden (Zentralmarkt freitags vormittags), Drachenbrücke. Danach zu Fuß über die Študentovska pot (ab Ciril-Metodov trg, 15 min) auf die Burg – Innenhof und Wehrgang frei, Aussichtsturm und Museum nur mit Ticket (Studi 10,50 € ohne Bahn, lohnt kaum)."},{"spot":null,"zeit":"12:30","titel":"Odprta kuhna auf dem Pogačar-Platz","notiz":"Freitags Streetfood-Markt, ab 10 Uhr – hier Mittag essen statt im Restaurant."},{"spot":null,"zeit":"14:30","titel":"Altstadt an der Ljubljanica","notiz":"Uferpromenade, Gassen unter der Burg, Kaffee am Fluss. Lass es ruhig angehen, der Tag ist lang."},{"spot":null,"zeit":"18:30","titel":"Metelkova oder Heimfahrt","notiz":"Metelkova (Ex-Kaserne, Street-Art, Bars) lebt erst ab 22 Uhr – nur, wenn ein später Zug zurück passt. Sonst mit dem Abendzug nach Žirovnica."}]},{"datum":"2027-06-12","titel":"Radovljica, Lectar, Vintgar am Nachmittag","intro":"Vintgar lief auf ein Online-Zeitfenster hinaus – nach 15 Uhr ist es am leersten, also ist der Vormittag für Radovljica da (Museum Di–So, Samstag passt). Radovljica ist von Žirovnica näher als Bled: Zug bis Lesce-Bled, 20 min zu Fuß. Vintgar-Pass vorher auf tickets.vintgar.si buchen; bei Starkregen schließt die Klamm, dann rückt der Besuch auf den Puffertag.","programm":[{"spot":"radovljica","zeit":"10:00","notiz":"Zug eine Station bis Lesce-Bled (stündlich), 20 min zu Fuß – oder Rad leihen. Linhartov trg mit Fresken und Arkaden, im Thurn-Herrenhaus das Imkereimuseum (Studi 6 €, Kombi mit Stadtmuseum 8 €): bemalte Bienenstock-Brettchen, lebender Stock mit Krainer Biene."},{"spot":"lectar","zeit":"12:30","notiz":"Mittag im Gewölbe, mittags ist es leer – abends voll, Reservierung empfohlen. Vorher im Keller der Lebkuchenwerkstatt zusehen; kleines Herz kaufen, nicht das große."},{"spot":"kremsnita","zeit":"14:30","notiz":"Bled Bus Radovljica-Linie (Tagespass 5 €) oder Arriva über Lesce zum Busbahnhof Bled, dort startet auch der Vintgar-Shuttle. Eine Kremšnita an der Promenade: Kavarna Park ist das Original (ca. 6,50 €), Zima oder Šmon landeinwärts günstiger. Eine reicht, das Ding ist riesig."},{"spot":"vintgar","zeit":"15:15","notiz":"Vorher buchen: All-in-One Pass 15 € mit Zeitfenster 15:00 oder 15:30, Shuttle ab Busbahnhof Bled alle 15 min inklusive. 1,6 km Stege bis zum Šum-Fall, Rückweg über einen Themenweg (ca. 1 h) nach Podhom, von dort Shuttle zurück (fährt bis 2 h nach Schluss)."},{"spot":null,"zeit":"18:30","titel":"Zurück nach Žirovnica","notiz":"Bus oder zu Fuß zum Bahnhof Lesce-Bled, Zug eine Station."}]},{"datum":"2027-06-13","titel":"Bohinj: See, Vogel, Savica","intro":"Der Tag im Triglav-Nationalpark. Mit Interrail über Jesenice auf die Bohinj-Bahn bis Bohinjska Bistrica, dort der 2-€-Ortsbus zum See. Am Südufer nach Ukanc wandern, von dort liegen Vogel-Talstation und Savica-Fall im selben Talschluss. Vogel nur bei klarer Sicht (Webcam vogel.si morgens) – wer sparen will, lässt ihn aus und bleibt länger am Wasser. Jause mitnehmen.","programm":[{"spot":null,"zeit":"07:30","titel":"Zug Žirovnica → Jesenice → Bohinjska Bistrica","notiz":"Umstieg in Jesenice auf die Bohinj-Bahn, Interrail gilt. In Bohinjska Bistrica in den Ortsbus (2 €/24 h) bis Ribčev Laz."},{"spot":"bohinj-see","zeit":"09:30","notiz":"Ribčev Laz: Steinbrücke und Johanneskirche, dann auf dem Südufer-Pfad nach Ukanc (gut 1,5 h mit Badepause – der See ist kälter als Bled). Zurück fährt später der Bus."},{"spot":"vogel","zeit":"12:00","notiz":"Talstation in Ukanc, Bahn alle 30 min. Rückfahrkarte 32 €, bis 23 J. 28 € – nur bei klarer Sicht, dann liegt der ganze See unter dir, gegenüber der Triglav. Oben kurze Runde Richtung Orlove glave, Schneereste möglich."},{"spot":"savica","zeit":"15:00","notiz":"Sommerbus Ukanc → Koča pri Savici (im 2-€-Ticket) oder 1 h zu Fuß. 500 Stufen, 20–25 min, 4 € Eintritt. Im Juni nach der Schneeschmelze mit dem meisten Wasser."},{"spot":null,"zeit":"17:30","titel":"Bus und Zug zurück","notiz":"Ortsbus ab Savica/Ukanc über Ribčev Laz nach Bohinjska Bistrica, Zug über Jesenice nach Žirovnica."}]},{"datum":"2027-06-14","titel":"Bled: Insel, Rundweg, Ojstrica, Burg","intro":"Der klassische Bled-Tag, am Montag ruhiger als am Wochenende und alles hier hat täglich offen. Früh zur Insel, bevor die Pletna-Schlange wächst, dann gegen den Uhrzeigersinn um den See – so liegt die Burg am Ende im Abendlicht. Von Velika Zaka aus auf die Ojstrica, danach ins Wasser, zum Schluss ab 18 Uhr auf die fast leere Burg. Badesachen, feste Schuhe, Studi-Ausweis.","programm":[{"spot":"bleder-insel","zeit":"09:00","notiz":"Zug nach Lesce-Bled, Bus oder Rad zur Promenade. Pletna um 9 nehmen (später Schlange): ca. 20 € bar an den Bootsführer, Inselgebühr Studi 10,50 €. 99 Stufen, Wunschglocke, Glockenturm. Alternative: Ruderboot in Mlino leihen."},{"spot":"bleder-see-rundweg","zeit":"11:30","notiz":"Bled → Mlino → Velika Zaka, der Weg ist eben und gut 1,5 h für die ganze Runde. Erste Hälfte jetzt, die zweite nach der Ojstrica."},{"spot":null,"zeit":"13:00","titel":"Mittag und Baden in Velika Zaka","notiz":"Picknick aus dem Rucksack, Badestelle direkt am Weg – Wasser im Juni 18–20 °C."},{"spot":"ojstrica-osojnica","zeit":"14:30","notiz":"Trailhead hinter dem Camping Bled. Erst Ojstrica (20 min), dann weiter zur Mala Osojnica (45 min, Leiterpassage), Abstieg nach Velika Zaka. Das ist das Postkartenfoto, kostet nichts; nach Regen rutschig."},{"spot":"burg-bled","zeit":"18:00","notiz":"Zweite Rundweghälfte am Nordufer bis zur Pfarrkirche St. Martin, von dort Waldpfad 15 min hoch. Studi-Ticket 11,50 € nur an der Burgkasse mit Ausweis. Terrasse mit Abendlicht auf der Insel, offen bis 20 Uhr."},{"spot":null,"zeit":"20:00","titel":"Zurück nach Žirovnica","notiz":"Bus oder zu Fuß nach Lesce-Bled, Zug eine Station."}]},{"datum":"2027-06-15","titel":"Pokljuka und Viševnik, früh los","intro":"Bergtag: mit dem ersten Bled Bus der Pokljuka-Linie zum Rudno polje und auf den Viševnik, den leichtesten 2.000er mit Triglav-Blick. Juni-Gewitter kommen nachmittags, deshalb bis 14 Uhr wieder am Bus. Nachmittag frei – wer noch Luft hat, legt sich an den See. Jause und Wasser mitnehmen, oben gibt es nur die Almhütte.","programm":[{"spot":null,"zeit":"07:00","titel":"Bled Bus Pokljuka-Linie ab Busbahnhof Bled","notiz":"Vorher per Zug nach Lesce-Bled und zum Busbahnhof. Tagespass 5 €; Fahrplan 2027 erscheint im Frühjahr, ersten Bus nehmen."},{"spot":"pokljuka","zeit":"08:30","notiz":"Ab Rudno polje (1.347 m) auf den Viševnik (2.050 m, ca. 1,5 h Aufstieg, Altschnee möglich), Almwiesen blühen. Bis 14 Uhr zurück am Rudno polje."},{"spot":null,"zeit":"14:30","titel":"Bus zurück, Nachmittag frei","notiz":"Füße in den See in Bled oder früh heim nach Žirovnica – morgen ist der Puffertag."}]},{"datum":"2027-06-16","titel":"Puffertag: Dichterdörfer vor der Haustür","intro":"Der Tag ohne Pflichtprogramm. Vormittags der Pfad des kulturellen Erbes direkt ab Žirovnica (Prešeren-Haus mittwochs 9–16 Uhr), der Nachmittag bleibt frei. Ist Vintgar oder Bohinj ins Wasser gefallen, holst du es heute nach (Vintgar-Fenster umbuchen). Lief alles glatt: Räder leihen und auf dem Bahntrassen-Radweg nach Kranjska Gora zu den Zelenci-Quellen, oder zur Valvasor-Hütte im Završnica-Tal.","programm":[{"spot":"pot-kulturne-dediscine","zeit":"09:30","notiz":"Rundweg Vrba (Prešeren-Geburtshaus, 3 €, seit Februar 2026 renoviert) – Doslovče – Žirovnica – Breznica (Janšas Bienenhaus), ca. 3 h ab Haustür. Öffnungszeiten des Hauses waren online widersprüchlich, kurz vorher prüfen."},{"spot":null,"zeit":"13:00","titel":"Nachmittag frei","notiz":"Nachholen, was ausgefallen ist – oder Kranjska Gora per Rad (Zelenci vormittags am klarsten, dann besser früh starten), Valvasor-Hütte, oder einfach nichts. Abends packen."}]},{"datum":"2027-06-17","titel":"Abfahrt nach Venedig","intro":"Lange Zugfahrt nach Mestre, deshalb früh los. Frühstück aus dem Vorrat, Apartment übergeben, Zug ab Žirovnica. Verbindung nach Venedig vorher in der Interrail-App festlegen.","programm":[{"spot":null,"zeit":"08:00","titel":"Frühstück, packen, Schlüssel abgeben","notiz":"Reste aus dem Kühlschrank als Zugproviant."},{"spot":null,"zeit":"09:30","titel":"Zug ab Žirovnica Richtung Venedig","notiz":"Ankunft Venezia Mestre am Nachmittag."}]}],"naechte":7},{"id":"venedig","name":"Venedig","land":"Italien","landcode":"IT","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-06-17","abreise":"2027-06-21","unterkunft":{"name":"a&o Hostel Venezia Mestre","ort":"Mestre (Venedig)","lat":45.48163,"lon":12.23832,"hinweis":"Via Ca' Marcello 19, 3 Min. zu Fuß zum Bahnhof Mestre; Regionalzug nach Venezia Santa Lucia ~10 Min."},"zentrum":{"lat":45.434,"lon":12.3386},"intro":"Venedig ist zu Fuß am schönsten – die Stadt ist klein, Vaporetti sind teuer, verlaufen ist Programm. Vier Nächte reichen für Markusplatz + Dogenpalast (ein voller Vormittag), Dorsoduro mit Accademia/Guggenheim, Cannaregio mit dem Ghetto, einen Inseltag Murano/Burano oder Lido und die Architektur-Biennale in Giardini/Arsenale. Mestre ist kein Nachteil: du bist in 10 Minuten am Bahnhof Santa Lucia und sparst die Eintrittsgebühr, weil du in der Gemeinde Venedig übernachtest.","feiertage":[],"gut_zu_wissen":[{"titel":"Eintrittsgebühr (Contributo di accesso) – du bist befreit","text":"Venedig verlangt an Spitzentagen 5 € (früh gebucht) bzw. 10 € (kurzfristig) von Tagesbesuchern der Altstadt, 8:30–16:00 Uhr. 2026 galt das an ~60 Tagen vom 3. April bis 26. Juli (Wochenenden und Brückentage). Die Tage für 2027 waren im Oktober 2026 noch nicht veröffentlicht – mit Fr–So 18.–20.06. liegt dein Aufenthalt aber fast sicher auf Gebührentagen. Entscheidend: Befreit ist, wer in einer Unterkunft im Gemeindegebiet von Venedig übernachtet (Reglement: 'strutture ricettive situate all'interno del territorio comunale'), vom Ankunfts- bis zum Abreisetag. Mestre gehört zur Comune di Venezia, das a&o zahlt Kurtaxe – also bist du befreit. Du brauchst nur den kostenlosen Befreiungs-QR-Code: entweder schickt ihn das Hostel (viele tun das automatisch), sonst selbst auf cda.ve.it registrieren und den Voucher für die Aufenthaltstage laden. Bei Kontrollen am Bahnhof Santa Lucia oder Piazzale Roma vorzeigen. Murano, Burano und Lido liegen ohnehin außerhalb der Gebührenzone. Ohne QR an einem Gebührentag: 50–300 € Bußgeld."},{"titel":"Gratistage – in deinem Zeitraum keine","text":"Staatliche Museen (Accademia) sind am 1. Sonntag im Monat frei – der 6. Juni und 4. Juli liegen außerhalb deines Aufenthalts. Die städtischen Musei Civici (Dogenpalast, Correr, Ca' Rezzonico) machen beim 'Domenica al Museo' nicht mit; frei sind dort nur Einwohner. Guggenheim: Gratis-Donnerstag gilt nur für Einheimische. Was für dich zählt: Accademia 2 € für EU-Bürger 18–25, Musei Civici ermäßigt 15 € statt 35 € mit Studierendenausweis (15–25) oder Rolling Venice, Guggenheim 9 € statt 17 € unter 26, Markusdom halber Preis für Studierende bis 26."},{"titel":"Rolling Venice – für unter 29 fast Pflicht","text":"Die Rolling-Venice-Karte kostet 6 € (6–29 Jahre, Ausweis), erhältlich an Venezia-Unica-Schaltern (z. B. Bahnhof Santa Lucia, Piazzale Roma) oder online. Damit kostet das 72-h-ACTV-Ticket 27 € statt 45 € – 33 € gesamt. Und der Dogenpalast-Ticketverbund (Musei di Piazza San Marco) 15 € statt 35 €. Allein diese zwei Posten sparen ~38 € pro Person; dazu Rabatte in Läden, Restaurants und Museen. Rechnung Vaporetto: Einzelfahrt 9,50 €, 24 h 25 €, 48 h 35 €, 72 h 45 €. Wer nur Murano/Burano (hin/zurück) und zweimal den Canal Grande fährt, ist schon bei 38 € – das 72-h-Rolling-Ticket lohnt ab dem zweiten Vaporetto-Tag."},{"titel":"Nahverkehr Mestre ↔ Venedig","text":"Regionalzug Venezia Mestre → Venezia Santa Lucia: ~10 Min., alle paar Minuten, Regionale-Ticket ca. 1,50 € (Preis prüfen, Trenitalia-App/Automat; Interrail-Pass gilt natürlich auch – Fahrt eintragen nicht vergessen bzw. bei Flexi-Pass lieber das Ticket kaufen). Alternative: ACTV-Bus 2 oder Tram T1 ab Bahnhof Mestre zum Piazzale Roma, 75-Min-Ticket Festland 1,50 € (im 72-h-Ticket enthalten). Letzte Züge zurück fahren bis nach Mitternacht; Nachtbus N2 danach. Vaporetto-Linie 1 fährt den ganzen Canal Grande ab (45 Min., der beste 'Sightseeing-Bus'), Linie 2 ist die schnelle; Traghetto-Gondelfähren queren den Canal Grande für 2 € im Stehen."},{"titel":"Biennale 2027 = Architektur, nicht Kunst","text":"Die Kunstbiennale läuft in geraden Jahren (2026), in ungeraden Jahren die Architekturbiennale: 20. Internationale Architekturausstellung, 8. Mai – 21. November 2027, Giardini + Arsenale, 10–18 Uhr, montags geschlossen (also nicht am 21.06.). Tickets nur online; 2027-Preise noch nicht veröffentlicht, 2025 kosteten sie 25 € / 16 € für Studierende und unter 26 / 3-Tages-Ticket 35 €."},{"titel":"Kirchen: Chorus-Pass","text":"16–18 Kirchen des Chorus-Verbunds (Frari, San Sebastiano, Madonna dell'Orto, Santa Maria dei Miracoli …) kosten je 3,50 €; der Chorus-Pass 14 € (Studierende bis 25: 10 €) lohnt ab vier Kirchen, ein Jahr gültig. Markusdom und Salute (Hauptraum) sind nicht dabei, viele Kirchen haben auch gratis zugängliche Bereiche. Kleiderordnung: Schultern und Knie bedeckt, besonders im Markusdom."},{"titel":"Geld, Wasser, Essen","text":"Karte fast überall, kleine Bàcari manchmal nur bar. Coperto 2–3 € pro Person im Restaurant, Trinkgeld nicht erwartet (aufrunden reicht). Leitungswasser ist gut, Trinkbrunnen (fontanelle) stehen auf vielen Campi – Flasche mitnehmen, 0,5 l Wasser kostet am Markusplatz sonst 3–4 €. Billig satt: Cicchetti im Stehen (1,50–3 € pro Stück), Pizza al taglio, Mensa-ähnliche Tavole calde bei der Uni in Dorsoduro. Vermeide Restaurants mit Bildern auf der Karte an Rialto und San Marco – dort kostet der Spritz 10 €, im Bàcaro 3–4 €."},{"titel":"Fondaco dei Tedeschi: zu","text":"Die kostenlose Dachterrasse am Rialto gibt es nicht mehr – DFS hat das Kaufhaus 2025 geschlossen, der Palazzo steht leer (Stand Oktober 2026). Gratis-Aussicht ersatzweise: Rialtobrücke selbst, Ponte dell'Accademia, Zattere, Giudecca-Ufer. Günstig hoch: Campanile San Giorgio Maggiore (aktuell wegen Wartung geschlossen – vorher prüfen) oder Scala del Bovolo 7 €."}],"spots":[{"id":"vaporetto","name":"Vaporetto Linie 1 über den Canal Grande","kategorie":"aktivitaet","muss":3,"kurz":"Die günstigste 'Gondelfahrt': 45 Minuten Canal Grande für den Preis eines Tickets","beschreibung":"Linie 1 hält an jeder Station zwischen Piazzale Roma und Lido und zeigt dir alle Palazzi, Ca' d'Oro, Rialto, Salute vom Wasser aus. Setz dich nach vorne oder hinten ins Freie. Mit dem 72-h-Ticket fährst du außerdem nach Murano, Burano, Lido, San Giorgio – alle Linien inklusive, nur die Flughafenbusse nicht.","lat":45.4411,"lon":12.3211,"adresse":"Haltestelle Ferrovia (Bahnhof Santa Lucia), 30121 Venezia","dauer_min":45,"preis":{"erwachsene":9.5,"ermaessigt":null,"unter26":27,"waehrung":"EUR","eur":9.5,"hinweis":"Einzelfahrt 75 Min. 9,50 €. Zeitkarten: 24 h 25 €, 48 h 35 €, 72 h 45 €, 7 Tage 65 €. Mit Rolling Venice (6–29 J., Karte 6 €): 72 h für 27 €. Festland-Bus/Tram 75 Min. 1,50 €. Traghetto (Gondelfähre über den Canal Grande) 2 € pro Person."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Linie 1 ca. 5:00–23:30 alle 10–12 Min., danach Nachtlinie N","ruhetag":null,"reservierung":"nein","tipp":"Rolling Venice + 72-h-Ticket (33 € gesamt) gleich am Venezia-Unica-Schalter im Bahnhof Santa Lucia kaufen; vor jeder Fahrt am Lesegerät validieren, sonst 60 € Strafe. Abends ab Lido zurück nach San Marco fahren – Sonnenuntergang hinter der Salute.","link":"https://actv.avmspa.it/","quelle":"https://avm.avmspa.it/en/content/venice-urban-services-0","preisstand":"2026","unsicher":false,"quelle_hinweis":"Traghetto-Touristenpreis 2 € nicht auf der AVM-Seite (dort nur 10er-Carnet 10 €); Sekundärquellen nennen 2 €.","dist_km":7.9},{"id":"rialto","name":"Rialtobrücke + Rialtomarkt","kategorie":"markt","muss":3,"kurz":"Älteste Brücke über den Canal Grande und der Fischmarkt der Stadt","beschreibung":"Die Brücke ist Fotomotiv und Nadelöhr zugleich; spannender ist der Markt dahinter: unter den Arkaden der Pescheria liegen morgens Seezungen, Moleche-Krabben und Tintenfische, auf dem Campo Cesare Battisti die Gemüsestände mit Artischocken aus Sant'Erasmo. Drumherum die dichteste Bàcaro-Zone der Stadt – Markt gucken, dann Cicchetti.","lat":45.43964,"lon":12.33452,"adresse":"Campo de la Pescaria, San Polo, 30125 Venezia","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-17","2027-06-18","2027-06-19","2027-06-20","2027-06-21"],"hinweis":null},"oeffnungszeiten":"Markt Di–Sa ca. 7:30–12:30, Fischmarkt So und Mo geschlossen; Brücke immer","ruhetag":"So/Mo (Fischmarkt)","reservierung":"nein","tipp":"Vor 9 Uhr kommen – dann kaufen Köche ein und keine Tour-Gruppen. Die Brücke ist um 7 Uhr morgens oder nach 22 Uhr fast leer. Sonntag und Montag ist der Fischmarkt zu, also Fr oder Sa einplanen.","link":"https://www.veneziaunica.it/","quelle":"https://www.veneziaunica.it/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffentlicher Raum; Marktzeiten aus Erfahrungswerten.","dist_km":8.8},{"id":"cicchetti","name":"Cicchetti-Bàcari: Cantina Do Mori + Al Mercà","kategorie":"essen","muss":3,"kurz":"Venedigs Tapas: Häppchen für 1,50–3 €, Spritz oder 'Ombra' Wein für 3–4 € im Stehen","beschreibung":"Cantina Do Mori (seit 1462, angeblich Casanovas Stammkneipe) ist eine dunkle Höhle hinter dem Rialtomarkt mit Kupfertöpfen an der Decke, Baccalà mantecato auf Polenta, Francobolli-Mini-Sandwiches und Wein aus dem Fass. Al Mercà ist eine Fensterluke am Campo Bella Vienna: Spritz holen, mit den Venezianern auf dem Platz stehen. Für 12–15 € ist man satt und hat zwei Gläser – das billigste gute Abendessen der Stadt.","lat":45.43896,"lon":12.33396,"adresse":"Cantina Do Mori: Calle dei Do Mori, San Polo 429; Al Mercà: Campo Bella Vienna, San Polo 213","dauer_min":60,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Richtwerte: Cicchetto 1,50–3 €, Ombra (kleines Glas Wein) 2–3 €, Spritz 3,50–4,50 €. Kein offizieller Preis."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeite
