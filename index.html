n":"Do Mori ca. Mo–Sa 8:00–19:30, So zu; Al Mercà ca. Mo–Sa 10–14:30 / 18–21","ruhetag":"Sonntag","reservierung":"nein","tipp":"Zur Marktzeit (11–13 Uhr) oder zum Aperitivo ab 18 Uhr; bar zahlen. Sitzen kostet überall Aufpreis – im Stehen ist der Preis venezianisch. Weitere Bàcari derselben Ecke: All'Arco, Cantina Do Spade, Bancogiro (teurer, mit Sitzplatz am Canal Grande).","link":"https://www.veneziaunica.it/","quelle":"https://www.veneziaunica.it/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Gastronomie ohne offizielle Preisliste; Richtwerte aus Reiseberichten 2025/26, Öffnungszeiten ändern sich.","dist_km":8.8},{"id":"markusdom","name":"Markusdom (Basilica di San Marco)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Goldmosaik-Kathedrale der Dogen, seit 2025 mit Pflicht-Zeitfenster","beschreibung":"8.000 m² Goldmosaike auf byzantinischen Kuppeln, der Boden wellt sich, und über allem hängt die Beute aus Konstantinopel. Die Pala d'Oro hinter dem Hauptaltar ist eine Wand aus Emaille und 1.900 Edelsteinen; vom Museum oben tritt man auf die Loggia mit den (Kopien der) bronzenen Pferden und schaut auf den Markusplatz. Seit Juli 2025 gibt es keine Gratis-Schlange mehr: alles ist Ticket mit Zeitfenster, dafür ohne Warten.","lat":45.43455,"lon":12.33982,"adresse":"Piazza San Marco 328, 30124 Venezia","dauer_min":75,"preis":{"erwachsene":8,"ermaessigt":4,"unter26":4,"waehrung":"EUR","eur":8,"hinweis":"Listenpreis Basilika 10 €, Privatpersonen automatisch −20 % → 8 €; Studierende bis 26 nochmals −50 % → 4 €. Basilika + Pala d'Oro 20 € (16 €/8 €), Basilika + Museum/Loggia 20 € (16 €/8 €), Komplettticket 30 € (24 €/12 €). Unter 11 frei."},"kostenlos":{"immer":false,"regeln":["Unter 11 Jahren frei","Einwohner der Diözese frei","Gottesdienstbesuch frei (ohne Besichtigung)"],"termine_im_aufenthalt":[],"hinweis":"Keine Gratistage für Touristen"},"oeffnungszeiten":"Besichtigung Mo–Sa ca. 9:30–17:15, So erst ab 14:00 (vormittags nur Museum/Loggia, 14 €); Zeitfenster online","ruhetag":null,"reservierung":"nötig","tipp":"Online auf tickets.basilicasanmarco.it buchen, Namen eintragen (Tickets sind personengebunden), Studierendenausweis mitnehmen – wird am Eingang Porta San Pietro geprüft. Keine Rucksäcke, Schultern/Knie bedeckt. Das Komplettticket für 12 € (Studi) lohnt: Pala d'Oro und Loggia sind das Beste.","link":"https://www.basilicasanmarco.it/","quelle":"https://tickets.basilicasanmarco.it/it/support/prices","preisstand":"2026","unsicher":true,"quelle_hinweis":"Rabattlogik der offiziellen Preisliste (Listenpreis, 20 % Privatrabatt, 50 % Studi-Rabatt 'auf den Privatpreis') ist mehrdeutig; Öffnungszeiten nicht auf der Preisseite – vor Ort/online prüfen.","dist_km":9.5},{"id":"dogenpalast","name":"Dogenpalast (Palazzo Ducale) + Museo Correr","kategorie":"museum","muss":3,"kurz":"Regierungssitz der Republik, Seufzerbrücke, Bleikammern – ein Ticket für vier Häuser","beschreibung":"Vom goldenen Treppenhaus durch die Ratssäle mit Tintoretto und Veronese bis in den Saal des Großen Rats, 53 Meter lang, mit dem größten Ölgemälde der Welt. Dann über die Seufzerbrücke in die Gefängnisse – der Blick durch das Gitter ist der, den Casanova hatte. Das Ticket 'Musei di Piazza San Marco' gilt auch für Museo Correr, Archäologisches Museum und die Biblioteca Marciana gegenüber.","lat":45.43421,"lon":12.34059,"adresse":"Piazza San Marco 1, 30124 Venezia","dauer_min":150,"preis":{"erwachsene":35,"ermaessigt":15,"unter26":15,"waehrung":"EUR","eur":35,"hinweis":"Vollpreis 35 € (30 € online mit >30 Tagen Vorlauf); ermäßigt 15 € für Studierende 15–25, Rolling Venice, ISIC, über 65, Kinder 6–14. Museum Pass (alle 11 Musei Civici, 6 Monate): 50 € / 25 € ermäßigt."},"kostenlos":{"immer":false,"regeln":["Nur Einwohner und unter 6 frei","Nicht Teil von 'Domenica al Museo'"],"termine_im_aufenthalt":[],"hinweis":"Kein Gratistag für Touristen"},"oeffnungszeiten":"Tägl. 9:00–19:00 (letzter Einlass 18:00)","ruhetag":null,"reservierung":"empfohlen","tipp":"Mit Studierendenausweis oder Rolling Venice zahlst du 15 € – das ist der größte Einzelrabatt der Reise, Ausweis einstecken. Zeitfenster online auf muve.vivaticket.it buchen (ab 9 Uhr ist es leer, ab 11 voll). Wer Ca' Rezzonico und ein weiteres Civico-Museum plant, rechnet den Museum Pass 25 € durch.","link":"https://palazzoducale.visitmuve.it/","quelle":"https://www.visitmuve.it/en/?p=4990","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":9.6},{"id":"ghetto","name":"Cannaregio + Jüdisches Ghetto","kategorie":"viertel","muss":2,"kurz":"Das erste 'Ghetto' der Welt (1516), heute das ruhigste Wohnviertel Venedigs","beschreibung":"Cannaregio ist Venedigs Alltag: Wäsche über den Kanälen, drei parallele Fondamente (Misericordia, Ormesini, Sensa) mit Bàcari, in denen Venezianer sitzen. Mittendrin der Campo del Ghetto Nuovo – weil die Juden ab 1516 nur hier wohnen durften, wuchsen die Häuser auf acht Stockwerke, mit versteckten Synagogen unterm Dach. Der Campo ist frei; das Jüdische Museum führt in die Synagogen.","lat":45.4454,"lon":12.3264,"adresse":"Campo del Ghetto Nuovo, Cannaregio 2902, 30121 Venezia","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Viertel frei. Museo Ebraico mit Synagogen-Rundgang (App) ca. 14 €, ermäßigt günstiger; Sa und an jüdischen Feiertagen geschlossen (Sa 19.06. also nicht)."},"kostenlos":{"immer":true,"regeln":["Viertel und Campo immer frei"],"termine_im_aufenthalt":["2027-06-17","2027-06-18","2027-06-19","2027-06-20","2027-06-21"],"hinweis":"Museum kostenpflichtig"},"oeffnungszeiten":"Viertel immer; Museo Ebraico So–Do 10–19:30, Fr 9–15, Sa zu","ruhetag":"Samstag (Museum)","reservierung":"nein","tipp":"Vom Bahnhof Santa Lucia 10 Min. zu Fuß – ideal für den Ankunftsabend. Aperitivo auf der Fondamenta della Misericordia (Al Timon, Vino Vero: Spritz 3,50–4 €, Cicchetti am Kanal). Koschere Bäckerei Panificio Volpe am Ghetto Vecchio.","link":"https://www.ghettovenezia.com/en/","quelle":"https://www.visititaly.eu/it/tickets/biglietti-per-jewish-ghetto-of-venice-self-guided-tour-with-app-p1096613","preisstand":"2026","unsicher":true,"quelle_hinweis":"Museumspreis nur von Wiederverkäufer ('ab 14 €'); offizielle Seite nennt keine Preise, Öffnungszeiten dort nur bis April 2026.","dist_km":8.0},{"id":"accademia","name":"Gallerie dell'Accademia","kategorie":"museum","muss":2,"kurz":"Venezianische Malerei von Bellini bis Tiepolo – für EU-Bürger 18–25 nur 2 €","beschreibung":"Das staatliche Hauptmuseum der venezianischen Malerei: Bellinis Madonnen, Giorgiones rätselhaftes 'Gewitter', Veroneses riesiges 'Gastmahl im Hause Levi', Carpaccios Ursula-Zyklus, und zeitweise Leonardos vitruvianischer Mensch (lichtempfindlich, selten ausgestellt). Als Staatsmuseum gilt die italienische Regel: 2 € für 18–25-jährige EU-Bürger.","lat":45.43137,"lon":12.32809,"adresse":"Campo della Carità, Dorsoduro 1050, 30123 Venezia","dauer_min":90,"preis":{"erwachsene":20,"ermaessigt":2,"unter26":2,"waehrung":"EUR","eur":20,"hinweis":"20 € Vollpreis (Hochsaison 6.5.–18.10.); EU-Bürger 18–25: 2 €; unter 18 frei."},"kostenlos":{"immer":false,"regeln":["Erster Sonntag im Monat frei","Unter 18 immer frei","Staatliche Gratistage (25.4., 2.6., 1.11., 4.11.)"],"termine_im_aufenthalt":[],"hinweis":"1. Sonntag (06.06./04.07.) liegt außerhalb des Aufenthalts"},"oeffnungszeiten":"Di–So 9:00–19:00 (Kasse bis 18:00); Mo nur vormittags/eingeschränkt","ruhetag":null,"reservierung":"nein","tipp":"Ausweis mit Geburtsdatum zeigen, dann 2 €. Direkt nach dem Besuch über die hölzerne Accademia-Brücke – der Blick zur Salute ist die beste Gratis-Aussicht auf den Canal Grande.","link":"https://www.gallerieaccademia.it/","quelle":"https://www.gallerieaccademia.it/en/plan-your-visit","preisstand":"2026","unsicher":false,"quelle_hinweis":"Montag-Öffnung auf der Seite nicht eindeutig.","dist_km":9.0},{"id":"guggenheim","name":"Peggy Guggenheim Collection","kategorie":"museum","muss":2,"kurz":"Moderne Kunst in Peggys Palazzo am Canal Grande, 9 € unter 26","beschreibung":"Pollock, Picasso, Magritte, Max Ernst (ihr Ex-Mann), Kandinsky – in dem einstöckigen Palazzo Venier dei Leoni, in dem Peggy Guggenheim 30 Jahre lebte. Der Skulpturengarten mit ihrem Grab (und dem ihrer Hunde) und die Terrasse am Canal Grande mit Marinis reitender Bronze sind Teil des Charmes.","lat":45.4308,"lon":12.33154,"adresse":"Dorsoduro 701-704, 30123 Venezia","dauer_min":90,"preis":{"erwachsene":17,"ermaessigt":9,"unter26":9,"waehrung":"EUR","eur":17,"hinweis":"Studierende unter 26 mit Ausweis 9 €; über 70 14 €; unter 10 frei."},"kostenlos":{"immer":false,"regeln":["Do 14–18 frei nur für Einwohner Venedigs und lokale Studierende"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mi–Mo 10:00–18:00","ruhetag":"Dienstag","reservierung":"empfohlen","tipp":"Kurz vor Schließung ist es ruhig; die Terrasse am Kanal ist der beste Platz für ein Foto ohne Gondel-Gedränge. Zusammen mit Accademia (5 Min. Fußweg) und Zattere einen Dorsoduro-Nachmittag machen.","link":"https://www.guggenheim-venice.it/","quelle":"https://www.guggenheim-venice.it/en/visit/tickets/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":9.2},{"id":"zattere","name":"Dorsoduro: Zattere + Punta della Dogana","kategorie":"viertel","muss":2,"kurz":"Südufer mit Abendsonne, Studentenviertel, Gelato bei Nico","beschreibung":"Die Zattere sind die lange Uferpromenade gegenüber der Giudecca, nach Süden ausgerichtet – der Ort, an dem Venedig abends am Wasser sitzt. Dahinter Dorsoduro mit Campo Santa Margherita (Uni, billige Bars), vorne die Punta della Dogana mit der Salute-Kirche und dem 360°-Blick auf San Marco, San Giorgio und die Giudecca. Alles gratis.","lat":45.429,"lon":12.3285,"adresse":"Fondamenta Zattere ai Gesuati, Dorsoduro, 30123 Venezia","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Salute-Kirche frei (Sakristei mit Tizian kostet, im Markusdom-Ticket enthalten); Punta della Dogana (Pinault-Museum) kostet, Außenbereich frei."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-17","2027-06-18","2027-06-19","2027-06-20","2027-06-21"],"hinweis":null},"oeffnungszeiten":"Immer; Salute tägl. ca. 9–12 / 15–17:30","ruhetag":null,"reservierung":"nein","tipp":"Gianduiotto bei Gelateria Nico (Zattere 922, seit 1935): Nougat-Eisblock in Schlagsahne, ~5 €, auf dem Steg am Wasser essen. Dann zur Punta della Dogana zum Sonnenuntergang – der Markusplatz liegt im Gegenlicht, du sitzt auf den Steinstufen am Kanal.","link":"https://www.veneziaunica.it/","quelle":"https://www.veneziaunica.it/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffentlicher Raum.","dist_km":9.2},{"id":"campanile_sanmarco","name":"Campanile di San Marco","kategorie":"aussicht","muss":2,"kurz":"99 m hoch, Aufzug, der klassische Blick über Lagune und Dächer","beschreibung":"Der Glockenturm stürzte 1902 komplett ein und wurde 'dov'era, com'era' wieder aufgebaut. Oben siehst du die Kuppeln des Markusdoms von oben, die Lagune bis zu den Alpen an klaren Tagen – aber keinen einzigen Kanal, weil die Gassen zu eng sind. Der Aufzug fährt in 30 Sekunden hoch, deshalb die Schlange.","lat":45.43404,"lon":12.33904,"adresse":"Piazza San Marco, 30124 Venezia","dauer_min":45,"preis":{"erwachsene":12,"ermaessigt":6,"unter26":6,"waehrung":"EUR","eur":12,"hinweis":"Listenpreis 15 €, Privatpersonen −20 % → 12 €; Studierende bis 26 → 6 €. Separates Ticket, nicht im Basilika-Komplettticket."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Sommer ca. 9:30–21:15 (letzte Fahrt 20:45)","ruhetag":null,"reservierung":"empfohlen","tipp":"Zum Sonnenuntergang hochfahren (Juni: gegen 21 Uhr) – der Platz leert sich, das Licht ist golden. Wer nur eine Aussicht bezahlen will: San Giorgio Maggiore gegenüber ist günstiger und zeigt den Markusplatz MIT Campanile – aber 2026 wegen Wartung geschlossen, Status prüfen.","link":"https://www.basilicasanmarco.it/","quelle":"https://tickets.basilicasanmarco.it/it/support/prices","preisstand":"2026","unsicher":true,"quelle_hinweis":"Öffnungszeiten aus Sekundärquellen (avygeo/invenicetoday), Preis aus der offiziellen Preisliste.","dist_km":9.5},{"id":"san_giorgio","name":"San Giorgio Maggiore (Palladio-Kirche + Campanile)","kategorie":"aussicht","muss":2,"kurz":"Der Blick AUF den Markusplatz – Kirche frei, Turm günstig, aber 2026 in Wartung","beschreibung":"Palladios weiße Kirche auf der Insel gegenüber dem Markusplatz, eine Vaporetto-Station von San Zaccaria. Innen zwei Tintorettos (Abendmahl, Mannalese) und Stille; der Aufzug im Campanile bringt dich auf die beste Aussicht der Stadt – Markusplatz mit Campanile, Dogenpalast, Giudecca, Lagune – für einen Bruchteil des Markusturm-Preises. Laut Abtei ist der Turm derzeit wegen außerordentlicher Wartung geschlossen; Stand Oktober 2026, bis 2027 hoffentlich wieder offen.","lat":45.42939,"lon":12.34328,"adresse":"Isola di San Giorgio Maggiore, 30133 Venezia (Vaporetto 2, Haltestelle San Giorgio)","dauer_min":60,"preis":{"erwachsene":6,"ermaessigt":4,"unter26":4,"waehrung":"EUR","eur":6,"hinweis":"Kirche frei. Campanile zuletzt 6 € / 4 € ermäßigt (Studierende unter 26, über 65) – Preis nach Wiedereröffnung prüfen."},"kostenlos":{"immer":false,"regeln":["Basilika immer frei"],"termine_im_aufenthalt":[],"hinweis":"Nur der Turm kostet"},"oeffnungszeiten":"Basilika tägl. 9:00–18:00; Campanile (wenn offen) ähnlich, Mittagspause ca. 10:40–12:00 wegen Messe","ruhetag":null,"reservierung":"nein","tipp":"Vor der Reise auf abbaziasangiorgio.it prüfen, ob der Campanile wieder offen ist – dann statt des Markusturms hierher. Mit Linie 2 weiter zur Giudecca (Zitelle, Redentore) und am Ufer entlang zurück: Venedigs ruhigster Spaziergang mit Blick auf Dorsoduro.","link":"https://www.abbaziasangiorgio.it/","quelle":"https://www.abbaziasangiorgio.it/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Seite: Campanile 'temporaneamente chiuso per lavori di manutenzione straordinaria', keine Preise; 6/4 € aus Sekundärquelle (nomadotravel).","teilfrei":true,"dist_km":10.0},{"id":"biennale_2027","name":"Biennale Architettura 2027 (Giardini + Arsenale)","kategorie":"museum","muss":2,"kurz":"20. Architekturbiennale, 8.5.–21.11.2027 – Länderpavillons im Park und die Seilerei des Arsenals","beschreibung":"2027 ist ein Architektur-Jahr (die Kunstbiennale läuft 2026). Zwei Orte: die Giardini mit den ~30 historischen Länderpavillons (der deutsche von 1938, Scarpas Venezuela, Aaltos Finnland) und das Arsenale, die 300 m lange Corderie, in der einst Schiffstaue gedreht wurden – allein das Gebäude lohnt. Kuratoren 2027: Wang Shu und Lu Wenyu. Ein Ticket gilt für beide Orte an einem Tag.","lat":45.42902,"lon":12.35793,"adresse":"Giardini della Biennale, Castello (Vaporetto Giardini); Arsenale, Campo della Tana (Vaporetto Arsenale)","dauer_min":300,"preis":{"erwachsene":25,"ermaessigt":16,"unter26":16,"waehrung":"EUR","eur":25,"hinweis":"2027-Preise noch nicht veröffentlicht (Stand 10/2026). Referenz Architettura 2025: 25 € / Studierende und unter 26 16 € / 3-Tages-Ticket 35 €. Nur online, +0,50 € Gebühr."},"kostenlos":{"immer":false,"regeln":["Unter 6 frei","Einige Länderpavillons außerhalb von Giardini/Arsenale (in Palazzi der Stadt) sind immer frei"],"termine_im_aufenthalt":[],"hinweis":"Collateral Events und Pavillons in der Stadt (z. B. in Cannaregio, Dorsoduro) kosten nichts – Programmheft/App prüfen"},"oeffnungszeiten":"Di–So 10:00–18:00, Mo geschlossen (also nicht am 21.06.)","ruhetag":"Montag","reservierung":"nötig","tipp":"Einen ganzen Tag einplanen, Giardini vormittags, Arsenale nachmittags (die Corderie ist kühl). Für den Weg zwischen beiden am Ufer Riva dei Sette Martiri entlang (15 Min.). Die Porta Magna des Arsenals mit den geraubten Löwen aus Piräus ist von außen immer frei – auch ohne Ticket sehenswert.","link":"https://www.labiennale.org/en/architecture/2027","quelle":"https://www.labiennale.org/en/architecture/2027/information","preisstand":"2026","unsicher":true,"quelle_hinweis":"Daten/Öffnungszeiten 2027 offiziell; Preise sind die der Ausgabe 2025 ('tickets available soon').","dist_km":11.0},{"id":"murano_burano","name":"Murano + Burano (Lagune)","kategorie":"tagesausflug","muss":2,"kurz":"Glasbläser-Insel und das bunteste Dorf Italiens – mit dem Vaporetto-Ticket inklusive","beschreibung":"Murano (10 Min. ab Fondamente Nove) ist die Glasinsel: Werkstätten mit offener Tür, der schiefe Campanile, viel Kitsch und ein paar echte Meister. Burano (45 Min.) ist winzig und knallbunt gestrichen, die Fischerhäuser spiegeln sich in den Kanälen, Spitzenklöppelei und Bussolà-Kekse. Beide Fahrten sind mit der 72-h-Karte abgegolten; außerhalb der Eintrittsgebühr-Zone.","lat":45.48536,"lon":12.41754,"adresse":"Vaporetto 12 ab Fondamente Nove (Cannaregio) → Murano Faro → Burano","dauer_min":300,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Inseln frei; Fahrt im Vaporetto-Ticket (Einzel 9,50 € je Richtung, deshalb Zeitkarte). Glasmuseum Murano und Spitzenmuseum Burano sind Musei Civici (im Museum Pass)."},"kostenlos":{"immer":true,"regeln":["Inseln immer frei zugänglich"],"termine_im_aufenthalt":["2027-06-17","2027-06-18","2027-06-19","2027-06-20","2027-06-21"],"hinweis":null},"oeffnungszeiten":"Linie 12 ca. 4:20–22:25, alle 20–30 Min.","ruhetag":null,"reservierung":"nein","tipp":"Früh los (Linie 12 um 8–9 Uhr), zuerst Burano, mittags zurück über Murano, wenn die Tagesausflügler erst ankommen. Auf Burano das Dorf Richtung Mazzorbo verlassen (Holzbrücke) – Weinberg, Stille, kein Mensch. Glas 'Made in Murano' trägt ein Herkunftssiegel; billiges Zeug ist aus China.","link":"https://actv.avmspa.it/","quelle":"https://www.isoladiburano.it/en/how-to-get-to-burano.html","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":14.0},{"id":"m9","name":"M9 – Museo del '900 (Mestre)","kategorie":"museum","muss":1,"kurz":"Italiens 20. Jahrhundert als Multimedia-Museum, 5 Min. vom Hostel – Donnerstag 5 € für Studierende","beschreibung":"Ein komplett digitales Museum (Sauerbruch Hutton, 2018) über Italiens 20. Jahrhundert: Migration, Faschismus, Wirtschaftswunder, Design – alles interaktiv, Tafeln auf Englisch. Das Gebäude mit der bunten Keramikfassade ist das neue Zentrum von Mestre. Nichts, wofür man nach Venedig fährt, aber ideal für den Regenvormittag oder den Ankunftstag.","lat":45.493,"lon":12.2415,"adresse":"Via Giovanni Pascoli 11, 30171 Venezia Mestre","dauer_min":120,"preis":{"erwachsene":12,"ermaessigt":8,"unter26":8,"waehrung":"EUR","eur":12,"hinweis":"Ermäßigt 8 € für Studierende unter 26, 7–18 J., über 65. Donnerstags 5 € für Hochschul-Studierende (nur an der Kasse)."},"kostenlos":{"immer":false,"regeln":["Donnerstag ab 15 Uhr frei nur für Einwohner der Metropolitanstadt Venedig","Unter 6 frei"],"termine_im_aufenthalt":[],"hinweis":"Do 17.06.: 5 € für Studierende mit Ausweis"},"oeffnungszeiten":"Mi–Fr 10:00–18:00, Sa–So 10:00–19:00","ruhetag":"Montag und Dienstag","reservierung":"nein","tipp":"Am Ankunftstag Donnerstag 17.06. mit Studierendenausweis für 5 € rein, danach abends nach Venedig ins Ghetto zum Aperitivo. 10 Min. zu Fuß vom Bahnhof Mestre.","link":"https://www.m9museum.it/","quelle":"https://www.m9museum.it/visita-m9/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":1.3},{"id":"san_giuliano","name":"Parco San Giuliano (Mestre)","kategorie":"natur","muss":1,"kurz":"Riesiger Lagunenpark am Festland mit Venedig-Skyline – gratis Sonnenuntergang","beschreibung":"70 Hektar Wiesen, Radwege und Schilf direkt am Wasser, wo die Brücke nach Venedig beginnt. Vom Ufer siehst du die ganze Silhouette – Campanile, Kuppeln, Kräne von Marghera – über die Lagune. Für Venezianer ein Jogging-Park, für dich der Platz für einen Abend mit Supermarkt-Picknick und ohne Touristen.","lat":45.47267,"lon":12.27712,"adresse":"Via San Giuliano, 30173 Venezia Mestre","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-17","2027-06-18","2027-06-19","2027-06-20","2027-06-21"],"hinweis":null},"oeffnungszeiten":"Tägl. ca. 7:00–Sonnenuntergang (Sommer bis ~21:00)","ruhetag":null,"reservierung":"nein","tipp":"Vom Bahnhof Mestre mit Bus 2/4L/5 Richtung Venezia bis Haltestelle San Giuliano (10 Min., 1,50 €) oder 35 Min. zu Fuß. Mückenspray – Lagune im Juni.","link":"https://www.comune.venezia.it/","quelle":"https://www.comune.venezia.it/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffentlicher Park.","dist_km":3.2},{"id":"ca_rezzonico","name":"Ca' Rezzonico – Museum des 18. Jahrhunderts","kategorie":"museum","muss":1,"kurz":"Barockpalast am Canal Grande mit Tiepolo-Decken, viel weniger voll als der Dogenpalast","beschreibung":"Ein kompletter Palazzo von innen: Ballsaal, Tiepolo-Fresken, Longhis Genreszenen vom venezianischen Alltag, eine rekonstruierte Apotheke und Puppenbühne. Von den Fenstern schaust du direkt auf den Canal Grande, ohne dass dich jemand schiebt. Teil der Musei Civici – also im Museum Pass drin.","lat":45.43325,"lon":12.32712,"adresse":"Dorsoduro 3136, 30123 Venezia","dauer_min":75,"preis":{"erwachsene":11,"ermaessigt":8.5,"unter26":8.5,"waehrung":"EUR","eur":11,"hinweis":"Ermäßigt für Studierende 15–25, über 65, Kinder 6–14. Im Museum Pass (50/25 €) enthalten."},"kostenlos":{"immer":false,"regeln":["Nur Einwohner, unter 6, ICOM frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mi–Mo 10:00–18:00 (Apr–Okt), Fr+Sa bis 20:00 (Mai–Sept)","ruhetag":"Dienstag","reservierung":"nein","tipp":"Freitag- oder Samstagabend bis 20 Uhr – da bist du fast allein im Ballsaal. Nur sinnvoll, wenn du ohnehin den Museum Pass nimmst oder Barock mögt.","link":"https://carezzonico.visitmuve.it/","quelle":"https://www.italy-museum.com/it/venezia/biglietti-ca-rezzonico","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle MUVE-Ticketseite nicht abrufbar; Preis aus Wiederverkäufer-Seite (ohne deren 6 € Gebühr), Öffnungszeiten aus Sekundärquelle.","dist_km":8.8},{"id":"bovolo","name":"Scala Contarini del Bovolo","kategorie":"aussicht","muss":1,"kurz":"Versteckte Renaissance-Wendeltreppe mit Dachblick – 7 € bis 26","beschreibung":"Ein Schneckenhaus ('bovolo') aus Bögen, 1499 an einen Gotikpalast gebaut, in einem Hinterhof, den man nur mit Karte findet. Oben: Loggia mit Blick auf den Campanile und die Dächer, viel intimer als der Markusturm. Das Ticket enthält einen Saal mit Tintoretto-Gemälden.","lat":45.43481,"lon":12.33455,"adresse":"Corte Contarini del Bovolo, San Marco 4303, 30124 Venezia","dauer_min":30,"preis":{"erwachsene":9,"ermaessigt":7,"unter26":7,"waehrung":"EUR","eur":9,"hinweis":"Ermäßigt 7 € für 12–26 Jahre, über 65, FAI/TCI; unter 12 frei."},"kostenlos":{"immer":false,"regeln":["Unter 12 frei","Einwohner frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Tägl. 10:00–18:00 (letzter Einlass 17:30), Sommerzeit bis 25.10.","ruhetag":null,"reservierung":"empfohlen","tipp":"Nachmittags steht die Sonne auf der Treppe – gutes Licht für Fotos von unten. Mit 7 € die günstigste 'echte' Aussicht, solange San Giorgio geschlossen ist. Hof von außen gratis zu sehen.","link":"https://www.gioiellinascostidivenezia.it/en/scala-contarini-del-bovolo/","quelle":"https://www.gioiellinascostidivenezia.it/en/scala-contarini-del-bovolo/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":9.1},{"id":"gondel","name":"Gondelfahrt (offizieller Tarif)","kategorie":"aktivitaet","muss":1,"kurz":"90 € für 30 Minuten – teuer, aber durch die Stadt festgelegt und pro Boot","beschreibung":"Der Tarif ist kommunal fixiert: 90 € für 30 Minuten tagsüber (bis 19 Uhr), 110 € für 35 Minuten abends – pro Gondel bis 5 Personen, nicht pro Kopf. Allein ist das sehr viel Geld, zu fünft 18 € pro Nase. Wer nur das Gefühl will: der Traghetto quert den Canal Grande in einer Gondel für 2 €, im Stehen, 2 Minuten.","lat":45.4338,"lon":12.3365,"adresse":"Gondelstationen u. a. Bacino Orseolo (hinter dem Markusplatz), San Tomà, Santa Sofia","dauer_min":30,"preis":{"erwachsene":90,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":90,"hinweis":"Pro Gondel (max. 5 Personen), 30 Min. tagsüber; abends ab 19 Uhr 110 € / 35 Min. Jede Zusatz-20-Minuten ca. 45 €. Preis vorher bestätigen lassen."},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Tagsüber durchgehend; Abendtarif ab 19:00","ruhetag":null,"reservierung":"nein","tipp":"Nicht am Markusplatz einsteigen (Verkehr, Wellen), sondern in Dorsoduro oder San Polo an einer kleinen Station – ruhigere Kanäle. Bei Bedarf mit anderen Reisenden teilen, der Preis gilt pro Boot. Traghetto-Alternative bei Santa Sofia ↔ Pescheria.","link":"https://www.comune.venezia.it/","quelle":"https://www.nomadotravel.app/it/guides/gondola-ride-venice-guide","preisstand":"2026","unsicher":true,"quelle_hinweis":"Offizielle Tarifseite der Gondolieri/Comune nicht erreichbar; Tarif aus Sekundärquelle, deckt sich mit dem seit 2023 bekannten Stadttarif.","dist_km":9.3},{"id":"acqua_alta","name":"Libreria Acqua Alta","kategorie":"sehenswuerdigkeit","muss":1,"kurz":"Buchladen mit Gondel als Regal und Treppe aus alten Büchern","beschreibung":"Bücher in Badewannen, Kanus und einer Vollgondel, Katzen auf den Stapeln, hinten eine Treppe aus vergammelten Enzyklopädien, von der du über die Mauer auf den Kanal schaust. Inzwischen Instagram-berühmt und zu Stoßzeiten eng – aber immer noch ein echter, chaotischer Laden, in dem man gebrauchte Bücher für 1–5 € findet.","lat":45.43806,"lon":12.34227,"adresse":"Calle Longa Santa Maria Formosa, Castello 5176b, 30122 Venezia","dauer_min":20,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["Eintritt frei"],"termine_im_aufenthalt":["2027-06-17","2027-06-18","2027-06-19","2027-06-20","2027-06-21"],"hinweis":null},"oeffnungszeiten":"Tägl. ca. 9:00–19:30","ruhetag":null,"reservierung":"nein","tipp":"Gleich um 9 Uhr oder nach 18 Uhr, sonst stehst du für die Büchertreppe Schlange. Liegt auf dem Weg Markusplatz → Campo Santa Maria Formosa → Fondamente Nove (Vaporetto nach Murano) – also auf dem Inseltag mitnehmen.","link":"https://www.facebook.com/libreriaacquaalta/","quelle":"https://www.facebook.com/libreriaacquaalta/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Kein Eintritt; Öffnungszeiten aus Sekundärquellen.","dist_km":9.4},{"id":"lido","name":"Lido di Venezia – freier Strand Blue Moon","kategorie":"strand","muss":1,"kurz":"Adria-Strand 15 Vaporetto-Minuten vom Markusplatz, Abkühlung im Juni","beschreibung":"Der Lido ist die 12 km lange Nehrung zwischen Lagune und Adria: Autos, Fahrräder, Jugendstilvillen und kilometerlanger Sandstrand. Die meisten Abschnitte sind kostenpflichtige Bagni mit Liegen; der öffentliche Strand 'Blue Moon' am Ende des Gran Viale (10 Min. zu Fuß von der Haltestelle Lido S.M.E.) ist gratis, mit Duschen und Bar. Ende Juni hat das Wasser 23–25 °C.","lat":45.41438,"lon":12.37676,"adresse":"Piazzale Bucintoro, Lido di Venezia, 30126 Venezia","dauer_min":180,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Freier Strandabschnitt; weiter südlich (Alberoni, San Nicolò) ebenfalls frei. Fahrt im Vaporetto-Ticket (Linie 1, 5.1, 6)."},"kostenlos":{"immer":true,"regeln":["Öffentlicher Strand immer frei"],"termine_im_aufenthalt":["2027-06-17","2027-06-18","2027-06-19","2027-06-20","2027-06-21"],"hinweis":null},"oeffnungszeiten":"Immer; Rettungsschwimmer ca. 9–19","ruhetag":null,"reservierung":"nein","tipp":"Nach einem heißen Museumstag am späten Nachmittag rüberfahren, baden, und mit Linie 1 zurück – die Rückfahrt in den Sonnenuntergang ist die beste Vaporetto-Fahrt überhaupt. Handtuch und Wasser mitnehmen, Supermarkt (Conad) am Gran Viale.","link":"https://www.veneziaunica.it/","quelle":"https://www.veneziaunica.it/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Öffentlicher Strand, kein Ticket.","dist_km":13.1}],"tage":[{"datum":"2027-06-17","titel":"Mestre, M9 für 5 €, Ghetto-Abend","intro":"Ankunft aus Slowenien am Nachmittag, das a&o liegt drei Minuten vom Bahnhof Mestre. Donnerstag ist M9-Tag: 5 € für Studierende an der Kasse, zehn Minuten vom Hostel. Abends mit dem Regionalzug nach Santa Lucia und zu Fuß ins Ghetto – der ruhigste Einstieg in die Stadt. Wichtig: Befreiungs-QR-Code für die Eintrittsgebühr vom Hostel geben lassen oder selbst auf cda.ve.it laden.","programm":[{"spot":null,"zeit":"14:00","titel":"Einchecken im a&o Mestre","notiz":"Via Ca' Marcello 19. Nach dem Befreiungs-QR für den Contributo di accesso fragen (du übernachtest in der Gemeinde Venedig, also befreit) – sonst selbst auf cda.ve.it registrieren und den Voucher für alle Tage laden."},{"spot":"m9","zeit":"15:00","notiz":"Donnerstag 5 € mit Studierendenausweis, nur an der Kasse. Italiens 20. Jahrhundert komplett digital, Tafeln auf Englisch, 2 Stunden. 10 min zu Fuß vom Bahnhof Mestre."},{"spot":null,"zeit":"17:30","titel":"Regionalzug Mestre → Venezia Santa Lucia","notiz":"10 Minuten, alle paar Minuten, ca. 1,50 € am Automaten – Interrail-Tag dafür nicht verschwenden."},{"spot":"ghetto","zeit":"18:00","notiz":"Vom Bahnhof 10 min zu Fuß zum Campo del Ghetto Nuovo (frei), dann die drei Fondamente Misericordia, Ormesini, Sensa. Aperitivo am Kanal bei Al Timon oder Vino Vero, Spritz 3,50–4 €, Cicchetti dazu. Letzte Züge zurück fahren bis nach Mitternacht."}]},{"datum":"2027-06-18","titel":"Rialto, Dogenpalast, Markusdom, Zattere","intro":"Der große Tag am Markusplatz. Erst Rolling Venice plus 72-h-Ticket am Schalter kaufen (gilt dann bis Montagfrüh), dann vor 9 Uhr auf den Fischmarkt, mit Zeitfenster in den Dogenpalast, bevor es voll wird, mittags in den Markusdom. Nachmittags Pause im Studentenviertel, abends Zattere und Sonnenuntergang an der Punta della Dogana, zurück mit Linie 1 durch den ganzen Canal Grande. Dogenpalast und Markusdom vorher online buchen, Schultern und Knie bedeckt, Studi-Ausweis dabei.","programm":[{"spot":"rialto","zeit":"08:15","notiz":"Vorher um 7:45 am Venezia-Unica-Schalter in Santa Lucia: Rolling Venice 6 € (bis 29, Ausweis) und damit das 72-h-ACTV-Ticket für 27 € – gilt bis Montagfrüh, vor jeder Fahrt validieren, sonst 60 € Strafe. Dann zu Fuß über die Strada Nova, 20 min. Vor 9 Uhr kaufen hier Köche ein: Pescheria, Gemüsestände am Campo Cesare Battisti. Die Brücke selbst ist jetzt noch leer."},{"spot":"dogenpalast","zeit":"09:30","notiz":"Vorher buchen: Zeitfenster auf muve.vivaticket.it, ab 9 Uhr ist es leer, ab 11 voll. Mit Rolling Venice oder Studi-Ausweis 15 € statt 35 € – gilt am selben Tag auch für Museo Correr gegenüber. Saal des Großen Rats, Seufzerbrücke, Gefängnisse."},{"spot":"markusdom","zeit":"12:15","notiz":"Vorher buchen: tickets.basilicasanmarco.it, Ticket ist personengebunden, Studi-Rabatt wird am Eingang Porta San Pietro geprüft. Komplettticket 12 € – Pala d'Oro und Loggia mit Blick auf den Platz sind das Beste. Keine Rucksäcke."},{"spot":"cicchetti","zeit":"14:00","notiz":"Zurück zum Rialto: Cantina Do Mori (bis 19:30) für Baccalà mantecato und Francobolli, Ombra Wein vom Fass, im Stehen und bar. Für 12–15 € satt."},{"spot":"zattere","zeit":"19:00","notiz":"Vorher Pause am Campo Santa Margherita (Uni, billige Bars, Trinkbrunnen – am Markusplatz kostet Wasser 3–4 €). Dann Gianduiotto bei Gelateria Nico (Zattere 922) auf dem Steg essen, dann zur Punta della Dogana: Sonnenuntergang gegen 21 Uhr, der Markusplatz im Gegenlicht, auf den Steinstufen am Kanal."},{"spot":"vaporetto","zeit":"21:15","notiz":"Linie 1 ab Haltestelle Salute bis Ferrovia: der ganze Canal Grande in der Dämmerung, vorne oder hinten ins Freie setzen. Ca. 40 Minuten, im 72-h-Ticket. Vom Bahnhof Zug nach Mestre."}]},{"datum":"2027-06-19","titel":"Burano, Murano, Guggenheim, Campanile","intro":"Inseltag mit dem 72-h-Ticket. Erst kurz in die Libreria Acqua Alta (um 9 noch ohne Schlange), dann mit Linie 12 ab Fondamente Nove zuerst nach Burano und mittags über Murano zurück – gegen den Strom der Tagesausflügler. Nachmittags die Guggenheim-Sammlung, kurz vor Schließung ist sie ruhig. Zum Sonnenuntergang auf den Campanile, der Platz leert sich dann.","programm":[{"spot":"acqua_alta","zeit":"09:00","notiz":"Castello 5176b, gleich um 9 Uhr: Gondel als Bücherregal, die Büchertreppe mit Blick auf den Kanal. Gebrauchte Bücher 1–5 €. Von hier 10 min zur Fondamente Nove."},{"spot":"murano_burano","zeit":"09:40","notiz":"Linie 12 ab Fondamente Nove, durchfahren bis Burano (45 min): bunte Fischerhäuser, Bussolà-Kekse, über die Holzbrücke nach Mazzorbo zum Weinberg, da ist niemand. Mittags zurück bis Murano Faro: Werkstätten mit offener Tür, Siegel „Made in Murano“ beachten. Gegen 14:30 wieder in Fondamente Nove."},{"spot":"guggenheim","zeit":"16:00","notiz":"Linie 1 ab Ca' d'Oro bis Accademia oder 25 min zu Fuß. Unter 26 mit Ausweis 9 €. Pollock, Magritte, Max Ernst, Skulpturengarten mit Peggys Grab, Terrasse am Canal Grande. Mi–Mo 10–18, kurz vor Schluss ruhig."},{"spot":null,"zeit":"18:00","titel":"Abend in Dorsoduro","notiz":"Essen bei den Tavole calde an der Uni oder Pizza al taglio, dann gemütlich Richtung Markusplatz über die Accademia-Brücke (bester Gratisblick auf die Salute)."},{"spot":"campanile_sanmarco","zeit":"20:15","notiz":"Vorher buchen oder früh anstellen: Studi 6 €, letzte Fahrt 20:45. Aufzug, oben Lagune bis zu den Alpen, Sonnenuntergang gegen 21 Uhr. Falls der Campanile von San Giorgio Maggiore 2027 wieder offen ist (abbaziasangiorgio.it), dort hoch – 4 € und der Markusplatz mit im Bild. Zurück Linie 2 ab San Marco zum Bahnhof."}]},{"datum":"2027-06-20","titel":"Accademia für 2 €, Architekturbiennale","intro":"Sonntag: Fischmarkt und Do Mori sind zu, der Markusdom öffnet erst 14 Uhr – deshalb heute Museen. Erst die Gallerie dell'Accademia (EU-Bürger 18–25: 2 €), dann mit Linie 1 zu den Giardini und ein ganzer Tag Biennale: Länderpavillons vormittags, die kühle Corderie im Arsenale nachmittags. Biennale-Ticket nur online, vorher buchen – montags ist sie zu.","programm":[{"spot":"accademia","zeit":"09:00","notiz":"Campo della Carità, Linie 1 bis Accademia. Ausweis mit Geburtsdatum zeigen, 2 €. Bellini, Giorgiones „Gewitter“, Veroneses „Gastmahl“, Carpaccio – 90 Minuten reichen."},{"spot":"biennale_2027","zeit":"10:45","notiz":"Vorher buchen (labiennale.org, unter 26 ca. 16 €, +0,50 € Gebühr; ein Ticket für beide Orte am selben Tag). Linie 1 Accademia → Giardini: die ~30 Länderpavillons bis ca. 13:30."},{"spot":null,"zeit":"13:30","titel":"Mittag am Ufer","notiz":"Am Riva dei Sette Martiri entlang zum Arsenale (15 min), unterwegs Pizza al taglio oder Panino. Trinkbrunnen nutzen."},{"spot":null,"zeit":"14:30","titel":"Arsenale: die Corderie","notiz":"Zweiter Teil des Biennale-Tickets, 300 m Seilerei, kühl und leer. Bis 18 Uhr."},{"spot":null,"zeit":"18:30","titel":"Porta Magna und letzter Abend","notiz":"Das Arsenal-Tor mit den Löwen aus Piräus ist von außen frei. Über die Riva degli Schiavoni zurück zum Markusplatz, Spritz im Stehen irgendwo abseits der Piazza, Zug nach Mestre."}]},{"datum":"2027-06-21","titel":"Lagunenpark, dann Zug nach Prato","intro":"Kurzer Morgen in Mestre: der Parco San Giuliano am Wasser mit der Venedig-Silhouette, ohne Touristen, Bus ab Bahnhof Mestre. Danach auschecken und Zug Richtung Prato. Die Biennale ist montags zu, die Altstadt kannst du gestern abgehakt haben.","programm":[{"spot":"san_giuliano","zeit":"08:00","notiz":"Bus 2, 4L oder 5 ab Bahnhof Mestre bis San Giuliano (10 min, 1,50 €) oder 35 min zu Fuß. Uferweg mit Campanile und Kuppeln über der Lagune, Mückenspray. Um 9:30 zurück."},{"spot":null,"zeit":"10:00","titel":"Auschecken, Zug ab Mestre Richtung Prato","notiz":"Verbindung nach Prato vorher in der Interrail-App festlegen; Ankunft am frühen Nachmittag."}]}],"naechte":4},{"id":"florenz","name":"Florenz & Prato","land":"Italien","landcode":"IT","waehrung":"EUR","kurs_eur":1.0,"kurs_stand":"2026-10-07","ankunft":"2027-06-21","abreise":"2027-06-28","unterkunft":{"name":"Charm Toscano – 19 min da Firenze in treno","ort":"Prato","lat":43.8748,"lon":11.1007,"hinweis":"Adresse unbekannt; Koordinaten = Bahnhof Prato Centrale. Prato Porta al Serraglio (43.8838, 11.0975) liegt näher an der Altstadt – prüfen, welcher Bahnhof näher ist."},"zentrum":{"lat":43.7714,"lon":11.2542},"intro":"Florenz ist die Renaissance auf wenigen Quadratkilometern: Dom, Uffizien, David, Ponte Vecchio liegen alle zu Fuß beieinander. Mit 18–25 kostet jedes Staatsmuseum 2 € – also lieber viele Museen als eine Firenzecard. Plane die großen Häuser (Uffizien, Accademia) auf Di–Fr mit Zeitfenster, halte den 24.06. (San Giovanni) für Umzug, Calcio Storico und Feuerwerk frei und nutze die Montage (alle Staatsmuseen zu) für Oltrarno, Fiesole oder Prato.","feiertage":[{"datum":"2027-06-24","name":"San Giovanni Battista (Stadtpatron, lokaler Feiertag Florenz)","hinweis":"Kein nationaler Feiertag, aber Florenz feiert: ab 9 Uhr Umzug in historischen Kostümen (Piazza della Signoria → Dom), ca. 16 Uhr Parade, 17 Uhr Finale des Calcio Storico auf der Piazza Santa Croce (Platz wochenlang verbaut), ca. 22 Uhr „Fochi“ (Feuerwerk) vom Piazzale Michelangelo. Staatsmuseen (Uffizien, Bargello, Cappelle Medicee) waren in den letzten Jahren regulär bzw. sogar verlängert offen; städtische Museen und die Dom-Bauwerke können kürzer öffnen – am Vortag prüfen. 2027 fällt der Tag auf einen Donnerstag (Palazzo Vecchio schließt donnerstags ohnehin 14 Uhr). Finaltermin laut Veranstalter „um den 24.06.“ – vor der Reise bestätigen."}],"gut_zu_wissen":[{"titel":"2-Euro-Regel für Staatsmuseen","text":"EU-Bürger von 18 bis zum Tag des 25. Geburtstags zahlen in den staatlichen Museen 2 € statt Vollpreis: Uffizien (statt 25 €), Accademia (statt 20 €), Bargello (statt 12 €), Cappelle Medicee (statt 11 €). Pitti und Boboli nehmen 3 €. Ausweis mitnehmen. Wer online über den offiziellen Shop (B-Ticket, verlinkt von uffizi.it) ein Zeitfenster bucht, zahlt zusätzlich 4 € Reservierungsgebühr pro Ticket – auch beim 2-€-Ticket. Ohne Reservierung geht es an der Kasse (Uffizien/Accademia: lange Schlangen, früh da sein). Gratis am 1. Sonntag im Monat – fällt nicht in deinen Aufenthalt (06.06. und 04.07.). Alle Staatsmuseen montags geschlossen. Falls Scott in dieser Woche dabei ist: Zeitfenster für Uffizien und Accademia gleich für zwei Tickets buchen – 2-€-Tarif und Reservierungsgebühr gelten pro Person."},{"titel":"Städtische Museen","text":"Palazzo Vecchio, Torre di Arnolfo, Brancacci-Kapelle u. a. gehören der Stadt (MUS.E). Seit 01.02.2026 teurer, aber 18–25-Jährige und Studierende bekommen den Ermäßigt-Preis (Palazzo Vecchio 12 statt 18 €, Turm 13 statt 20 €, Brancacci 10 statt 15 €). Online: bigliettimusei.comune.fi.it."},{"titel":"Firenzecard lohnt nicht","text":"85 € für 72 h, über 60 Museen, Dom-Pässe sind NICHT enthalten. Rechnung mit deinen Preisen: Uffizien 2+4, Accademia 2+4, Bargello 2, Cappelle Medicee 2, Palazzo Vecchio 12, Brancacci 10, Galileo 10, Santa Croce 10 = ca. 58 € – und das wäre schon ein sehr volles Programm. Also: einzeln kaufen."},{"titel":"Dom-Pässe","text":"Die Kathedrale selbst ist frei (Mo–Sa ca. 10:15–15:45, Schlange am Hauptportal). Kuppel, Campanile, Baptisterium, Dommuseum und Krypta gibt es nur im Paket: Brunelleschi-Pass 30 € (alles inkl. Kuppel, Kuppel-Zeitfenster Pflicht), Giotto-Pass 20 € (ohne Kuppel, Campanile mit Zeitfenster), Ghiberti-Pass 15 € (Baptisterium + Museum + Krypta). Jeweils 3 Tage gültig, keine Jugend-/Studierendenermäßigung (nur Kinder 7–14). Kuppel-Slots sind in der Hochsaison Wochen vorher weg – sofort buchen auf duomo.firenze.it."},{"titel":"Prato ↔ Florenz","text":"Regionalzüge (Trenitalia Regionale) fahren mehrmals pro Stunde, 15–25 min, ab Prato Centrale und Prato Porta al Serraglio nach Firenze S.M.N. (manche nur bis Rifredi/Campo di Marte – auf die Anzeige achten). Interrail gilt ohne Reservierung; ohne Pass kostet die Fahrt rund 3 € (Tarif 39/17 Toscana, Stufe 11–20 km – genauen Betrag nicht verifiziert). Letzte Züge gegen Mitternacht – für die Fochi am 24.06. vorher den Rückzug raussuchen."},{"titel":"Nahverkehr Florenz","text":"Bus und Tram (Autolinee Toscane): Einzelticket 90 min 2,00 € (seit 08/2025; vorher 1,70 €) in der App „at bus“, am Tabacchi oder am Tram-Automaten; im Bus kaufen ist teurer. Innenstadt ist komplett fußläufig, du brauchst Tickets eigentlich nur für Bus 7 nach Fiesole und Bus 12/13 zum Piazzale Michelangelo."},{"titel":"Prato Card","text":"Prato Card 4 (16 €, 4 Tage) bzw. Prato Card Young (10 €, unter 25, 1 Jahr) für Palazzo Pretorio, Textilmuseum, Dommuseum und Centro Pecci. Mit deinen Einzelpreisen (Pecci 7, Tessuto 6, Dommuseum 6, Pretorio ca. 6) lohnt die Young-Karte ab drei Museen."},{"titel":"Geld, Wasser, Kleidung","text":"Karte geht fast überall, Kleinbeträge am Markt oft nur bar. Coperto 2–3 € pro Person im Restaurant, Trinkgeld nicht erwartet (aufrunden reicht). Trinkwasser aus den „fontanelli“ (auch mit Sprudel, z. B. Piazza della Signoria, Sant'Ambrogio) ist frei. Kirchen: Schultern und Knie bedeckt, sonst kein Einlass."}],"spots":[{"id":"mercato-centrale","name":"Mercato Centrale + Lampredotto bei Nerbone","kategorie":"essen","muss":3,"kurz":"Markthalle von 1874 – unten Lampredotto-Panino für 5 €, oben Food Hall","beschreibung":"Im Erdgeschoss der Eisen-Glas-Halle verkaufen Metzger, Käser und Gemüsehändler, dazwischen seit 1872 Da Nerbone: Lampredotto (Kuhmagen, langsam in Brühe gegart) im Brötchen, mit salsa verde und scharf, Brot kurz in die Brühe getunkt („bagnato“). Das Florentiner Streetfood schlechthin. Oben die Food Hall mit Pasta-, Pizza- und Trüffelständen – teurer, aber bis 23 Uhr offen.","lat":43.7765,"lon":11.2537,"adresse":"Piazza del Mercato Centrale, 50123 Firenze","dauer_min":60,"preis":{"erwachsene":5,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":5,"hinweis":"Lampredotto-Panino bei Nerbone ca. 4–6 € (Preis nicht offiziell, Reiseführer 2026). Markthalle frei."},"kostenlos":{"immer":false,"regeln":["Markthalle immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Food Hall (OG) tägl. 9–23; Markt (EG) Mo–Sa vormittags bis ca. 15 Uhr; Nerbone Mo–Sa 8–15","ruhetag":"Sonntag (EG-Markt)","reservierung":"nein","tipp":"Vor 11:30 zu Nerbone, sonst 30 Minuten Schlange. Alternative ohne Schlange: Lampredotto-Kioske (z. B. Trippaio di Sant'Ambrogio am Markt Sant'Ambrogio oder Pollini an der Via de' Macci).","link":"https://www.mercatocentrale.it/firenze/","quelle":"https://www.mercatocentrale.it/firenze/info/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Panino-Preis aus Reiseführern (4–6 €), EG-Marktzeiten nicht offiziell ausgewiesen.","teilfrei":true,"dist_km":16.4},{"id":"accademia","name":"Galleria dell'Accademia (David)","kategorie":"museum","muss":3,"kurz":"Michelangelos David im Original – plus die unvollendeten „Sklaven“","beschreibung":"Der 5 Meter hohe David steht am Ende eines Flurs, in dem Michelangelos unfertige Gefangene aus dem Marmor ringen – das Gegenüber von Skizze und Vollendung ist der eigentliche Grund für den Besuch. Dazu eine Musikinstrumentensammlung der Medici mit Stradivari-Geigen. Kleines Haus, in 60–90 Minuten gesehen.","lat":43.7768,"lon":11.2588,"adresse":"Via Ricasoli 58/60, 50122 Firenze","dauer_min":75,"preis":{"erwachsene":20,"ermaessigt":2,"unter26":2,"waehrung":"EUR","eur":20,"hinweis":"Vollpreis 20 € (seit 15.03.2026). EU 18–25: 2 €. Online-/Telefonreservierung +4 €. Kombiticket Accademia + Bargello 48 h 26 €; 72-h-Ticket für alle sechs Häuser der Gruppe 38 € – für dich irrelevant, einzeln 2 € ist billiger."},"kostenlos":{"immer":false,"regeln":["Erster Sonntag im Monat frei","Unter 18 immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Di–So 8:15–18:50 (letzter Einlass 18:20)","ruhetag":"Montag","reservierung":"nötig","tipp":"Die Schlange ohne Reservierung ist in Florenz berüchtigt; mit 2 € + 4 € Reservierung bist du immer noch unter 10 € und sparst Stunden. Spätes Fenster (ab 17 Uhr) ist am leersten.","link":"https://www.galleriaaccademiafirenze.it/en/","quelle":"https://www.galleriaaccademiafirenze.it/en/visit/tickets/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Offizielle Seite nur per Direktabruf lesbar (Zertifikatsfehler im Fetch-Tool); Preise zusätzlich über cultura.gov.it bestätigt.","dist_km":16.7},{"id":"dom-komplex","name":"Dom-Komplex (Kathedrale, Kuppel, Campanile, Baptisterium)","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Brunelleschis Kuppel besteigen – 463 Stufen, Pflicht-Zeitfenster","beschreibung":"Santa Maria del Fiore mit der größten gemauerten Kuppel der Welt, Giottos Campanile, dem Baptisterium mit Ghibertis Paradiestür (Original im Dommuseum) und der Krypta Santa Reparata. Der Aufstieg zwischen den beiden Kuppelschalen zeigt, wie Brunelleschi das Ding ohne Gerüst hochgezogen hat. Das Kirchenschiff ist schlicht und frei zugänglich.","lat":43.7731,"lon":11.256,"adresse":"Piazza del Duomo, 50122 Firenze","dauer_min":180,"preis":{"erwachsene":30,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":30,"hinweis":"Brunelleschi-Pass 30 € (Kuppel + Campanile + Baptisterium + Museum + Krypta), Giotto-Pass 20 € (ohne Kuppel), Ghiberti-Pass 15 € (ohne Kuppel und Turm). 3 Tage gültig. Ermäßigung nur für Kinder 7–14, nichts für Studierende/unter 26. Kathedrale frei."},"kostenlos":{"immer":false,"regeln":["Kathedrale (Kirchenschiff) immer frei"],"termine_im_aufenthalt":[],"hinweis":"Frei gilt nur fürs Kirchenschiff, Mo–Sa ca. 10:15–15:45; sonntags nur Gottesdienst."},"oeffnungszeiten":"Kuppel: Mo–Fr 8:15–19:30, Sa 8:15–17:15, So 12:45–17:15. Campanile tägl. 8:15–19:30. Kathedrale Mo–Sa ca. 10:15–15:45.","ruhetag":null,"reservierung":"nötig","tipp":"Kuppel-Slot sofort nach Buchung der Reise sichern (duomo.firenze.it, Pass gilt 3 Tage – Kuppel an einem Tag, Rest an einem anderen). Wer nur einen Aufstieg zahlen will: Campanile (Giotto-Pass) hat die Kuppel im Bild, die Kuppel selbst nicht.","link":"https://duomo.firenze.it/en/","quelle":"https://www.feelflorence.it/en/points-interest/brunelleschis-dome","preisstand":"2026","unsicher":true,"quelle_hinweis":"duomo.firenze.it blockiert automatisierte Abrufe (403); Preise über feelflorence.it (offizielle Tourismusseite, 30/20 €) und Reiseführer (Ghiberti 15 €, Stand 06/2026).","teilfrei":true,"dist_km":16.8},{"id":"ponte-vecchio","name":"Ponte Vecchio","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Die Goldschmiedebrücke – früh morgens oder bei Sonnenuntergang","beschreibung":"Die einzige Arno-Brücke, die den Krieg überlebt hat, voller Juweliere, oben drüber der Vasari-Korridor. Tagsüber Menschenstau, morgens vor 9 Uhr gehört sie dir. Am schönsten von außen: von der Ponte Santa Trinita (west) im Abendlicht.","lat":43.768,"lon":11.2531,"adresse":"Ponte Vecchio, 50125 Firenze","dauer_min":20,"preis":{"erwachsene":0,"ermaessigt":0,"unter26":0,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-21","2027-06-22","2027-06-23","2027-06-24","2027-06-25","2027-06-26","2027-06-27","2027-06-28"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Nicht auf der Brücke essen (Touristenpreise) – 200 m weiter im Oltrarno ist alles halb so teuer.","link":"https://www.feelflorence.it/en","quelle":"https://www.feelflorence.it/en","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":17.0},{"id":"uffizien","name":"Uffizien","kategorie":"museum","muss":3,"kurz":"Botticelli, Leonardo, Caravaggio – die wichtigste Renaissance-Sammlung der Welt","beschreibung":"Die Medici-Sammlung in Vasaris Verwaltungsbau: Botticellis „Geburt der Venus“ und „Primavera“, Leonardos „Verkündigung“, Michelangelos „Tondo Doni“, Caravaggios „Medusa“. Dazu der Korridor mit Blick auf Ponte Vecchio und Arno. Für 2 € bekommst du hier mehr Kunstgeschichte pro Euro als irgendwo sonst auf der Reise – rechne mit 3 Stunden, mehr hält niemand durch.","lat":43.7687,"lon":11.2553,"adresse":"Piazzale degli Uffizi 6, 50122 Firenze","dauer_min":180,"preis":{"erwachsene":25,"ermaessigt":2,"unter26":2,"waehrung":"EUR","eur":25,"hinweis":"Vollpreis 25 € an der Kasse, 29 € online (inkl. 4 € Reservierung). EU 18–25: 2 € (+4 € bei Online-Reservierung). Ab 16 Uhr Einlass 16 € (2026). Keine Hoch-/Nebensaisonpreise mehr auf der offiziellen Seite ausgewiesen. Uffizien + Vasari-Korridor 43 €."},"kostenlos":{"immer":false,"regeln":["Erster Sonntag im Monat frei (keine Reservierung möglich)","Unter 18 immer frei"],"termine_im_aufenthalt":[],"hinweis":"06.06. und 04.07.2027 liegen außerhalb des Aufenthalts."},"oeffnungszeiten":"Di–So 8:15–18:30 (letzter Einlass 17:30)","ruhetag":"Montag","reservierung":"nötig","tipp":"Zeitfenster 8:15 oder nach 16 Uhr buchen (nur offizieller Shop über uffizi.it, keine Reseller) – vormittags zwischen 10 und 14 ist es rappelvoll. Am 24.06. waren die Uffizien in den letzten Jahren regulär offen.","link":"https://www.uffizi.it/en/the-uffizi","quelle":"https://www.uffizi.it/en/tickets","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":17.1},{"id":"calcio-storico-fochi","name":"San Giovanni: Calcio Storico Finale + Fochi (24.06.)","kategorie":"aktivitaet","muss":3,"kurz":"Stadtfest in deiner Woche: Kostümumzug, brutales Renaissance-Fußballfinale, Feuerwerk","beschreibung":"Am Tag des Stadtpatrons spielen die vier Stadtviertel (Weiß, Blau, Rot, Grün) in Sand auf der Piazza Santa Croce das Finale des Calcio Storico – ein Gemisch aus Fußball, Rugby und Faustkampf, 27 gegen 27, seit dem 16. Jh. Vorher ab 16 Uhr der Umzug der Republik Florenz in Kostümen. Nachts die „Fochi di San Giovanni“, ein 20-minütiges Feuerwerk vom Piazzale Michelangelo, dem die ganze Stadt vom Arno-Ufer aus zuschaut. Finaltermin 2027 noch nicht offiziell bestätigt (traditionell 24.06.).","lat":43.7685,"lon":11.262,"adresse":"Piazza Santa Croce, 50122 Firenze","dauer_min":300,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Umzug und Feuerwerk frei. Finaltickets gehen über den offiziellen Vorverkauf der Stadt (meist Anfang Juni, schnell ausverkauft, Preis 2027 unbekannt). Ohne Ticket: Umzug an der Via dei Calzaiuoli, Spiel auf den Leinwänden in den Bars rund um Santa Croce."},"kostenlos":{"immer":false,"regeln":["Umzug und Fochi immer frei"],"termine_im_aufenthalt":["2027-06-24"],"hinweis":null},"oeffnungszeiten":"24.06.: Umzug ab ca. 16 Uhr, Finale 17 Uhr, Fochi ca. 22 Uhr","ruhetag":null,"reservierung":"empfohlen","tipp":"Halbfinale finden meist am Wochenende davor statt (2027 vermutlich 12./13.06., also vor deiner Ankunft). Am 24.06. frühzeitig einen Platz am Arno sichern und den letzten Zug nach Prato (gegen 0 Uhr) rausgesucht haben.","link":"https://www.visittuscany.com/en/events/calcio-storico-fiorentino/","quelle":"https://italianismo.com.br/it/agenda-evento/calcio-storico-fiorentino-2027-a-final-na-praca-santa-croce/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Finaltermin 2027 laut Veranstalter-Vorschau „um den 24.06.“, offizielle Bestätigung und Ticketpreise erst 2027.","dist_km":17.5},{"id":"piazzale-michelangelo-san-miniato","name":"Piazzale Michelangelo + San Miniato al Monte + Giardino delle Rose","kategorie":"aussicht","muss":3,"kurz":"Das Postkartenpanorama, darüber die schönste romanische Kirche der Stadt","beschreibung":"Vom Piazzale aus liegt die ganze Stadt vor dir – Kuppel, Turm, Arno. Zehn Minuten weiter oben steht San Miniato (11. Jh.) mit grün-weißer Marmorfassade, Mosaiken und oft gregorianischer Vesper der Mönche gegen 17:30 Uhr. Auf dem Weg hoch der Giardino delle Rose: 350 Rosensorten, Skulpturen von Folon, Blick auf die Stadt und fast keine Leute.","lat":43.7629,"lon":11.265,"adresse":"Piazzale Michelangelo, 50125 Firenze","dauer_min":120,"preis":{"erwachsene":0,"ermaessigt":0,"unter26":0,"waehrung":"EUR","eur":0,"hinweis":"Alles frei (Piazzale, Rosengarten, Kirche)."},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-06-21","2027-06-22","2027-06-23","2027-06-24","2027-06-25","2027-06-26","2027-06-27","2027-06-28"],"hinweis":null},"oeffnungszeiten":"Piazzale immer; Giardino delle Rose tägl. ca. 9–20 (Sommer); San Miniato tägl. ca. 9:30–13 und 15–19","ruhetag":null,"reservierung":"nein","tipp":"Zu Fuß vom Ponte alle Grazie über die Rampen (20 min) statt Bus 12/13. Zum Sonnenuntergang ist der Piazzale voll – San Miniato-Treppe ist ruhiger und höher. Am 24.06. wird hier das Feuerwerk gezündet: Zugang zum Piazzale dann gesperrt, schauen vom Arno-Ufer.","link":"https://www.feelflorence.it/en","quelle":"https://www.feelflorence.it/en","preisstand":"2026","unsicher":true,"quelle_hinweis":"Öffnungszeiten von Rosengarten und San Miniato nicht auf offizieller Seite verifiziert (übliche Sommerzeiten).","dist_km":18.1},{"id":"duomo-prato","name":"Dom von Prato (Lippi-Fresken) + Museo dell'Opera del Duomo + Biscotti Mattei","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Filippo Lippis Herodes-Tanz, Donatellos Außenkanzel – und die Original-Cantucci","beschreibung":"Die Kathedrale Santo Stefano in grün-weißem Marmor hat außen Donatellos Kanzel für den „Heiligen Gürtel“ Mariens (Reliquie in der Cingolo-Kapelle, Fresken von Agnolo Gaddi) und innen in der Cappella Maggiore Filippo Lippis Zyklus zu Stephanus und Johannes dem Täufer (1452–65) mit dem berühmten Tanz der Salome – vollständig restauriert, eines der großen Freskenwerke der Toskana. Das Dommuseum nebenan hat die Originalreliefs der Donatello-Kanzel. Drei Minuten weiter in der Via Ricasoli: Antonio Mattei, seit 1858 Erfinder der Biscotti di Prato (Cantucci).","lat":43.8815,"lon":11.0973,"adresse":"Piazza del Duomo, 59100 Prato","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Kirche frei. Zugang zur Cappella Maggiore (Lippi) war zeitweise nur mit Ticket/Zeitfenster möglich – vor Ort an der Dom-Infostelle fragen. Museo dell'Opera del Duomo 8 € / ermäßigt 6 € (in der Prato Card enthalten). Biscotti bei Mattei nach Gewicht, Tüte ab ca. 5 €."},"kostenlos":{"immer":false,"regeln":["Kathedrale immer frei (außer ggf. Lippi-Kapelle)"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Dom tägl. ca. 10–17 (Gottesdienstzeiten ausgenommen); Museum Di–Sa 10–13 und 14–17, So 13–17","ruhetag":"Montag (Museum)","reservierung":"nein","tipp":"Prato-Abend statt Florenz-Abend: Dom bei Abendlicht, dann Aperitivo auf der Piazza del Comune – ein Drittel der Florenz-Preise. Bahnhof Porta al Serraglio liegt 5 Minuten vom Dom.","link":"https://www.pratoturismo.it/en/","quelle":"https://museionline.info/toscana-musei-monumenti/museo-dell-opera-del-duomo-di-prato","preisstand":"2026","unsicher":true,"quelle_hinweis":"Museumspreis und Öffnungszeiten aus Museumsverzeichnis (nicht offizielle Seite); Lippi-Kapellen-Ticket nicht verifiziert; Mattei-Preis geschätzt.","teilfrei":true,"dist_km":0.8},{"id":"centro-pecci","name":"Centro Pecci (Prato)","kategorie":"museum","muss":2,"kurz":"Toskanas Haus für Gegenwartskunst – goldener Ring am Stadtrand von Prato","beschreibung":"Das 1988 eröffnete, 2016 um den goldenen „Ring“ von Maurice Nio erweiterte Zentrum zeigt wechselnde Ausstellungen zeitgenössischer Kunst, dazu Kino, Bibliothek und Bistro. Nach einer Woche Renaissance der Kontrast, der gut tut – und für unter 26 nur 7 €.","lat":43.8696,"lon":11.1109,"adresse":"Viale della Repubblica 277, 59100 Prato","dauer_min":90,"preis":{"erwachsene":10,"ermaessigt":7,"unter26":7,"waehrung":"EUR","eur":10,"hinweis":"10 € / ermäßigt 7 € (unter 26, Studierende, über 65). In der Prato Card Young (10 €, un
