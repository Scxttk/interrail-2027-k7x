der Altstadt: der runde Gerichtsturm (Sodni stolp, 1310) am Westende, der fünfeckige Wasserturm (Vodni stolp, 1555) am Ostende – Sloweniens ältester Weinladen –, dazwischen Kneipenterrassen direkt am Wasser und der Blick auf die Alte Brücke. Hier findet Ende Juni das Festival Lent statt.","lat":46.5573,"lon":15.645,"adresse":"Pristan / Usnjarska ulica, 2000 Maribor","dauer_min":60,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-07-13","2027-07-14","2027-07-15"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Über die Alte Brücke (Stari most) ans Südufer wechseln – von dort das beste Foto der Altstadt mit Kathedrale und Burg. Abends im Wasserturm ein Glas Štajerska-Wein.","link":"https://www.visitmaribor.si/en/","quelle":null,"preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.3},{"id":"burg-museum","name":"Burg Maribor & Regionalmuseum","kategorie":"museum","muss":2,"kurz":"Stadtburg von 1478 mit Rokoko-Treppe, Festsaal und Stadtgeschichte – nur mit Führung","beschreibung":"Die Burg am Grajski trg ist eher Stadtpalais als Festung: Außen Renaissance und Barock, innen die prächtige Rokoko-Treppe, der Festsaal mit Deckenfresken und die Loretokapelle. Das Regionalmuseum darin zeigt in fünf Dauerausstellungen 23 Gemeinden von der Steinzeit bis 1900 – Rüstungen, Trachten, eine komplette Apotheke. Besuch nur im Rahmen der Führung zur vollen Stunde (60 Min., Slowenisch/Englisch).","lat":46.5596,"lon":15.6475,"adresse":"Grajska ulica 2, 2000 Maribor","dauer_min":75,"preis":{"erwachsene":12.0,"ermaessigt":6.5,"unter26":null,"waehrung":"EUR","eur":12.0,"hinweis":"Führung Erwachsene 12 €, Studierende/Schüler/Rentner 6,50 € (visitmaribor.si nennt teils noch 8 €/5,50 € – alter Stand)"},"kostenlos":{"immer":false,"regeln":["frei am 08.02., 18.05., 3. Samstag im Juni, 03.12."],"termine_im_aufenthalt":[],"hinweis":"3. Samstag im Juni 2027 = 19.06., vor deiner Ankunft"},"oeffnungszeiten":"Di–So 10:00–18:00, Führungen stündlich 10:00–17:00","ruhetag":"Montag","reservierung":"nein","tipp":"Zur vollen Stunde da sein, sonst wartest du bis zu 59 Minuten. Die Treppe und der Festsaal sind der Höhepunkt – wenn die Zeit knapp ist, reicht die Burg von außen und ein Blick in den Hof (frei).","link":"https://museum-mb.si/en/","quelle":"https://museum-mb.si/en/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.0},{"id":"glavni-trg","name":"Hauptplatz (Glavni trg) mit Pestsäule & Rathaus","kategorie":"sehenswuerdigkeit","muss":2,"kurz":"Barocke Pestsäule von 1743, Renaissance-Rathaus, Kaffeehausplatz","beschreibung":"Der Hauptplatz oberhalb des Lent: in der Mitte die Pestsäule (1743) mit Maria und sechs Heiligen, Dank für das Ende der Pest von 1680, an der Nordseite das Rathaus (1515) mit Renaissance-Balkon, rundherum Bürgerhäuser mit Cafés. Daneben die Alte Brücke über die Drau. Zwischen Hauptplatz, Schlossplatz (Grajski trg) und Dom liegt die ganze Altstadt – 15 Minuten zu Fuß.","lat":46.5579,"lon":15.6449,"adresse":"Glavni trg, 2000 Maribor","dauer_min":30,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":null},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-07-13","2027-07-14","2027-07-15"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Von hier durch die Gasse Poštna zum Slomškov trg (Dom) und weiter zum Grajski trg – das ist die komplette Altstadtrunde.","link":"https://www.visitmaribor.si/en/","quelle":null,"preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.2},{"id":"stolnica","name":"Kathedrale St. Johannes & Glockenturm","kategorie":"aussicht","muss":2,"kurz":"Gotischer Dom, 162 Stufen hoch zum Feuerwächter-Rundblick – frei, aber nur Fr/Sa","beschreibung":"Der Dom auf dem Slomškov trg ist Mariborer Geschichte in Stein: romanischer Kern, gotisches Chorgestühl, Barockkapellen. Im 57 m hohen Glockenturm wohnte bis ins 20. Jh. ein Feuerwächter, dessen Stube heute eine Mini-Ausstellung ist ('Čuvajnica'); 162 Stufen weiter oben die Außenplattform mit Blick über Altstadt, Drau und Pohorje. Zugang gegen Spende – aber im Sommer 2024 nur Fr/Sa 10–13 und 16–19 Uhr.","lat":46.559,"lon":15.6449,"adresse":"Slomškov trg 20, 2000 Maribor","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Dom frei; Turm frei gegen freiwillige Spende"},"kostenlos":{"immer":true,"regeln":["Dom immer frei","Turm frei (Spende erbeten)"],"termine_im_aufenthalt":["2027-07-13","2027-07-14","2027-07-15"],"hinweis":"Turm vermutlich an deinen Tagen (Di–Do) zu"},"oeffnungszeiten":"Dom tägl. außerhalb der Messen; Turm (Stand 2024): bis Ende Juni tägl. 16–19, danach Fr+Sa 10–13 und 16–19","ruhetag":null,"reservierung":"nein","tipp":"Turmzeiten 2027 beim TIC Maribor (Partizanska 6a) erfragen – wenn er Di–Do zu bleibt, nimm stattdessen den Piramida-Hügel für die Aussicht.","link":"https://www.visitmaribor.si/en/","quelle":"https://www.rtvslo.si/zabava-in-slog/ture-avanture/kako-so-ziveli-mariborski-pozarni-opazovalci-in-kaksen-razgled-so-imeli/712712","preisstand":"2026","unsicher":true,"quelle_hinweis":"Turmzeiten nur aus RTV-Artikel 06/2024; Betreiberseite (turizem.znm.si) nicht erreichbar.","dist_km":0.2},{"id":"malica","name":"Malica – das Mittagsmenü","kategorie":"essen","muss":2,"kurz":"Werktags 11–15 Uhr: Suppe + Hauptgericht für 7–10 € in jeder Gostilna","beschreibung":"Sloweniens bestgehütetes Spargeheimnis ist die 'malica' – das Werktagsmenü, das Gostilnas und sogar bessere Restaurants zwischen 11 und 15 Uhr für 7–10 € servieren: Suppe (im Sommer kalte Gurkensuppe oder Štajerska kisla juha), Hauptgericht, oft Salat. Da du Di–Do da bist, trifft es dich perfekt. Rund um Glavni trg, Gosposka ulica und am Lent nach dem Schild 'malica' oder 'dnevno kosilo' schauen.","lat":46.5583,"lon":15.646,"adresse":"Gostilnas rund um Glavni trg / Gosposka ulica, 2000 Maribor","dauer_min":60,"preis":{"erwachsene":null,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":null,"hinweis":"Menü ca. 7–10 € (Erfahrungswert, kein offizieller Preis)"},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mo–Fr ca. 11:00–15:00","ruhetag":null,"reservierung":"nein","tipp":"Zum Nachtisch Pohorska gibanica (Schichtkuchen mit Quark, Mohn, Nuss, Apfel) – gibt es in jeder Bäckerei um 3 €.","link":null,"quelle":null,"preisstand":"2026","unsicher":true,"quelle_hinweis":"Essens-Tipp, Preis nicht offiziell verifiziert.","dist_km":0.2},{"id":"mestni-park","name":"Stadtpark & Drei Teiche (Trije ribniki)","kategorie":"natur","muss":2,"kurz":"Englischer Park von 1872 mit drei Weihern am Fuß der Weinberge","beschreibung":"Fünf Minuten nördlich der Burg beginnt der Stadtpark: alte Platanen, Pavillon, Aquarium-Terrarium (kostenpflichtig), dahinter die drei Teiche mit Café und Rosengarten. Von dort führt ein Weg in die Weinberge zur Piramida – Hügel mit Kapelle und dem besten Blick auf die Stadt (25 Minuten bergauf, frei).","lat":46.566,"lon":15.648,"adresse":"Mestni park / Trije ribniki, 2000 Maribor","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":0,"hinweis":"Park frei; Aquarium-Terrarium kostet (nicht geprüft)"},"kostenlos":{"immer":true,"regeln":["immer frei"],"termine_im_aufenthalt":["2027-07-13","2027-07-14","2027-07-15"],"hinweis":null},"oeffnungszeiten":"immer","ruhetag":null,"reservierung":"nein","tipp":"Abends zur Piramida (46.5695, 15.6500) hoch – Sonnenuntergang über Drau und Pohorje, danach am Teich-Café ein Bier.","link":"https://www.visitmaribor.si/en/","quelle":null,"preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.7},{"id":"mariborski-otok","name":"Mariborski otok – Flussinsel & Freibad","kategorie":"strand","muss":2,"kurz":"Naturschutz-Insel in der Drau mit Freibad von 1930, Studi-Ticket 5 €","beschreibung":"Vier Kilometer flussaufwärts liegt eine bewaldete Insel in der Drau, Naturschutzgebiet mit altem Auwald, Spazierweg rundherum und einem Freibad aus den 1930ern: drei Becken, große Liegewiese, Beachvolleyball, Blick auf den Fluss. Bei 30 Grad im Juli der Ort, an dem Maribor ist. Bus 15 bis Endstation, dann über die Brücke.","lat":46.57,"lon":15.606,"adresse":"Mariborski otok, 2000 Maribor","dauer_min":240,"preis":{"erwachsene":7.0,"ermaessigt":5.0,"unter26":null,"waehrung":"EUR","eur":7.0,"hinweis":"Mo–Fr: Erwachsene ganztags 7 €, Schüler/Studierende 5 €, nach 14 Uhr einheitlich 4,50 €, nach 18 Uhr 3 €. Sa/So: 9 € / 7 € / 6,50 € / 3 €. Preisliste gültig ab 01.06.2026."},"kostenlos":{"immer":false,"regeln":["Insel-Rundweg außerhalb des Bades frei","bei Hitzewellen hat die Stadt den Eintritt schon erlassen (nicht planbar)"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Saison ca. Juni–Anfang Sept., tägl. ca. 9:00–19:00 (Zeiten 2027 auf sportmaribor.si)","ruhetag":null,"reservierung":"nein","tipp":"Nach 14 Uhr kommen: 4,50 € statt 7 € und die Sonne steht trotzdem noch vier Stunden. Du bist an Werktagen da – die billigen Tage.","link":"https://www.sportmaribor.si/","quelle":"https://www.sportmaribor.si/wp-content/uploads/documents/facilities/Kopalis%CC%8Cc%CC%8Ce_Mariborski_otok.pdf","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":3.3},{"id":"pohorje","name":"Pohorje-Seilbahn (Pohorska vzpenjača) + Bike-Park / Wanderung","kategorie":"tagesausflug","muss":2,"kurz":"In 10 Minuten von 328 auf 1.042 m – Wald, Almen, Bike-Park","beschreibung":"Die Kabinenbahn (seit 1957, Kabinen 2009 erneuert) startet am Stadtrand und bringt dich in 10 Minuten auf den Pohorje-Kamm: Fichtenwald, Hochmoore, der Wasserfall Šumik, die Bolfenk-Kirche mit Aussichtsturm, Berggasthöfe. Im Sommer Bike-Park mit Downhill-Trails (teuer) und ein Netz an Wanderwegen – zu Fuß zurück in die Stadt dauert 2 Stunden. Achtung Fahrplan: 2026 fuhr die Bahn im Sommer ab 25.06. täglich während der Bike-Park-Saison, im Herbst aber nur Fr–So – du bist Di–Do da.","lat":46.5334,"lon":15.615,"adresse":"Talstation: Pohorska ulica 60, 2000 Maribor (Bus G6)","dauer_min":300,"preis":{"erwachsene":16.0,"ermaessigt":11.0,"unter26":null,"waehrung":"EUR","eur":16.0,"hinweis":"Hin+zurück 16 € / Studierende, Jugendliche, Senioren 11 €; einfach 10 € / 7 €; Fahrrad +4 €. Bike-Park-Tageskarte zusätzlich 34–44 € (Studi 27–35 €). Preisliste gültig ab 01.06.2026."},"kostenlos":{"immer":false,"regeln":["Wanderwege immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Sommerfahrplan 2026 ab 25.06.: in der Bike-Park-Saison täglich, stündlich ab 7:00 und durchgehend 10:00–17:00 (Fr–So auch bis 21:00); Di–Do-Betrieb im Juli 2027 auf visitpohorje.si bestätigen","ruhetag":null,"reservierung":"nein","tipp":"Nur einfach hoch kaufen (7 € im Studi-Tarif) und über den markierten Weg Nr. 1 zu Fuß runter nach Radvanje (1,5–2 h, Schatten). Oben zur Bolfenk-Kirche (15 Min.), der Turm daneben ist frei. Wasser mitnehmen, die Hütten sind unter der Woche nicht alle offen.","link":"https://www.visitpohorje.si/en/","quelle":"https://www.visitpohorje.si/en/price-lists/cableway/","preisstand":"2026","unsicher":true,"quelle_hinweis":"Preise offiziell; Betriebstage Di–Do im Juli nicht sicher (Fahrplan-PDF 2026 nicht ladbar, 2027 nicht publiziert).","dist_km":3.8},{"id":"vinag","name":"Weinkeller Vinag 1847","kategorie":"aktivitaet","muss":1,"kurz":"2 km Kellergänge unter der Altstadt, Führung mit Verkostung ab 25 €","beschreibung":"Unter dem Trg svobode liegt einer der größten klassischen Weinkeller Europas: 2 km Tunnel, 144 Holzfässer, Weinarchiv mit Jahrgängen bis 1946. Führungen täglich um 12, 14, 16 und 18 Uhr, immer mit Verkostung – Classic 3 Weine (25 €) bis Extra Premium 5 Weine mit Schinken und Käse (39 €). Teuer für ein Studi-Budget, aber ein echtes Erlebnis, wenn du Wein magst.","lat":46.5602,"lon":15.646,"adresse":"Trg svobode 3, 2000 Maribor","dauer_min":75,"preis":{"erwachsene":25.0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":25.0,"hinweis":"Classic 25 € (3 Weine), Classic Plus 29 €, Premium 38 €, Extra Premium 39 €; kein Studi-Tarif"},"kostenlos":{"immer":false,"regeln":[],"termine_im_aufenthalt":[],"hinweis":"Weinladen/Empfang (11–19 Uhr) ohne Führung frei betretbar"},"oeffnungszeiten":"Führungen tägl. 12:00, 14:00, 16:00, 18:00; Laden 11:00–19:00","ruhetag":null,"reservierung":"nötig","tipp":"Mindestens einen Tag vorher per Mail (info@vinag1847.si) reservieren, keine Mindestgruppe. Die Alternative fürs kleine Budget: Weinprobe im Haus der Alten Rebe, glasweise.","link":"https://vinag1847.si/en/","quelle":"https://vinag1847.si/en/dozivetja/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":0.1},{"id":"sinagoga","name":"Synagoge Maribor","kategorie":"museum","muss":1,"kurz":"Eine der ältesten erhaltenen Synagogen Europas (14. Jh.), 2 € Eintritt","beschreibung":"Im ehemaligen Judenviertel neben dem Judenturm steht die 1354 erstmals erwähnte Synagoge – nach der Vertreibung 1497 Kirche, Lager, Wohnhaus, seit 2001 Kulturzentrum. Innen ein schlichter gotischer Raum mit Wechselausstellungen zur jüdischen Geschichte Sloweniens. Klein, 20 Minuten, nur werktags.","lat":46.5569,"lon":15.6429,"adresse":"Židovska ulica 4, 2000 Maribor","dauer_min":25,"preis":{"erwachsene":2.0,"ermaessigt":null,"unter26":null,"waehrung":"EUR","eur":2.0,"hinweis":"2 € (laut visitmaribor.si); Tage der offenen Tür frei"},"kostenlos":{"immer":false,"regeln":["Europäische Tage der jüdischen Kultur (September) frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Mo–Fr 8:00–16:00; 2026 wegen Sanierung 20.07.–03.08. geschlossen","ruhetag":"Samstag, Sonntag","reservierung":"nein","tipp":"Liegt direkt am Weg vom Gerichtsturm zur Alten Rebe – mitnehmen, wenn offen. Der Judenturm daneben ist Fotogalerie mit freiem Zugang zur Terrasse.","link":"https://sinagogamaribor.si/en/","quelle":"https://www.visitmaribor.si/en/what-to-do/sights/4968-maribor-synagogue/","preisstand":"2026","unsicher":false,"quelle_hinweis":"Eigene Website nennt keinen Preis; 2 € laut städtischer Tourismusseite.","dist_km":0.4}],"tage":[{"datum":"2027-07-13","titel":"Altstadt, Lent, Alte Rebe, Piramida","intro":"Alles liegt zehn Minuten um die Burg herum, deshalb heute die ganze Altstadtrunde zu Fuß: Hauptplatz, runter zum Drauufer, die älteste Rebe der Welt, abends durch den Stadtpark auf die Piramida zum Sonnenuntergang. Die Pohorje-Seilbahn passt in zwei Nächte nicht – dafür morgen die Badeinsel.","programm":[{"spot":null,"zeit":"14:00","titel":"Ankunft, zu Fuß zur Unterkunft","notiz":"Vom Bahnhof 15 Min. ins Zentrum zum Grajski trg, einchecken. Kein Bus nötig."},{"spot":"glavni-trg","zeit":"15:00","notiz":"Pestsäule, Rathaus mit Renaissance-Balkon, Cafés. Von hier über die Poštna zum Slomškov trg und zum Grajski trg ist die ganze Altstadt – heute nur kurz orientieren."},{"spot":"stara-trta","zeit":"15:30","notiz":"Zwei Minuten runter zum Lent, Vojašniška 8 – Eintritt frei, bis 18 Uhr offen. Rebe an der Fassade, digitale Ausstellung, Weinprobe glasweise ab ca. 3 € statt der teuren Kellerführung."},{"spot":"lent","zeit":"16:30","notiz":"Vom Gerichtsturm im Westen zum Wasserturm im Osten die Promenade entlang, dann über die Alte Brücke ans Südufer – von dort das beste Foto von Altstadt, Dom und Burg."},{"spot":null,"zeit":"18:00","titel":"Abendessen in einer Gostilna","notiz":"Rund um Glavni trg oder am Lent: Štajerska kisla juha, Hauswürste, dazu ein Glas Laški Rizling. Leitungswasser ist Quellwasser, Trinkgeld 5–10 %."},{"spot":"mestni-park","zeit":"19:30","notiz":"5 Min. nördlich der Burg: Platanen, drei Teiche, dann 25 Min. durch die Weinberge hoch zur Piramida (46.5695, 15.6500) – Sonnenuntergang über Drau und Pohorje, danach Bier am Teich-Café."}]},{"datum":"2027-07-14","titel":"Burgführung, Malica, Badeinsel","intro":"Vormittag für Dom und Burg – die Burgführung geht nur zur vollen Stunde, also um 10 vor der Tür stehen –, dazwischen die Synagoge (nur werktags). Mittags die Malica, das Werktagsmenü für 7–10 €, und ab 14 Uhr auf den Mariborski otok: dann kostet das Freibad 4,50 € statt 7 € und die Sonne steht noch vier Stunden.","programm":[{"spot":"stolnica","zeit":"09:00","notiz":"Dom frei, 2 Min. vom Grajski trg. Der Turm hatte 2024 im Sommer nur Fr/Sa offen – beim TIC (Partizanska 6a) nachfragen; wenn zu, war die Piramida gestern dein Ersatz."},{"spot":"burg-museum","zeit":"10:00","notiz":"Führung um Punkt 10 (60 Min., 6,50 € mit Studiausweis), sonst wartest du bis zu 59 Minuten. Rokoko-Treppe, Festsaal, Loretokapelle; der Hof ist frei."},{"spot":"sinagoga","zeit":"11:30","notiz":"Mo–Fr 8–16 Uhr, 2 €, 20 Minuten – auf dem Weg vom Gerichtsturm zur Rebe. Der Judenturm daneben hat eine freie Terrasse."},{"spot":"malica","zeit":"12:15","notiz":"Schild 'malica' oder 'dnevno kosilo' um Glavni trg und Gosposka ulica: Suppe plus Hauptgericht 7–10 €. Nachtisch Pohorska gibanica aus der Bäckerei, 3 €."},{"spot":"mariborski-otok","zeit":"14:00","notiz":"Bus 15 bis Endstation (Marprom-App 1,30 €, die letzten Haltestellen laut Presse gratis), über die Brücke. Nach 14 Uhr 4,50 €, nach 18 Uhr 3 €. Drei Becken, Liegewiese, Auwald-Rundweg außerhalb des Bades frei."},{"spot":null,"zeit":"19:00","titel":"Abendessen am Fluss","notiz":"Zurück mit Bus 15, essen am Lent oder am Glavni trg. Zug morgen gegen 11 – Weg zum Bahnhof 15 Min."}]},{"datum":"2027-07-15","titel":"Gibanica und Zug nach Prag","intro":"Abreisetag, Zug gegen 11 Uhr – Prag ist weit, also keine Experimente. Frühstück in der Altstadt, Kuchen für den Zug, 15 Minuten zum Bahnhof.","programm":[{"spot":null,"zeit":"08:30","titel":"Frühstück, auschecken","notiz":"Pohorska gibanica aus der Bäckerei (3 €) als Zugproviant, Wasser auffüllen."},{"spot":null,"zeit":"10:15","titel":"Zum Bahnhof","notiz":"15 Min. zu Fuß vom Grajski trg."}]}],"naechte":2},{"id":"prag","name":"Prag","land":"Tschechien","landcode":"CZ","waehrung":"CZK","kurs_eur":0.04094,"kurs_stand":"2026-10-07","ankunft":"2027-07-15","abreise":"2027-07-17","unterkunft":{"name":"Plus Prague Hostel","ort":"Praha 7 – Holešovice","lat":50.1095,"lon":14.448,"hinweis":"Přívozní 1, 170 00 Praha 7; Tram Ortenovo náměstí 2 min, Metro C Nádraží Holešovice"},"zentrum":{"lat":50.0875,"lon":14.4213},"intro":"Prag ist im Juli voll, teuer im Zentrum und trotzdem zu Fuß am schönsten: Burg, Karlsbrücke und Altstädter Ring liegen auf einer Linie. Dein Hostel in Holešovice liegt am Letná-Park mit Biergarten, dem Veletržní-Palast und DOX – das Viertel machst du am Ankunftsabend. Ein voller Tag für Burg, Kleinseite, Petřín und Altstadt; der Samstag ist Abreisetag, aber mit Náplavka-Bauernmarkt am Morgen. Jüdisches Viertel nur Do/Fr, samstags geschlossen.","feiertage":[],"gut_zu_wissen":[{"titel":"Was frei ist","text":"Das Burggelände mit Höfen, Gärten und dem vorderen Teil des Veitsdoms (6–22 Uhr), Vyšehrad, Letná, Petřín-Hügel, Kampa, Náplavka, Riegrovy sady und die Karlsbrücke kosten nichts. Die Nationalgalerie war früher unter 26 frei – die aktuelle Preisliste nennt nur noch unter 16 frei und ermäßigt 140 CZK; Gratis am 1. Sonntag im Monat (04.07. liegt vor deiner Ankunft). Nationalmuseum-Gratistage 2026 fielen alle auf Sonntage, keiner im Juli. Prager Türme: 50 % in der ersten Stunde nach Öffnung (9–10 Uhr)."},{"titel":"Nahverkehr","text":"PID-Tickets: 30 min 39 CZK, 90 min 50, 24 h 150, 72 h 350 (in der PID-Lítačka-App 36/46/140/340). Studi-Ermäßigung für 18–26 nur mit im PID-System registriertem Nachweis – rechne mit Vollpreis. Kaufen per App, am Automaten, mit Kontaktlos-Karte an den gelben Lesegeräten in Tram und Bus (dort gleich entwertet). Papierticket beim ersten Einsteigen stempeln. Das 24-h-Ticket gilt auch für die Petřín-Standseilbahn (sonst 100 CZK einfach). Vom Hostel: Tram 6/12/17 ab Ortenovo náměstí Richtung Zentrum, Metro C ab Nádraží Holešovice bis Muzeum/Hlavní nádraží."},{"titel":"Prague Visitor Pass","text":"48 h 2.700 CZK, Studierende 15–25 2.050 CZK, inkl. ÖPNV und über 70 Eintritten (Burg, Jüdisches Viertel, Türme, Vyšehrad-Kasematten). Rechnung für dich: Burg 450 + Jüdisches Viertel 600 + Petřín-Turm 250 + Rathausturm 350 + 2 × 24-h-Ticket 300 = 1.950 CZK – weniger als der Studentenpass. Lohnt nur, wenn du zusätzlich Zoo oder Schifffahrt mitnimmst."},{"titel":"Geld","text":"1 EUR ≈ 24,43 CZK (EZB 07.10.2026); schnell gerechnet: 100 CZK ≈ 4 EUR. Karte geht fast überall. Wechselstuben am Altstädter Ring, Wenzelsplatz und an der Karlsbrücke werben mit „0 % commission“ und zahlen 15–25 % unter Kurs – wenn überhaupt, kleine Stuben in Seitenstraßen mit ausgehängtem Ankaufskurs um 24. Keine Euro-Münzen in Euronet-Automaten tauschen, am Geldautomaten „ohne Umrechnung / decline conversion“ wählen. Euro werden in Touristenlokalen oft angenommen, aber zu schlechtem Kurs. Trinkgeld ~10 %, wird beim Zahlen gesagt. Leitungswasser trinkbar."},{"titel":"Touristenfallen","text":"Trdelník ist keine tschechische Tradition, sondern Touristenware zu 100+ CZK. Restaurants direkt am Altstädter Ring und in der Karlova verlangen Zentrums-Aufschlag, Kleinseite-Hinterhöfe und Holešovice sind halb so teuer. Astronomische Uhr: Das Figurenspiel zur vollen Stunde dauert 45 Sekunden – nicht enttäuscht sein."}],"spots":[{"id":"letna","name":"Letná-Park + Biergarten","kategorie":"natur","muss":3,"kurz":"Der Aussichtsbalkon über der Altstadt mit Biergarten, zehn Minuten vom Hostel","beschreibung":"Hochplateau über der Moldau, wo bis 1962 das größte Stalin-Denkmal der Welt stand – heute steht da das rote Metronom, darunter die Skater. Vom Rand siehst du alle Brücken auf einmal. Der Biergarten unter Kastanien beim Letenský zámeček ist Prags beliebtester: Bier vom Fass im Plastikbecher, Bänke, Blick auf die Stadt. Von Holešovice aus dein Abendplatz.","lat":50.0956,"lon":14.4208,"adresse":"Letenské sady, 170 00 Praha 7","dauer_min":90,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"CZK","eur":0,"hinweis":"Park frei; Bierpreise nicht offiziell geprüft, Biergarten-Niveau deutlich unter Altstadt"},"kostenlos":{"immer":true,"regeln":["Immer frei"],"termine_im_aufenthalt":["2027-07-15","2027-07-16","2027-07-17"],"hinweis":null},"oeffnungszeiten":"Park immer; Biergarten saisonal bei gutem Wetter, meist bis ca. 23 Uhr","ruhetag":null,"reservierung":"nein","tipp":"Zum Sonnenuntergang zum Metronom, dann 100 Meter weiter östlich in den Biergarten. Vom Hostel zu Fuß 20 Minuten durch Holešovice oder Tram bis Letenské náměstí.","link":"https://www.prague.eu/en","quelle":"https://www.prague.eu/en","preisstand":"2026","unsicher":false,"quelle_hinweis":"Freier Zugang, keine Preisquelle nötig","dist_km":2.5},{"id":"altstaedter-ring","name":"Altstädter Ring + Astronomische Uhr + Rathausturm","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Prags Wohnzimmer: Teynkirche, Hus-Denkmal, die Uhr von 1410 und der Turm mit Aufzug","beschreibung":"Der Platz ist Kulisse aus sechs Jahrhunderten – gotische Teynkirche, barocke Nikolauskirche, Jugendstil-Fassaden. Zur vollen Stunde (9–23 Uhr) ziehen an der Astronomischen Uhr die Apostel vorbei, der Tod läutet die Glocke. Der Rathausturm hat einen Aufzug und oben den Rundblick über den Platz und die Dächer; die Rathaus-Innenräume mit Kapelle und den Apostelfiguren von innen sind im Ticket drin.","lat":50.0875,"lon":14.4213,"adresse":"Staroměstské náměstí 1, 110 00 Praha 1","dauer_min":60,"preis":{"erwachsene":350,"ermaessigt":280,"unter26":280,"waehrung":"CZK","eur":14.5,"hinweis":"Rathausturm + Innenräume; ermäßigt 16–26 Jahre. Platz und Uhr frei"},"kostenlos":{"immer":false,"regeln":["Platz und Figurenspiel immer frei"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Platz immer; Rathausturm Apr–Dez tägl. 9:00–20:00","ruhetag":null,"reservierung":"nein","tipp":"Fürs Figurenspiel nicht vor der Uhr stehen, sondern von der Turmplattform zuschauen – du siehst die Menge und die Apostel von hinten. Der Turm hat abends das beste Licht.","link":"https://www.prague.eu/en","quelle":"http://prague.eu/en/objevujte/old-town-hall-with-astronomical-clock-staromestska-radnice-s-orlojem/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"teilfrei":true,"dist_km":3.1},{"id":"karlsbruecke","name":"Karlsbrücke + Altstädter Brückenturm","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"600 Jahre alte Steinbrücke mit 30 Barockstatuen – früh morgens fast leer","beschreibung":"Karl IV. ließ sie 1357 bauen, bis 1841 war sie Prags einzige Moldaubrücke. Tagsüber ein Strom aus Karikaturisten, Musikern und Gruppen; um 7 Uhr morgens hast du Nebel, Schwäne und die Burg für dich. Der Altstädter Brückenturm ist der schönste gotische Turm der Stadt und oben der klassische Blick die Brücke entlang zur Burg.","lat":50.0865,"lon":14.4114,"adresse":"Karlův most, 110 00 Praha 1","dauer_min":45,"preis":{"erwachsene":0,"ermaessigt":null,"unter26":null,"waehrung":"CZK","eur":0,"hinweis":"Brücke frei. Brückenturm 250 / 200 CZK (16–26 Jahre), 50 % in der ersten Stunde (9–10 Uhr)"},"kostenlos":{"immer":true,"regeln":["Brücke immer frei"],"termine_im_aufenthalt":["2027-07-15","2027-07-16","2027-07-17"],"hinweis":"Turm 9:00–10:00 halber Preis"},"oeffnungszeiten":"Brücke immer; Turm Jun–Sep tägl. 9:00–20:30","ruhetag":null,"reservierung":"nein","tipp":"Sonnenaufgang oder nach 22 Uhr. Die Statue des Johannes Nepomuk reiben ist Touristenfolklore – die echte Stelle ist das Kreuz auf dem Geländer, wo er ins Wasser geworfen wurde.","link":"https://www.prague.eu/en","quelle":"http://prague.eu/en/objevujte/old-town-bridge-tower-staromestska-mostecka-vez/","preisstand":"2026","unsicher":false,"quelle_hinweis":null,"dist_km":3.7},{"id":"prager-burg","name":"Prager Burg (Pražský hrad) + Veitsdom","kategorie":"sehenswuerdigkeit","muss":3,"kurz":"Größtes zusammenhängendes Burgareal der Welt, Gelände frei, Innenräume per Rundgang-Ticket","beschreibung":"Sitz böhmischer Könige, Kaiser und heute des Präsidenten. Durch die Höfe, in die Gärten und in den vorderen Teil des Veitsdoms kommst du ohne Ticket. Der Rundgang (seit 2026 ein gemeinsames Ticket statt Kreis A/B) öffnet den ganzen Dom mit Wenzelskapelle und Mucha-Fenster, den Alten Königspalast mit Vladislav-Saal, die St.-Georgs-Basilika und das Goldene Gässchen mit Kafkas Haus Nr. 22. Ticket gilt zwei Tage, jedes Gebäude einmal.","lat":50.0909,"lon":14.4005,"adresse":"Hradčany, 119 08 Praha 1","dauer_min":180,"preis":{"erwachsene":450,"ermaessigt":300,"unter26":null,"waehrung":"CZK","eur":18.5,"hinweis":"Rundgang 450 / erm. 300 CZK (prague.eu). Wer ermäßigt bekommt (Studierende bis 26?), steht nur auf hrad.cz – Seite blockierte den Abruf. Gelände frei"},"kostenlos":{"immer":false,"regeln":["Höfe, Gärten und westlicher Teil des Veitsdoms immer frei (6:00–22:00)"],"termine_im_aufenthalt":[],"hinweis":null},"oeffnungszeiten":"Gelände tägl. 6:00–22:00; Gebäude Apr–Okt 9:00–17:00; Veitsdom Mo–Sa 9:00–17:00, So 12:00–17:00","ruhetag":null,"reservierung":"empfohlen","tipp":"Vor 9 Uhr über die Alte Schlosstreppe hoch (Metro Malostranská), dann stehst du vor den Reisegruppen am Sicherheitscheck. Goldenes Gässchen ist nach 17 Uhr frei zugänglich, aber die Häuschen sind zu. Abstieg durch die Südgärten.","link":"https://www.hrad.cz/en","quelle":"http://prague.eu/en/objevujte/prague-castle-prazsky-hrad/","preisstand":"2026","unsicher":true,"quelle_hinweis":"hrad.cz liefert 403; Preis von der offiziellen Tourismusseite prague.eu. Zweitquellen widersprechen sich (250/350 alte Kreise A/B vs. 450 Gesamtrundgang)","teilfrei":true,"dist_km":4.0},{"id":"nationalgalerie-veletrzni","name":"Nationalgalerie – Veletržní palác (Messepalast)","kategorie":"museum","muss":2,"kurz":"Funktionalistischer Riesenbau in Holešovice mit Kunst 1796 bis heute, Mucha, Picasso, Klimt","beschreibung":"Der Messepalast von 1928 war das erste funktionalistische Großgebäude Europas, innen ein lichtdurchfluteter Hof über sieben Etagen. Hier hängt die moderne Sammlung der Nationalgalerie: tschechische Moderne, französische Impressionisten, Klimt, Schiele, Picasso, Muchas Slawisches Epos zeitweise. Fünf Gehminuten vom Hostel – ideal für einen Regen- oder Ankunftsnachmittag.","lat":50.102,"lon":14.4324,"adresse":"Dukelských hrdinů 47, 170 00 Praha 7","dauer_min":120,"preis":{"erwachsene":250,"ermaessigt":140,"unter26":null,"waehrung":"CZK","eur":10.0,"hinweis":"Preisliste nennt Erwachsene 250, ermäßigt 140, frei nur unter 16. Die frühere Regel „unter 26 frei“ steht nicht mehr auf der Eintrittsseite"},"kostenlos":{"immer":false,"regeln":["Jeden ersten Sonntag im Monat Dauerausstellungen frei","Unter 16 immer frei","Einzelne Aktionstage (17.5., 28.10., 17.11.)"],"termine_im_aufenthalt":[],"hinweis":"04.07.2027 liegt vor der Ankunft, nächster 1. Sonntag 01.08."},"oeffnungszeiten":"Di–So 10:00–18:00","ruhetag":"Mo","reservierung":"nein","tipp":"An der Kasse mit Studierendenausweis nach der Unter-26-Regel fragen – falls sie noch gilt, sparst du 250 CZK. Der Blick von der obersten Galerie in den Lichthof lohnt auch ohne Kunstinteresse.","link":"https://www.ngprague.cz/en","quelle":"https://www.ngprague.cz/en/about/admission","preisstand":"2026","unsicher":true,"quelle_hinweis":"Eintrittsseite trägt Preisstand 2024; prague.eu behauptete noch „unter 26 frei“, die Seite dazu ist aber offline (404)","dist_km":1.4},{"id":"lokal-hospoda","name":"Tschechische Hospoda: Lokál","kategorie":"essen","muss":2,"kurz":"Ehrliche Kneipenküche mit frisch gezapftem Pilsner – Svíčková, Gulasch, Knödel","beschreibung":"Lokál (Dlouhá 33 in der Altstadt, weitere u. a. U Bílé kuželky auf der Kleinseite) ist die Kette, die Prager Kneipenküche ohne Touristenaufschlag ernst nimmt: Tanks mit unpasteurisiertem Pilsner Urquell, Svíčková (Rinderbraten in Sahnesauce mit Knödeln), Gulasch, Smažený sýr. Laut, langer Tisch, schnell. Besser jedenfalls als jedes Lokal direkt am Altstädter Ring.","lat": function dayBlock(t,c){

    const name=s?`<button data-go="${s.id}">${esc(s.name)}</button>`:`<span>${esc(pr.titel||"")}</span>`;
    return `<div class="prog"><div class="zeit num">${esc(pr.zeit||"")}</div><div><div class="pn">${name}${price}${s&&s.reservierung==="nötig"?`<span class="tag warn">vorab buchen</span>`:""}</div>${pr.notiz?`<p>${esc(pr.notiz)}</p>`:""}</div></div>`;
  }).join("");

}
function mapPoints(c){
  let pts=c.spots.filter(s=>s.lat&&s.lon);
  if(mapDay){ const t=(c.tage||[]).find(x=>x.datum===mapDay); const ids=new Set((t?.programm||[]).map(p=>p.spot).filter(Boolean)); pts=pts.filter(s=>ids.has(s.id)); }
  else { if(!store.trips) pts=pts.filter(s=>s.kategorie!=="tagesausflug"); if(mapMust) pts=pts.filter(s=>s.muss===3); }
  return pts;
}
function updateMap(c){
  const sec=$("#mapsec"); if(!sec) return;

  sec.innerHTML=chips+(window.L?renderLeaflet(c):renderMap(c));

  sec.querySelectorAll(".map [data-go]").forEach(el=>el.onclick=()=>jumpTo(el.dataset.go));
  const tg=sec.querySelector("#trips"); if(tg) tg.onchange=()=>{store.trips=tg.checked;save();updateMap(c);};
  if(window.L) mountLeaflet(c);
}
function prevNext(c){ const i=DATA.indexOf(c); const p=DATA[i-1], n=DATA[i+1]; return `${p?`<button data-city="${p.id}">← ${esc(p.name)}</button>`:"<span></span>"}${n?`<button data-city="${n.id}">${esc(n.name)} →</button>`:""}`; }
function jumpTo(id){ filter={mode:"alle",kat:null}; renderCity(); const el=$("#s-"+CSS.escape(id)); if(!el) return; const d=el.querySelector(".detail"); d.hidden=false; el.querySelector(".head").setAttribute("aria-expanded","true"); el.scrollIntoView({behavior:"smooth",block:"start"}); }
function renderLeaflet(c){
  const showTrips=!!store.trips;
  return `<div class="map"><div id="lmap" data-n="${mapPoints(c).length}" style="height:min(70vh,520px);border-radius:10px;overflow:hidden;background:var(--surface2)"></div>
  <div class="legend"><span><i style="background:var(--free)"></i>immer frei</span><span><i style="background:var(--warn)"></i>an deinen Tagen mal frei</span><span><i style="background:var(--muted)"></i>kostet</span><span><i style="background:var(--accent)"></i>Unterkunft</span><span>Großer Punkt = Pflicht</span></div>
  ${!mapDay&&c.spots.some(s=>s.kategorie==="tagesausflug")?`<label class="toggle"><input type="checkbox" id="trips" ${showTrips?"checked":""}> Tagesausflüge einblenden</label>`:""}</div>`;
}
function mountLeaflet(c){
  const el=$("#lmap"); if(!el) return;
  const css=getComputedStyle(document.documentElement); const v=n=>css.getPropertyValue(n).trim();
  const map=L.map(el,{scrollWheelZoom:false,attributionControl:true});
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}).addTo(map);
  const pts=mapPoints(c);
  const col=s=>(s.kostenlos?.immer||s.preis?.erwachsene===0)?v("--free"):(s.kostenlos?.termine_im_aufenthalt?.length?v("--warn"):v("--muted"));
  const b=[];
  pts.forEach(s=>{ const m=L.circleMarker([s.lat,s.lon],{radius:s.muss===3?10:7,color:"#fff",weight:2,fillColor:col(s),fillOpacity:.95}).addTo(map);
    const y=yourPrice(s); const pr=(s.kostenlos?.immer||s.preis?.erwachsene===0)?"frei":(y!=null?money(y,c.waehrung):"");
    if(s.muss===3||mapDay||mapMust) m.bindTooltip(esc(s.name.length>28?s.name.slice(0,27)+"…":s.name),{permanent:true,direction:"right",offset:[8,0],className:"must"});
    m.bindPopup(`<b>${esc(s.name)}</b><br>${esc(s.kurz)}<br>${pr}${s.dist_km!=null?` · ${walk(s.dist_km)}`:""}<br><a href="#" data-go="${s.id}">Details</a>`);
    m.on("popupopen",e=>{ const a=e.popup.getElement().querySelector("[data-go]"); if(a) a.onclick=ev=>{ev.preventDefault(); jumpTo(s.id);}; });
    b.push([s.lat,s.lon]); });
  const u=c.unterkunft; if(u?.lat){ L.circleMarker([u.lat,u.lon],{radius:9,color:"#fff",weight:2,fillColor:v("--accent"),fillOpacity:1}).addTo(map).bindTooltip("Unterkunft",{permanent:true,direction:"left",offset:[-8,0],className:"must"}); b.push([u.lat,u.lon]); }
  if(b.length) map.fitBounds(b,{padding:[30,30],maxZoom:15});
  const lab=()=>el.classList.toggle("labels-off",map.getZoom()<(mapDay||mapMust?12:14)); map.on("zoomend",lab); lab();
}
function renderMap(c){
  const showTrips=!!store.trips;
  const pts=mapPoints(c);
  const u=c.unterkunft; const lat0=u.lat, lon0=u.lon, kx=111.32*Math.cos(lat0*Math.PI/180), ky=110.57;
  const all=[...pts.map(s=>({x:(s.lon-lon0)*kx,y:-(s.lat-lat0)*ky,s})),{x:0,y:0,home:true}];
  let minx=Math.min(...all.map(p=>p.x)),maxx=Math.max(...all.map(p=>p.x)),miny=Math.min(...all.map(p=>p.y)),maxy=Math.max(...all.map(p=>p.y));
  const span=Math.max(maxx-minx,maxy-miny,1)*1.15; const cx=(minx+maxx)/2, cy=(miny+maxy)/2;
  const W=600,H=420,pad=28; const sc=Math.min(W-2*pad,H-2*pad)/span;
  const X=x=>W/2+(x-cx)*sc, Y=y=>H/2+(y-cy)*sc;
  const step=[0.5,1,2,5,10,20,50].find(v=>v*sc>80)||100;
  const col=s=>(s.kostenlos?.immer||s.preis?.erwachsene===0)?"var(--free)":(s.kostenlos?.termine_im_aufenthalt?.length?"var(--warn)":"var(--muted)");
  const pins=pts.map((s,i)=>{const x=X((s.lon-lon0)*kx),y=Y(-(s.lat-lat0)*ky); return `<g data-go="${s.id}"><circle class="pin" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${s.muss===3?9:7}" fill="${col(s)}" stroke="var(--surface)" stroke-width="2"/><text x="${x.toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="700" fill="#fff" style="pointer-events:none">${i+1}</text><text class="lbl" x="${(x+11).toFixed(1)}" y="${(y+3.5).toFixed(1)}">${esc(s.name.length>22?s.name.slice(0,21)+"…":s.name)}</text></g>`;}).join("");
  const hx=X(0),hy=Y(0);
  return `<div class="map"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Lageplan ${esc(c.name)}">
    <rect width="${W}" height="${H}" fill="var(--surface2)" rx="10"/>
    <circle cx="${hx}" cy="${hy}" r="${(step*sc).toFixed(1)}" fill="none" stroke="var(--line)" stroke-dasharray="4 4"/>
    <text class="lbl" x="${(hx+step*sc+4).toFixed(1)}" y="${(hy-4).toFixed(1)}">${step.toLocaleString("de-DE")} km</text>
    ${pins}
    <path class="home" d="M${hx} ${hy-9} l9 9 -9 9 -9 -9z" stroke="var(--surface)" stroke-width="2"/>
    <text class="lbl" x="${(hx+13).toFixed(1)}" y="${(hy+3.5).toFixed(1)}" font-weight="700">Unterkunft</text>
  </svg>
  <div class="legend"><span><i style="background:var(--free)"></i>immer frei</span><span><i style="background:var(--warn)"></i>an deinen Tagen mal frei</span><span><i style="background:var(--muted)"></i>kostet</span><span>Großer Punkt = Pflicht</span></div>
  ${c.spots.some(s=>s.kategorie==="tagesausflug")?`<label class="toggle"><input type="checkbox" id="trips" ${showTrips?"checked":""}> Tagesausflüge einblenden</label>`:""}
  <ol class="small muted" style="columns:2;margin:8px 0 0;padding-left:22px">${pts.map(s=>`<li><button data-go="${s.id}" style="text-align:left;color:var(--fg)">${esc(s.name)}</button></li>`).join("")}</ol></div>`;
}

/* ---------- Gratis-Kalender ---------- */
function renderFree(){
  const all=[...stops,...extras]; const byDay=new Map();
  for(const c of all) for(const d of days(c)){ if(!byDay.has(d)) byDay.set(d,[]); byDay.get(d).push(c); }
  const out=[]; let month="";
  for(const d of [...byDay.keys()].sort()){
    const m=D(d).toLocaleDateString("de-DE",{month:"long",year:"numeric"}); if(m!==month){month=m; out.push(`<h3 class="month">${m}</h3>`);}
    const dow=D(d).getDay(); const we=dow===0||dow===6;
    const cs=byDay.get(d).sort((x,y)=>x.abreise===d?-1:1); // Abreiseort zuerst
    const parts=cs.map(c=>{
      const free=c.spots.filter(s=>!s.kostenlos?.immer&&s.kostenlos?.termine_im_aufenthalt?.includes(d));
      const always=c.spots.filter(s=>s.kostenlos?.immer||s.preis?.erwachsene===0).length;
      const hol=(c.feiertage||[]).find(f=>f.datum===d);
      return `<div class="city">${esc(c.name)}${d===c.ankunft?" · Ankunft":""}${d===c.abreise?" · Abreise":""}</div>
      ${hol?`<div class="hol">${esc(hol.name)}: ${esc(hol.hinweis)}</div>`:""}
      ${free.length?`<ul>${free.map(s=>`<li><button data-go="${c.id}:${s.id}">${esc(s.name)}</button>${s.kostenlos.hinweis?` <span class="small muted">· ${esc(s.kostenlos.hinweis)}</span>`:""}</li>`).join("")}</ul>`:`<div class="none">Keine Gratis-Aktion${always?` · ${always} Spots sind sowieso frei`:""}</div>`}`;
    });
    out.push(`<div class="day ${we?"we":""} ${d===today?"now":""}"><div class="d">${D(d).getDate()}<small>${D(d).toLocaleDateString("de-DE",{weekday:"short"}).replace(".","")}</small></div><div style="display:flex;flex-direction:column;gap:8px">${parts.map(p=>`<div>${p}</div>`).join("")}</div></div>`);
  }
  $("#v-free").innerHTML=`<div class="cityhead"><span class="eyebrow">Tag für Tag</span><h2>Wann es nichts kostet</h2><p class="intro">Hier steht nur, was <em>an diesem Tag</em> ausnahmsweise frei ist (Gratistage, erster Sonntag, Feiertage). Was immer frei ist, findest du in den Städten unter „Kostenlos".</p></div><div class="cal">${out.join("")}</div>`;
  $("#v-free").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const [c,s]=b.dataset.go.split(":"); cityId=c; store.city=c; save(); showTab("city"); jumpTo(s);});
}

/* ---------- Merkliste ---------- */

  const ids=Object.keys(store.fav); const groups={};

/* ---------- Info ---------- */
function renderInfo(){
  const unsure=DATA.flatMap(c=>c.spots.filter(s=>s.unsicher).map(s=>`${c.name}: ${s.name}`));
  $("#v-info").innerHTML=`<div class="cityhead"><span class="eyebrow">Wie das hier entstanden ist</span><h2>Info</h2></div><div class="prose">
    <h3>Woher die Preise kommen</h3>
    <p>Jeder Spot wurde am ${STAND} auf der offiziellen Website des Ortes (Ticketseite) oder der offiziellen Tourismusseite der Stadt nachgeschlagen. Die Quelle steht unter jedem Spot. Die meisten Häuser veröffentlichen 2027er-Preise erst im Winter oder Frühjahr, deshalb gilt: Stand 2026, rechnet mit 5–10 % Aufschlag. Bei ${unsure.length} Spots war die Lage unklar, die sind mit „Preis unsicher" markiert.</p>
    <h3>„Dein Preis"</h3>
    <p>Du bist unter 26 und studierst, deshalb nimmt die App immer den günstigsten Tarif, der auf dich zutrifft: erst „unter 26 (EU)", sonst „ermäßigt (Studierende/ISIC)", sonst der volle Preis. Nimm beide Ausweise mit: Personalausweis (EU-Nachweis, Alter) und Studentenausweis mit Foto oder ISIC. In Italien reicht der Personalausweis für den 2-€-Tarif der Staatsmuseen (18–25), in Ungarn für die 50 % (unter 26), in Prag für die freie Nationalgalerie (unter 26).</p>
    <h3>Die Länderregeln in einem Satz</h3>
    <ul>
      <li><b>Polen:</b> Jedes staatliche und städtische Museum hat einen Gratistag pro Woche, meist nur für die Dauerausstellung, oft nur 10–15 Uhr und nur an der Kasse. In Krakau trifft das auf alle drei deiner Tage: Montag Schindler-Fabrik, Dienstag Nationalmuseum und Rynek Underground, Mittwoch Collegium Maius.</li>
      <li><b>Slowakei:</b> Kein Fronleichnam, keine nationale Gratisregel. Burg-Hof, Slavín, Donauufer und die Aussicht sind frei; die Nationalgalerie nennt nur Spannen von 0 bis 7 €, also vor Ort fragen.</li>
      <li><b>Ungarn:</b> Staatliche Museen: EU-Bürger von 6 bis 26 zahlen die Hälfte, an Nationalfeiertagen frei (keiner im Reisezeitraum), dazu wählt jedes Haus einen Wochenendtag im Monat, an dem unter 26 frei ist (steht beim jeweiligen Spot).</li>
      <li><b>Kroatien und Slowenien:</b> Keine nationale Regel. Einzelne Museen haben Gratistage, die nicht in deinen Aufenthalt fallen; Natur, Aussichten und Ufer sind frei. In Bled hängt viel an der Gästekarte, die es nur bei Partnerbetrieben gibt, also den Vermieter in Žirovnica fragen.</li>
      <li><b>Italien:</b> Staatsmuseen am ersten Sonntag im Monat frei. Für dich ist das nur der 4. Juli, vom Comer See aus in Mailand (Brera, Castello Sforzesco). EU-Bürger 18–25 zahlen in Staatsmuseen 2 € (Uffizien, Accademia, Bargello, Pitti; Brera 4 €), dazu meist 4 € Reservierungsgebühr. Städtische Museen (Venedig, Florenz, Verona, Genua) haben eigene Jugendtarife, oft 2–3 €.</li>
      <li><b>Österreich:</b> In Zell am See steckt der Hebel in der Sommerkarte der Unterkunft. Das Hotel-Garni Seestrand steht nicht in der Partnerliste, deshalb rechnet die App volle Seilbahnpreise. Beim Hotel nachfragen lohnt sich, es geht um gut 200 €.</li>
      <li><b>Tschechien:</b> Burggelände, Vyšehrad, Letná und Petřín-Hang sind frei. Dass die Nationalgalerie unter 26 nichts kostet, stand 2026 nicht mehr auf der Eintrittsseite; die App rechnet mit dem ermäßigten Preis.</li>
    </ul>
    <h3>Was die App kann</h3>
    <ul><li><b>Route:</b> alle Stationen, Zähler bis zur Abfahrt bzw. Reisetag.</li><li><b>Stadt:</b> Spots nach Wichtigkeit, Filter „Kostenlos" und „Pflicht", Lageplan mit Luftlinie zur Unterkunft, Feiertage und Gut-zu-wissen pro Ort.</li><li><b>Gratis:</b> Tageskalender, an welchem deiner Tage etwas ausnahmsweise frei ist.</li><li><b>Merkliste:</b> Herz bei einem Spot, dann Summe der Eintritte für dich. Wird nur auf diesem Gerät gespeichert.</li></ul>
    <h3>Nicht vergessen</h3>
    <ul><li>Interrail: Regionalzüge in Italien ohne Reservierung, Fernzüge (Frecce, Railjet, EC) brauchen eine. Die Interrail-App zeigt es pro Verbindung.</li><li>Zeitfenster-Tickets (Uffizien, Dom-Kuppel Florenz, Markusdom, Vintgar, Auschwitz) im Mai buchen, nicht vor Ort.</li><li>Wechselstuben in Prag und Budapest: nur mit Karte zahlen oder am Bankautomaten ohne „Umrechnung" (DCC ablehnen).</li></ul>
    ${unsure.length?`<h3>Als unsicher markiert</h3><ul>${unsure.map(u=>`<li>${esc(u)}</li>`).join("")}</ul>`:""}
    <p class="small muted">Gebaut für Samira, die allein unterwegs ist. Falls Scott in der Florenz-Woche dazukommt, ändert sich an den Preisen nichts, nur an der Portionsgröße beim Lampredotto. Stand ${STAND}.</p></div>`;
}

/* ---------- Tabs ---------- */
function showTab(t){
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===t)));
  document.querySelectorAll(".view").forEach(v=>v.hidden=true);
  $("#v-"+t).hidden=false;
  ({route:renderRoute,city:renderCity,free:renderFree,saved:renderSaved,info:renderInfo})[t]();
  if(t!=="city") history.replaceState(null,"","#"+t);
  window.scrollTo(0,0);
}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
(function boot(){
  const h=location.hash.slice(1);
  if(byId[h]){cityId=h;showTab("city");return;}
  if(["free","saved","info","route"].includes(h)){showTab(h);return;}
  const c=cityOn(today); if(c){cityId=c.id;showTab("city");return;}
  showTab("route");
})();
</script>
